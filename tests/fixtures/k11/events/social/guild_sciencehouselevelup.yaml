name: game.guild.sciencehouselevelup
event_filter: event = 'game.guild.sciencehouselevelup'
description: 军机处（公会科技屋）升级事件：玩家在公会场景将军机处升级到更高等级时上报。subject 粒度为 role_id（角色级），level 参数为升级目标等级。参数含游戏服id/名字、账号id、角色id/名字、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表（gold/sendgold/freegold/diamond/expCoin/energy）、会话id、logUUID 等共23个。ds=20260729 实测 cnt=15、role_uv=8、acc_uv=8、server_uv=7。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  level:
    type: int
    description: 等级
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测：cnt=15, role_uv=8, acc_uv=8, server_uv=7；level 参数取值 2-5，多角色多次升级，事件触发正常。
metrics:
  sciencehouselevelup_cnt:
    expression: COUNT(*)
    description: 军机处升级总次数
  sciencehouselevelup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发军机处升级的去重角色数（subject=role_id）
  sciencehouselevelup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发军机处升级的去重账号数
  sciencehouselevelup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发军机处升级的去重游戏服数
  sciencehouselevelup_level_max:
    expression: MAX(CAST(GET_JSON_OBJECT(params, '$.level') AS BIGINT))
    description: 当日观测到的军机处最高升级等级
  sciencehouselevelup_upgrades_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均军机处升级次数（总次数/去重角色数）
coverage:
  scenarios:
    - 公会军机处升级的活跃度与渗透（次数、角色UV、账号UV、服务器UV）
    - 当日观测到的军机处最高升级等级上限
    - 人均升级频次（衡量玩家军机处升级节奏）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - subject 粒度默认 role_id（事件参数含 roleId/roleName，与基础视图 role_id 对齐）
    - level 参数为升级目标等级，单角色可能多次升级覆盖多个等级
    - 未覆盖 coinList 货币变动与 roleForce 战力的连带影响分析
coverage_status: analyst_confirmed
external_refs:
  - dim_table: dim_10000251_knight_awaken_info_arch
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_awaken_info_arch 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info_arch
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info_arch 主键精确同名
    origin: deterministic
