name: game.guild.share
event_filter: event = 'game.guild.share'
description: 公会分享事件：玩家对所在公会（params.id/params.name/params.level/params.memberCount）执行分享动作，可分享至世界频道（params.shareWorld）或好友（params.shareFriends）。分析主体为 role_id（角色），日志同步携带 serverId、roleName、roleLevel、vipLevel、roleForce、exp 与 coinList 关键货币快照。ds=20260729 单日实测：18 次 / 9 角色 / 9 账号 / 7 服，覆盖 9 个公会，成员数合计 315。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 公会id
  name:
    type: string
    description: 公会名
  tag:
    type: int
    description: 标签
  level:
    type: int
    description: 等级
  icon:
    type: array
    description: 图标列表
  memberCount:
    type: int
    description: 成员数量
  shareWorld:
    type: bool
    description: 是否分享到世界频道
  shareFriends:
    type: array
    description: 好友ID列表
metrics:
  game_guild_share_cnt:
    expression: COUNT(*)
    description: 公会分享事件总次数
  game_guild_share_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发公会分享的去重角色数（分析主体 role_id）
  game_guild_share_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发公会分享的去重账号数
  game_guild_share_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发公会分享的去重游戏服数
  game_guild_share_guild_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 被分享的去重公会数（params.id）
  game_guild_share_world_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.shareWorld') = 'true' THEN 1 ELSE 0 END)
    description: 分享至世界频道（params.shareWorld=true）的次数
  game_guild_share_world_rate:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.shareWorld') = 'true' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 分享至世界频道次数 / 公会分享总次数
  game_guild_share_member_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.memberCount') AS BIGINT))
    description: 被分享公会的成员数合计（params.memberCount）
coverage:
  scenarios:
    - 公会分享的活跃规模（次数/角色UV/账号UV/服UV）
    - 哪些公会被分享最多（params.id 分布）
    - 分享渠道偏好：世界频道占比 vs 好友分享
    - 被分享公会的成员规模分布（params.memberCount 合计/平均）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分享渠道偏好默认按 shareWorld 布尔判定，未区分 shareFriends 好友数量与去向
    - 分析主体为 role_id；账号级 UV 由 account_id 派生
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=18 / role_uv=9 / acc_uv=9 / server_uv=7 / guild_uv=9；shareWorld 全部为 true；member_cnt_sum=315。数据量与口径合理。
coverage_status: analyst_confirmed
