metrics:
  game_guild_battle_result_cnt:
    expression: COUNT(*)
    description: 公会战结算事件总记录数（按行计数，单日维度）
  game_guild_battle_result_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 公会战结算涉及的去重角色数（subject 粒度，单日）
  game_guild_battle_result_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 公会战结算涉及的去重账号数（单日）
  game_guild_battle_result_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 公会战结算覆盖的去重游戏服数（单日）
  game_guild_battle_result_guild_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.guildId'))
    description: 公会战结算涉及的去重本方公会数（单日）
  game_guild_battle_result_battle_score_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.battleScore') AS BIGINT))
    description: 本方公会战积分合计（单日所有结算场次累加）
  game_guild_battle_result_rel_battle_score_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.relBattleScore') AS BIGINT))
    description: 对手公会战积分合计（单日所有结算场次累加）
  game_guild_battle_result_guild_power_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.guildPower') AS BIGINT))
    description: 本方公会战力合计（单日所有结算场次累加）
  game_guild_battle_result_avg_battle_score:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.battleScore') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均本方公会战积分（积分合计/去重角色数，分母用 NULLIF 防除零）
coverage:
  scenarios:
    - 公会战参与度：通过 role_uv/account_uv/server_uv/guild_uv 量化各游戏服与公会当日公会战结算的覆盖面与活跃角色规模。
    - 公会战战力对比：通过 battle_score_sum 与 rel_battle_score_sum 对比本方与对手公会当日累计积分，衡量公会战胜负态势。
    - 公会战力规模：通过 guild_power_sum 评估参战公会的整体战力水位。
    - 人均贡献：通过 avg_battle_score 评估单角色平均公会战积分贡献（需结合场次解读，结算行计数非场次计数）。
  limitations:
    - 日志中零命中(ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 同样为 0)，疑似该公会战活动当日未开启或事件已下线/未触发，metrics 表达式未经真实数据验证。
    - 仅 ds=20260729 单日 scout 实测（并补测 ds=20260728），未做全量复核；事件恢复触发后需重新验证数值水位。
    - subject 粒度默认 role_id（事件按单场结算上报，role_id 为参战角色）；memberList 为数组型明细，本组 metrics 未对其做 EXPLODE 展开，成员级进攻/防守胜负指标需单独建模。
    - avg_battle_score 的分母为去重角色数而非场次数，受单角色多场次结算影响，仅作粗粒度参考。
