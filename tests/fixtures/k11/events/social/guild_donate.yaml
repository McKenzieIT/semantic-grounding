name: game.guild.donate
event_filter: event = 'game.guild.donate'
description: 公会捐献事件（game.guild.donate）：玩家在游戏内对所属公会进行捐献时上报的行为埋点。参数携带捐献角色、目标公会 guild、捐献次数 count，以及捐后角色货币快照 coinList（gold/freegold/diamond/expCoin/energy 等）。分析主体粒度为 role_id（每次捐献按角色记录），可通过 COUNT(DISTINCT server_id)/COUNT(DISTINCT GET_JSON_OBJECT(params,$.guild)) 评估公会捐献的覆盖面与活跃度。scout 实测 ds=20260729 单日：事件 4788 条、捐献角色 3240、账号 3093、游戏服 436、公会 567、count 累计 7596。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  count:
    type: int
    description: count
  time:
    type: int
    description: time
  guild:
    type: int
    description: guild
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 单日：cnt=4788、role_uv=3240、acc_uv=3093、server_uv=436、guild_uv=567、count_sum=7596；数据合理（单日活跃公会捐献），分析主体粒度 role_id
metrics:
  game_guild_donate_cnt:
    expression: COUNT(*)
    description: 公会捐献事件总次数（每条=一次捐献行为）
  game_guild_donate_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与公会捐献的去重角色数
  game_guild_donate_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与公会捐献的去重账号数
  game_guild_donate_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 有捐献行为发生的去重游戏服数
  game_guild_donate_guild_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.guild'))
    description: 收到捐献的去重公会数
  game_guild_donate_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
    description: 捐献次数 count 的累计值（捐献总量）
  game_guild_donate_avg_count_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均捐献次数（count_sum / role_uv，NULLIF 防零除）
coverage:
  scenarios:
    - 公会捐献参与率（捐献角色 / 公会活跃角色）
    - 公会捐献覆盖面（覆盖公会数、覆盖游戏服数）
    - 单角色捐献强度（人均捐献次数 avg_count_per_role）
    - 公会捐献总量趋势（count_sum 按日/服务器/公会聚合）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体粒度默认 role_id，未独立核对 account_id 维度的去重差异
    - count 字段语义为"捐献次数"（来自埋点描述），未与游戏内公会贡献值二次对账
coverage_status: analyst_confirmed
external_refs: []
