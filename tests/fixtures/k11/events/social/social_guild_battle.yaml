name: game.social.guild.battle
event_filter: event = 'game.social.guild.battle'
description: 公会战挑战事件：记录角色参与公会战的战斗数据（含两场战斗id battleId1/battleId2、进攻积分 attackScore、战斗结果 battleId1Res/battleId2Res 等27个参数）。分析主体粒度为 role_id（角色）。scout 实测 ds=20260729 与 ds=20260728 均零命中(cnt=0)，事件疑似下线/未触发。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  battleId1:
    type: string
    description: 对应首场战斗id
  battleId2:
    type: string
    description: 对应第二场战斗id
  attackScore:
    type: int
    description: 获得进攻积分
  battleId1Res:
    type: int
    description: 对应首场战斗结果
  battleId2Res:
    type: int
    description: 对应第二场战斗结果
metrics:
  game_social_guild_battle_cnt:
    expression: COUNT(*)
    description: 公会战挑战事件总记录数
  game_social_guild_battle_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与公会战挑战的去重角色数（分析主体粒度 role_id）
  game_social_guild_battle_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与公会战挑战的去重账号数
  game_social_guild_battle_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 公会战挑战涉及的游戏服数量
  game_social_guild_battle_attack_score_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.attackScore') AS BIGINT))
    description: 公会战挑战累计获得的进攻积分总和
  game_social_guild_battle_avg_attack_score_per_role:
    expression: CAST(SUM(CAST(GET_JSON_OBJECT(params, '$.attackScore') AS BIGINT)) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 参与角色的平均进攻积分（NULLIF 防零除）
coverage:
  scenarios:
    - 公会战参与规模（角色数/账号数/服务器数）
    - 公会战进攻积分产出总量与人均产出
    - 单角色进攻积分贡献对比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - scout 实测 ds=20260729 与 ds=20260728 均零命中(cnt=0/role_uv=0/acc_uv=0/server_uv=0)，事件疑似下线/未触发，保持 draft
    - 分析主体粒度默认 role_id（角色），因零命中未能验证实际数据分布与 battleId1Res/battleId2Res 的结果码语义
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 cnt=0；零命中，事件疑似下线/未触发，保持 draft
external_refs: []
