name: game.guild.submitMission
event_filter: event = 'game.guild.submitMission'
description: 公会完成任务事件。记录玩家角色(role_id 为分析主体)向公会提交任务(missionId)的日志，携带角色等级/vip等级/战力/经验与各类货币余额等23个参数。scout 实测 ds=20260729/20260728 均零命中，疑似事件下线或从未触发。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  missionId:
    type: int
    description: 任务id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 cnt=0/role_uv=0/acc_uv=0/server_uv=0；retry ds=20260728 仍 cnt=0。零命中，疑似事件下线或从未触发，保持 draft。
metrics:
  game_guild_submitMission_cnt:
    expression: COUNT(*)
    description: 公会提交任务事件总条数（零命中场景下实测返回 0）
  game_guild_submitMission_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 提交公会任务的去重角色数（分析主体 role_id）
  game_guild_submitMission_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 提交公会任务的去重账号数
  game_guild_submitMission_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 提交公会任务的去重游戏服数
coverage:
  scenarios:
    - 公会任务提交活跃度（条数/角色UV/账号UV/服务器UV）
    - 公会任务参与度与角色战力/等级切片交叉分析
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729/20260728 两日 scout 实测，未做全量复核
    - 分析主体默认 role_id；事件当前无数据产出，metrics 实测均返回 0
coverage_status: draft
external_refs: []
