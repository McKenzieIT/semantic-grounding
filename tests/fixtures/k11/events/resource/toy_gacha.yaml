name: game.toy.gacha
event_filter: event = 'game.toy.gacha'
description: 遗物抽卡事件：角色在遗物卡池进行抽卡时上报，记录每次抽卡的卡池id、卡池类型、抽卡数量、消耗资源(cost)、实际给玩家添加的资源(rewards)、真实结果(gainRes)及抽卡任务(mission)进度。分析主体粒度为 role_id（角色），单次抽卡行为计为一条日志。ds=20260729 实测：cnt=18337，role_uv=2312，acc_uv=2229，server_uv=383；当日累计抽卡次数(count合计) 136102，涉及卡池去重 23 个、卡池类型 2 种。
domains:
  - 探索收集
domain: resource
