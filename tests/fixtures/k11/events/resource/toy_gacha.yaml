metrics:
  game_toy_gacha_cnt:
    expression: COUNT(*)
    description: 抽卡日志条数（每次抽卡行为一条）
  game_toy_gacha_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发起抽卡的角色去重数（分析主体粒度 role_id）
  game_toy_gacha_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发起抽卡的账号去重数
  game_toy_gacha_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及抽卡的游戏服去重数
  game_toy_gacha_pulls_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.count') AS BIGINT))
    description: 当期累计抽卡次数（count 求和）
  game_toy_gacha_pool_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.gachaId'))
    description: 当期涉及卡池去重数（gachaId 去重）
  game_toy_gacha_type_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.type'))
    description: 当期涉及卡池类型去重数（type 去重）
  game_toy_gacha_pulls_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.count') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id),0)
    description: 人均抽卡次数 = 累计抽卡次数 / 角色去重数（NULLIF 防零除）
coverage:
  scenarios:
    - 通过 role_uv/account_uv 评估遗物抽卡玩法的角色/账号渗透规模
    - 通过 pulls_sum、pool_uv、type_uv 衡量抽卡产出与卡池分布，辅助卡池调优
    - 通过 pulls_per_role 评估人均抽卡深度，定位重度抽卡角色
    - 通过 server_uv 与按服维度聚合，定位高活跃抽卡服
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核；多日趋势需另行批量校验
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角色复抽做去重校验
    - cost（消耗资源）、rewards（添加资源）、gainRes（真实结果）为数组参数，未在本事件 metrics 内展开逐元素求和，如需按资源类型聚合需单独建模
    - mission（抽卡任务）为 json 参数，point/lastFetchPoint/lastFetchId 未在 metrics 内展开
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=18337, role_uv=2312, acc_uv=2229, server_uv=383; count合计=136102, gachaId去重=23, type去重=2, count非空行=18337。数值合理，event+ds 双过滤命中，确认在线可查。
coverage_status: analyst_confirmed
