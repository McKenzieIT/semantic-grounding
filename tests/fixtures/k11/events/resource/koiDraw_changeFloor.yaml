name: game.koiDraw.changeFloor
event_filter: event = 'game.koiDraw.changeFloor'
description: 锦鲤彩运-切换层事件：玩家在锦鲤彩运（koiDraw）玩法中切换层数时上报，记录活动 drawId、切换前层数 oldFloor 与切换后层数 newFloor，并携带 coinList 关键货币与角色基础信息（role_id/role_name/level/vip/force 等）。分析主体粒度为 role_id（角色级），account_id 用于关联同账号多角色。scout 实测 ds=20260729 与 ds=20260728 单日均零命中(cnt=0)，疑似活动下线或未触发上报。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  drawId:
    type: int
    description: 活动id
  oldFloor:
    type: int
    description: 切换前层数
  newFloor:
    type: int
    description: 切换后层数
metrics:
  koi_draw_change_floor_cnt:
    expression: COUNT(*)
    description: 锦鲤彩运切换层操作总次数（每次 changeFloor 上报 1 条）
  koi_draw_change_floor_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发切换层的去重角色数（分析主体粒度）
  koi_draw_change_floor_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发切换层的去重账号数
  koi_draw_change_floor_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及切换层的去重游戏服数
  koi_draw_change_floor_per_role_avg:
    expression: ROUND(CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0), 3)
    description: 人均切换层次数（总次数 / 去重角色数，NULLIF 防零除）
  koi_draw_change_floor_draw_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.drawId'))
    description: 当日涉及切换层的去重锦鲤彩运活动 drawId 数
  koi_draw_change_floor_actual_change_role_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params, '$.newFloor') <> GET_JSON_OBJECT(params, '$.oldFloor') THEN role_id END)
    description: 实际发生层数变化(newFloor<>oldFloor)的去重角色数，剔除同层重报
coverage:
  scenarios:
    - 锦鲤彩运切换层玩法活跃度量：单日切换次数/参与角色数/涉及服数，判断玩法渗透与频次
    - 人均切换次数 per_role_avg 反映核心玩家在活动层间流转强度
    - draw_uv 观察当日被切换的活动 drawId 覆盖广度，辅助识别活跃活动
    - actual_change_role_uv 区分真实层间流转与同层重报，校准有效切换行为
  limitations:
    - 日志中零命中(ds=20260729 与 ds=20260728 单日 cnt=0)，疑似活动下线/未触发上报，指标定义待活动恢复后复核
    - 仅 ds=20260729/ds=20260728 两日 scout 实测，未做全量复核（多日趋势/周环比未验证）
    - 分析主体默认 role_id（角色级），account_id 仅用于关联同账号多角色，未单独验证账号粒度业务口径
    - newFloor/oldFloor/drawId 取自 GET_JSON_OBJECT(params,'$.<field>')，依赖上报端 params 完整性；若个别上报缺字段会落入 NULL
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 与 ds=20260728 单日均零命中(cnt=0,role_uv=0,acc_uv=0,server_uv=0)，疑似活动下线/未触发上报，维持 draft 待恢复后复核。
coverage_status: draft
external_refs: []
