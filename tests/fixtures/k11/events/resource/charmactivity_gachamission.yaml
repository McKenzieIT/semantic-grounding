name: game.charmactivity.gachamission
event_filter: event = 'game.charmactivity.gachamission'
description: 灵器活动（charmactivity）抽卡任务奖励领取事件。玩家在灵器/抽卡活动内完成指定任务并领取奖励时上报，携带活动id(activityId)与本次领奖任务列表(missionIds)，以及角色基础信息(roleLevel/vipLevel/roleForce/exp)和全量货币快照(coinList)。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。ds=20260729/20260728 scout 实测：日志零命中（event='game.charmactivity.gachamission' 在 ds=20260729 与 ds=20260728 均无记录），疑似活动下线/未触发/事件未上报。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动id
  missionIds:
    type: array
    description: 领奖的任务列表
metrics:
  game_charmactivity_gachamission_cnt:
    expression: COUNT(*)
    description: 灵器活动抽卡任务领奖事件总记录数
  game_charmactivity_gachamission_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取抽卡任务奖励的角色数（去重）
  game_charmactivity_gachamission_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取抽卡任务奖励的账号数（去重）
  game_charmactivity_gachamission_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的游戏服数量（去重）
  game_charmactivity_gachamission_activity_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.activityId'))
    description: 涉及的灵器抽卡活动数量（activityId 去重）
coverage:
  scenarios:
    - 灵器活动抽卡任务领奖参与度（cnt / role_uv / account_uv / server_uv）
    - 抽卡任务领奖跨活动分布（activity_uv）
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度）；account_id 可作账号粒度补充
    - missionIds 为数组，单事件可对应该次领奖的多个任务，未做展开计数
  granularity: role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729 与 ds=20260728：event='game.charmactivity.gachamission' 均零命中（cnt=0），事件疑似下线/未触发/未上报，保持 draft。
coverage_status: draft
external_refs: []
