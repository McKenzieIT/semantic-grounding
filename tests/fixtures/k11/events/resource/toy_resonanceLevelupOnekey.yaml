name: game.toy.resonanceLevelupOnekey
event_filter: event = 'game.toy.resonanceLevelupOnekey'
description: 遗物共鸣台一键升级事件：角色使用一键升级功能批量提升遗物共鸣台多个格子(toy)等级时上报，记录共鸣组(resonance.group)、被升级格子列表(cellIds)、各格子升级前后的 toyId/level 信息，以及角色基础属性与货币(coinList)。分析主体粒度为 role_id（角色），单次一键升级行为计为一条日志。ds=20260729 实测：cnt=1942，role_uv=825，acc_uv=807，server_uv=116；当日平均每角色约 2.35 次一键升级，覆盖 116 个游戏服，事件在线可查。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  resonance:
    type: json
    description: resonance
  resonance.group:
    type: int
    description: resonance.group
  resonance.cell:
    type: array
    description: resonance.cell
  resonance.cell.cellId:
    type: int
    description: resonance.cell.cellId
  resonance.cell.toyId:
    type: int
    description: resonance.cell.toyId
  resonance.cell.level:
    type: int
    description: resonance.cell.level
  cellIds:
    type: array
    description: cellIds
metrics:
  game_toy_resonanceleveluponekey_cnt:
    expression: COUNT(*)
    description: 遗物共鸣台一键升级日志条数（每次一键升级行为一条）
  game_toy_resonanceleveluponekey_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发起一键升级的角色去重数（分析主体粒度 role_id）
  game_toy_resonanceleveluponekey_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发起一键升级的账号去重数
  game_toy_resonanceleveluponekey_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及一键升级的游戏服去重数
coverage:
  scenarios:
    - 通过 role_uv/account_uv/server_uv 评估遗物共鸣台一键升级玩法的角色/账号/游戏服渗透规模
    - 通过 cnt/role_uv 比值衡量人均一键升级频次，定位重度升级玩家
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核；多日趋势需另行批量校验
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角升级做去重校验
    - cellIds（被升级格子列表）与 resonance.cell（toyId/level 数组）为数组参数，未在本事件 metrics 内展开逐元素求和/计数（如升级格子数、toy 去重数），如需按格子维度聚合需单独建模
    - params 字段的 GET_JSON_OBJECT 路径在事件视图上 SELECT 抽样查询易超时，故未对 resonance.group/cellIds 做单独 SUM/SIZE 实测校验，仅 COUNT(*) 量级已实测
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=1942, role_uv=825, acc_uv=807, server_uv=116；event+ds 双过滤命中，数值合理。平均每角色 2.35 次一键升级，覆盖 116 个游戏服。确认在线可查。
coverage_status: analyst_confirmed
external_refs: []
