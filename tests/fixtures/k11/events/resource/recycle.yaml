confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=5180, role_uv=2057, acc_uv=1968, server_uv=273；event+ds 双过滤命中，数字量级合理，事件真实在线可查。resources 数组抽样部分为空，故未对回收数量求和。
coverage_status: analyst_confirmed
