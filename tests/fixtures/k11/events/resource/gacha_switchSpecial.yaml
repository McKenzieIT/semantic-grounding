name: game.gacha.switchSpecial
event_filter: event = 'game.gacha.switchSpecial'
description: 招募-切换新手集市卡池：角色在招募玩法内切换至新手集市卡池时上报，记录卡池切换行为、当前关键货币持有与累计切换次数。分析主体粒度为 role_id（角色），每次切换新手集市卡池计为一条日志。ds=20260729 实测：cnt=400，role_uv=400，acc_uv=400，server_uv=7；切换覆盖 7 个游戏服、400 个角色，当日人均仅切换 1 次（cnt=role_uv），当日仅 1 个 specialId 命中。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  specialId:
    type: int
    description: 新手集市id
  gachaIds:
    type: array
    description: 切换后选中的卡池id列表
  switchCount:
    type: int
    description: 切换后的累计切换次数
metrics:
  game_gacha_switchSpecial_cnt:
    expression: COUNT(*)
    description: 切换新手集市卡池日志条数（每次切换一条）
  game_gacha_switchSpecial_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 切换新手集市卡池的角色去重数（分析主体粒度 role_id）
  game_gacha_switchSpecial_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 切换新手集市卡池的账号去重数
  game_gacha_switchSpecial_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及切换新手集市卡池的游戏服去重数
  game_gacha_switchSpecial_special_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.specialId'))
    description: 涉及的新手集市 id（specialId）去重数
  game_gacha_switchSpecial_switch_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.switchCount') AS BIGINT))
    description: 切换后累计切换次数（switchCount）求和，用于衡量卡池切换强度
coverage:
  scenarios:
    - 通过 role_uv/account_uv 评估新手集市卡池切换玩法的角色/账号渗透规模
    - 通过 server_uv 与按服维度聚合，定位新手集市卡池切换的活跃服
    - 通过 special_uv 识别当日开放的新手集市 id 数量
    - 通过 switch_count_sum 结合 cnt 评估人均切换频次（switch_count_sum/cnt）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核；多日趋势需另行批量校验
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角色复切做去重校验
    - gachaIds（切换后选中的卡池id列表）为数组参数，当日 GET_JSON_OBJECT 直取计数为 0（疑似空值或需展开逐元素），未在本事件 metrics 内展开，如需按卡池维度聚合需单独建模
    - 当日 cnt=role_uv=switch_count_sum（400=400=400），switchCount 全样本恒为 1，人均切换频次指标在该样本下退化为 1，跨日复核后才有统计意义
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=400, role_uv=400, acc_uv=400, server_uv=7；event+ds 双过滤命中，数值合理（400 角色覆盖 7 服，人均切换 1 次，specialId 当日仅 1 个），确认在线可查。
coverage_status: analyst_confirmed
external_refs: []
