name: game.charmactivity.setautoskillscheme
event_filter: event = 'game.charmactivity.setautoskillscheme'
description: 灵器活动-设置技能方案事件。记录玩家在灵器活动（charmactivity）玩法中为骑士（knightId）配置技能方案（schemeId）的操作，每次设置触发一条日志，附带角色基础属性、关键货币快照及所属 unit（unitId）。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。scout 实测 ds=20260729 cnt=0、ds=20260728 cnt=0——日志中零命中，事件疑似下线/未触发或未上报到该视图。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  unitId:
    type: int
    description: unitId
  knightId:
    type: int
    description: knightId
  schemeId:
    type: int
    description: schemeId
metrics:
  game_charmactivity_setautoskillscheme_cnt:
    expression: COUNT(*)
    description: 设置技能方案日志条数（每次设置行为一条）
  game_charmactivity_setautoskillscheme_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置技能方案的角色去重数（分析主体粒度 role_id）
  game_charmactivity_setautoskillscheme_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置技能方案的账号去重数
  game_charmactivity_setautoskillscheme_scheme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.schemeId'))
    description: 涉及的技能方案去重数（schemeId）
  game_charmactivity_setautoskillscheme_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.knightId'))
    description: 涉及的骑士去重数（knightId）
coverage:
  scenarios:
    - 通过 role_uv/account_uv 评估灵器活动技能方案设置的角色/账号渗透规模
    - 通过 scheme_uv 监控被设置的技能方案分布与热度
    - 通过 knight_uv 评估技能方案配置的骑士覆盖范围
  limitations:
    - 日志中零命中（ds=20260729 cnt=0、ds=20260728 cnt=0），事件疑似下线/未触发或未上报到该视图，所有 metrics 实测均为 0
    - 仅 ds=20260729/ds=20260728 两日 scout 实测，未做全量多日复核；事件恢复上报后需重新验证
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角色设置做去重校验
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=0, role_uv=0, acc_uv=0, server_uv=0；ds=20260728 复测仍为 0。事件疑似下线/未触发，保留 draft 状态。
coverage_status: draft
external_refs: []
