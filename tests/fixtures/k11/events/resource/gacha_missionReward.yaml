name: game.gacha.missionReward
event_filter: event = 'game.gacha.missionReward'
description: |-
  抽卡-任务奖励（gacha mission reward）：玩家在抽卡玩法中领取任务奖励时触发的资源事件。分析粒度为 role_id（角色），可用 account_id 做账号维度汇总。ds=20260729 单日 scout 实测：事件计数 2604，覆盖 1314 个角色、1285 个账号、218 个游戏服。
  参数（29个）：游戏服id/名字、账号id、角色id/名/性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表（充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）、会话id、logUUID、类型、奖励列表(rewards)、已领取奖励列表(rewarded)。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  type:
    type: int
    description: 类型
  rewards:
    type: array
    description: 奖励
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
  rewarded:
    type: array
    description: 已领取的奖励
metrics:
  gacha_mission_reward_cnt:
    expression: COUNT(*)
    description: 抽卡任务奖励事件总触发次数
  gacha_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取抽卡任务奖励的去重角色数
  gacha_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取抽卡任务奖励的去重账号数
  gacha_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取抽卡任务奖励的去重游戏服数
  gacha_mission_reward_role_per_account:
    expression: ROUND(COUNT(DISTINCT role_id) / NULLIF(COUNT(DISTINCT account_id), 0), 4)
    description: 人均触发角色数（角色UV/账号UV）
  gacha_mission_reward_cnt_per_role:
    expression: ROUND(COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0), 4)
    description: 人均触发次数（事件总数/角色UV）
coverage:
  scenarios:
    - 抽卡任务奖励的整体触发规模与角色/账号/游戏服覆盖面
    - 人均领取角色数与人均触发次数，识别多角色账号与高频领取行为
    - 抽卡任务奖励在不同游戏服/区服的分布对比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量日期复核
    - 分析粒度默认 role_id（角色），account_id 仅用于账号维度汇总，未单独验证账号粒度
    - rewards/rewarded 为数组类型参数，本事件 metrics 暂未对奖励数量做数组展开聚合
    - ds=20260729 数据来自加速视图(event,ds)分区，跨日趋势需后续多日查询
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测：cnt=2604, role_uv=1314, acc_uv=1285, server_uv=218；数据合理，事件在线且持续触发。
coverage_status: analyst_confirmed
