name: game.toy.starup
event_filter: event = 'game.toy.starup'
description: |
  遗物(toy)升星事件：角色对遗物执行升星操作后上报，记录目标遗物 id、升星后星数 toy.star、
  穿戴位 toy.wearCellId，以及升星时刻的货币/角色快照(coinList.*、roleForce、roleLevel 等)。
  分析主体为 role_id（角色级事件），同一角色同日可多次升星。
  实测 ds=20260729：cnt=1286, role_uv=347, acc_uv=341, server_uv=71, toy_uv=192, star_sum=1613, star_max=7。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  toy:
    type: json
    description: toy
  toy.id:
    type: int
    description: toy.id
  toy.star:
    type: int
    description: toy.star
  toy.wearCellId:
    type: int
    description: toy.wearCellId
metrics:
  game_toy_starup_cnt:
    expression: COUNT(*)
    description: 遗物升星事件总次数
  game_toy_starup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发遗物升星的去重角色数
  game_toy_starup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发遗物升星的去重账号数
  game_toy_starup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发遗物升星的去重服务器数
  game_toy_starup_toy_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.toy.id'))
    description: 被升星的去重遗物 id 数
  game_toy_starup_star_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.toy.star') AS BIGINT))
    description: 升星后星数总和（衡量升星总量）
  game_toy_starup_star_max:
    expression: MAX(CAST(GET_JSON_OBJECT(params, '$.toy.star') AS BIGINT))
    description: 当日遗物升星后达到的最高星数
  game_toy_starup_star_per_role:
    expression: COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每个触发角色的升星次数
coverage:
  scenarios:
    - 各服务器/角色遗物升星活跃度与升星总量(star_sum)监控
    - 升星渗透率分子：触发升星角色数(role_uv)，分母需联表当日活跃角色，本事件仅给分子
    - 高星遗物分布：star_max 与 toy_uv 反映遗物养成深度
    - 单角色升星强度：cnt / role_uv
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级事件），account_id 仅作交叉核对
    - star_sum 为升星后星数累加，非净增星数；toy.star 实测为可转 BIGINT 的整数字符串
    - 升星渗透率分母需联表当日活跃角色，本事件不提供，仅输出分子
    - coinList.* 货币字段未在 metrics 内 SUM，本事件属探索收集域非付费域，货币为快照非流水
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=1286, role_uv=347, acc_uv=341, server_uv=71, toy_uv=192, star_sum=1613, star_max=7；payload(toy.id/toy.star/toy.wearCellId)真实有效
coverage_status: analyst_confirmed
external_refs: []
