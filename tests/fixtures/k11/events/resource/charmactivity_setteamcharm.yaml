name: game.charmactivity.setteamcharm
event_filter: event = 'game.charmactivity.setteamcharm'
description: 灵器活动-设置队伍灵器事件：记录角色在灵器活动中配置队伍灵器（主灵器 mainCharm + 助战灵器 assistCharm）的操作行为。分析主体为 role_id（角色级）。scout 实测 ds=20260729 与 ds=20260728 双日 cnt=0（日志零命中，疑似事件下线/未触发）。
domains:
  - 探索收集
domain: resource
metrics:
  game_charmactivity_setteamcharm_cnt:
    expression: COUNT(*)
    description: 灵器活动设置队伍灵器操作总次数（事件行数）
  game_charmactivity_setteamcharm_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与设置队伍灵器的去重角色数（分析主体 role_id）
  game_charmactivity_setteamcharm_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与设置队伍灵器的去重账号数
  game_charmactivity_setteamcharm_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 产生设置队伍灵器行为的去重游戏服数
coverage:
  scenarios:
    - 灵器配置热度：以 cnt 度量队伍灵器设置操作频次，定位活动高峰时段
    - 活动参与度：以 role_uv/account_uv 度量灵器活动触达的角色与账号规模
    - 服务器覆盖：以 server_uv 度量活动生效的游戏服范围
  limitations:
    - 日志中零命中（ds=20260729 与 ds=20260728 双日 cnt=0），疑似事件下线/未触发，所有指标实测均为 0
    - 仅 ds=20260729/20260728 双日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级），因零命中未在数据中实测验证账号粒度
  coverage_status: draft
