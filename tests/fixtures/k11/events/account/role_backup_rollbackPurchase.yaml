name: game.role.backup.rollbackPurchase
event_filter: event = 'game.role.backup.rollbackPurchase'
description: 玩家数据回滚后对已购订单重新发货（补发）事件：当玩家数据被回滚时，系统按原订单(orderId)重新发放已购道具与货币（充值钻石 coinList.gold 等），用于修复回滚导致的充值丢失。分析主体为 role_id（角色粒度），account_id 为账号粒度。scout 实测 ds=20260729/20260728 均零命中，事件疑似下线/未触发，暂无真实量级数据。
domains:
  - 用户生命周期
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  orderId:
    type: string
    description: 订单id
metrics:
  rollback_purchase_cnt:
    expression: COUNT(*)
    description: 回滚补发事件总记录数
  rollback_purchase_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发回滚补发的去重角色数（分析主体 role_id）
  rollback_purchase_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发回滚补发的去重账号数
  rollback_purchase_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及回滚补发的去重游戏服数
  rollback_purchase_order_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.orderId'))
    description: 回滚补发涉及的去重订单数
  rollback_purchase_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 回滚补发充值钻石总量
  rollback_purchase_gold_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 回滚补发人均充值钻石量（NULLIF 防零除）
coverage:
  scenarios:
    - 回滚补发事件触发量与去重角色/账号/游戏服分布（rollback_purchase_cnt / _role_uv / _account_uv / _server_uv）
    - 回滚补发涉及的去重订单数（rollback_purchase_order_uv），衡量受影响订单规模
    - 回滚补发充值钻石总量及人均量（rollback_purchase_gold_sum / _gold_per_role），量化补发货币成本
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729/20260728 双日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），因零命中未做实际粒度核对
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。双日零命中，事件疑似下线/未触发，保持 draft。"
external_refs: []
