name: game.role.viewPlayerShow
event_filter: event = 'game.role.viewPlayerShow'
description: 玩家查看其他玩家展示信息的埋点事件，记录被查看角色的基本信息（角色名、等级、VIP、战力、性别、创角/上线时间）、关键货币（钻石/紫金/经验卷轴/体力）及展示类型/展示id。主体粒度为 role_id（被查看角色），每条日志代表一次玩家查看展示行为。scout 实测 ds=20260729 命中 0 条（ds=20260728 同为 0），事件疑似下线或未触发。
domains:
  - 用户生命周期
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  showType:
    type: int
    description: 展示类型
  showId:
    type: int
    description: 展示id
metrics:
  game_role_viewPlayerShow_cnt:
    expression: COUNT(*)
    description: 玩家查看展示事件总触发次数
  game_role_viewPlayerShow_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发查看展示事件的去重角色数（被查看角色主体）
  game_role_viewPlayerShow_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发查看展示事件的去重账号数
  game_role_viewPlayerShow_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发查看展示事件的去重游戏服数
coverage:
  scenarios:
    - 衡量玩家查看其他玩家展示信息的频次与覆盖角色/账号/服务器范围
    - 评估展示系统的使用情况与玩家互动活跃度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728 cnt=0)，事件疑似下线/未触发，指标在当前数据周期不可用
    - 默认主体粒度为 role_id（被查看角色）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 重试 cnt=0，零命中
  coverage_status: draft
external_refs: []
