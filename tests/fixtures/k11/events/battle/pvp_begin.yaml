metrics:
  game_pvp_begin_cnt:
    expression: COUNT(*)
    description: PVP战斗开始事件总次数（含同一战斗多次上报）
  game_pvp_begin_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与PVP战斗的去重角色数（分析主体默认粒度）
  game_pvp_begin_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与PVP战斗的去重账号数
  game_pvp_begin_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生PVP战斗的去重区服数
  game_pvp_begin_battle_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.battleId'))
    description: 去重战斗局数（按 battleId）
  game_pvp_begin_score_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT))
    description: 己方积分累计和
  game_pvp_begin_lineuppower_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.lineupPower') AS BIGINT))
    description: 己方阵容战力累计和
  game_pvp_begin_relfforce_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.relFforce') AS BIGINT))
    description: 对手战力累计和
  game_pvp_begin_avg_score:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 平均单场己方积分
  game_pvp_begin_avg_lineuppower:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.lineupPower') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 平均单场己方阵容战力
coverage:
  scenarios:
    - PVP玩法参与规模：日活角色/账号/区服数、战斗局数
    - PVP玩法热度分布：按 playType/playName/mode 拆分战斗次数
    - PVP战力/积分基线：己方阵容战力、对手战力、平均单场积分
    - 玩法渗透率：参与PVP角色数 / 全服活跃角色数（需关联角色维度表）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（roleId），账号级聚合请使用 account_id
    - begin 事件仅记录对战初始快照，胜负结果需关联 pvp_end/pvp_result 事件
    - 战斗局数（battle_uv=40639）小于事件次数（cnt=42327），存在重复上报或 battleId 缺失，分析时建议去重
    - mode=4（演武场）当日零命中，该模式当日未触发或未上报
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=42327、role_uv=2926、acc_uv=2794、server_uv=414；battle_uv=40639、play_type_uv=3、score_sum=18984649、lineuppower_sum=665682835874、relfforce_sum=559856542751；量级合理，事件正常上报
coverage_status: analyst_confirmed
