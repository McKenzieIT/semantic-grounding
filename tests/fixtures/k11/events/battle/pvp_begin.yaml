name: game.pvp.begin
event_filter: event = 'game.pvp.begin'
description: PVP战斗开始事件（game.pvp.begin）：玩家进入PVP对战（竞技场正常模式/竞技场休闲模式/演武场等）时上报的对战初始快照，含双方阵容、武将装备潜能、灵器、PVP玩法、赛季、双方积分与战力、唯一战斗标识等。分析主体为角色（role_id），亦可按账号（account_id）/区服（server_id）聚合。ds=20260729 单日 scout 实测：日志量 42327 条、参与角色 2926、账号 2794、区服 414；去重战斗局数（battleId）40639、playType 去重 3 种、己方积分累计和 18984649、己方阵容战力累计和 665682835874、对手战力累计和 559856542751。参数共 136 个字段。
