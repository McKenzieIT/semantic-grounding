name: game.rogue.dropElement
event_filter: event = 'game.rogue.dropElement'
description: 古战场(Rogue)丢弃元素事件：玩家在古战场玩法中丢弃/卸下已装备的元素时上报，携带丢弃元素类型(elementType)与元素id(elementId)。分析粒度为角色(role_id)，每个角色每次丢弃产生一条日志。真实实测 ds=20260729：事件118条，去重角色60个，去重账号59个，覆盖25个游戏服；元素类型2种、元素id 66种。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  elementType:
    type: int
    description: 元素类型
  elementId:
    type: int
    description: 元素id
metrics:
  game_rogue_dropElement_cnt:
    expression: COUNT(*)
    description: 古战场丢弃元素事件总条数
  game_rogue_dropElement_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 去重丢弃元素角色数
  game_rogue_dropElement_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 去重丢弃元素账号数
  game_rogue_dropElement_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 去重涉及游戏服数
  game_rogue_dropElement_element_type_cnt:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.elementType'))
    description: 去重元素类型数
  game_rogue_dropElement_element_id_cnt:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.elementId'))
    description: 去重元素id数
  game_rogue_dropElement_gold_snapshot_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 丢弃时点充值钻石快照总量
  game_rogue_dropElement_energy_snapshot_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.energy') AS BIGINT))
    description: 丢弃时点体力快照总量
  game_rogue_dropElement_exp_snapshot_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.exp') AS BIGINT))
    description: 丢弃时点经验快照总量
  game_rogue_dropElement_cnt_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均丢弃元素次数
coverage:
  scenarios:
    - 古战场元素丢弃活跃度：丢弃事件量、参与角色数与游戏服覆盖度
    - 元素品类分布：丢弃元素类型数与元素id数（识别热门/冷门元素）
    - 角色级粒度(roleId)的丢弃频次分布与人均丢弃次数
    - 丢弃时点角色货币/经验快照（gold/energy/exp，非发放量，仅时点余额参考）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析粒度默认 role_id（事件 params.roleId 为角色id，未独立校验去重语义）
    - coinList.gold/energy/exp 为丢弃时点快照余额(非产出)，diamond 实测 ds=20260729 SUM 为 NULL，本日该字段无值
    - coinList.sendgold/freegold/expCoin 本日未纳入指标(快照字段语义不确定)
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=118, role_uv=60, acc_uv=59, server_uv=25; element_type_cnt=2, element_id_cnt=66; gold_snapshot=165, energy_snapshot=14030, exp_snapshot=390600, diamond NULL"
coverage_status: analyst_confirmed
external_refs: []
