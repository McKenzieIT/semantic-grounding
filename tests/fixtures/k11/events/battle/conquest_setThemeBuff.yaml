name: game.conquest.setThemeBuff
event_filter: event = 'game.conquest.setThemeBuff'
description: 讨伐(Conquest)设置主题加成buff阵营事件：玩家在讨伐玩法中选择某个主题(themeId)下的加成buff阵营(buffGroup)时上报。分析粒度为角色(role_id)，每个角色每次设置选择产生一条日志，params.themeId 为主题配置id、params.buffGroup 为所选加成buff阵营id。scout 实测 ds=20260729/20260728 均零命中，事件疑似下线或未触发。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  themeId:
    type: int
    description: 主题
  buffGroup:
    type: int
    description: 选择的加成buff阵营
metrics:
  game_conquest_setThemeBuff_cnt:
    expression: COUNT(*)
    description: 讨伐设置主题加成buff阵营事件总条数
  game_conquest_setThemeBuff_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 去重设置加成buff阵营角色数
  game_conquest_setThemeBuff_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 去重设置加成buff阵营账号数
  game_conquest_setThemeBuff_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 去重涉及游戏服数
  game_conquest_setThemeBuff_theme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.themeId'))
    description: 去重被选择主题(themeId)数量
  game_conquest_setThemeBuff_buffgroup_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.buffGroup'))
    description: 去重被选择加成buff阵营(buffGroup)数量
coverage:
  scenarios:
    - 讨伐主题加成buff阵营设置行为量、参与角色数与游戏服覆盖度（玩法活跃度与渗透）
    - 主题(themeId)与加成buff阵营(buffGroup)的选择分布与热度（运营/配置调优依据）
    - 角色级粒度(role_id)的阵营偏好与人均设置频次分布
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729/20260728 单日 scout 实测，未做全量复核
    - 分析粒度默认 role_id（事件 params.roleId 为角色id，未独立校验去重语义）
    - 因零命中，themeId/buffGroup 去重指标本日未验证非零产出
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729 与 ds=20260728: cnt=0, role_uv=0, acc_uv=0, server_uv=0；事件零命中，疑似下线/未触发，维持 draft"
coverage_status: draft
external_refs: []
