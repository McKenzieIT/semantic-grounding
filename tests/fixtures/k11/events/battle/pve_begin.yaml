metrics:
  game_pve_begin_cnt:
    expression: COUNT(*)
    description: 副本进入总次数
  game_pve_begin_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 进入副本的去重角色数（分析主体为 role_id）
  game_pve_begin_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 进入副本的去重账号数
  game_pve_begin_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数
  game_pve_begin_stage_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.stageId'))
    description: 被挑战的去重关卡数
  game_pve_begin_battle_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.battleId'))
    description: 去重战斗会话数（battleId 唯一标识一次战斗）
  game_pve_begin_elite_stage_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.stageType') = '1' THEN 1 ELSE 0 END)
    description: 精英关卡(stageType=1)进入次数
  game_pve_begin_boss_stage_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.stageType') = '2' THEN 1 ELSE 0 END)
    description: 头目关卡(stageType=2)进入次数
  game_pve_begin_normal_stage_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.stageType') = '3' THEN 1 ELSE 0 END)
    description: 普通关卡(stageType=3)进入次数
  game_pve_begin_boost_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.isBoost') = '1' THEN 1 ELSE 0 END)
    description: 代打(isBoost=1)进入次数
  game_pve_begin_avg_lineup_power:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.lineupPower') AS BIGINT))
    description: 进入副本时的平均阵容战力
  game_pve_begin_entry_per_role:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均副本进入次数（总次数/去重角色数）
coverage:
  scenarios:
    - 副本参与度：通过总次数、去重角色/账号数衡量副本玩法的活跃度与渗透
    - 关卡分布：通过 stage_uv 与精英/头目/普通次数拆解各类关卡挑战分布
    - 代打占比：通过 boost_cnt 占比评估代打玩法的使用情况
    - 战力水平：通过平均阵容战力衡量参与玩家的整体战力
    - 人均强度：通过 entry_per_role 评估单人副本挑战频次
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id（角色粒度），账号粒度需配合 account_uv 解读
    - 卡牌/装备/天赋等嵌套列表字段未在指标层展开，仅做参数留存
    - stageType 取值 1/2/3 之外可能存在其他值未单独统计
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=132394, role_uv=4310, acc_uv=4066, server_uv=467；数值合理，事件正常触发
