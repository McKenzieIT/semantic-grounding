name: game.pve.begin
event_filter: event = 'game.pve.begin'
description: |-
  副本挑战：进入副本（包括主线、支线、挑战塔、阵营塔、时间塔）事件，玩家进入副本战斗开始时上报；分析主体为 role_id（角色粒度）。scout 实测 ds=20260729 单日 cnt=132394、role_uv=4310、acc_uv=4066、server_uv=467，事件正常触发。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等90个
domains:
  - 战斗关卡
domain: battle
