name: game.rogue.choosesoul
event_filter: event = 'game.rogue.choosesoul'
description: 古战场（rogue）副本中触发将魂（soul）选择时上报的事件，记录玩家在某个章节/难度/阶段的将魂候选项及最终选择。分析主体为 role_id（角色粒度），account_id 用于账号去重。参数含游戏服、账号/角色、等级战力、coinList 货币、choice 选项列表（含 id/name/quality/suit/choose 是否被选）、buff 祝福、soul 将魂列表（id/suitId/suitNum）、treasure 奇珍、rogueStage 阶段、chapter/difficulty/step 等。ds=20260729 单日 scout 实测：cnt=1100，role_uv=119，acc_uv=118，server_uv=47。
domains:
  - 战斗关卡
domain: battle
