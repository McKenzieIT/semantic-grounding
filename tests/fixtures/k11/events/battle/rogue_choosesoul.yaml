confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测 cnt=1100, role_uv=119, acc_uv=118, server_uv=47；数字合理（多服多角色，单角色平均约 9.2 次将魂选择）。
metrics:
  game_rogue_choosesoul_cnt:
    expression: COUNT(*)
    description: 将魂选择事件总次数（古战场副本中将魂选择节点的触发量）
  game_rogue_choosesoul_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发将魂选择的角色数（去重）
  game_rogue_choosesoul_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发将魂选择的账号数（去重）
  game_rogue_choosesoul_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发将魂选择的游戏服数（去重）
  game_rogue_choosesoul_choices_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 角色平均将魂选择次数（人均深度，反映古战场将魂选择节点的触发频度）
  game_rogue_choosesoul_chapter_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.chapter'))
    description: 覆盖的章节去重数（GET_JSON_OBJECT 取 chapter）
  game_rogue_choosesoul_roguestage_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.rogueStage'))
    description: 覆盖的古战场阶段去重数（GET_JSON_OBJECT 取 rogueStage）
coverage:
  scenarios:
    - 古战场将魂选择节点的总触发量与参与角色/账号/服务器规模
    - 角色人均将魂选择次数，评估玩家在将魂选择节点的交互深度
    - 将魂选择覆盖的章节与古战场阶段广度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；多日趋势需扩 ds 范围后复算
    - 分析主体默认 role_id（角色粒度），账号粒度仅用于去重辅助
    - choice/soul/treasure 为数组类型，本事件 metrics 暂未展开数组元素级聚合（如各品质将魂被选次数），如需可后续补充 LATERAL VIEW 数组展开
coverage_status: analyst_confirmed
external_refs:
