name: game.battle.quit
event_filter: event = 'game.battle.quit'
description: 角色放弃/退出战斗事件。记录角色在副本中主动放弃战斗的行为，分析主体为 role_id（角色）。参数含副本id、副本详细类型、角色等级、vip等级、角色战力及货币余额等。ds=20260729 scout 实测：当日 4773 次退出、1350 角色、1305 账号、177 服务器。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  dungeonId:
    type: int
    description: 副本id
  detailType:
    type: int
    description: 副本详细类型
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=4773, role_uv=1350, acc_uv=1305, server_uv=177，数值合理，事件在线
metrics:
  game_battle_quit_cnt:
    expression: COUNT(*)
    description: 放弃战斗总次数
  game_battle_quit_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 放弃战斗的角色数（分析主体 role_id）
  game_battle_quit_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 放弃战斗的账号数
  game_battle_quit_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生放弃战斗的服务器数
  game_battle_quit_dungeon_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.dungeonId'))
    description: 被放弃的副本种类数
  game_battle_quit_avg_role_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 放弃战斗角色的平均等级
  game_battle_quit_per_role_avg_cnt:
    expression: COUNT(*)::FLOAT / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均放弃战斗次数（总次数/角色UV）
coverage:
  scenarios:
    - 各副本（dungeonId）放弃战斗的频次分布，定位流失/卡点关卡
    - 放弃战斗角色的等级、vip、战力画像，识别新手卡点或战力不足
    - 各服务器放弃战斗热度对比
    - 人均放弃次数衡量玩家挫败程度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），未逐字段核对 params 类型
    - dungeonId/roleLevel 来自 params JSON，未抽样比对原始值
coverage_status: analyst_confirmed
external_refs: []
