name: game.war.activityEnterPerformDungeon
event_filter: event = 'game.war.activityEnterPerformDungeon'
description: 玩家进入剧情/表演副本关卡时上报的事件，记录被进入的剧情关卡id(dungeonId)以及角色进入时刻的快照（角色等级 roleLevel、vip等级 vipLevel、角色战力 roleForce、经验 exp、看板娘 image、关键货币列表 coinList 等）。分析主体粒度为 role_id（角色），account_id 为账号粒度补充。ds=20260729 单日 scout 实测：进入次数 cnt=830，覆盖角色 role_uv=304、账号 acc_uv=295、游戏服 server_uv=93，命中不同剧情关卡 dungeonId 去重 4 个。参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  dungeonId:
    type: int
    description: 关卡id
metrics:
  game_war_activity_enter_perform_dungeon_cnt:
    expression: COUNT(*)
    description: 进入剧情表演副本事件总记录数（进入次数）
  game_war_activity_enter_perform_dungeon_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 进入剧情表演副本的角色数（去重，分析主体 role_id）
  game_war_activity_enter_perform_dungeon_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 进入剧情表演副本的账号数（去重）
  game_war_activity_enter_perform_dungeon_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 进入剧情表演副本涉及的游戏服数（去重）
  game_war_activity_enter_perform_dungeon_dungeon_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.dungeonId'))
    description: 进入命中的不同剧情关卡id数（dungeonId 去重）
  game_war_activity_enter_perform_dungeon_enters_per_role:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均进入剧情表演副本次数（总次数/角色数）
coverage:
  scenarios:
    - 剧情表演副本参与度与渗透率（进入角色数 role_uv / 账号数 account_uv / 游戏服数 server_uv）
    - 剧情关卡命中广度与内容消耗（dungeon_uv 反映当日被进入的关卡广度）
    - 人均进入次数衡量剧情关卡的重复挑战强度（enters_per_role）
    - 各游戏服剧情关参与热度分布（按 server_id 分组）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度）；account_id 可作账号粒度补充，单日实测 params.roleId 与 role_id 一一对应（去重均=304）
    - dungeonId 单日仅 4 个去重取值，受当日活动配置与剧情进度范围限制，不代表全量剧情关卡数
    - coinList 字段为进入时刻货币快照，非本次进入的产出，未纳入事件级 metrics 求和
  granularity: role_id
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729：cnt=830, role_uv=304, acc_uv=295, server_uv=93, dungeon_uv=4。事件+ds 过滤命中且数值合理（角色与账号数接近、单服进入约8.9次）。
coverage_status: analyst_confirmed
external_refs: []
