name: game.realm.levelUp
event_filter: event = 'game.realm.levelUp'
description: 玩家境界升级事件，记录角色境界（realm）提升时的旧境界/阶段/等级/经验与当前境界/阶段/等级/经验及本次消耗经验（costExp）。 分析主体为 role_id（角色）；同时携带 accountId/serverId/roleLevel/vipLevel/roleForce/exp 与多种货币（coinList）。 scout 实测 ds=20260729：cnt=3571 次境界升级，覆盖 role_uv=1075 / acc_uv=1053 / server_uv=246。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  oldRealm:
    type: int
    description: 旧境界
  oldStage:
    type: int
    description: 旧阶段
  oldLevel:
    type: int
    description: 旧等级
  oldExp:
    type: int
    description: 旧经验
  currRealm:
    type: int
    description: 当前境界
  currStage:
    type: int
    description: 当前阶段
  currLevel:
    type: int
    description: 当前等级
  currExp:
    type: int
    description: 当前经验
  costExp:
    type: int
    description: 消耗经验
metrics:
  game_realm_levelUp_cnt:
    expression: COUNT(*)
    description: 境界升级事件总次数
  game_realm_levelUp_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发境界升级的去重角色数
  game_realm_levelUp_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发境界升级的去重账号数
  game_realm_levelUp_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发境界升级的去重游戏服数
  game_realm_levelUp_cost_exp_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.costExp') AS BIGINT))
    description: 境界升级消耗经验总量（costExp 求和）
  game_realm_levelUp_avg_cost_exp:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.costExp') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 平均每次境界升级消耗经验
  game_realm_levelUp_avg_level_gain:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.currLevel') AS BIGINT) - CAST(GET_JSON_OBJECT(params, '$.oldLevel') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 平均每次境界升级等级提升数（currLevel-oldLevel）
coverage:
  scenarios:
    - 境界升级整体热度（次数/角色/账号/服务器覆盖）
    - 境界升级经验消耗规模与单次平均消耗（costExp 求和/均值）
    - 单次升级等级跨度（currLevel-oldLevel 均值）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），账号粒度按 account_id 镜像统计
    - costExp/currLevel/oldLevel 取自 params JSON 字段，未做空值校验复核
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=3571, role_uv=1075, acc_uv=1053, server_uv=246; 数据合理"
coverage_status: analyst_confirmed
external_refs: []
