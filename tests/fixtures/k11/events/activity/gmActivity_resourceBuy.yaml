name: game.gmActivity.resourceBuy
event_filter: event = 'game.gmActivity.resourceBuy'
description: GM活动资源购买事件：玩家在GM运营活动中购买资源（活动ID actId / 子活动 subId），主体粒度为 role_id。实测 ds=20260729 与 ds=20260728 均零命中，活动疑似未上线/未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  actId:
    type: int
    description: 活动ID
  subId:
    type: int
    description: 活动子ID
metrics:
  game_gmActivity_resourceBuy_cnt:
    expression: COUNT(*)
    description: GM活动资源购买事件总次数
  game_gmActivity_resourceBuy_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与GM活动资源购买的去重角色数
  game_gmActivity_resourceBuy_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与GM活动资源购买的去重账号数
  game_gmActivity_resourceBuy_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及GM活动资源购买的去重游戏服数
coverage:
  scenarios:
    - GM活动运营投放的资源购买量与参与规模统计
    - 按 actId / subId 拆解活动子项的购买热度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729 cnt=0；retry ds=20260728 仍 cnt=0)，疑似活动下线/未触发
    - 主体粒度默认为 role_id（角色级事件）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: "ds=20260729 scout: cnt=0 role_uv=0 acc_uv=0；retry ds=20260728: cnt=0 role_uv=0 acc_uv=0；零命中，未达 analyst_confirmed 条件，保留 draft"
external_refs: []
