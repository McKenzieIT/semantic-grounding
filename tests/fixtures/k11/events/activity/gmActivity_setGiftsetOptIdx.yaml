name: game.gmActivity.setGiftsetOptIdx
event_filter: event = 'game.gmActivity.setGiftsetOptIdx'
description: GM活动礼包选项设置事件：玩家在GM活动(actId/subId)的礼包集(Giftset)中选择某选项索引(optIdxs)，触发礼包领取/资源购买行为，同时上报boxIds及玩家货币余额(coinList)等26个参数。主体粒度为角色(role_id)，单条日志代表一次礼包选项设置动作。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  actId:
    type: int
    description: 活动ID
  subId:
    type: int
    description: 活动子ID
  boxIds:
    type: array
    description: boxid列表
  optIdxs:
    type: array
    description: optidx列表
metrics:
  game_gmActivity_setGiftsetOptIdx_cnt:
    expression: COUNT(*)
    description: GM活动礼包选项设置事件总触发次数
  game_gmActivity_setGiftsetOptIdx_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发礼包选项设置的去重角色数(主体粒度)
  game_gmActivity_setGiftsetOptIdx_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发礼包选项设置的去重账号数
  game_gmActivity_setGiftsetOptIdx_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发礼包选项设置的去重游戏服数
coverage:
  scenarios:
    - 监控GM活动礼包选项设置的整体触发规模、参与角色/账号/服务器广度
    - 评估GM活动礼包玩法的活跃度与覆盖范围
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似活动下线/当日未触发
    - 默认主体粒度为 role_id；零命中场景下指标值均为0，需活动复现后再次校验
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: scout 实测(ds=20260729) cnt=0, role_uv=0, acc_uv=0, server_uv=0；retry ds=20260728 仍 cnt=0，判定为零命中
external_refs: []
