name: game.dig.pickupDigKey
event_filter: event = 'game.dig.pickupDigKey'
description: 挖宝玩法中玩家拾取钥匙的事件。玩家在挖宝过程中获得钥匙道具时触发，记录玩家当时所在的挖宝层级（newDigLevel/oldDigLevel）、拾取位置（pos）以及角色基础属性（等级、VIP、战力、货币余额等25项参数）。主体粒度为 role_id（角色级），可按 server_id/account_id 聚合。本事件 ds=20260729/20260728 单日 scout 实测零命中。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  pos:
    type: int
    description: 位置
  newDigLevel:
    type: int
    description: 新层级
  oldDigLevel:
    type: int
    description: 旧层级
metrics:
  game_dig_pickupDigKey_cnt:
    expression: COUNT(*)
    description: 挖宝拾取钥匙事件总触发次数
  game_dig_pickupDigKey_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 拾取钥匙的去重角色数
  game_dig_pickupDigKey_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 拾取钥匙的去重账号数
  game_dig_pickupDigKey_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 拾取钥匙涉及的去重游戏服数
coverage:
  scenarios:
    - 统计挖宝玩法中钥匙拾取的触发量与角色/账号/服务器覆盖面，用于评估挖宝玩法参与度与钥匙产出节奏。
  limitations:
    - 日志中零命中(ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 同样为零)，疑似事件已下线或未触发，需确认事件名是否变更或埋点是否仍在线。
    - 仅 ds=20260729 单日 scout 实测，未做全量复核。
    - 默认主体粒度为 role_id；account_id/server_id 仅供跨维度聚合参考。
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 scout: cnt=0 role_uv=0 acc_uv=0 server_uv=0；ds=20260728 重试同为零命中。事件疑似下线/未触发，保持 draft。"
  coverage_status: draft
external_refs: []
