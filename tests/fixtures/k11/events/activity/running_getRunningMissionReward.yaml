name: game.running.getRunningMissionReward
event_filter: event = 'game.running.getRunningMissionReward'
description: 领取赛马任务奖励事件：角色在赛马(running)玩法中完成并领取任务奖励时上报，携带 missionIds(任务id数组)、rewards(奖励明细数组 type/value/size/uid)、coinList(关键货币 gold/sendgold/freegold/diamond/expCoin/energy) 等参数。分析主体为 role_id（角色粒度），account_id 用于账号级去重。ds=20260729 单日 scout 实测 0 命中（ds=20260728 同样 0 命中），事件疑似下线/未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  missionIds:
    type: array
    description: missionIds
  rewards:
    type: array
    description: rewards
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  running_get_running_mission_reward_cnt:
    expression: COUNT(*)
    description: 赛马任务奖励领取事件总次数
  running_get_running_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取赛马任务奖励的去重角色数
  running_get_running_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取赛马任务奖励的去重账号数
coverage:
  scenarios:
    - 事件级量纲：领取赛马任务奖励的发生次数、参与角色/账号 UV
    - 按 server_id/roleLevel/vipLevel 维度拆分领取参与度
    - rewards/coinList 货币与奖励发放总量核对
  limitations:
    - 日志中零命中(ds=20260729 cnt=0；ds=20260728 cnt=0)，疑似事件下线/未触发
    - 仅 ds=20260729/ds=20260728 双日 scout 实测，未做全量复核
    - subject 粒度默认 role_id（角色），未实测到非零值
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0。零命中，保持 draft。"
external_refs: []
