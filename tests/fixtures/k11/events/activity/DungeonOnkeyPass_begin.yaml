name: game.DungeonOnkeyPass.begin
event_filter: event = 'game.DungeonOnkeyPass.begin'
description: 副本一键推关启动事件：玩家触发副本一键扫荡/自动推关时上报，记录开始层 beginFloor、副本类型 dungeonType、编队武将 BattleTeam.knightList 及货币快照等33个参数。主体粒度为 role_id（角色）。实测 ds=20260729 单日 cnt=52970、role_uv=1867、acc_uv=1772、server_uv=181。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  dungeonType:
    type: int
    description: 副本类型
  beginFloor:
    type: int
    description: 开始层
  BattleTeam:
    type: array
    description: 参与的编队
  BattleTeam.knightList:
    type: array
    description: 上阵武将列表
  BattleTeam.effectGroup:
    type: int
    description: 生效的阵营光环
  BattleTeam.knightAutoSkill:
    type: array
    description: 武将自动方案
  BattleTeam.knightAutoSkill.knightId:
    type: int
    description: 武将id
  BattleTeam.knightAutoSkill.schemeId:
    type: int
    description: 方案id
  BattleTeam.mainCharm:
    type: int
    description: 主灵器
  BattleTeam.assistCharm:
    type: int
    description: 助灵器
  BattleTeam.spCaptain:
    type: int
    description: BattleTeam.spCaptain
metrics:
  game_DungeonOnkeyPass_begin_cnt:
    expression: COUNT(*)
    description: 副本一键推关启动事件总触发次数
  game_DungeonOnkeyPass_begin_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发一键推关的去重角色数
  game_DungeonOnkeyPass_begin_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发一键推关的去重账号数
  game_DungeonOnkeyPass_begin_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发一键推关的去重游戏服数
coverage:
  scenarios:
    - 一键推关功能使用频次与参与角色/账号/游戏服规模
    - 副本自动扫荡玩法的日活与渗透（结合主活跃口径）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色），账号级口径需用 account_uv 单独核算
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 实测 cnt=52970, role_uv=1867, acc_uv=1772, server_uv=181
  coverage_status: analyst_confirmed
external_refs: []
alt_labels:
  - 副本
  - 地下城
