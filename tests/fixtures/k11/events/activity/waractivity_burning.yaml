name: game.waractivity.burning
event_filter: event = 'game.waractivity.burning'
description: 三山燃灵-点燃蜡烛活动事件：角色在三山燃灵玩法中点燃蜡烛/烛台进行燃灵，记录当次点燃蜡烛数(caddleNum)、烛台数(caddleHolderNum)、今日燃灵次数(todayBurningCount, 每日上限5次)及剩余燃灵次数(leftBurningCount)等26个参数。分析主体为 role_id（角色级事件，account_id 为账号去重维度，server_id 为分服维度）。实测 ds=20260729：事件 17283 条、参与角色 3439 人、账号 3275 个、覆盖 447 个服。参数：游戏服id、角色id、角色名、角色等级、vip等级、角色战力、蜡烛数量、烛台数量、今日/剩余燃灵次数 等26个
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  caddleNum:
    type: int
    description: 点亮的蜡烛数量
  caddleHolderNum:
    type: int
    description: 点亮的烛台数量
  leftBurningCount:
    type: int
    description: 剩余燃灵次数
  todayBurningCount:
    type: int
    description: 今日燃灵次数（每日最多5次）
metrics:
  burning_cnt:
    expression: COUNT(*)
    description: 燃灵（点燃蜡烛）事件总次数
  burning_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与燃灵的去重角色数
  burning_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与燃灵的去重账号数
  burning_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 参与燃灵的去重游戏服数
  burning_candle_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.caddleNum') AS BIGINT))
    description: 点亮蜡烛总数（所有事件累加，含同角色多次重复累加）
  burning_candle_holder_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.caddleHolderNum') AS BIGINT))
    description: 点亮烛台总数（所有事件累加）
  burning_today_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.todayBurningCount') AS BIGINT))
    description: 今日燃灵次数总和（每日上限5次/角色）
  burning_left_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.leftBurningCount') AS BIGINT))
    description: 剩余燃灵次数总和
  burning_avg_candle_per_role:
    expression: CAST(SUM(CAST(GET_JSON_OBJECT(params, '$.caddleNum') AS BIGINT)) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均点亮蜡烛数（蜡烛总数/参与角色数）
  burning_avg_today_count_per_role:
    expression: CAST(SUM(CAST(GET_JSON_OBJECT(params, '$.todayBurningCount') AS BIGINT)) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均今日燃灵次数（对照每日5次上限）
coverage:
  granularity: 单次点燃蜡烛事件（role_id 为默认主体粒度，account_id 为账号去重维度）
  scenarios:
    - 衡量三山燃灵玩法活跃度：参与角色数/账号数/覆盖游戏服数/事件次数
    - 评估燃灵产出强度：人均点燃蜡烛数、人均今日燃灵次数（对照每日5次上限）
    - 监控燃灵资源余量：剩余燃灵次数总和，判断玩法消耗节奏
    - 分服/分时段下钻（结合 server_id、ds、hh）定位高活跃服与燃灵高峰时段
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；多日趋势/周末波动需后续补充
    - 分析主体默认 role_id（角色级事件），account_id 仅作账号去重维度，不作为主分析粒度
    - todayBurningCount 上限 5 次/角色/日，实测当日 MAX=5 与设定一致；个别角色可能未达上限
    - 蜡烛/烛台数量为当次点燃快照值，SUM 含同一角色多次点燃的重复累加，不代表独立蜡烛总数
    - 货币类参数(coinList.*)未纳入指标，如需货币产出分析需另行定义
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729（game.waractivity.burning）：cnt=17283、role_uv=3439、acc_uv=3275、server_uv=447；caddleNum 累加 34570、todayBurningCount 累加 51513（MAX=5 符合每日上限5次）、leftBurningCount 累加 113351。数据量级合理，事件正常触发。
external_refs: []
