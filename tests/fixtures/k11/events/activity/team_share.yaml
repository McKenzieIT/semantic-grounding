name: game.team.share
event_filter: event = 'game.team.share'
description: 阵容分享事件：玩家将当前阵容（队伍搭配）分享到世界/公会频道或好友，记录分享行为、分享目标、阵容类型(teamType)及分享时刻角色等级、战力、VIP、各货币余额等26个参数。分析主体为 role_id。scout 实测 ds=20260729/20260728 均零命中。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  shareGuild:
    type: bool
    description: 是否分享到公会频道
  teamType:
    type: int
    description: 阵容类型
  shareWorld:
    type: bool
    description: 是否分享到世界频道
  shareFriends:
    type: array
    description: 好友ID列表
metrics:
  team_share_cnt:
    expression: COUNT(*)
    description: 阵容分享事件总次数
  team_share_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 分享阵容的去重角色数（分析主体 role_id）
  team_share_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 分享阵容的去重账号数
  team_share_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 分享阵容覆盖的去重游戏服数
  team_share_world_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params,'$.shareWorld')='true' THEN role_id END)
    description: 分享到世界频道的去重角色数
  team_share_guild_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params,'$.shareGuild')='true' THEN role_id END)
    description: 分享到公会频道的去重角色数
coverage:
  granularity: 单次阵容分享事件（role_id 为默认主体粒度）
  scenarios:
    - 阵容分享行为规模（总次数/角色UV/账号UV/服务器覆盖）
    - 按分享目标（世界 shareWorld / 公会 shareGuild）拆分分享渠道分布
    - 按 teamType 阵容类型拆分，分析不同阵容的分享热度
    - 结合 roleLevel/vipLevel/roleForce 分析分享人群特征
  limitations:
    - 日志中零命中（ds=20260729 与 ds=20260728 均 cnt=0/role_uv=0/acc_uv=0/server_uv=0），事件疑似下线/未触发，待业务确认事件名与触发条件
    - 仅 ds=20260729/20260728 两日 scout 实测，未做全量复核
    - 分析主体默认 role_id（因零命中未能校验）
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样零命中。事件疑似下线/未触发，保持 draft。
external_refs: []
