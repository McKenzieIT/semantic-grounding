name: game.knightMap.stageUp
event_filter: event = 'game.knightMap.stageUp'
description: 武将云图升阶段事件：记录玩家在武将云图（武将图鉴）系统中提升阶段等级的行为，携带 serverId/roleId/roleName/roleLevel/vipLevel/roleForce/exp 等角色属性及 group/stage 阶段参数。subject 粒度为 role_id（角色级事件），ds=20260729 单日实测 673 次触发、132 角色、130 账号、92 游戏服。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  group:
    type: int
    description: group
  stage:
    type: int
    description: stage
metrics:
  game_knightMap_stageUp_cnt:
    expression: COUNT(*)
    description: 武将云图升阶段触发总次数
  game_knightMap_stageUp_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发武将云图升阶段的角色去重数
  game_knightMap_stageUp_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发武将云图升阶段的账号去重数
  game_knightMap_stageUp_stage_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.stage') AS BIGINT))
    description: 武将云图升阶段累计提升的 stage 值总和
coverage:
  scenarios:
    - 评估武将云图升阶段系统的参与度（触发次数、角色/账号覆盖）与阶段推进总量，作为角色成长与系统监控的活跃指标
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - subject 默认为 role_id（角色级）
    - stage_sum 为累计求和口径，可能多次升阶累加，非去重阶段数
  data_scope: ds=20260729
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 实测 cnt=673, role_uv=132, acc_uv=130, server_uv=92
  coverage_status: analyst_confirmed
external_refs: []
