confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0/role_uv=0/acc_uv=0，ds=20260728 同样零命中；疑似事件未触发或已下线，标记 draft 待后续命中复核
  coverage_status: draft
external_refs: []
