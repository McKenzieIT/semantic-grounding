  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
  missionType:
    type: int
    description: missionType
  requireType:
    type: int
    description: requireType
  detail:
    type: string
