name: game.monthFund.fetchReward
event_filter: event = 'game.monthFund.fetchReward'
description: 月基金奖励领取事件：玩家领取月基金（Month Fund）每日/档位奖励时上报，记录领奖档位ID（id）、第几天（day）、哪期（themeId）、自选第几个（boxId）、是否付费奖励（isVip）及领奖时的角色基础属性与货币快照。主体粒度为 role_id（角色），单事件计 1 次领奖行为，可按 role/account/server 维度聚合度量领取次数与覆盖人数。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  reason:
    type: int
    description: 来源ShareConst.MONTH_FUND.GAMELOG_REASON
  isVip:
    type: bool
    description: 是否付费奖励
  themeId:
    type: int
    description: 哪期获得
  id:
    type: int
    description: 档位ID
  day:
    type: int
    description: 第几天的
  boxId:
    type: int
    description: 自选第几个（非自选默认1）
metrics:
  game_monthFund_fetchReward_cnt:
    expression: COUNT(*)
    description: 月基金领奖总次数（单事件=1次领奖行为）
  game_monthFund_fetchReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取月基金奖励的去重角色数
  game_monthFund_fetchReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取月基金奖励的去重账号数
  game_monthFund_fetchReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取月基金奖励的去重游戏服数
coverage:
  scenarios:
    - 按日/档位/期数统计月基金领奖次数与覆盖人数，评估月基金玩法参与度与留存拉动效果
    - 结合是否付费奖励标志（isVip）区分付费/免费领奖用户结构
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色）；领奖金额相关货币字段（coinList.*）未纳入聚合度量
    - cnt=2/role_uv=1/acc_uv=1/server_uv=1，样本极小，需多日观测确认稳态
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 scout 实测：cnt=2, role_uv=1, acc_uv=1, server_uv=1（单日命中，规模极小但事件可达）
  coverage_status: analyst_confirmed
