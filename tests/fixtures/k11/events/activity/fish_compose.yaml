name: game.fish.compose
event_filter: event = 'game.fish.compose'
description: 钓鱼玩法合成事件：玩家在钓鱼系统中通过合成操作产出/合成鱼类或道具。记录触发合成的角色、所属账号、所在游戏服、合成产物品质(quality)与数量(count)等参数。主体粒度为 role_id（角色级），单日(ds=20260729)实测触发 799 次，覆盖 565 个角色、536 个账号、200 个游戏服。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  quality:
    type: int
    description: quality
  count:
    type: int
    description: count
metrics:
  game_fish_compose_cnt:
    expression: COUNT(*)
    description: 钓鱼合成事件触发总次数
  game_fish_compose_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发钓鱼合成的去重角色数
  game_fish_compose_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发钓鱼合成的去重账号数
  game_fish_compose_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.count') AS BIGINT))
    description: 钓鱼合成产出数量总和(按 params.count 字段聚合)
coverage:
  scenarios:
    - 监控钓鱼合成玩法的日活参与度(角色/账号UV)与触发频次(cnt)
    - 评估钓鱼合成产出规模(count_sum)用于资源产销分析
    - 结合 server_uv 衡量钓鱼玩法在不同游戏服的渗透情况
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id；若需账号级汇总请使用 account_uv 指标
    - count_sum 依赖 params.count 字段，若个别日志缺字段会被 CAST 忽略
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 实测: cnt=799, role_uv=565, acc_uv=536, server_uv=200; 数据合理, 确认为 analyst_confirmed"
  coverage_status: analyst_confirmed
external_refs: []
