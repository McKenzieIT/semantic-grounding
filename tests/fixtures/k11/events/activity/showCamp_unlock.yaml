name: game.showCamp.unlock
event_filter: event = 'game.showCamp.unlock'
description: 折扣服玩法：营地/阵营解锁事件。记录角色解锁营地（看板娘 slot）时刻，含角色等级、vip等级、战力、经验及关键货币余额快照（钻石/紫金/经验卷轴/体力）。分析主体为 role_id（角色级），ds=20260729 scout 实测 cnt=2342/role_uv=668/acc_uv=659/server_uv=189。
domains:
  - 自定义
domain: activity
metrics:
  showCamp_unlock_cnt:
    expression: COUNT(*)
    description: 营地解锁事件总次数
  showCamp_unlock_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发营地解锁的去重角色数
  showCamp_unlock_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发营地解锁的去重账号数
  showCamp_unlock_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发营地解锁的去重服务器数
coverage:
  scenarios:
    - 营地解锁参与度：每日解锁营地的角色/账号数与事件总量
    - 解锁时点角色画像：角色等级、vip等级、角色战力分布
    - 解锁时点货币余额：钻石/紫金/经验卷轴/体力快照
    - 服务器覆盖：解锁事件触发的去重服务器数
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id（角色级），未单独核实 account_id 唯一性
    - coinList 为解锁时刻余额快照，非交易流水金额，不可作营收汇总
coverage_status: analyst_confirmed
