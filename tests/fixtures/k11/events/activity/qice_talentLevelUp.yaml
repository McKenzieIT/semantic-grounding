name: game.qice.talentLevelUp
event_filter: event = 'game.qice.talentLevelUp'
description: 奇策-潜能升级事件：记录角色在奇策系统中对潜能进行升级操作的行为日志，上报点位 order 与目标等级 level。主体粒度为 role_id（角色维度），同时携带 account_id、server_id、角色等级、vip 等级、角色战力、经验及关键货币（充值钻石/紫金/经验卷轴/体力）等 24 个参数字段。日志中零命中(ds=20260729/20260728)，疑似下线/未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  order:
    type: int
    description: 点位
  level:
    type: int
    description: 目标等级
metrics:
  game_qice_talentLevelUp_cnt:
    expression: COUNT(*)
    description: 奇策潜能升级事件总上报次数
  game_qice_talentLevelUp_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 奇策潜能升级触发的去重角色数（默认 subject）
  game_qice_talentLevelUp_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 奇策潜能升级触发的去重账号数
  game_qice_talentLevelUp_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 奇策潜能升级触发的去重游戏服数
coverage:
  scenarios:
    - 角色奇策潜能升级频次（cnt）
    - 参与潜能升级的角色/账号/服务器分布（role_uv / account_uv / server_uv）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 默认 subject 为 role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: ds=20260729 scout 实测 cnt=0 / role_uv=0 / acc_uv=0 / server_uv=0；ds=20260728 复测 cnt=0，日志中零命中，疑似下线/未触发
external_refs:
  - dim_table: dim_10000251_knight_awaken_info_arch
    join_keys:
      - dws_column: order
        dim_column: order
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 order, level 与 dim_10000251_knight_awaken_info_arch 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info_arch
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info_arch 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_trans_story_df
    join_keys:
      - dws_column: order
        dim_column: order
    derivation: 确定性：事件字段 order 与 dim_10000251_trans_story_df 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_trans_story_df_arch
    join_keys:
      - dws_column: order
        dim_column: order
    derivation: 确定性：事件字段 order 与 dim_10000251_trans_story_df_arch 主键精确同名
    origin: deterministic
