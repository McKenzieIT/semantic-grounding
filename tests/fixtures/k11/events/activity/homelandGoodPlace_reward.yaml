name: game.homelandGoodPlace.reward
event_filter: event = 'game.homelandGoodPlace.reward'
description: 家园-宝地领奖事件：角色在家园宝地玩法中领取奖励时上报，携带角色基础信息（账号/角色/性别/等级/VIP/战力/经验）与领奖类型(types)及关键货币快照(coinList)。主体粒度为 role_id（角色），单角色可多次领奖。ds=20260729/20260728 单日 scout 实测零命中(cnt=0)。
domains:
  - 自定义
domain: activity
metrics:
  game_homelandGoodPlace_reward_cnt:
    expression: COUNT(*)
    description: 家园宝地领奖总次数（事件行数）
  game_homelandGoodPlace_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 家园宝地领奖触达角色数
  game_homelandGoodPlace_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 家园宝地领奖触达账号数
  game_homelandGoodPlace_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 家园宝地领奖涉及游戏服数
coverage:
  scenarios:
    - 监控家园宝地领奖的触发频次与角色/账号/服务器触达广度
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度 role_id；当前无可信体量，未做金额/数量类聚合
  default_subject: role_id
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  types:
    type: array
    description: 领奖的类型
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 重试 cnt=0；零命中，保留 draft
  coverage_status: draft
external_refs: []
