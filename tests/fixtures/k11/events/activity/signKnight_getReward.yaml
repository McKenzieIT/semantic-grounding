name: game.signKnight.getReward
event_filter: event = 'game.signKnight.getReward'
description: 全武将活动（signKnight）-领取奖励事件：玩家在全武将活动中领取某个武将的奖励时上报。分析主体为 role_id（角色）；同期上报 knightId（武将id）、id（奖励id）、coinList（货币变动）。ds=20260729 scout 实测：2831 次领取，2685 角色，2512 账号，227 服；覆盖 34 个武将、48 个奖励 id，事件在线。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
  knightId:
    type: int
    description: knightId
metrics:
  sign_knight_get_reward_cnt:
    expression: COUNT(*)
    description: 全武将活动领取奖励总次数（全量事件计数）
  sign_knight_get_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取奖励的去重角色数（分析主体 role_id）
  sign_knight_get_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取奖励的去重账号数
  sign_knight_get_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取奖励覆盖的去重游戏服数
  sign_knight_get_reward_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.knightId'))
    description: 领取奖励覆盖的去重武将数（knightId）
  sign_knight_get_reward_id_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.id'))
    description: 领取奖励覆盖的去重奖励 id 数
  sign_knight_get_reward_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 领取奖励的人均领取次数（次数/去重角色数）
coverage:
  scenarios:
    - 全武将活动奖励领取活跃度（次数/角色UV/账号UV/服务器覆盖）
    - 武将领取广度（去重 knightId 与奖励 id 覆盖数，反映活动奖励被领取的覆盖面）
    - 角色参与全武将奖励领取的分布与人均领取次数
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id；账号级口径见 account_uv 指标
    - coinList 为数组结构，本指标未对货币变动逐项聚合，仅汇总领取次数与武将/奖励覆盖
    - rewards 明细（若上报）未在本指标层逐项聚合
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测：cnt=2831, role_uv=2685, acc_uv=2512, server_uv=227, knight_uv=34, reward_id_uv=48；knightId 全样本非空，数据合理，事件在线。
