name: game.ScriptCampaign.fetchDailyRewards
event_filter: event = 'game.ScriptCampaign.fetchDailyRewards'
description: 剧本活动领取每日奖励事件：角色在剧本活动（ScriptCampaign）中领取每日奖励时上报，携带角色基础信息、货币快照（coinList 含充值/赠送/免费钻石、紫金、经验卷轴、体力）、剧本进度（lastRecord.level/hpStage/groundId）及 isNumUp/isQualityUp 升级标记。主体粒度为 role_id（角色级），单日 ds=20260729 实测 1534 条事件、1507 角色、1477 账号、376 服。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  isNumUp:
    type: bool
    description: isNumUp
  isQualityUp:
    type: bool
    description: isQualityUp
  scriptId:
    type: int
    description: scriptId
  lastRecord:
    type: json
    description: lastRecord
  lastRecord.level:
    type: int
    description: lastRecord.level
  lastRecord.hpStage:
    type: int
    description: lastRecord.hpStage
  lastRecord.groundId:
    type: int
    description: lastRecord.groundId
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout ds=20260729 实测：cnt=1534, role_uv=1507, acc_uv=1477, server_uv=376；主体粒度 role_id，量级合理，确认上线。
metrics:
  game_ScriptCampaign_fetchDailyRewards_cnt:
    expression: COUNT(*)
    description: 剧本活动领取每日奖励事件总次数
  game_ScriptCampaign_fetchDailyRewards_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取每日奖励的去重角色数
  game_ScriptCampaign_fetchDailyRewards_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取每日奖励的去重账号数
  game_ScriptCampaign_fetchDailyRewards_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取每日奖励的去重游戏服数
coverage:
  scenarios:
    - 评估剧本活动每日奖励的发放规模与角色/账号触达面
    - 监控剧本活动活跃度与服务器覆盖范围
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色级），未细化到奖励档位/数量
coverage_status: analyst_confirmed
external_refs: []
