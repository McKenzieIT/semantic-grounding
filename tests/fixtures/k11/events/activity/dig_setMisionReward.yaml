name: game.dig.setMisionReward
event_filter: event = 'game.dig.setMisionReward'
description: 挖宝活动设置任务奖励埋点：玩家在挖宝玩法中触发"设置/选择任务奖励"行为时上报。参数含游戏服id/名字、账号id、角色id/名字/性别/创角时间/上线时间/角色等级/vip等级/角色战力/经验、看板娘、关键货币列表（充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）、会话id、logUUID、任务ID(id)、选择位置(boxSeq)、奖励位置(posSeq)等共25个字段。主体粒度为 role_id（角色级），单条日志代表一次角色在挖宝中对某任务奖励位置的设置/选择行为，实测量级为事件条数、角色/账号/服 UV。
domains:
  - 自定义
domain: activity
metrics:
  game_dig_setMisionReward_cnt:
    expression: COUNT(*)
    description: 挖宝设置任务奖励事件总条数（每次角色设置/选择任务奖励计一次）
  game_dig_setMisionReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发挖宝设置任务奖励的去重角色数（主体粒度 role_id）
  game_dig_setMisionReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发挖宝设置任务奖励的去重账号数
  game_dig_setMisionReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发挖宝设置任务奖励的去重游戏服数
coverage:
  scenarios:
    - 挖宝玩法任务奖励设置/选择的参与规模（事件量、角色/账号/服 UV）
    - 评估挖宝任务奖励投放覆盖的角色与服务器广度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似事件下线/未触发或未在该游戏上线
    - 主体粒度默认 role_id（角色级），账号级指标仅作辅助去重参考
    - boxSeq(选择位置)/posSeq(奖励位置)/id(任务ID) 为标识性参数，未配置聚合度量
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 任务ID
  boxSeq:
    type: int
    description: 选择位置
  posSeq:
    type: int
    description: 奖励位置
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 scout 实测 cnt=0 role_uv=0 acc_uv=0 server_uv=0；retry ds=20260728 仍 cnt=0；零命中，疑似事件下线/未触发或未在该游戏上线，保持 draft。
  coverage_status: draft
