name: game.lunwu.matchSuccess
event_filter: event = 'game.lunwu.matchSuccess'
description: 论武(PVP竞技场)匹配成功事件：玩家在论武玩法中发起匹配并成功匹配到对手时触发，记录玩家匹配分(point)、当前挑战次数(battleCount)、对手信息(oppos.uid/oppoType/point)及角色等级/战力/vip等31个参数。主体粒度为 role_id(角色)，account_id 为账号粒度。ds=20260729 实测：cnt=7787 / role_uv=2064 / acc_uv=2005 / server_uv=380。
metrics:
  game_lunwu_matchSuccess_cnt:
    expression: COUNT(*)
    description: 论武匹配成功事件触发总次数
  game_lunwu_matchSuccess_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 论武匹配成功覆盖的去重角色数(主体粒度)
  game_lunwu_matchSuccess_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 论武匹配成功覆盖的去重账号数
  game_lunwu_matchSuccess_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 论武匹配成功覆盖的去重游戏服数
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  seasonId:
    type: int
    description: 当前的剧本id
  battleCount:
    type: int
    description: 当前调整次数
  oppos:
    type: array
    description: 对手信息
  oppos.uid:
    type: int
    description: 玩家uid
  oppos.oppoType:
    type: int
    description: 对手档次
  oppos.point:
    type: int
    description: 对手的匹配分
  oppos.winAtkPoint:
    type: int
    description: 胜利后玩家匹配分
  oppos.winDefPoint:
    type: int
    description: 胜利后对手匹配分
  point:
    type: int
    description: 玩家的匹配分
coverage:
  scenarios:
    - 论武匹配活跃度(cnt/role_uv) → 自定义玩法参与规模
    - 账号/角色覆盖(account_uv/role_uv) → 唯一玩家触达
    - 服务器分布(server_uv) → 论武玩法覆盖区服范围
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体默认 role_id(角色)；账号粒度参考 account_uv
    - 指标基于事件日志，未与论武玩法后端结算数据交叉校验
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 实测 cnt=7787 / role_uv=2064 / acc_uv=2005 / server_uv=380，数据合理，已 analyst_confirmed
  coverage_status: analyst_confirmed
external_refs: []
