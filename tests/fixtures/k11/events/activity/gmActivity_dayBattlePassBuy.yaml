name: game.gmActivity.dayBattlePassBuy
event_filter: event = 'game.gmActivity.dayBattlePassBuy'
description: 玩家购买每日战令（dayBattlePassBuy）行为事件，记录角色每日购买战令的购买动作及关联角色/账号/服务器上下文（含 vip 等级、战力、货币快照、是否使用代金券 useVoucher）。主体粒度为 role_id（角色级）。实测 ds=20260729 单日 cnt=21，覆盖 21 个角色 / 21 个账号 / 9 个服务器。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activity:
    type: int
    description: activity
  useVoucher:
    type: bool
    description: useVoucher
metrics:
  game_gmActivity_dayBattlePassBuy_cnt:
    expression: COUNT(*)
    description: 每日战令购买事件总触发次数（行数）
  game_gmActivity_dayBattlePassBuy_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 购买每日战令的去重角色数（主体粒度 role_id）
  game_gmActivity_dayBattlePassBuy_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 购买每日战令的去重账号数
  game_gmActivity_dayBattlePassBuy_voucher_used_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.useVoucher') = 'true' THEN 1 ELSE 0 END)
    description: 使用代金券（useVoucher=true）完成每日战令购买的次数
coverage:
  scenarios:
    - 每日战令购买规模与去重角色/账号/服务器覆盖度
    - 代金券（useVoucher）使用占比，评估促销券对每日战令购买的拉动
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id；账号级去重以 account_id 为准
    - useVoucher 为布尔字段，GET_JSON_OBJECT 返回字符串 'true'/'false' 进行匹配
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 scout: cnt=21, role_uv=21, acc_uv=21, server_uv=9"
  coverage_status: analyst_confirmed
external_refs: []
