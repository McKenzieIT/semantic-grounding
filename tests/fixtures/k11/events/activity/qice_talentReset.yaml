name: game.qice.talentReset
event_filter: event = 'game.qice.talentReset'
description: 奇策-潜能重置事件：玩家在奇策（策略/谋士）系统中重置角色潜能/天赋时上报。携带角色级快照（roleId、roleName、roleLevel、vipLevel、roleForce、exp）及重置时刻的关键货币余额快照（coinList.*：充值钻石、赠送钻石、免费钻石、紫金、经验卷轴、体力等）。分析主体为 role_id（角色级粒度）。scout 实测 ds=20260727/20260728/20260729 连续三日 cnt=0，事件疑似下线/未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
metrics:
  game_qice_talentreset_cnt:
    expression: COUNT(*)
    description: 奇策潜能重置事件触发次数（按行计，含同一角色多次重置）
  game_qice_talentreset_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发奇策潜能重置的去重角色数（分析主体为 role_id，角色级粒度）
  game_qice_talentreset_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发奇策潜能重置的去重账号数
coverage:
  scenarios:
    - 奇策潜能重置功能的整体触发规模与参与角色/账号数（角色级粒度）
    - 不同游戏服、不同角色等级段（roleLevel）/vip等级（vipLevel）下的潜能重置活跃度对比
  limitations:
    - 日志中零命中(ds=20260727/20260728/20260729 连续三日 cnt=0/role_uv=0/acc_uv=0)，事件疑似下线/未触发或埋点未生效，指标当前无法实测校验
    - 仅做了 ds=20260727/20260728/20260729 三日 scout 实测，未做全量复核
    - 事件为快照型，params 中 coinList.* 为重置时刻的货币余额快照（非交易金额），故未定义收入类指标；分析主体默认 role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260727/20260728/20260729 连续三日 cnt=0/role_uv=0/acc_uv=0，事件疑似下线/未触发，维持 draft；事件上线/恢复触发后需重测后升级为 analyst_confirmed
coverage_status: draft
external_refs: []
