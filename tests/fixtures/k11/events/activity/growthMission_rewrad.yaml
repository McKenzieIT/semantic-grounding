name: game.growthMission.rewrad
event_filter: event = 'game.growthMission.rewrad'
description: 成长助力-任务奖励事件：玩家完成成长助力任务并领取奖励时上报，记录角色维度的奖励领取行为。主体粒度为 role_id（角色），单条日志代表一次任务奖励领取。参数包含游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等24个，可用于统计成长助力任务奖励的领取次数、领取角色/账号 UV 及各服务器分布。
domains:
  - 自定义
domain: activity
metrics:
  game_growthMission_rewrad_cnt:
    expression: COUNT(*)
    description: 成长助力任务奖励领取总次数
  game_growthMission_rewrad_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取成长助力任务奖励的去重角色数
  game_growthMission_rewrad_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取成长助力任务奖励的去重账号数
  game_growthMission_rewrad_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取成长助力任务奖励的去重游戏服数
coverage:
  scenarios:
    - 成长助力任务奖励领取热度（次数、角色/账号 UV）
    - 各服务器奖励领取分布
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  missionGroup:
    type: int
    description: 任务组
  missionOrder:
    type: int
    description: 组内order
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: ds=20260729 实测 cnt=0/role_uv=0/acc_uv=0；ds=20260728 复测仍为 0；零命中，保持 draft
external_refs: []
