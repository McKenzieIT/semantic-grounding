name: game.achievement.reward
event_filter: event = 'game.achievement.reward'
description: "成就奖励领取事件：玩家达成成就并领取奖励时上报，含成就id(id)、成就星数(order)与奖励货币列表(coinList: gold/freegold/diamond/energy 等24个参数)。分析粒度为角色(role_id)，可统计成就完成进度、奖励发放量与领取活跃度。ds=20260729 实测 cnt=2071, role_uv=429, acc_uv=425, server_uv=84。"
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 成就id
  order:
    type: int
    description: 成就星数
metrics:
  achievement_reward_cnt:
    expression: COUNT(*)
    description: 成就奖励领取总次数
  achievement_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取成就奖励的去重角色数（分析主体）
  achievement_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取成就奖励的去重账号数
  achievement_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取成就奖励的去重游戏服数
  achievement_reward_distinct_id:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.id'))
    description: 被领取的去重成就id数（成就完成广度）
  achievement_reward_star_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.order') AS BIGINT))
    description: 成就星数累计（成就完成深度）
  achievement_reward_freegold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.freegold') AS BIGINT))
    description: 免费钻石奖励发放累计（主奖励货币）
  achievement_reward_energy_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.energy') AS BIGINT))
    description: 体力奖励发放累计
  achievement_reward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.gold') AS BIGINT))
    description: 充值钻石奖励发放累计（少量）
  achievement_reward_per_role_avg:
    expression: COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均成就奖励领取次数
coverage:
  scenarios:
    - 成就完成广度与深度：被领取的去重成就id数与累计星数，刻画玩家成就推进进度
    - 奖励发放量：免费钻石/体力/充值钻石累计发放，刻画成就奖励经济产出
    - 领取活跃度：领取次数、角色/账号/服去重UV与人均领取次数，刻画成就玩法参与度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核（多日趋势/节假日波动未覆盖）
    - 分析主体默认 role_id（参数含 roleId/accountId，角色粒度更贴合成就完成场景）
    - coinList.diamond(紫金) 本日样本 SUM 为 NULL，该奖励项当日未发放或字段缺失
    - 奖励货币字段来自 params JSON 解析，依赖客户端上报一致性
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
coverage_status: analyst_confirmed
