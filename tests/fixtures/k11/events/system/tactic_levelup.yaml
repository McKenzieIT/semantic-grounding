name: game.tactic.levelup
event_filter: event = 'game.tactic.levelup'
description: 战法升级事件：角色升星/升级战法时上报，记录战法id、战法等级、战法星级与角色状态（角色等级、vip等级、战力、经验、关键货币等25个参数）。分析主体为 role_id（角色），按 role_id 维度度量战法养成进度与分布。scout 实测 ds=20260729/20260728 日志零命中（cnt=0），疑似事件下线或未触发上报。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  tacticId:
    type: int
    description: 战法id
  tacticLvl:
    type: int
    description: 战法等级
  tacticStar:
    type: int
    description: 战法星级
metrics:
  game_tactic_levelup_cnt:
    expression: COUNT(*)
    description: 战法升级事件总次数
  game_tactic_levelup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发战法升级的去重角色数
  game_tactic_levelup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发战法升级的去重账号数
  game_tactic_levelup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发战法升级的去重游戏服数
  game_tactic_levelup_tactic_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.tacticId'))
    description: 被升级的去重战法id数
coverage:
  scenarios:
    - 角色战法养成进度与分布（按战法等级/星级）
    - 战法升级参与角色/账号/游戏服覆盖面
    - 不同战法id的养成热度排行
  limitations:
    - 仅 ds=20260729/20260728 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729 cnt=0；ds=20260728 cnt=0)，疑似下线/未触发上报
    - 默认分析主体为 role_id（角色粒度），尚未由业务方确认
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728: cnt=0。零命中，疑似事件下线/未触发上报，保持 draft。"
external_refs: []
