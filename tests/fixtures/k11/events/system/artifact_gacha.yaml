name: game.artifact.gacha
event_filter: event = 'game.artifact.gacha'
description: |-
  artifact.gacha（兵符抽卡/抽奖）
  记录角色进行兵符（artifact）抽卡/抽奖的日志事件。事件携带游戏服id、角色id、角色名、性别、等级、VIP、战力、 货币快照（coinList: 充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）、本次抽卡的阶数（id）与职业（job）， 以及本次事件触发的抽卡次数（count，单次事件最多 5 次）。该事件用于度量兵符抽卡玩法的参与规模与抽卡频次。 分析粒度：角色级（role_id 为分析主体，account_id 可作为账号级汇总）；sessionId/logUUID 用于会话与日志去重。 真实单日实测（ds=20260729）：6735 次抽卡事件，覆盖 2313 个角色、2228 个账号、355 个游戏服，累计抽卡 29351 次。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 阶数
  job:
    type: int
    description: 职业
  count:
    type: int
    description: 次数
metrics:
  game_artifact_gacha_cnt:
    expression: COUNT(*)
    description: 兵符抽卡事件总次数
  game_artifact_gacha_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发兵符抽卡的去重角色数
  game_artifact_gacha_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发兵符抽卡的去重账号数
  game_artifact_gacha_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生兵符抽卡的去重游戏服数
  game_artifact_gacha_draw_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
    description: 兵符抽卡累计抽卡次数（params.count 求和）
  game_artifact_gacha_avg_draw_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均兵符抽卡次数（累计抽卡次数 / 去重角色数）
  game_artifact_gacha_avg_event_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均兵符抽卡事件次数（事件次数 / 去重角色数）
coverage:
  scenarios:
    - 角色成长：监控兵符抽卡玩法的日活参与规模（角色/账号UV、事件次数）及人均抽卡频次
    - 系统监控：按 server_id 维度评估各服兵符抽卡活跃度分布
    - 数据校验：通过 sessionId/logUUID 进行会话级与日志去重核对；count 字段可用于核对累计抽卡次数
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id（角色级），未验证 account_id 多角色聚合边界
    - 未拆解 id（阶数）与 job（职业）维度的细分度量，仅做事件级与抽卡次数级汇总
    - 抽卡消耗的货币变化通过 coinList 快照记录，未单独构造消耗金额 SUM 度量（非支付类事件，无 money/amount 字段）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 单日实测 ds=20260729：cnt=6735, role_uv=2313, acc_uv=2228, server_uv=355；累计抽卡次数 SUM(count)=29351（max(count)=5），人均约 12.7 次抽卡/角色，数值合理（角色级抽卡事件）。
coverage_status: analyst_confirmed
