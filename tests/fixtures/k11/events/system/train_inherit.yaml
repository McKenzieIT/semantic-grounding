name: game.train.inherit
event_filter: event = 'game.train.inherit'
description: 武将继承事件：玩家执行武将继承操作，记录继承前后武将(cardId/newCardId)、战力(power)、等级(level)、星级(star)、品质(quality)及装备/觉醒/天赋/战法等养成状态。分析主体为 role_id（角色级）。实测 ds=20260729 单日 cnt=3960，role_uv=1007，account_uv=973，server_uv=94。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  cardId:
    type: int
    description: cardId
  newCardId:
    type: int
    description: newCardId
  power:
    type: int
    description: power
  level:
    type: int
    description: level
  quality:
    type: int
    description: quality
  star:
    type: int
    description: star
  piece:
    type: int
    description: piece
  awakeList:
    type: array
    description: 觉醒点列表
  awakeList.lvl:
    type: int
    description: 节点等级
  awakeList.id:
    type: int
    description: 节点id
  unrivalLevel:
    type: int
    description: unrivalLevel
  equip:
    type: array
    description: 装备列表
  equip.pos:
    type: int
    description: 装备部位 1：武器/2：头盔/3：护具/4：饰品
  equip.id:
    type: int
    description: 装备id
  equip.uid:
    type: int
    description: 装备uid
  equip.level:
    type: int
    description: 装备等级
  equip.quality:
    type: int
    description: 装备品质id
  ability:
    type: array
    description: 天赋列表
  ability.id:
    type: int
    description: 天赋模板id
  ability.num:
    type: int
    description: 消耗潜能点数量
  ability.value:
    type: int
    description: 加成效果
  ability.name:
    type: string
    description: 名称
  abilityPoints:
    type: int
    description: 天赋点数
  tactic:
    type: json
    description: 战法
  tactic.tacticId:
    type: int
    description: 战法id
  tactic.tacticName:
    type: string
    description: 战法名称
  tactic.tacticLevel:
    type: int
    description: 战法等级
  tactic.tacticStar:
    type: int
    description: 战法星级
  job:
    type: int
    description: 职业
  wsRoad:
    type: int
    description: 无双之路阶数
metrics:
  game_train_inherit_cnt:
    expression: COUNT(*)
    description: 武将继承操作总次数
  game_train_inherit_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 执行武将继承的去重角色数
  game_train_inherit_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 执行武将继承的去重账号数
  game_train_inherit_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及武将继承的去重游戏服数
  game_train_inherit_card_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.newCardId'))
    description: 继承产出的去重新武将数
  game_train_inherit_card_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.level') AS BIGINT))
    description: 继承后新武将平均等级
  game_train_inherit_card_star_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.star') AS BIGINT))
    description: 继承后新武将平均星级
  game_train_inherit_card_quality_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.quality') AS BIGINT))
    description: 继承后新武将平均品质
  game_train_inherit_power_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.power') AS BIGINT))
    description: 继承后新武将平均战力
  game_train_inherit_per_role_cnt:
    expression: COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均武将继承次数（操作次数 / 去重角色数）
coverage:
  scenarios:
    - 武将继承玩法的整体参与度与操作规模（次数/角色UV/账号UV/服数）
    - 继承产出的新武将去重卡片规模
    - 继承后新武将的养成水平分布（等级/星级/品质/战力均值）
    - 人均继承次数反映玩家在该玩法的投入深度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级粒度），武将继承以角色为操作主体
    - coinList/equip/ability/tactic/awakeList 为数组/JSON 结构，本指标集未展开聚合，必要时可按需补列
    - ds=20260729 实测 role_uv(1007) > acc_uv(973)，存在单账号多角色继承
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "实测 ds=20260729: cnt=3960, role_uv=1007, account_uv=973, server_uv=94；事件正常触发，数量合理。"
