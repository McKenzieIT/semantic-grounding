name: game.knightnatalchart.refineconfirmMulti
event_filter: event = 'game.knightnatalchart.refineconfirmMulti'
description: 武将命盘-确认方案(refine confirm Multi)事件。玩家在武将命格图(knightNatalChart)对武将(knightId)从候选方案(nodes)中选定并确认某一方案序号(index)/方案(scheme)时触发，上报武将id、方案、节点列表(nodeList.staged/nodeList.used)、货币列表(coinList)、角色等级、战力等29个参数，每次确认产出一条日志。分析主体为角色(role_id)，account_id 用于账号级去重；该事件承接 refineMulti(批量精炼)之后的确认环节。scout实测 ds=20260729：事件次数3915、去重角色834、去重账号816、去重游戏服191。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  scheme:
    type: int
    description: 方案
  nodes:
    type: array
    description: 方案的id
  index:
    type: int
    description: 选择的方案序号
  nodeList:
    type: array
    description: nodeList
  nodeList.staged:
    type: array
    description: nodeList.staged
  nodeList.used:
    type: bool
    description: nodeList.used
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=3915, role_uv=834, acc_uv=816, server_uv=191；数据合理，事件正常触发(确认环节承接 refineMulti 批量精炼之后，量级约 refineMulti 的 14%，符合确认漏斗)"
metrics:
  game_knightnatalchart_refineconfirmMulti_cnt:
    expression: COUNT(*)
    description: 武将命盘确认方案事件总触发次数
  game_knightnatalchart_refineconfirmMulti_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发确认方案的不重复玩家角色数（分析主体 role_id）
  game_knightnatalchart_refineconfirmMulti_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发确认方案的不重复账号数
  game_knightnatalchart_refineconfirmMulti_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发确认方案的不重复游戏服数
  game_knightnatalchart_refineconfirmMulti_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.knightId'))
    description: 被确认方案的不重复武将 id 数（基于 params.knightId）
  game_knightnatalchart_refineconfirmMulti_scheme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.scheme'))
    description: 被确认的不重复方案(scheme)数（基于 params.scheme）
  game_knightnatalchart_refineconfirmMulti_avg_per_role:
    expression: ROUND(COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0), 2)
    description: 每个触发角色平均确认方案次数（NULLIF 防除零）
coverage:
  scenarios:
    - 命盘确认参与度：通过 role_uv/account_uv 衡量角色与账号级参与度
    - 命盘确认热度：通过 cnt 与 avg_per_role 衡量确认总次数与人均次数
    - 多服分布：通过 server_uv 观察事件覆盖的游戏服范围
    - 武将/方案广度：通过 knight_uv/scheme_uv 观察被确认的武将种类与方案分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id，account_id 为账号去重维度
    - coinList/nodeList(nodes/index/nodeList.staged/nodeList.used) 为数组/嵌套结构，本批次未展开做逐元素聚合(如 SUM 消耗钻石、节点 staged 统计)，用数侧可按需扩展
    - refineconfirmMulti 为确认环节，其上游 refineMulti(批量精炼)漏斗关系需结合对应事件联合分析
coverage_status: analyst_confirmed
external_refs: []
