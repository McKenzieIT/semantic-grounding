name: game.train.tactic
event_filter: event = 'game.train.tactic'
description: 战法(tactic)操作事件：角色对各类战法执行操作(action 实测全为 2，即统一战法操作)，记录被操作战法id、星级及角色货币快照。分析主体粒度为 role_id(角色)，可统计战法操作次数、参与角色数及不同战法/星级分布。ds=20260729 单日实测 5044 条操作、1462 角色、219 服。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  action:
    type: int
    description: 行为
  id:
    type: int
    description: 战法id
  star:
    type: int
    description: 星级
metrics:
  game_train_tactic_cnt:
    expression: COUNT(*)
    description: 战法操作总次数
  game_train_tactic_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与战法操作的去重角色数
  game_train_tactic_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与战法操作的去重账号数
  game_train_tactic_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及战法操作的去重游戏服数
  game_train_tactic_tactic_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.id'))
    description: 被操作的去重战法种类数(战法id)
  game_train_tactic_avg_star:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.star') AS DOUBLE))
    description: 战法操作平均星级
coverage:
  scenarios:
    - 战法玩法参与度：通过操作次数/角色UV衡量战法系统活跃度
    - 战法偏好分布：通过 tactic_uv 及 id/star 分组评估热门战法与星级分布
    - 角色成长广度：结合 role_uv/account_uv 评估战法成长覆盖面
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id(角色)；action 字段实测全为 2，未覆盖其他行为类型
    - 未校验 params.id/star 为空时的边界情况
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "measured ds=20260729: cnt=5044, role_uv=1462, acc_uv=1423, server_uv=219; action=2 全量; tactic_id 310001-310006/410001+ 等, star 2-3"
coverage_status: analyst_confirmed
