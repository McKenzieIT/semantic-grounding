name: game.tactic.reset
event_filter: event = 'game.tactic.reset'
description: 角色成长域战法重置事件：玩家执行战法(tactic)重置操作时上报，记录被重置的战法id(tacticId)及角色当前状态(角色等级/vip等级/角色战力/经验/货币列表等)。分析主体为 role_id(角色粒度)，可度量每日战法重置总次数、参与重置的角色/账号数、被重置的独立战法id数及人均重置频次。scout 实测 ds=20260729/20260728 零命中(疑似下线/未触发或埋点未生效)。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  tacticId:
    type: int
    description: 战法id
metrics:
  game_tactic_reset_cnt:
    expression: COUNT(*)
    description: 战法重置事件总次数
  game_tactic_reset_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与战法重置的独立角色数(分析主体 role_id)
  game_tactic_reset_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与战法重置的独立账号数
  game_tactic_reset_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生战法重置的独立游戏服数
  game_tactic_reset_distinct_tactic_id_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.tacticId'))
    description: 被重置的独立战法id数(取自 params.tacticId)
  game_tactic_reset_role_reset_freq:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均战法重置频次(总次数/去重角色数，分母为0返回NULL)
coverage:
  scenarios:
    - 战法重置每日总次数与参与角色数趋势(角色成长域活跃与养成消耗度量)
    - 各角色战法重置频次分布(识别重置密集型/反复调整加点的玩家)
    - 被重置的战法id分布(识别冷门/热门战法，辅助平衡性评估)
  limitations:
    - 日志中零命中(ds=20260729 与 ds=20260728 均为 cnt=0/role_uv=0/acc_uv=0/server_uv=0)，疑似下线/未触发或埋点未生效，上述指标无法实测复核
    - 仅 ds=20260729/20260728 两个单日 scout 探测，未做全量多日复核
    - 分析主体默认 role_id(角色粒度)；因零命中未实际验证 params 字段(GET_JSON_OBJECT 取数)可用性
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；retry ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。零命中，疑似下线/未触发。维持 draft。"
coverage_status: draft
external_refs: []
