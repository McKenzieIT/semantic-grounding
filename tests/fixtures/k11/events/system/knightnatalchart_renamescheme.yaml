name: game.knightnatalchart.renamescheme
event_filter: event = 'game.knightnatalchart.renamescheme'
description: 武将命盘方案命名事件：玩家对武将命盘的某一方案（scheme）进行命名/重命名操作时上报，记录命中的武将 knightId、方案序号 scheme 与新名字 name，并附带角色身份与货币快照。分析主体为 role_id（角色粒度，account_id 为账号粒度补充）。真实单日实测 ds=20260729：cnt=13、role_uv=10、acc_uv=10、server_uv=6，属低频命名操作事件。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  scheme:
    type: int
    description: 方案
  name:
    type: string
    description: 名字
metrics:
  game_knightnatalchart_renamescheme_cnt:
    expression: COUNT(*)
    description: 武将命盘方案命名操作总次数
  game_knightnatalchart_renamescheme_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 命名操作的去重角色数（分析主体粒度）
  game_knightnatalchart_renamescheme_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 命名操作的去重账号数（账号粒度补充）
  game_knightnatalchart_renamescheme_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生命名操作的去重游戏服数
  game_knightnatalchart_renamescheme_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.knightId'))
    description: 被命名的去重武将数
  game_knightnatalchart_renamescheme_scheme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.scheme'))
    description: 涉及的去重方案序号数
  game_knightnatalchart_renamescheme_per_role_avg:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每角色命名操作次数（带 NULLIF 防零除）
coverage:
  scenarios:
    - 武将命盘方案命名功能的使用热度与活跃度（cnt/role_uv/server_uv）
    - 哪些武将、哪些方案序号被玩家命名（knight_uv/scheme_uv）
    - 单角色命名操作频率分布（per_role_avg）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；样本量偏小（cnt=13）需谨慎外推
    - 分析主体默认 role_id（角色粒度），未对 account_id 跨服合并做单独校验
    - knightId/scheme/name 均为分类标识字段，无可加总的金额/数量度量
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729：cnt=13、role_uv=10、acc_uv=10、server_uv=6，数量级合理且非零，确认为真实触发事件
coverage_status: analyst_confirmed
external_refs: []
