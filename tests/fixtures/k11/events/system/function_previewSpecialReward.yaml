name: game.function.previewSpecialReward
event_filter: event = 'game.function.previewSpecialReward'
description: 新功能情报/特殊奖励预览领取事件。当玩家触发特殊奖励预览（如新功能情报奖励）时上报，params 携带游戏服、账号、角色、VIP等级、战力、看板娘、货币余额(coinList)与获得的资源(rewards)等27个字段。 分析主体为 role_id（角色粒度），account_id 为账号粒度。ds=20260729 实测：88 次上报，88 个角色，4 个游戏服。
domains:
  - 系统监控
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  rewards:
    type: array
    description: 获得的资源
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  previewSpecialReward_cnt:
    expression: COUNT(*)
    description: 特殊奖励预览领取事件总次数
  previewSpecialReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发特殊奖励预览领取的去重角色数
  previewSpecialReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发特殊奖励预览领取的去重账号数
  previewSpecialReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发特殊奖励预览领取的去重游戏服数
coverage:
  scenarios:
    - 特殊奖励预览领取的总体触发量与角色覆盖（cnt/role_uv）
    - 账号粒度与游戏服粒度的覆盖面（account_uv/server_uv）
    - 新功能情报奖励投放的触达范围评估
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id（角色粒度），account_id 为账号粒度补充
    - rewards 为 params 内数组字段，未做行展开聚合，故未提供奖励条目数/数值汇总指标
    - 单日样本量较小（88 次/88 角色），跨日趋势需扩展时间范围复核
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=88, role_uv=88, acc_uv=88, server_uv=4"
coverage_status: analyst_confirmed
external_refs: []
