name: game.train.card
event_filter: event = 'game.train.card'
description: 武将（卡片）养成事件：玩家对游戏内武将进行的各类养成操作（升级/升星/升阶/天赋/觉醒/战法/天命方案等共17种 action）触发上报。分析粒度以 role_id 为分析主体（account_id 为账号维度辅助），每次事件携带被养成武将的 id/名称/等级/战力/资质/星级/碎片数、装备/天赋/战法/觉醒节点快照，以及玩家货币与角色战力等上下文。ds=20260729 单日 scout 实测：事件量 164979 条，覆盖 3655 角色 / 3426 账号 / 396 游戏服，涉及约 60 张武将。
domains:
  - 角色成长
domain: system
