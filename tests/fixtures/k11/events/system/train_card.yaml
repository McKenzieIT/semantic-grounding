metrics:
  train_card_cnt:
    description: 武将养成事件总次数（全 action）
    expression: COUNT(*)
  train_card_role_uv:
    description: 参与武将养成的角色数（去重 role_id）
    expression: COUNT(DISTINCT role_id)
  train_card_account_uv:
    description: 参与武将养成的账号数（去重 account_id）
    expression: COUNT(DISTINCT account_id)
  train_card_server_uv:
    description: 触发武将养成的游戏服数（去重 server_id）
    expression: COUNT(DISTINCT server_id)
  train_card_card_uv:
    description: 被养成的武将种类数（去重 params.id）
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
  train_card_power_sum:
    description: 被养成武将战力（power）累加，反映养成体量
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.power') AS BIGINT))
  train_card_level_sum:
    description: 被养成武将等级（level）累加
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.level') AS BIGINT))
  train_card_avg_power_per_role:
    description: 人均武将战力累加值（power_sum/role_uv，分母 NULLIF 防零）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.power') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
  train_card_action1_cnt:
    description: action=1（升级类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '1' THEN 1 ELSE 0 END)
  train_card_action2_cnt:
    description: action=2（升阶类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '2' THEN 1 ELSE 0 END)
  train_card_action3_cnt:
    description: action=3（升星类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '3' THEN 1 ELSE 0 END)
  train_card_action6_cnt:
    description: action=6（天赋类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '6' THEN 1 ELSE 0 END)
  train_card_action8_cnt:
    description: action=8（战法类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '8' THEN 1 ELSE 0 END)
  train_card_action13_cnt:
    description: action=13（觉醒类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '13' THEN 1 ELSE 0 END)
  train_card_action15_cnt:
    description: action=15（天命方案类）事件次数
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params, '$.action') = '15' THEN 1 ELSE 0 END)
coverage:
  scenarios:
    - 分析角色成长线下的武将养成活跃度与分布：(1) 养成总参与规模（角色/账号/游戏服去重 UV、事件总量）；(2) 各养成 action（升级/升星/升阶/天赋/觉醒/战法/天命方案等）的次数分布，定位主要养成路径；(3) 被养成武将战力 power 与等级 level 的累加，反映养成资源投入体量与人均投入；(4) 按 server_id/role_id 下钻定位养成活跃服与头部养成玩家。
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；action 枚举依据当日实测命中 17 种（1/2/3/6/7/8/9/10/11/13/15/16/17/18/20/21/22），其余 action 的语义未逐一核对常量表；分析主体默认 role_id（武将养成由角色驱动）；coinList.* 字段为玩家货币快照而非交易金额，未计入营收指标；部分 action（如 9/18/21）role_uv 偏小可能存在触发门槛，使用时注意样本代表性。
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测：cnt=164979, role_uv=3655, acc_uv=3426, server_uv=396；action 分布合理（action1=36002 最多），被养成武将 card_uv≈60 张，power/level 累加值量级正常，数据非空且合理。
coverage_status: analyst_confirmed
