name: game.recharge.purcharseActivityReward
event_filter: event = 'game.recharge.purcharseActivityReward'
description: 限时充值活动奖励领取事件：玩家在限时充值活动中达成档位后领取奖励（由 activityId 标识活动、rewardId 标识奖励档位），领取时同时下发充值钻石(coinList.gold)等货币。分析主体为 role_id（角色粒度，account_id 与 role_id 一一对应）。实测 ds=20260729：cnt=237、role_uv=138、acc_uv=138、server_uv=41，覆盖 2 个活动、11 个奖励档位，充值钻石合计 45842。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动ID
  rewardId:
    type: int
    description: 奖励ID
metrics:
  purcharse_activity_reward_cnt:
    description: 限时充值活动奖励领取次数（事件总行数）
    expression: COUNT(*)
  purcharse_activity_reward_role_uv:
    description: 领取奖励的去重角色数
    expression: COUNT(DISTINCT role_id)
  purcharse_activity_reward_account_uv:
    description: 领取奖励的去重账号数
    expression: COUNT(DISTINCT account_id)
  purcharse_activity_reward_server_uv:
    description: 领取奖励的去重游戏服数
    expression: COUNT(DISTINCT server_id)
  purcharse_activity_reward_gold_sum:
    description: 通过该活动下发的充值钻石(coinList.gold)总量
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
  purcharse_activity_reward_activity_uv:
    description: 涉及的去重活动数(基于 activityId)
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.activityId'))
  purcharse_activity_reward_reward_uv:
    description: 涉及的去重奖励档位数(基于 rewardId)
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.rewardId'))
  purcharse_activity_reward_gold_per_role:
    description: 人均充值钻石（角色粒度，分母用 NULLIF 防零除）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
coverage:
  scenarios:
    - 限时充值活动奖励的领取参与度（角色/账号/服务器覆盖）
    - 活动下发的充值钻石总量及人均水平，评估活动投放ROI
    - 活动与奖励档位的分布广度（多少活动、多少档位被领取）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（实测 account_id 与 role_id 一一对应，acc_uv=role_uv=138）
    - coinList.gold 为充值钻石字段，非法定货币金额，不可直接折算为流水
    - rewardId 含义需业务侧确认档位映射后再做深入分析
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=237、role_uv=138、acc_uv=138、server_uv=41、gold_sum=45842、activity_uv=2、reward_uv=11；数据量与分布合理，事件在线可观测。
coverage_status: analyst_confirmed
external_refs: []
