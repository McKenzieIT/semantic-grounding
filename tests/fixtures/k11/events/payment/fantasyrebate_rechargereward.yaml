name: game.fantasyrebate.rechargereward
event_filter: event = 'game.fantasyrebate.rechargereward'
description: 幻想服返利活动-领取充值奖励事件。记录玩家在幻想服返利系统中领取充值奖励的行为，分析主体为角色(role_id)。参数包括游戏服/账号/角色基础信息、vip等级、角色战力、经验、看板娘、关键货币列表(coinList含充值钻石gold/充值赠送钻石sendgold/免费钻石freegold/紫金diamond/经验卷轴expCoin/体力energy)、会话id、logUUID、领取的代金券数量(voucherNum)等23个字段。真实测量(ds=20260729)：当日4次领取，4个角色/4个账号/4个游戏服，领取代金券合计302张，发放充值钻石合计1、充值赠送钻石合计0。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  voucherNum:
    type: int
    description: 领取的代金券数量
metrics:
  game_fantasyrebate_rechargereward_cnt:
    expression: COUNT(*)
    description: 充值奖励领取事件总次数
  game_fantasyrebate_rechargereward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取充值奖励的去重角色数(分析主体)
  game_fantasyrebate_rechargereward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取充值奖励的去重账号数
  game_fantasyrebate_rechargereward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发领取充值奖励的去重游戏服数
  game_fantasyrebate_rechargereward_voucher_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.voucherNum') AS BIGINT))
    description: 领取的代金券数量合计(奖励发放量)
  game_fantasyrebate_rechargereward_voucher_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.voucherNum') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id),0)
    description: 人均领取代金券数量(总量/去重角色数)
  game_fantasyrebate_rechargereward_recharge_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(GET_JSON_OBJECT(params,'$.coinList'),'$.gold') AS BIGINT))
    description: 充值钻石gold发放合计
  game_fantasyrebate_rechargereward_sendgold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(GET_JSON_OBJECT(params,'$.coinList'),'$.sendgold') AS BIGINT))
    description: 充值赠送钻石sendgold发放合计
coverage:
  scenarios:
    - 幻想服返利活动充值奖励领取的总量与参与度(次数/角色数/账号数/游戏服数)
    - 奖励发放量(代金券、充值钻石、充值赠送钻石)核算与人均领取水平
    - 不同游戏服、渠道、操作系统下的奖励领取分布对比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核(多日/活动周期聚合)
    - 分析主体默认 role_id；未验证同一 account 多 role 场景的去重口径
    - ds=20260729 样本量较小(4次/4角色/4账号/4游戏服)，充值钻石与赠送钻石合计接近0，疑似活动早期或低活跃样本
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=4, role_uv=4, acc_uv=4, server_uv=4, voucher_sum=302, gold_sum=1, sendgold_sum=0；数值合理(小样本)
external_refs: []
