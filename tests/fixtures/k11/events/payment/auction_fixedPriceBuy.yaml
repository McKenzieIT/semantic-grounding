name: game.auction.fixedPriceBuy
event_filter: event = 'game.auction.fixedPriceBuy'
description: 拍卖行一口价购买事件：玩家在拍卖行以一口价(fixed price)方式购买商品。记录购买商品 id、一口价金额 price、买卖双方角色/账号、游戏服及角色等级/vip/战力等上下文。分析主体为 role_id(角色粒度)，可按 server_id/account_id 下钻。实测 ds=20260729：cnt=6、role_uv=2、acc_uv=2、server_uv=2、price_sum=1950。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  goodUid:
    type: string
    description: goodUid
  id:
    type: int
    description: id
  price:
    type: int
    description: 一口价
metrics:
  game_auction_fixed_price_buy_cnt:
    expression: COUNT(*)
    description: 一口价购买事件总次数
  game_auction_fixed_price_buy_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发一口价购买的去重角色数
  game_auction_fixed_price_buy_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发一口价购买的去重账号数
  game_auction_fixed_price_buy_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发一口价购买的去重游戏服数
  game_auction_fixed_price_buy_revenue:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.price') AS BIGINT))
    description: 一口价购买总金额(price 累加)
  game_auction_fixed_price_buy_avg_price:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.price') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 单次一口价购买平均金额
coverage:
  scenarios:
    - 拍卖行一口价成交规模(次数/UV/金额)
    - 单服/单角色拍卖行购买活跃度
    - 一口价购买客单价与金额分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id(角色粒度)，未独立验证 account 粒度
    - 实测样本量较小(cnt=6、role_uv=2)，跨日波动可能较大
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "实测 ds=20260729: cnt=6, role_uv=2, acc_uv=2, server_uv=2, price_sum=1950, price_min=75, price_max=1050"
