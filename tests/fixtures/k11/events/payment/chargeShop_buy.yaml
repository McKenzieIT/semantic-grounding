name: game.chargeShop.buy
event_filter: event = 'game.chargeShop.buy'
description: |-
  充值商店-资源购买：玩家在充值商店购买资源/货物时触发的行为事件。每条日志记录一次购买行为，含商店id(shopId)、货物id(goodsId)、购买数量(amount)、消耗凤翎(money, 付费货币)等。分析主体为 role_id（角色），可统计购买次数、购买角色UV、消耗凤翎总额、人均消耗等。scout实测 ds=20260729/20260728 均零命中（事件疑似下线/未触发，待复核）。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等30个
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  shopId:
    type: int
    description: 商店id
  shopName:
    type: string
    description: 商店名字
  goodsId:
    type: int
    description: 货物id
  goodsName:
    type: string
    description: 货物名字
  amount:
    type: int
    description: 数量
  useVoucher:
    type: bool
    description: 是否使用代金券
  overSell:
    type: bool
    description: 是否超卖
  money:
    type: int
    description: 凤翎数量
metrics:
  game_chargeShop_buy_cnt:
    description: 充值商店购买事件总次数（所有日志行数）
    expression: COUNT(*)
  game_chargeShop_buy_role_uv:
    description: 触发购买的去重角色数
    expression: COUNT(DISTINCT role_id)
  game_chargeShop_buy_account_uv:
    description: 触发购买的去重账号数
    expression: COUNT(DISTINCT account_id)
  game_chargeShop_buy_money_sum:
    description: 消耗凤翎总额（付费货币 money 字段求和）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT))
  game_chargeShop_buy_amount_sum:
    description: 购买货物总数量（amount 字段求和）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.amount') AS BIGINT))
  game_chargeShop_buy_money_per_role:
    description: 人均消耗凤翎（money_sum / role_uv，分母为0时返回NULL）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.money') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
coverage:
  scenarios:
    - 充值商店资源购买总体量（次数、角色UV、账号UV）
    - 充值商店付费货币(凤翎)消耗总额与人均消耗
    - 货物购买数量分布与热门货物识别
  limitations:
    - scout实测 ds=20260729 与 ds=20260728 均零命中(cnt=0)，事件疑似下线/未触发，保持 draft 待后续复核
    - 分析主体默认 role_id（角色）；如需账号粒度可改用 account_id
    - money 字段为凤翎数量（游戏内付费货币），非人民币金额；如需人民币收入需关联计费侧数据
    - amount 为单次购买数量，多次购买累计求和
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0；零命中，事件疑似下线/未触发，保持 draft"
coverage_status: draft
external_refs: []
