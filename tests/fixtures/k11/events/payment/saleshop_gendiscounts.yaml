name: game.saleshop.gendiscounts
event_filter: event = 'game.saleshop.gendiscounts'
description: |-
  折扣商店-生成折扣：玩家打开/刷新折扣商店时触发生成折扣商品列表的事件。每条日志记录一次折扣随机生成请求，携带 shopId(商店id)、discounts(生成的折扣商品列表)、rndCount(本次随机次数)等字段，用于追踪折扣商店玩法的曝光与刷新参与。主体粒度为 role_id。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等25个
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  shopId:
    type: int
    description: 商店id
  discounts:
    type: array
    description: 折扣列表
  rndCount:
    type: int
    description: 随机次数
metrics:
  gendiscounts_cnt:
    expression: COUNT(*)
    description: 折扣商店生成折扣事件触发次数(每条日志=一次折扣随机生成请求)
  gendiscounts_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发折扣商店生成折扣的去重角色数(去重基础视图 role_id,即 params.roleId)
  gendiscounts_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发折扣商店生成折扣的去重账号数(去重基础视图 account_id,即 params.accountId)
  gendiscounts_rndcount_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.rndCount') AS BIGINT))
    description: 折扣随机生成总次数(rndCount 求和,反映折扣商品刷新规模)
  gendiscounts_server_dn:
    expression: COUNT(DISTINCT server_id)
    description: 触发折扣生成折扣的去重游戏服数
  gendiscounts_rndcount_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.rndCount') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 触发角色的平均折扣随机次数(总随机次数/去重角色数)
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
coverage:
  scenarios:
    - 折扣商店生成折扣的事件规模与触达角色/账号数(gendiscounts_cnt/role_uv/account_uv)
    - 折扣随机刷新规模(gendiscounts_rndcount_sum)与单角色平均刷新次数(gendiscounts_rndcount_per_role),衡量折扣商店玩法参与度
    - 触发折扣生成的游戏服覆盖数(gendiscounts_server_dn)
  limitations:
    - 仅 ds=20260729 单日 scout 实测(cnt=682/role_uv=594/acc_uv=587/rndcount_sum=769/server_dn=6/os_dn=3),未做全量多日复核
    - discounts 数组字段未拆解为独立指标(单条日志含多档折扣商品,逐档金额聚合需配合消费侧 saleshop_confirmdiscounts 事件,本表只统计生成次数与 rndCount 汇总)
    - subject 粒度默认 role_id 未逐事件实测,但 params.roleId/roleName/accountId 均存在且与基础视图 role_id/account_id 同族口径一致
  coverage_status: analyst_verified
external_refs: []
