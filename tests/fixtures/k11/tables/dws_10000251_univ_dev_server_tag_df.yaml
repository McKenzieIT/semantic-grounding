table_name: dws_10000251_univ_dev_server_tag_df
engine: maxcompute
table_comment: ""
description: |
  记录每个设备在每个区服上的累计活跃、付费、关联关系与归因标签。本表固定为 user_type=1 的【设备表】(表名含 dev,按主体判定规则归为设备表),分析主体=设备,主体标识字段 user_id 实际存储设备ID;表内 user_type 不随行变化,DISTINCT user_type 仅返回单一值 1(建议用 SELECT DISTINCT user_type 复核)。因此本表不再承载账号/角色主体,user_id 一律为设备ID,无需按 user_type 切换或过滤层级。
  粒度:每个设备(user_id,存设备ID)每个区服(server_id)每天一行,日全量快照(_df),即截至当日的历史累计口径。
  能回答的业务问题:设备在某区服的累计活跃天数/时长、首次与最近活跃/付费时间、新增当日与首付当日付费金额、最近两次活跃间隔(留存节奏)、设备与设备/账号/角色的关联关系(首次与最近)、首次与最近活跃的设备品牌型号/IP/地理位置、买量归因(广告ID/媒体)、内部用户标记、关联角色等级、跨主体关联追溯。
  注意事项:(1) 各 *_std 字段为截至当日全量累计,非当日增量,做趋势分析需按 ds 差分;(2) 本表固定 user_type=1,主体为设备,user_id 一律为设备ID,无需按 user_type 分组;(3) 不分区服的活跃日期见 whole_act_ymd_prev;(4) 关联关系(rel_*)为历史首次与最近两条快照,非全量映射表;(5) 本表为快照口径,适合做累计/周期级分析,不适合查询单条事件级明细;(6) 付费金额、活跃天数等 *_std 为该区服口径,不含跨区服汇总;(7) role_level 为设备关联角色的等级快照,设备主体下语义有限,可能为 NULL。
domains:
  - 用户生命周期
  - 付费经济
  - 角色成长
  - 系统监控
granularity: 每个设备(user_id,本表固定 user_type=1,存设备ID)每个区服(server_id)每天一行的日全量快照(_df)。表名含 dev,判定为【设备表】,分析主体=设备,主体标识字段 user_id 存设备ID;DISTINCT user_type 仅返回单一值 1(建议用 SELECT DISTINCT user_type 复核),无多主体切换。
