metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV（去重角色数），日全量快照角色规模
  pay_amt_std_total:
    expression: SUM(pay_amt_std)
    description: 累计付费金额总额（角色维度汇总）
  pay_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END)
    description: 累计付费角色数（付费渗透）
  avg_role_level:
    expression: AVG(role_level)
    description: 平均角色等级（角色成长水平）
  avg_role_force:
    expression: AVG(role_force)
    description: 平均角色战力（角色实力水平）
coverage:
  scenarios:
    - 角色规模与付费渗透：role_uv / pay_role_cnt 回答日快照活跃角色数与付费角色数
    - 付费经济：pay_amt_std_total 汇总累计付费金额，配合 pay_role_cnt 算 ARPPU
    - 角色成长：avg_role_level / avg_role_force 衡量角色成长与战力分布
  limitations:
    - 日全量快照(_df)按 ds 分区，指标为当日全量角色快照而非日增量；跨日对比需用两天快照差分
    - 仅对 20250507 最新分区做 scout 抽样验证（role_uv=36209, pay_amt_std_total≈1,090,109），未做全量 maxc 实测复核
    - 角色标签维度众多（公会/任务/PVP/家园等），本表仅覆盖核心 5 指标，未穷尽全部可聚合字段
    - 无 user_type 列，分析主体=角色系按表名 role 推断（user_type=3 概念）
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已对最新分区 ds=20250507 跑通 COUNT(DISTINCT role_id)/SUM(pay_amt_std)/AVG(role_force) 等指标，返回合理值（36209 角色、付费 ~109 万、平均战力与等级合理），抽样验证通过
