table_name: dim_10000251_sync_platform_reward_item_catalogue_test_df_arch
engine: maxcompute
kind: dim
table_comment: 平台奖励物品类别配置维度表（按 ds 分区，每个类别在每个分区日一份快照）
description: 平台奖励物品类别目录（reward item catalogue）配置维度表。存储各类别（如货币、武将等）的显示名称与类别ID，作为事实表奖励发放记录 JOIN 取类别维度属性（name）的字典/配置源。粒度：每个奖励物品类别在每个 ds 分区日一行的配置快照。
primary_key: [id]
primary_key_unique: false
label_columns: [name]
domains:
- 装备道具
granularity: 每个奖励物品类别（每 ds 分区日一行）的配置维度表
coverage:
  scenarios:
  - 事实表（如奖励发放流水）通过 id JOIN 本表，取类别的显示名称 name 作为维度标签用于分组/筛选/展示
  - 跨分区按 id 取最新或指定 ds 快照的类别元数据
  limitations:
  - 配置类维度表，无值度量（measure）字段
  - primary_key_unique=false：跨 ds 分区 id 重复（每个分区日一份快照），实测 r=16224 d=39，未做唯一性实测（按分区单日去重后方可视为唯一，使用时需限定 ds）
  - name 与 id 在样本中取值相同（如"货币"/"武将"），可能存在编码串需二次解码/校验
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数（含全部分区快照）
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: "2026-07-31"
  note: 配置类维度表，按 id 主键、name 标签列建模；跨分区 id 重复（实测 r=16224 d=39），primary_key_unique=false，使用时需限定 ds 分区
columns:
- name: name
  type: string
  comment: 类别的显示名称
  role: dimension
- name: id
  type: string
  comment: 类别ID
  role: dimension
- name: ds
  type: string
  comment: ''
  role: partition
