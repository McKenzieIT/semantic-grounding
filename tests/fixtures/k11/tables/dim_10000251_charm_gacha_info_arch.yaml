table_name: dim_10000251_charm_gacha_info_arch
engine: maxcompute
kind: dim
table_comment: 灵器抽卡卡池配置维度表（按 ds 日分区快照）
description: '游戏 10000251 灵器抽卡（charm gacha）卡池配置维度表。每行描述一个卡池在某 ds 日的完整配置：卡池ID、名称、组、解锁规则、单抽消耗、多抽次数、保底与限制、up池与新手集市购买资源、展示灵器与背景图等。
  键：card_pool_id（卡池ID，业务唯一标识）+ ds（日分区，快照日期）。复合唯一。
  标签：card_pool_name（卡池名称）、directions（卡池备注）。'
domains:
- 探索收集
granularity: 每个 (card_pool_id, ds) 一行的卡池配置日快照维度表
primary_key:
- card_pool_id
- ds
primary_key_unique: true
label_columns:
- card_pool_name
- directions
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数
coverage:
  scenarios:
  - 通过 card_pool_id 关联抽卡流水/事实表，获取卡池名称、组、解锁规则、消耗资源等卡池配置属性
  - 作为灵器抽卡活动配置的统一维度来源，支撑卡池维度切片分析（按组、按展示灵器、按是否展示等）
  - 结合 ds 分区查询卡池配置的日快照变化
  limitations:
  - 配置类维度表，无值度量；cost/back/up_gacha_cost 等为复合编码字符串，需二次解码才能拆分资源类型与数量
  - gacha_drop_id 为外键指向掉落库配置，需关联另一掉落库维度表才能获得具体掉落内容
  - card_pool_id 单列不唯一（595 行对应 6 个卡池 × 148 个 ds 快照），唯一性需复合 (card_pool_id, ds)
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: "2026-07-31"
  note: 配置类维度表，已实测 (card_pool_id, ds) 复合唯一性 (r=d=595)；card_pool_id 单列非唯一；保持 draft。
