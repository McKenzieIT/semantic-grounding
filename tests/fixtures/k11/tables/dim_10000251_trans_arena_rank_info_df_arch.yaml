table_name: dim_10000251_trans_arena_rank_info_df_arch
engine: maxcompute
kind: dim
table_comment: 竞技场段位配置维度表（按 ds 日分区存储段位定义，每分区含全套段位）。primary_key=rank_id（段位ID），label=rank_name（段位名称）。
description: '竞技场段位（arena rank）配置维度表。每行描述一个段位：段位ID、名称、图标、分数上下限、胜负得分、升降级保护、属性加成、赛季结算奖励与积分、匹配战力区间、奖励邮件、机器人匹配开关等。配置类维度表，无值度量；rank_id 在单分区（ds）内唯一，跨分区因每日快照重复故全表非唯一。'
primary_key:
- rank_id
label_columns:
- rank_name
primary_key_unique: false
domains:
- 系统监控
granularity: 每段位（rank_id）一行的配置维度表，按 ds 日分区切片。
columns:
- name: rank_id
  type: string
  comment: 段位ID
  role: dimension
- name: rank_name
  type: string
  comment: 段位名称
  role: dimension
- name: img
  type: string
  comment: 段位图标配置
  role: dimension
- name: min_point
  type: string
  comment: 分数下限
  role: dimension
- name: win_point
  type: string
  comment: 胜利得分
  role: dimension
- name: lose_point
  type: string
  comment: 失败扣分
  role: dimension
- name: reward_rank
  type: string
  comment: 首次段位提升奖励
  role: dimension
- name: attibute
  type: string
  comment: 属性加成
  role: dimension
- name: level_protect
  type: string
  comment: 等级保护
  role: dimension
- name: rank_proof
  type: string
  comment: 段位保护
  role: dimension
- name: rank_mode
  type: string
  comment: 段位模式
  role: dimension
- name: season_reward
  type: string
  comment: 赛季结算奖励
  role: dimension
- name: season_point
  type: string
  comment: 赛季结算积分
  role: dimension
- name: rank_order
  type: string
  comment: 是否显示排名
  role: dimension
- name: mail_id
  type: string
  comment: 奖励邮件
  role: dimension
- name: robot_match
  type: string
  comment: 可否匹配机器人
  role: dimension
- name: match_power_min_interval
  type: string
  comment: 匹配战力下限
  role: dimension
- name: match_power_interval
  type: string
  comment: 匹配战力上限
  role: dimension
- name: lose_protection
  type: string
  comment: 连败次数
  role: dimension
- name: protection_num
  type: string
  comment: 保护场次
  role: dimension
- name: protection_power_interval
  type: string
  comment: 保护战力上限
  role: dimension
- name: ds
  type: string
  comment: ''
  role: partition
coverage:
  scenarios:
  - 事实表按 rank_id JOIN 本表，回填段位名称（rank_name）、图标（img）等段位元数据用于报表展示与筛选。
  - 战斗/赛事分析中按段位分组统计玩家分布、升降级趋势，引用 min_point/win_point/lose_point 划分分数区间。
  - 赛季结算与奖励分析：season_reward/season_point/mail_id 用于核对奖励发放与邮件触达。
  - 匹配机制诊断：match_power_interval/match_power_min_interval/robot_match 用于核对匹配战力区间与机器人补位策略。
  limitations:
  - 配置类维度表，无值度量（所有列均为键/属性/配置项），不直接承载度量聚合。
  - rank_id 在单 ds 分区内唯一，但跨 ds 日分区因每日快照重复，故全表 primary_key_unique=false；如需全局唯一需附加 ds 复合键。
  - attibute/reward_rank/season_reward 等为复合编码串（如 1_62_300），需二次解码方能拆分道具/数量明细。
  - 未对单分区内的 rank_id 做进一步唯一性实测（已由 meta describe 标注 primary_key=rank_id 并经样本核对）。
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数（跨所有 ds 分区）
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: "2026-07-31"
  note: '基于 maxc meta describe 校正列类型/注释；primary_key=rank_id（meta 标注），label=rank_name。唯一性实测 r=740/d=10（跨 ds 分区重复）→ primary_key_unique=false，保留 draft。配置类维度表无值度量。'
