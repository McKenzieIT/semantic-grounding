metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV(快照日活跃角色数)
  account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 账号UV(快照日活跃账号数，去重)
  total_pay_amt_std:
    expression: SUM(pay_amt_std)
    description: 累计付费金额总和(快照日所有角色累计付费汇总)
  total_act_dur:
    expression: SUM(act_dur)
    description: 游戏时长总和(快照日所有角色游戏时长汇总)
  avg_role_force:
    expression: SUM(role_force) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均角色战力(衡量快照日角色整体战力水平)
coverage:
  scenarios:
    - 角色活跃规模：role_uv/account_uv衡量快照日活跃角色与账号UV及账号多角色分布
    - 付费规模：total_pay_amt_std衡量快照日全角色累计付费总额，可配合pay_level/vip_level下钻分层
    - 在线时长：total_act_dur衡量快照日总游戏时长，配合act_days_std分析粘性
    - 角色战力：avg_role_force衡量快照日角色平均战力水平，可配合role_level/role_force_rank下钻分层
    - 维度下钻：可按server_id/os_id/ch_type/activation_type/pay_level分组分析角色结构与活跃付费差异
  limitations:
    - 表为空/无数据(SELECT MAX(ds) FROM ieu_cdm.dws_10000251_role_tag_pbt3_df 返回 NULL，截至 2026-07-31 无业务数据，无法 spot-verify 任何指标)
    - 仅 scout 抽样验证(meta describe 列结构复核)，未做全量 maxc 实测复核；指标语义为结构性推断，待有数据后实测
    - _df 为日全量快照，跨 ds 聚合需去重(同一 role_id 每日一行)，时序 UV 需用近似/集合去重
    - 表内无 user_type 列，主体角色(role)为按 role_id 主键推断，user_type=3 未在表内实测验证
    - 188 列覆盖主线/无尽塔/装备塔/古战场/奇策/演武场/竞技场/洗炼/小队/家园等子域，本表 metrics 仅覆盖 5 项核心汇总，子域指标需另建派生表
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空(MAX(ds) NULL)，无法 spot-verify 指标；基于 meta describe 列结构做结构性指标推断，status=draft，待有数据后实测升级为 analyst_confirmed
