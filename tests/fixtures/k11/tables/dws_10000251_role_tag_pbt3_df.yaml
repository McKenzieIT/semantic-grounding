table_name: dws_10000251_role_tag_pbt3_df
engine: maxcompute
table_comment: PBT3角色宽表(日全量快照)
description: PBT3角色宽表：按角色(role)汇总的日全量快照(_df)，每角色每日一行，覆盖活跃/付费/战力/任务/小队/家园/抽卡/各类关卡(主线/无尽塔/装备塔/古战场/奇策)/演武场/竞技场/洗炼/战场等全量行为与状态。分析主体=角色(role,推断user_type=3，表内无user_type列未实测)。粒度：日全量快照(_df)。
domains:
  - 角色成长
  - 战斗关卡
  - 付费经济
granularity: 日全量快照(_df)，主体角色(role)，每角色每日一行
