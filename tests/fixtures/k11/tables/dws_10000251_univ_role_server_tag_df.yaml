metrics:
  role_active_count:
    expression: COUNT(DISTINCT user_id)
    description: 截至 ds 的活跃角色数（角色粒度，本表固定 user_type=3，统计在册角色主体数）
  avg_act_days:
    expression: AVG(act_days_std)
    description: 角色平均累计活跃天数（截至 ds，衡量生命周期活跃深度）
  avg_act_dur:
    expression: AVG(act_dur_std)
    description: 角色平均累计活跃时长（单位秒，截至 ds）
  retention_rate_d3:
    expression: SUM(CASE WHEN act_days_std>=3 THEN 1 ELSE 0 END)*1.0/NULLIF(COUNT(*),0)
    description: 3日留存近似率（基于累计活跃天数>=3 的近似口径，非逐日精确留存；本表全为角色行，分母为角色总数）
  retention_rate_d7:
    expression: SUM(CASE WHEN act_days_std>=7 THEN 1 ELSE 0 END)*1.0/NULLIF(COUNT(*),0)
    description: 7日留存近似率（基于累计活跃天数>=7，近似口径）
  retention_rate_d30:
    expression: SUM(CASE WHEN act_days_std>=30 THEN 1 ELSE 0 END)*1.0/NULLIF(COUNT(*),0)
    description: 30日留存近似率（基于累计活跃天数>=30，近似口径）
  return_interval_avg:
    expression: AVG(act_ymd_diff)
    description: 角色平均回流间隔天数（最近两次活跃间隔，衡量活跃节奏）
  return_interval_max:
    expression: MAX(act_ymd_diff)
    description: 角色最大回流间隔天数（识别流失边缘角色）
  pay_amt_total:
    expression: SUM(pay_amt_std)
    description: 累计付费总金额（单位元，截至 ds，角色粒度）
  pay_amt_avg:
    expression: AVG(pay_amt_std)
    description: 角色平均累计付费金额（单位元，截至 ds）
  first_pay_rate:
    expression: SUM(CASE WHEN pay_amt_p1d>0 THEN 1 ELSE 0 END)*1.0/NULLIF(COUNT(*),0)
    description: 首付率（首付金额>0 的角色占比，衡量付费转化；本表全为角色行，分母为角色总数）
  paid_role_share:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std>0 THEN user_id END)*1.0/NULLIF(COUNT(DISTINCT user_id),0)
    description: 付费角色占比（付费角色数/角色总数，付费渗透率，NULLIF 防除零）
  arpu:
    expression: SUM(pay_amt_std)*1.0/NULLIF(COUNT(DISTINCT user_id),0)
    description: 角色累计 ARPU（每角色累计付费金额，单位元，NULLIF 防除零）
  avg_role_level:
    expression: AVG(role_level)
    description: 角色平均等级（截至 ds）
  max_role_level:
    expression: MAX(role_level)
    description: 角色最高等级（截至 ds）
  internal_role_count:
    expression: COUNT(DISTINCT CASE WHEN fellow_flag=1 THEN user_id END)
    description: 内部角色数（fellow_flag=1，用于剔除内部用户前的盘点）
partitions:
  - name: ds
    type: string
confirmation:
  status: analyst_confirmed
  confirmed_by: data-verification-agent
  confirmed_at: "2026-07-30"
  note: 真实数据验证通过（MAX(ds)=20260729 最新）。列校验：metrics 引用的 8 列(user_id/act_days_std/act_dur_std/act_ymd_diff/pay_amt_std/pay_amt_p1d/role_level/fellow_flag)均存在于真实 schema(42列)。user_type 校验：DISTINCT user_type={3} 单一值，与 YAML 角色表(user_type=3)声明一致。粒度校验：rows=1,668,110 vs DISTINCT(user_id,server_id)=1,668,110，严格 1 行/角色×区服/天；608 个区服。核心指标实测合理：role_active_count=1,668,110；avg_act_days=6.56；avg_act_dur=31,319秒≈8.7小时累计(非Unix时间戳，无移植时序bug)；pay_amt_total=107,314,524元；arpu=64.33元；first_pay_rate=0.193；paid_role_share=0.193；avg_role_level=4.06；max_role_level=100；internal_role_count=1,369；return_interval_avg=4.63天/最大439天；retention_d3/d7/d30=0.304/0.180/0.047 均∈[0,1]单调递减。所有指标非NULL且合理，无 verified-broken 指标需移除。domains(用户生命周期/付费经济/角色成长)无活动运营，无需调整。
coverage:
  scenarios:
    - 角色累计活跃深度分析：按区服/渠道/平台分组统计角色平均累计活跃天数与时长（avg_act_days/avg_act_dur），识别高活跃区服与流失边缘区服
    - 角色回流与活跃节奏分析：用 act_ymd_diff 的均值/最大值衡量回流间隔，定位长期未活跃即将流失的角色
    - 角色付费金额与首付率分析：按区服/媒体/渠道统计累计付费总额、角色付费均值、首付率（first_pay_rate）、付费渗透率（paid_role_share）与 ARPU（arpu）
    - 角色等级分布分析：按等级分桶或均值/最大值（avg_role_level/max_role_level）刻画区服角色成长进度
    - 地域与平台/渠道分布分析：按 region_id/os_id/ch_type/pkg_name 分组统计角色数与付费金额，刻画用户画像
    - 设备/账号/角色跨主体关联分析：通过 rel_dev_id_*/rel_acc_id_*/rel_role_id_* 首末次关联ID还原角色与设备/账号的绑定关系与切换行为
    - 内部用户剔除分析：用 fellow_flag 过滤内部角色（internal_role_count 盘点），正式分析须 fellow_flag=0
  limitations:
    - _df 为日全量快照，所有累计指标截至 ds 当日；跨日对比须用两日快照差量，本表不直接提供日增量
    - 本表无独立 role_id 列，角色主体由 user_id（角色ID）+server_id 联合标识，跨表关联角色须带齐两字段
    - 本表固定 user_type=3 仅含角色行，不包含设备/账号层级数据；如需设备/账号粒度分析须回对应设备/账号表（univ_dev/univ_acc）
    - retention_rate_dX 为基于累计活跃天数（act_days_std>=N）的近似留存口径，非逐日精确留存；精确逐日留存需回 dwd/ods 事件明细
    - 本表无逐日活跃/付费明细事件，无法回答"某日活跃/付费事件流"类问题，需回 dwd/ods 事件源
    - 累计指标（act_days_std/pay_amt_std 等）为截至 ds 的历史累计，不可与日增量指标混用或直接相加
    - 内部用户标记 fellow_flag=1 的角色会污染正式分析，统计外部用户时须过滤 fellow_flag=0
    - act_*_fst/lst、rel_*_fst/lst、pay_tm_fst/lst 为成对首末次快照，不可 SUM/AVG 聚合
    - 多区服角色精确占比（同一账号跨区服去重）超出单表单 SQL 片段能力，需配合 server_id 分组或回 dwd 子查询
  coverage_status: draft
supersedes: []
