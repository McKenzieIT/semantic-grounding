table_name: dws_10000251_univ_role_server_tag_df
engine: maxcompute
table_comment: ""
description: |
  角色×区服粒度的通用标签日全量快照表（_df，每日全量）。每行表示一个角色在某区服截至分区日期 ds 的累计标签状态，
  记录该角色的累计活跃天数/时长、累计与首日/首付付费金额、最近活跃时间、首末次活跃/付费时间、首末次关联设备/账号/角色、
  设备品牌型号、活跃 IP 与地理位置、买量归因（广告ID/媒体）、角色等级、内部用户标记等。
  【主体类型：角色表】本表固定为 user_type=3 的【角色表】（表名含 role），分析主体=角色；user_id 列实际存储角色ID（role_id），
  配合 server_id 联合标识角色主体；DISTINCT user_type 仅返回单一值 3（建议用 SELECT DISTINCT user_type 复核）。
  能回答的业务问题：角色生命周期累计活跃与回流间隔、付费金额与首日/首付付费、角色等级分布、设备/账号/角色跨主体关联、
  买量归因带来的角色质量、地域与平台/渠道分布、内部用户剔除。
  注意事项：1) _df 为日全量快照，所有累计指标截至 ds 当日，跨日对比需用快照差量；2) 本表仅含角色行（user_type 固定为 3），不存在设备/账号行，无需也不应按 user_type 切换或过滤层级；
  3) act_*_fst/lst、rel_*_fst/lst、pay_tm_fst/lst 为成对首末次快照，不可聚合；4) 无独立 role_id 列，跨表关联角色需用 user_id（角色ID）+server_id；
  5) 指标口径：角色数统计用 COUNT(DISTINCT user_id)；留存率为基于累计活跃天数的近似口径（act_days_std>=N），非逐日精确留存；
  付费率/首付率用 pay_amt_p1d>0 判定；累计付费金额用 pay_amt_std。
domains:
  - 用户生命周期
  - 付费经济
  - 角色成长
granularity: |
  日全量快照（_df），每角色每区服每天一行；分析主体=角色（角色表，表名含 role，固定 user_type=3）。
  标识字段：user_id（实际存储角色ID role_id）+ server_id 联合标识角色主体（本表无独立 role_id 列）。
  本表仅含角色行，DISTINCT user_type 仅返回单一值 3（建议用 SELECT DISTINCT user_type 复核），不存在设备/账号层级切换。
  分区字段 ds 为快照日期（yyyyMMdd），全量覆盖历史所有角色×区服组合。
