metrics:
  role_uv_day1:
    expression: COUNT(DISTINCT CASE WHEN day1 IS NOT NULL THEN role_id END)
    description: 首日活跃角色数（day1 非空的角色去重数）
  role_uv_day7:
    expression: COUNT(DISTINCT CASE WHEN day7 IS NOT NULL THEN role_id END)
    description: 7日留存角色数（day7 非空的角色去重数）
  role_uv_day30:
    expression: COUNT(DISTINCT CASE WHEN day30 IS NOT NULL THEN role_id END)
    description: 30日留存角色数（day30 非空的角色去重数）
  retention_rate_day7:
    expression: COUNT(DISTINCT CASE WHEN day7 IS NOT NULL THEN role_id END) / NULLIF(COUNT(DISTINCT CASE WHEN day1 IS NOT NULL THEN role_id END), 0)
    description: 7日留存率（7日留存角色数 / 首日活跃角色数，分母 NULLIF 防零除）
  total_progression_day30:
    expression: SUM(day30)
    description: 30日累计培养表现（day30 数值总和）
coverage:
  scenarios:
    - N日留存角色规模与衰减：通过 day1/day7/day30 等节点活跃角色数观察新增角色留存曲线
    - 角色培养深度：累计培养表现(SUM)反映角色培养投入规模
    - 留存率评估：7日留存率等比例指标量化新增角色生命周期的留存质量
  limitations:
    - 表为空/无数据(MAX(ds) NULL)，所有指标均为结构性定义，未经 maxc 实测验证
    - 仅按 role_id+server_id+data_type 粒度展开，无账户/设备维度（分析主体为 user_type=3 角色）
    - _df 为日全量快照，指标按 ds 分区快照计算，非日增量聚合
    - 仅抽样结构性定义 day1/day7/day30 节点，未独立验证 day60~day360 长周期指标
