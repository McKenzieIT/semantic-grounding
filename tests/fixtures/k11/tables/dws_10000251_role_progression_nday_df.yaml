table_name: dws_10000251_role_progression_nday_df
engine: maxcompute
table_comment: 新增角色培养表现N日汇总
description: |-
  新增角色培养表现N日汇总（DWS日全量快照）。记录每个新增角色在首日至第360日各时间节点的培养表现数值，
  按 role_id+server_id+data_type 粒度展开，用于观察角色随生命周期的培养进度与留存衰减。
  粒度：日全量快照(_df)。分析主体=角色（user_type=3，role_id 为唯一标识，server_id 为服务器分组键）。
  主要字段：role_id, server_id, data_type, day1~day30, day60, day90, day180, day360 等38列。
domains:
  - 角色成长
  - 用户生命周期
granularity: 日全量快照(_df)，分析主体=角色（user_type=3）
