metrics:
  churn_acc_uv:
    expression: COUNT(DISTINCT user_id)
    description: 当日流失账号数（UV），user_id 去重
  avg_churn_day:
    expression: AVG(churn_day)
    description: 当日流失账号的平均流失天数
  churn_pay_amt_total:
    expression: SUM(pay_amt_std)
    description: 当日流失账号的累计付费金额总和（元，账号级累计）
  churn_pay_acc_cnt:
    expression: SUM(CASE WHEN pay_amt_std > 0 THEN 1 ELSE 0 END)
    description: 当日流失账号中累计付费过的账号数（pay_amt_std>0）
  churn_pay_ratio:
    expression: SUM(CASE WHEN pay_amt_std > 0 THEN 1 ELSE 0 END) * 1.0 / NULLIF(COUNT(DISTINCT user_id), 0)
    description: 当日流失账号中付费账号占比（付费账号数/流失账号UV）
coverage:
  scenarios:
    - 当日流失账号规模与流失天数画像（churn_acc_uv / avg_churn_day）
    - 流失账号的累计付费贡献与付费渗透（churn_pay_amt_total / churn_pay_acc_cnt / churn_pay_ratio）
  limitations:
    - _di 为日增量，每 user_id 一行；跨日聚合流失 UV 需按 ds 切分去重，不可直接跨日 SUM(UV)。
    - 分析主体=账号（user_type=2，ds=20260730 仅含 user_type=2 已校验）；pay_amt_std/act_days_std 为账号级累计值，非角色级。
    - churn_day 为流失天数标量，avg_churn_day 仅在单日分区内有业务意义；跨日平均需注意每行已是当日流失账号的流失天数。
    - 仅对 20260730 抽样验证 churn_acc_uv=3371 / avg_churn_day=8.70 / 累计付费=752188 元，未做全量历史 maxc 实测复核。
    - 未覆盖角色级/区服级维度（rel_role_srv_* 为字符串，非规范化维度）；pay_amt_l7d/l30d/l90d/l180d/l360d 滚动窗口付费可按需扩展指标。
confirmation:
