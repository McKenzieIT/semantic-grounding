  confirmed_at: "2026-07-31"
dimension_refs:
  - dim_table: dim_10000251_user_tag_before_ob_info
    join_keys:
      - dws_column: user_id
        dim_column: user_id
    derivation: "DWS column user_id (comment: 用户id) is the account identifier matching the PK user_id of dim_10000251_user_tag_before_ob_info, which is explicitly meant for joining fact tables via user_id to provide pre-OB user tag/batch dimensions."
    origin: deterministic
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: rel_role_srv_fst
        dim_column: server_id
      - dws_column: rel_role_srv_lst
        dim_column: server_id
    derivation: "DWS columns rel_role_srv_fst/rel_role_srv_lst (comment: 首次/最近关联角色区服) are 区服(server) identifiers, semantically equal to the PK server_id of dim_10000251_server_info, which is the canonical 区服 dimension for joining fact tables by server_id."
