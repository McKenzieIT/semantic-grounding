table_name: dws_10000251_univ_acc_churn_di
engine: maxcompute
table_comment: DWS通用账号流失日增量表：账号粒度流失用户快照（_di），含流失天数与累计付费/活跃画像
description: |-
  粒度：日增量(_di)，每 user_id 一行。分析主体=账号（user_type=2，已校验 ds=20260730 仅含 user_type=2）。
  流失账号快照：记录当日判定流失的账号及其 churn_day（流失天数）、累计活跃/付费画像（act_days_std、act_dur_std、pay_amt_std 及 l7d/l30d/l90d/l180d/l360d 等滚动窗口付费）、首末活跃时间与设备/渠道/地域维度。
  主要字段：user_type, user_id, churn_day, act_days_std, act_dur_std, pay_amt_std, pay_amt_l30d, act_tm_fst, act_tm_lst, pay_tm_fst, pay_tm_lst, os_id, ch_type, region_id 等49列。
domains:
  - 用户生命周期
  - 付费经济
granularity: 日增量(_di)，每 user_id 一行，主体=账号（user_type=2）
