table_name: dws_10000251_role_server_base_df
engine: maxcompute
table_comment: 角色-区服维度日全量快照（_df）：每业务日每角色(role_id)在每区服(server_id)一行累计画像。
description: 粒度：日全量快照(_df)，每业务日(ds)每角色(role_id)在每区服(server_id)一行累计画像。分析主体=角色（user_type=3，由表名 role 推断；该表无 user_type 列，主体按角色-区服汇总定义）。涵盖首/末次活跃与付费(时间/账号/utdid)、近期7/30天及累计活跃(pv/days/dur)与付费(pv/days/amt)、滚服标识、归因推广等角色-区服级画像字段。
domains:
  - 用户生命周期
  - 付费经济
granularity: 日全量快照(_df)：每业务日每角色-区服一行
