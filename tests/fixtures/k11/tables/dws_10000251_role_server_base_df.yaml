metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色数UV：当日快照下去重角色数（角色-区服粒度主体指标）
  pay_role_uv:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END)
    description: 累计付费角色数：累计付费金额>0的去重角色数
  pay_amt_std_total:
    expression: SUM(pay_amt_std)
    description: 累计付费总金额（元）：快照内角色累计付费金额之和
  pay_rate:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 付费转化率：累计付费角色数 / 角色数
  arppu_std:
    expression: SUM(pay_amt_std) / NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END), 0)
    description: 累计付费角色ARPPU（元/付费角色）：累计付费总金额 / 累计付费角色数
coverage:
  scenarios:
    - 角色规模与活跃：快照角色数UV、累计付费角色数
    - 付费经济：累计付费总金额、付费转化率、ARPPU
    - 留存与生命周期：首/末次活跃时间、累计活跃天数、最近2次活跃间隔(act_ymd_diff1)、最近活跃日期与ds间隔(act_ymd_diff2)
    - 渠道与平台画像：按 os_id/ch_type/ch_id/app_ver/ip_country 拆分角色规模与付费
  limitations:
    - 仅 scout 抽样验证，未做全量 maxc 实测复核
    - 全表零行：maxc 实测 SELECT MAX(ds)=NULL；该 dws 角色-区服汇总表疑似未产出数据/历史遗留空表，无法验证指标合理性
    - 主体 user_type=3 为由表名 role 推断；该表无 user_type 列，未做 SELECT DISTINCT 实测确认
    - 仅定义角色-区服粒度聚合指标；跨区服/跨角色明细拆分未实测
    - _df 为日全量快照，每 ds 每角色-区服一行累计值；跨 ds 不可直接累加，须以单 ds 快照为准
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已通过 maxc meta describe 校验全部56列真实名称/类型/注释并据实重排 role（标识/分组键->dimension，可聚合数值->measure，文本属性->attribute）。但 maxc 实测全表零行（MAX(ds)=NULL），无法验证指标合理性，故保持 draft；指标表达式仅使用已校验真实列且除法均带 NULLIF，待数据产出后复核可升 analyst_confirmed。
