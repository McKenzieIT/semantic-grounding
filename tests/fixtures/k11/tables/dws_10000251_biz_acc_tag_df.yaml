table_name: dws_10000251_biz_acc_tag_df
engine: maxcompute
table_comment: 账号大事件标签日全量表（DWS层）：每个账号每日对应一个大事件标签(biz_name，如CBT1/CBT2)，未打标则为NULL
description: 粒度：日全量快照(_df)，单分区为截至当日全量账号打标状态（非当日增量）。分析主体=账号（user_type=2，已实测验证）。 主要字段：user_type, user_id, biz_name, ds。biz_name 为账号大事件标签，取值如 CBT1/CBT2（封闭测试批次），NULL 表示未参与任何已打标大事件。
domains:
  - 用户生命周期
  - 系统监控
granularity: 日全量快照(_df)
columns:
  - name: user_type
    type: bigint
    comment: 用户类型，取值：1:设备/2:账号/3:角色
    role: dimension
  - name: user_id
    type: string
    comment: 用户id
    role: dimension
  - name: biz_name
    type: string
    comment: 大事件名称
    role: dimension
  - name: ds
    type: string
    comment: 分区字段
    role: partition
metrics:
  acc_uv:
    description: 截至当日累计账号数（全量快照UV，去重 user_id）
    expression: COUNT(DISTINCT user_id)
  tagged_acc_uv:
    description: 已打标(biz_name IS NOT NULL)账号数（去重）
    expression: COUNT(DISTINCT CASE WHEN biz_name IS NOT NULL THEN user_id END)
  tag_rate:
    description: 账号打标渗透率 = 已打标账号数 / 累计账号数
    expression: COUNT(DISTINCT CASE WHEN biz_name IS NOT NULL THEN user_id END) * 1.0 / NULLIF(COUNT(DISTINCT user_id), 0)
  cbt1_acc_uv:
    description: CBT1 批次账号数（去重）
    expression: COUNT(DISTINCT CASE WHEN biz_name = 'CBT1' THEN user_id END)
  cbt2_acc_uv:
    description: CBT2 批次账号数（去重）
    expression: COUNT(DISTINCT CASE WHEN biz_name = 'CBT2' THEN user_id END)
coverage:
  scenarios:
    - 账号大盘：acc_uv 追踪累计账号规模随日期变化
    - 打标渗透：tag_rate/tagged_acc_uv 评估大事件标签覆盖进度
    - 批次对比：cbt1_acc_uv vs cbt2_acc_uv 比较各封测批次账号规模
  limitations:
    - 仅 scout 抽样验证（最新分区 ds=20260730 实测 acc_uv=1207231/tagged_uv=19244/tag_rate=0.0159），未做全量 maxc 实测复核
    - _df 为日全量快照，跨分区做 UV 累加会重复计数；跨期对比需用去重口径或同分区
    - biz_name 仅含 CBT1/CBT2 两类实测取值，后续若新增大事件标签需补充 CASE 分支
    - user_type 实测最新分区仅取值 2(账号)，跨分区无其他主体
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  notes: 最新分区 ds=20260730 实测 user_type=2(账号) 单一值；acc_uv/tagged_uv/tag_rate 三指标抽样值合理，确认 analyst_confirmed。biz_name 含 NULL+CBT1+CBT2。
dimension_refs:
  - dim_table: dim_10000251_user_tag_before_ob_info
    join_keys:
      - dws_column: user_id
        dim_column: user_id
    derivation: DWS column user_id (用户id, account-level user_type=2) is an exact match to PK user_id of dim_10000251_user_tag_before_ob_info (用户标签维度表, 含 user_type 字段, user_id tested unique), designed for fact tables to JOIN via user_id for tag/batch dimension lookup; both tables share the user-tag/CBT-batch domain.
    origin: deterministic
pref_label: 账号大事件标签表
alt_labels:
  - CBT
