table_name: dws_10000251_play_rogue_df
engine: maxcompute
table_comment: 古战场(rogue)玩法角色关卡通关日全量表
description: |-
  古战场(rogue)玩法角色粒度日全量快照(_df)，按角色(role_id)+关卡(stage_id)记录参与/通关状态。
  主体：角色(role_id 为主键，user_type=3 角色)；粒度：角色×关卡×日全量快照。
  主要字段：role_id, server_id, play_id, sub_play_id, stage_id, pass_status, part_pv, part_pv_valid, pass_pv, pass_tm 等18列。
domains:
  - 战斗关卡
  - 角色成长
granularity: 角色粒度日全量快照(_df)，主体角色(role_id)，按日全量切片
columns:
  - name: role_id
    type: string
    comment: 角色id
    role: dimension
  - name: server_id
    type: string
    comment: 区服id
    role: dimension
  - name: play_id
    type: string
    comment: 玩法id
    role: dimension
  - name: sub_play_id
    type: string
    comment: 子玩法id
    role: dimension
  - name: stage_id
    type: string
    comment: 关卡id，章节id+难度
    role: dimension
  - name: pass_status
    type: bigint
    comment: 通关状态，0-未通关 1-通关
    role: dimension
  - name: part_pv
    type: bigint
    comment: 参与次数
    role: measure
  - name: part_pv_valid
    type: bigint
    comment: 有效参与次数
    role: measure
  - name: unpass_part_pv
    type: bigint
    comment: 首通前参与次数
    role: measure
  - name: unpass_part_pv_valid
    type: bigint
    comment: 首通有效参与次数
    role: measure
  - name: pass_part_id
    type: string
    comment: 首通参与id
    role: dimension
  - name: pass_pv
    type: bigint
    comment: 通关次数
    role: measure
  - name: pass_tm
    type: datetime
    comment: 首通时间
    role: dimension
  - name: pass_buff_list
    type: string
    comment: 首通BUFF列表
    role: attribute
  - name: pass_card_list
    type: string
    comment: 首通卡牌列表
    role: attribute
  - name: pass_battle_pv
    type: bigint
    comment: 首通战斗次数
    role: measure
  - name: ext_info
    type: string
    comment: 扩展信息
    role: attribute
  - name: ds
    type: string
    comment: 业务日期
    role: partition
metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与古战场玩法的角色数(UV)，去重角色主键
  part_pv_sum:
    expression: SUM(part_pv)
    description: 古战场关卡总参与次数(含未通关)
  pass_pv_sum:
    expression: SUM(pass_pv)
    description: 古战场关卡总通关次数
  pass_role_uv:
    expression: COUNT(DISTINCT CASE WHEN pass_status = 1 THEN role_id END)
    description: 至少通关一个关卡的角色数(pass_status=1)
  pass_rate:
    expression: SUM(pass_pv) * 1.0 / NULLIF(SUM(part_pv), 0)
    description: 通关率=总通关次数/总参与次数
coverage:
  scenarios:
    - 按角色(role_id)统计古战场玩法参与UV与通关UV，评估玩法渗透与通关达成
    - 按关卡(stage_id)/子玩法(sub_play_id)聚合参与次数与通关次数，识别热门关卡与卡点
    - 通关率(pass_pv/part_pv)衡量关卡难度与玩家推进效率
    - 首通时间(pass_tm)与首通战斗次数(pass_battle_pv)分析首通体验
  limitations:
    - _df 为日全量快照，非增量；跨日聚合需注意重复计数(同一角色关卡每日重复行)
    - 表无 user_type 列，角色主体由 role_id 主键推断(user_type=3)，未做独立校验
    - 仅在 latest ds=20260318 上抽样验证 role_uv/part_pv_sum/pass_pv_sum/pass_rate，未做全量 maxc 实测复核
    - pass_buff_list/pass_card_list/ext_info 为文本属性，未结构化展开
    - 历史分区 sample_preview 含 NULL 行(未通关角色)，指标已用 NULLIF 规避除零
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  notes: latest ds=20260318 抽样验证 role_uv=3528, part_pv_sum=72120, pass_pv_sum=26986, pass_rate≈0.374，数值合理；status=analyst_confirmed。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS server_id (comment 区服id) exactly matches the PK server_id of dim_10000251_server_info, the canonical 区服 dimension for server name/opening date lookup.
    origin: deterministic
  - dim_table: dim_10000251_trans_sub_play_od
    join_keys:
      - dws_column: sub_play_id
        dim_column: sub_play_id
    derivation: DWS sub_play_id (comment 子玩法id) exactly matches the PK sub_play_id of dim_10000251_trans_sub_play_od, the 子玩法配置 dimension keyed by sub_play_id.
    origin: deterministic
  - dim_table: dim_10000251_trans_stage_df
    join_keys:
      - dws_column: stage_id
        dim_column: id
    derivation: DWS stage_id (comment 关卡id，章节id+难度) semantically matches the PK id (关卡id) of dim_10000251_trans_stage_df, the 关卡配置 dimension for stage lookup by id.
pref_label: 古战场肉鸽表
alt_labels:
  - 古战
  - 肉鸽
  - rogue
  - 古战场
  - 通关率
