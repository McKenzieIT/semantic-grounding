metrics:
  dev_uv:
    expression: COUNT(DISTINCT utdid)
    description: 设备活跃UV（_df快照去重设备数）
  pay_dev_cnt:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN utdid END)
    description: 累计付费设备数（pay_amt_std>0）
  pay_amt_std_total:
    expression: SUM(pay_amt_std)
    description: 累计付费金额合计（元）
  pay_amt_1m_total:
    expression: SUM(pay_amt_1m)
    description: 最近30日付费金额合计（元）
  act_pv_std_total:
    expression: SUM(act_pv_std)
    description: 累计活跃次数合计
coverage:
  scenarios:
    - 设备规模与画像（按os/品牌/型号/渠道/IP地区切片）
    - 设备生命周期：新增、活跃留存、流失（act_ymd_diff2 与累计/窗口活跃天数）
    - 付费经济：付费设备渗透、累计/窗口付费金额、首日付费
  limitations:
    - 表为空/无数据（MAX(ds) NULL，截至2026-07-31未观测到数据），指标为结构性定义未经实测复核
    - _df为日全量快照，跨ds不可直接累加；用户/角色级分析需用对应acc/role汇总表
    - 含角色列表字段（act_role_list_*、pay_role_list_*）为聚合文本，不可作度量直接SUM
    - 仅scout抽样验证，未做全量maxc实测复核
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空(MAX(ds) NULL)，指标未做实测复核，按结构性定义起草为draft
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: act_server_id_fst
        dim_column: server_id
      - dws_column: act_server_id_lst
        dim_column: server_id
      - dws_column: pay_server_id_fst
        dim_column: server_id
      - dws_column: pay_server_id_lst
        dim_column: server_id
    derivation: DWS act_server_id_fst/act_server_id_lst（首次/最近活跃区服id）与 pay_server_id_fst/pay_server_id_lst（首次/最近付费区服）均为区服id，与 dim_10000251_server_info 主键 server_id 语义匹配，JOIN 回填区服名称与开服时间。
pref_label: 研发汇总表
alt_labels:
