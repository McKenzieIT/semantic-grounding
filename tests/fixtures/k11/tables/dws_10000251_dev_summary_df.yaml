table_name: dws_10000251_dev_summary_df
engine: maxcompute
table_comment: 设备汇总日全量快照表（_df）：每设备一行，记录设备画像、活跃/付费累计及近7/30日窗口指标
description: |-
  粒度：日全量快照(_df)，每ds每设备(utdid)一行。分析主体=设备（user_type=1）。
  覆盖设备画像（os/品牌/型号/IP/渠道）、活跃与付费的累计/近7日/近30日/新增首日窗口指标，含金额、次数、天数、时长、角色列表等75列。
domains:
  - 用户生命周期
  - 付费经济
granularity: 日全量快照(_df)，主体=设备(utdid)
