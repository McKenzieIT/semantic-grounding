table_name: dws_10000251_progression_card_di
engine: maxcompute
table_comment: 卡牌培养详情日表
description: 卡牌培养详情日表（_di 日增量）。粒度：每日每角色每张卡牌一行记录，主体为角色(role_id)。记录角色所持卡牌的培养进度：星级、等级、战力、魂石、无双、觉醒、风物、装备、天命方案等22列。
domains:
  - 角色成长
  - 装备道具
granularity: 日增量(_di)，角色+卡牌粒度（role_id+card_id）
columns:
  - name: role_id
    type: STRING
    comment: 角色id
    role: dimension
  - name: card_id
    type: BIGINT
    comment: 卡牌ID
    role: dimension
  - name: card_job
    type: BIGINT
    comment: 卡牌职业
    role: dimension
  - name: card_star
    type: BIGINT
    comment: 卡牌星级
    role: dimension
  - name: card_level
    type: BIGINT
    comment: 卡牌等级
    role: dimension
  - name: card_force
    type: BIGINT
    comment: 卡牌战力
    role: measure
  - name: card_piece
    type: BIGINT
    comment: 魂石余量
    role: measure
  - name: unrival_level
    type: BIGINT
    comment: 无双等级
    role: dimension
  - name: is_key
    type: STRING
    comment: 是否主力卡牌 true-是 false-否
    role: dimension
  - name: ability
    type: STRING
    comment: 潜力加点
    role: attribute
  - name: ability_points
    type: BIGINT
    comment: 潜能点总数
    role: measure
  - name: awake_list
    type: STRING
    comment: 觉醒列表
    role: attribute
  - name: tactic_id
    type: BIGINT
    comment: 风物ID
    role: dimension
  - name: tactic_name
    type: STRING
    comment: 风物名称
    role: attribute
  - name: tactic_star
    type: BIGINT
    comment: 风物星级
    role: dimension
  - name: equip
    type: STRING
    comment: 装备详情
    role: attribute
  - name: card_archive
    type: BIGINT
    comment: 典藏ID
    role: dimension
  - name: natalcharts
    type: STRING
    comment: 天命方案
    role: attribute
  - name: natalchartscheme
    type: BIGINT
    comment: 当前天命方案索引
    role: dimension
  - name: act_tm_fst
    type: DATETIME
    comment: 首次培养时间
    role: dimension
  - name: act_tm_lst
    type: DATETIME
    comment: 最近一次培养时间
    role: dimension
  - name: ds
    type: STRING
    comment: 分区
    role: partition
metrics:
  card_uv:
    expression: COUNT(DISTINCT role_id)
    description: 当日持有卡牌的角色数（去重 role_id）
  card_count:
    expression: COUNT(*)
    description: 当日卡牌培养记录总数（role_id+card_id 行数）
  key_card_count:
    expression: SUM(CASE WHEN is_key = 'true' THEN 1 ELSE 0 END)
    description: 当日主力卡牌(is_key=true)数量
  total_card_force:
    expression: SUM(card_force)
    description: 当日全部卡牌战力总和
  avg_card_force:
    expression: SUM(card_force) / NULLIF(COUNT(*), 0)
    description: 当日平均单卡战力
coverage:
  scenarios:
    - 监测每日卡牌培养规模（持卡角色数、卡牌记录数、主力卡数）
    - 评估卡牌战力水平（总战力、平均战力）随版本/活动变化
    - 可按 card_star/card_level/unrival_level 维度分桶分析培养深度分布
    - 可按 is_key 区分主力卡与非主力卡的培养强度
  limitations:
    - _di 日增量表，跨日累计需按 ds 逐日聚合或回溯全量快照表
    - 表无 user_type 列，主体为角色(role_id)系推断（无 acc/dev 标识列，user_type=3 未能通过查询验证）
    - 仅对 latest ds=20260730 做了 scout 抽样验证（role_uv/card_cnt/force 等值合理），未做全量 maxc 实测复核
    - ability/awake_list/equip/natalcharts 为 JSON 文本字段，指标需 JSON 解析方可下钻
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已对 latest ds=20260730 抽样验证 card_uv/card_count/key_card_count/total_card_force/avg_card_force，值合理
dimension_refs:
  - dim_table: dim_10000251_trans_card_df
    join_keys:
      - dws_column: card_id
        dim_column: id
    derivation: DWS card_id (卡牌ID) is the card/武将 FK; dim_10000251_trans_card_df (武将配置维度表, PK id) is the card dimension, so card_id joins id.
  - dim_table: dim_10000251_tactic_info
    join_keys:
      - dws_column: tactic_id
        dim_column: tactic_id
    derivation: DWS tactic_id (风物ID) exactly matches dim_10000251_tactic_info PK tactic_id (风物配置维度表).
    origin: deterministic
  - dim_table: dim_10000251_knight_job_name
    join_keys:
      - dws_column: card_job
        dim_column: job_id
    derivation: DWS card_job (卡牌职业, dimension) is the card's profession code; dim_10000251_knight_job_name (职业配置维度表, PK job_id) translates 职业编码 to 可读名称, so card_job joins job_id.
pref_label: 卡牌培养详情日表
alt_labels:
  - 培养
