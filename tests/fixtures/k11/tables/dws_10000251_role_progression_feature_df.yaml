metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV（当日全量快照去重角色数）
  total_ssr_card:
    expression: SUM(ssr_card_cnt)
    description: SSR卡总数（全角色求和）
  avg_top6_force:
    expression: AVG(card_force_top6)
    description: 巅峰六人战力均值
  full_star_ssr_card_total:
    expression: SUM(full_star_ssr_card_cnt)
    description: 满火SSR卡总数
  server_cnt:
    expression: COUNT(DISTINCT server_id)
    description: 活跃服务器数（去重 server_id）
coverage:
  scenarios:
    - 角色培养进度分布（UV/战力均值/SSR卡数趋势，按 ds 快照）
    - 满火/典藏SSR卡拥有规模及服务器覆盖
    - TOP5/TOP6-10/TOP11-15 各梯队星级/等级/无双装备水平分层
  limitations:
    - 日全量快照(_df)，跨日查询需去重 role_id，避免重复累加
    - 表无 user_type 列，分析主体=角色由表名(role_)推断，未在表中显式校验
    - 仅在最新分区 ds=20260730 抽样验证 5 项核心指标，未做全量 maxc 实测复核；其余 30+ 培养特征列未逐一抽样
    - server_id 样本存在空串；server_cnt 统计含空串服务器，按需过滤
    - 战力排名/梯队聚合列(card_force_top6_server_rn、top*_*)为画像属性，跨角色聚合意义有限，建议维度下钻
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已在最新分区 ds=20260730 抽样验证 role_uv/total_ssr_card/avg_top6_force/full_star_ssr_card_total/server_cnt 5 项指标，值合理（uv≈166.9万, sum_ssr≈999.8万, avg_force≈24.4万）。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS column server_id (comment 服务器ID) is an exact name match to the primary key server_id of dim_10000251_server_info, the 服务器(区服)维度配置表 described as purpose-built for fact-table server_id JOIN.
    origin: deterministic
pref_label: 角色培养画像表
alt_labels:
  - 培养
  - 成长
  - 养成
