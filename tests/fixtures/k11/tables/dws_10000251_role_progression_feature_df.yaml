table_name: dws_10000251_role_progression_feature_df
engine: maxcompute
table_comment: 角色培养画像总表
description: |-
  角色培养画像总表。
  粒度：日全量快照(_df)。分析主体=角色（user_type=3）。
  主要字段：role_id, server_id, card_force_top6, card_force_top6_server_rn, ssr_card_cnt, full_star_ssr_card_cnt, archive_ssr_card_cnt, ssr_tactic_cnt 等35列。
domains:
  - 角色成长
  - 装备道具
granularity: 日全量快照(_df); 分区字段 ds; 分析主体=角色(user_type=3, 表名推断; 表无 user_type 列)
