description: '游戏 10000251 肉鸽（rogue）模式 BUFF 配置维度表，日全量快照(_df)。每行记录一个 BUFF 的配置属性：BUFFid、名称、类型、关联技能/套装、品质、描述。用于事实表 BUFF 维度查找（JOIN）。
