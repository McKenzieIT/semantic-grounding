table_name: dws_10000251_role_play_active_di_v3
engine: maxcompute
table_comment: 角色上手进循环(pbt3版)
description: |-
  角色上手进循环(pbt3版)。DWS 角色粒度日增量表(_di)，记录角色当日各玩法系统的积极度与循环进阶状态。
  粒度：角色×日（明细行）。分析主体=角色（user_type=3，按表名 role 推断；表内无 user_type 列，未经实测确认）。
  覆盖玩法：主线(zhuxian)、装备塔(equip)、无尽塔(wujinta)、虎牢线(hulaoguan)、奇策(qice)、演武(yanwu)、竞技场(jingji)、小队(social)、娱乐城(xiyu)、基础/进阶循环(loop)。积极度 STRING 字段为分档枚举，BIGINT 字段为可聚合数值。
  注：MAX(ds) 为 NULL，当前表为空，下列指标为结构性定义，未经实测验证。
domains:
  - 角色成长
  - 战斗关卡
granularity: 角色×日增量(_di)；分析主体=角色(user_type=3，按表名推断)
