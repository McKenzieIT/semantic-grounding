metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 当日活跃角色数（增量口径，按 role_id 去重）
  account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 当日活跃账号数（增量口径，按 account_id 去重）
  total_wujinta_active:
    expression: SUM(wujinta_active)
    description: 当日无尽塔积极度总分
  total_yanwu_active:
    expression: SUM(yanwu_active)
    description: 当日演武积极度日版总分
  avg_jingji_active:
    expression: SUM(jingji_active) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 当日人均竞技场积极度（按活跃角色均摊）
coverage:
  scenarios:
    - 当日各玩法系统（主线/装备塔/无尽塔/虎牢/奇策/演武/竞技场/小队/娱乐城/循环）的角色活跃分布与积极度统计
    - 角色上手循环进阶情况（基础循环1-1/1-2、进阶循环2-1/2-2 达成分档占比）
    - 账号 vs 角色层级当日活跃对比（account_uv / role_uv 比值）
  limitations:
    - 表为空/无数据（MAX(ds) 为 NULL），无法做任何实测验证；指标均为结构性定义，待数据入库后复核
    - 仅抽样验证未执行（无数据可查）；user_type 列不存在，主体=角色(user_type=3)为按表名推断，未经实测确认
    - _di 为日增量口径，跨日累加需注意；days/regdate 为角色生命周期维度，同一角色跨 ds 会重复出现
    - 积极度 STRING 字段（zhuxian_active_*/equip_active/loop_*/xiyu*）为分档枚举，非可聚合数值，须配合 COUNT/GROUP BY 使用
