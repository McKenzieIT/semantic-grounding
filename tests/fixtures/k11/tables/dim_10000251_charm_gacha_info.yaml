coverage:
  scenarios:
  - 事实表（如抽卡流水）通过 card_pool_id 关联查询卡池名称、消耗、保底、掉落库等维度属性
  - 按卡池组（group）聚合统计卡池数量与配置差异
  - 卡池展示与解锁配置（display_weight / is_show / node_name / banner_name）查询
  limitations:
  - 配置类维度表，无值度量（金额/次数等数值度量不在本表）
  - cost / back / up_gacha_cost 等为编码串（如 "3_1010_1|3_1009_1"），需二次解码资源ID与数量
  - drop_desc / function_id 等为外键编码，需关联对应配置表二次解析
  - 未对运行时数据做唯一性实测（基于卡池配置表的天然唯一性，meta 样例与计数 r=d=6 一致）
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: "2026-07-31"
  note: 灵器抽卡卡池配置维度表；primary_key=card_pool_id（计数 r=d=6 实测唯一）；label=card_pool_name+directions；status=draft 待业务确认
