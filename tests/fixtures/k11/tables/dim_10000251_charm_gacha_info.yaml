table_name: dim_10000251_charm_gacha_info
engine: maxcompute
kind: dim
primary_key:
- card_pool_id
primary_key_unique: true
label_columns:
- card_pool_name
- directions
table_comment: 灵器抽卡卡池配置维度表（每卡池一行，含消耗/保底/掉落/展示等配置）
description: '灵器（charm）抽卡卡池的配置维度表。每行对应一个卡池（card_pool_id），存储卡池名称、消耗、保底、掉落库、UP/新手集市、展示资源等静态配置属性，供事实表通过 card_pool_id 关联查询卡池维度信息。

  粒度：每卡池（card_pool_id）一行的配置维度表。

  主要字段：card_pool_id, card_pool_name, directions, group, cost, gacha_drop_id, gacha_guarantee_group, gacha_grade_guarantee, up_gacha_reward/cost, new_gacha_reward/cost 等28列。'
domains:
- 探索收集
granularity: 每 card_pool_id（卡池）一行的配置维度表
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数（卡池数）
columns:
- name: card_pool_id
  type: string
  comment: 卡池ID
  role: dimension
- name: directions
  type: string
  comment: 卡池备注
  role: dimension
- name: card_pool_name
  type: string
  comment: 卡池名称
  role: dimension
- name: group
  type: string
  comment: 卡池组
  role: dimension
- name: back
  type: string
  comment: 抽1次返还
  role: dimension
- name: function_id
  type: string
  comment: 解锁规则
  role: dimension
- name: cost
  type: string
  comment: 单抽消耗
  role: dimension
- name: gacha_multi_num
  type: string
  comment: 默认多抽次数
  role: dimension
- name: gacha_limit_award
  type: string
  comment: 限制出货次数
  role: dimension
- name: gacha_drop_id
  type: string
  comment: 卡池掉落库
  role: dimension
- name: gacha_guarantee_group
  type: string
  comment: 卡池保底组
  role: dimension
- name: gacha_grade_guarantee
  type: string
  comment: 次数保底
  role: dimension
- name: max_num_limit
  type: string
  comment: 限制抽卡次数
  role: dimension
- name: up_gacha_reward
  type: string
  comment: up池购买资源
  role: dimension
- name: up_gacha_cost_max
  type: string
  comment: up池购买次数上限
  role: dimension
- name: up_gacha_cost
  type: string
  comment: up池购买资源消耗
  role: dimension
- name: new_gacha_reward
  type: string
  comment: 新手集市购买资源
  role: dimension
- name: new_gacha_cost_max
  type: string
  comment: 新手集市购买次数上限
  role: dimension
- name: new_gacha_cost
  type: string
  comment: 新手集市购买资源消耗
  role: dimension
- name: display_weight
  type: string
