table_name: dim_10000251_charm_info_arch
engine: maxcompute
table_comment: '灵器配置维度表（按日归档快照）：灵器id/名称/品质/碎片/各星战斗技与助战技id/升星模板/图鉴属性/攻击力系数。每日全量快照，按 ds 分区。'
description: '灵器（charm）配置维度表，按日归档快照。每行描述一个灵器在某日的配置：唯一标识为 charm_id+ds；可读标签为 charm_name。包含品质色 quality、对应碎片 fragment_id、1-5星战斗技 active_skill_id_1..5、1-5星助战技 passive_skill_id_1..5、升星模板 starup_model、图鉴属性 own_attribute、攻击力系数千分比 atk、资源id res。用于按灵器维度JOIN事实表做品质/技能/属性切片与图鉴分析。'
domains:
- 装备道具
granularity: 每个（灵器id, 日期分区）一行的归档快照维度表
primary_key:
- charm_id
- ds
primary_key_unique: true
label_columns:
- charm_name
metrics:
  row_count:
    expression: COUNT(*)
    description: 灵器配置快照总行数
