kind: dim
coverage:
  scenarios:
  - 按灵器id JOIN事实表，按品质色 quality 切片统计各品质灵器分布与战力贡献
  - 按 charm_id 取当日最新配置，分析灵器1-5星战斗技/助战技id所指向技能的搭配
  - 按图鉴属性 own_attribute 与升星模板 starup_model 做图鉴收集进度与升星路径分析
  - 按碎片 fragment_id 关联碎片掉落事实，评估灵器获取路径
  limitations:
  - 配置类维度表，无值度量（atk 为系数千分比字符串，非可直接聚合的数值度量）
  - 多个字段为编码id串（active_skill_id_*、passive_skill_id_*、fragment_id、res），需二次解码关联对应技能/碎片/资源维度表
  - 按日全量归档快照，跨日分析时需显式指定 ds 分区以避免重复
