table_name: dws_10000251_progression_toy_di
engine: maxcompute
table_comment: 幻谷培养详情日表
description: |-
  幻谷培养详情日表，记录角色对幻谷（toy）的培养行为明细。
  主题对象：角色（role）。
  粒度：日增量(_di)，每行一个角色-幻谷当日培养记录。
  主要字段：role_id, server_id, toy_id, toy_star, act_tm_fst, act_tm_lst, ds。
domains:
  - 角色成长
granularity: 日增量(_di)，角色粒度
columns:
  - name: role_id
    type: string
    comment: 角色id
    role: dimension
  - name: server_id
    type: string
    comment: 服务器id
    role: dimension
  - name: toy_id
    type: bigint
    comment: 幻谷ID
    role: dimension
  - name: toy_star
    type: bigint
    comment: 幻谷星级
    role: measure
  - name: act_tm_fst
    type: datetime
    comment: 首次培养时间
    role: dimension
  - name: act_tm_lst
    type: datetime
    comment: 最近一次培养时间
    role: dimension
  - name: ds
    type: string
    comment: 分区
    role: partition
metrics:
  cultivate_uv:
    expression: COUNT(DISTINCT role_id)
    description: 当日有培养行为的角色数（UV）。
  cultivate_cnt:
    expression: COUNT(*)
    description: 当日幻谷培养行为总次数（明细行数）。
  cultivate_toy_kinds:
    expression: COUNT(DISTINCT toy_id)
    description: 当日被培养的幻谷种类数。
  avg_toy_star:
    expression: AVG(toy_star)
    description: 当日培养记录的平均幻谷星级。
  per_role_cultivate_cnt:
    expression: COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均当日培养次数（总次数/培养角色UV）。
coverage:
  scenarios:
    - 每日参与幻谷培养的角色规模与活跃度（cultivate_uv、per_role_cultivate_cnt）。
    - 幻谷培养行为的总量与覆盖的幻谷种类（cultivate_cnt、cultivate_toy_kinds）。
    - 培养产出的幻谷星级水平（avg_toy_star）。
  limitations:
    - 仅对最新分区(ds=20260730)做抽样验证（uv=291,cnt=814,avg_star=1.31,toy_kinds=177），未做全量 maxc 实测复核。
    - 粒度为日增量(_di)，仅含当日发生培养的角色-幻谷记录，不含全量角色快照，不可直接用于留存/总角色数口径。
    - 缺少渠道/账号维度，仅角色与服务器(server_id)可分组。
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已对最新分区(20260730)抽样验证 4 项核心指标，数值合理；status=analyst_confirmed。
dimension_refs:
  - dim_table: dim_10000251_toy_info
    join_keys:
      - dws_column: toy_id
        dim_column: toy_id
    derivation: DWS column toy_id (comment 幻谷ID; table tracks 幻谷(toy) cultivation per role) is an exact-name foreign key to dim_10000251_toy_info primary key toy_id, the 遗物(toy)配置维度表 with one row per toy.
    origin: deterministic
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS column server_id (comment 服务器id) is an exact-name foreign key to dim_10000251_server_info primary key server_id, the 区服维度配置表.
    origin: deterministic
pref_label: 幻谷培养日表
alt_labels:
  - 幻谷
  - 培养
  - 玩具
