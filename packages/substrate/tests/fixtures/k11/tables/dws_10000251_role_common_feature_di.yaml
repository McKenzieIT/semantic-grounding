table_name: dws_10000251_role_common_feature_di
engine: maxcompute
table_comment: ""
description: |
  角色通用特征日增量表,记录每个角色在每日的通用属性与状态快照,涵盖角色基础信息(等级/名称/战力/VIP)、
  各类货币余额(coinlist_*、diamond)、公会归属与公会信息、赛季/联赛阶段、在线时长、注册时间等。
  粒度:日增量(di),每角色每天一行,记录当日角色通用特征快照。
  主体类型:表名含"role"且存在 role_id 字段 → 【角色表】,分析主体=角色,标识字段=role_id,账号标识字段=ejoyid,分区字段=ds。
  能回答的业务问题(配合指标字典 metrics 可直接计算的常用度量):
  - 角色货币余额分布(金币/钻石/券/能量/债/友情点等)及付费货币沉淀情况;
  - 角色战力(roleforce)、等级(rolelevel)、VIP 等级分布与分层;
  - 角色所属公会(guildid/guildname)、公会等级/战力/会长;
  - 角色赛季/联赛阶段(season/league/seasonactstage)进度分布;
  - 角色在线时长、注册时间分布,判断新老与活跃度;
  - 服务器/区服(server_id/serverzone/serialid)维度的角色特征对比。
  注意事项:
  - 所有列存储类型为 string,但 coinlist_*、diamond、roleforce、guildlv、guildpower、membercount、onlinetime、rolelevel、viplevel 等语义为数值,聚合前需 CAST 转换(CAST 失败可能抛错,生产使用前需确保源数据可数值解析或 ETL 侧清洗);
  - coinlist_* 为余额快照(当日结余),非流水增减,不可直接累加为发生额;余额类指标聚合的是当日结余快照,付费货币沉淀需配 AVG/SUM 而非发生额;
  - ejoyid 为账号标识,可用于角色到账号的归并;
  - guildidold 为历史公会ID,用于分析公会变动;
  - 本表为 di 增量,仅含当日有变更/活跃的角色,跨日累计需按 role_id 去重,总量类指标(如 diamond_total)仅覆盖当日有快照角色,非全量角色池。
domains:
  - 角色成长
  - 社交公会
  - 付费经济
granularity: 日增量(di),每角色每天一行,记录当日角色通用特征快照;分析主体=角色(【角色表】),标识字段=role_id,账号标识字段=ejoyid,分区键=ds
