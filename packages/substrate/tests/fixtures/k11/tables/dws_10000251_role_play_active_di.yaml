metrics:
  daily_active_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 日活角色数（按 role_id 去重），衡量当日参与上手/循环玩法的活跃角色规模
  zhuxian_active_sum:
    expression: SUM(zhuxian_active)
    description: 当日主线积极度总量，反映主线玩法参与度
  tuiguanjingsu_sum:
    expression: SUM(tuiguanjingsu)
    description: 当日推关竞速参与总量，衡量关卡推进活跃度
  loop_total:
    expression: SUM(loop1) + SUM(loop2) + SUM(loop3) + SUM(loop4) + SUM(loop5)
    description: 当日基础/进阶循环参与总量合计，衡量核心循环活跃度
  step_reached_uv:
    expression: COUNT(DISTINCT CASE WHEN step > 0 THEN role_id END)
    description: 当日达成上手最终阶段的角色数（去重），衡量上手转化规模
coverage:
  scenarios:
    - 日常监控角色上手与基础/进阶循环的活跃度（角色粒度日增量）
    - 评估主线/推关/解谜等关卡向玩法的日参与规模与转化
  limitations:
    - 表为空/无数据（SELECT MAX(ds) 返回 NULL），无法进行实际数据校验，metrics 为结构性定义
    - 无 user_type 列，分析主体=角色（user_type=3）由表名 role_play 推断，未做数据值复核
    - 仅 scout 抽样验证，未做全量 maxc 实测复核；表有数据后需重新校验各 metric 列非空与合理性
    - _di 日增量语义：daily_active_role_uv/loop_total 等为当日增量聚合，非累计快照
confirmation:
