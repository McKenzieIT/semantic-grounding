table_name: dws_10000251_role_play_active_di
engine: maxcompute
table_comment: 角色上手进循环
description: |-
  角色上手进循环。
  粒度：日增量(_di)。分析主体=角色（user_type=3）。
  主要字段：account_id, role_id, role_name, server_id, zhuxian_active, wujinta_active, zhuxian_active2, wujinta_active2 等38列。
