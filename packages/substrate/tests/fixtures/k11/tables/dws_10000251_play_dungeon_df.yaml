table_name: dws_10000251_play_dungeon_df
engine: maxcompute
table_comment: 玩法通关表
description: |-
  玩法通关表（角色维度，dws 日全量快照 _df）。
  粒度：角色(role_id) x 玩法(play_func_id) x 章节关卡(chapter_id/stage_id) x 日全量快照(_df)； 主体为角色(role_id)，无账户/设备维度。
  主要字段：role_id, server_id, play_func_id, chapter_id, stage_id, pass_status, part_pv_std, unpass_part_pv 等38列。
domains:
  - 战斗关卡
granularity: 日全量快照(_df)
columns:
  - name: role_id
    type: string
    comment: 角色id
    role: dimension
  - name: server_id
    type: string
    comment: 区服id
    role: dimension
  - name: play_func_id
    type: string
    comment: 玩法功能id
    role: dimension
  - name: chapter_id
    type: string
    comment: 章节id，无需用章节id区分关卡的玩法为0
    role: dimension
  - name: stage_id
    type: string
    comment: 关卡id，key，0表示ds活跃但未参与
    role: dimension
  - name: pass_status
    type: bigint
    comment: 通关状态，1表示通关，0表示未通关
    role: dimension
  - name: part_pv_std
    type: bigint
    comment: 累计参与次数
    role: measure
  - name: unpass_part_pv
    type: bigint
    comment: 通关前参与次数
    role: measure
  - name: star1_status
    type: bigint
    comment: 星级1达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: star2_status
    type: bigint
    comment: 星级2达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: star3_status
    type: bigint
    comment: 星级3达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: goal1_status
    type: bigint
    comment: 成就1达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: goal2_status
    type: bigint
    comment: 成就2达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: goal3_status
    type: bigint
    comment: 成就3达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: full_stars_status
    type: bigint
    comment: 满星达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: full_goals_status
    type: bigint
    comment: 满成就达成状态，0-未达成 1-达成 2-首通即达成
    role: dimension
  - name: pass_tm
    type: datetime
    comment: 首通时间，9999-12-31 23:59:59为缺省值
    role: dimension
  - name: pass_pv
    type: bigint
    comment: 首通参与次数
    role: measure
  - name: pass_battle_id
    type: string
    comment: 首通战斗id
    role: dimension
  - name: pass_rounds
    type: bigint
    comment: 首通回合数
    role: measure
  - name: pass_role_level
    type: bigint
    comment: 首通等级
    role: dimension
  - name: pass_card_list
    type: string
    comment: 首通卡牌列表
    role: dimension
  - name: pass_lineup
    type: string
    comment: 首通阵容
    role: dimension
  - name: pass_lineup_level
    type: bigint
    comment: 首通阵容等级
    role: dimension
  - name: pass_lineup_force
    type: bigint
    comment: 首通阵容战力
    role: measure
  - name: full_stars_part_pv
    type: bigint
    comment: 首满星参与次数
    role: measure
  - name: full_stars_tm
    type: string
    comment: 首满星时间
    role: dimension
  - name: full_stars_card_list
    type: string
    comment: 首满星卡牌列表
    role: dimension
  - name: full_stars_lineup
    type: string
    comment: 首满星阵容
    role: dimension
  - name: full_stars_lineup_level
    type: bigint
    comment: 首满星阵容等级
    role: dimension
  - name: full_stars_lineup_force
    type: bigint
    comment: 首满星阵容战力
    role: measure
  - name: full_goals_part_pv
    type: bigint
    comment: 首满成就参与次数
    role: measure
  - name: full_goals_tm
    type: string
    comment: 首满成就时间
    role: dimension
  - name: full_goals_card_list
    type: string
    comment: 首满成就卡牌列表
    role: dimension
  - name: full_goals_lineup
    type: string
    comment: 首满成就阵容
    role: dimension
  - name: full_goals_lineup_level
    type: bigint
    comment: 首满成就阵容等级
    role: dimension
  - name: full_goals_lineup_force
    type: bigint
    comment: 首满星阵容战力
    role: measure
  - name: ds
    type: string
    comment: 业务日期
    role: partition
metrics:
  play_dungeon_uv:
    expression: COUNT(DISTINCT role_id)
    description: 玩法参与角色数（角色粒度 UV，_df 快照去重 role_id）
  pass_dungeon_uv:
    expression: COUNT(DISTINCT CASE WHEN pass_status = 1 THEN role_id END)
    description: 通关角色数（pass_status=1 的角色去重数）
  pass_rate:
    expression: SUM(CASE WHEN pass_status = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 通关率（通关记录数 / 参与角色去重数）
  total_pass_records:
    expression: SUM(CASE WHEN pass_status = 1 THEN 1 ELSE 0 END)
    description: 通关记录数（角色x关卡粒度的通关条目数）
  avg_pass_rounds:
    expression: AVG(pass_rounds)
    description: 首通平均回合数（仅通关记录）
coverage:
  scenarios:
    - 玩法/关卡参与度与通关率分析（角色维度 UV、通关率，可按 server_id/play_func_id/chapter_id/stage_id 下钻）
    - 首通效率与首满星/满成就达成情况（pass_rounds、full_stars_status、full_goals_status）
  limitations:
    - 表为空/无数据(MAX(ds) NULL)，无法做实测复核，指标表达式为结构化定义。
    - _df 日全量快照语义；同角色跨关卡多记录，UV 去重以 role_id 计。
    - 缺少账户/设备维度，仅角色粒度；无 user_type 列，主体按表名(role_id)推断为角色。
    - 仅抽样/结构化定义，未做全量 maxc 实测复核。
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空(MAX(ds) NULL)，未做指标实测复核，仅结构化指标定义。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS server_id (区服id) exactly matches dim_10000251_server_info primary key server_id (区服维度配置表)，用于按区服切片玩法通关分析。
    origin: deterministic
  - dim_table: dim_10000251_trans_stage_df
    join_keys:
      - dws_column: stage_id
        dim_column: id
    derivation: DWS stage_id (关卡id) semantically matches dim_10000251_trans_stage_df primary key id (关卡配置维度表，主键 id=关卡id，供事实表按 id 关联做关卡维度查找)。
pref_label: 副本通关表
alt_labels:
  - 地牢
  - 玩法
