table_name: dws_10000251_univ_role_act_mi
engine: maxcompute
table_comment: DWS-角色月增量活跃表：按月统计角色的活跃、新增、付费与角色行为标记（user_type=3）
description: |-
  粒度：月增量(_mi)。分析主体=角色（user_type=3）。
  主要字段：user_type, user_id, act_dur, pay_amt, act, act_fst, pay, pay_fst 等21列。
domains:
  - 用户生命周期
  - 付费经济
granularity: 月增量(_mi)，分析主体=角色（user_type=3），每行=单个角色一个月的活跃/付费汇总
columns:
  - name: user_type
    type: int
    comment: 用户类型，取值：1:设备/2:账号/3:角色
    role: dimension
  - name: user_id
    type: string
    comment: 用户id
    role: dimension
  - name: act_dur
    type: int
    comment: 月累计活跃时长，单位：秒
    role: measure
  - name: pay_amt
    type: decimal
    comment: 月累计付费金额，单位：元
    role: measure
  - name: act
    type: int
    comment: 月活跃标记，1-活跃、0-非活跃
    role: dimension
  - name: act_fst
    type: int
    comment: 月新增标记，新增即首次活跃，1-新增、0-非新增
    role: dimension
  - name: pay
    type: int
    comment: 月付费标记，1-付费、0-非付费
    role: dimension
  - name: pay_fst
    type: int
    comment: 月首次付费标记，1-首次付费、0-非首次付费
    role: dimension
  - name: act_pv
    type: int
    comment: 月累计活跃次数，用“角色登录”事件计算，每登录1次算1次活跃
    role: measure
  - name: role_act
    type: int
    comment: 当月有角色行为标记，1-是、0-否
    role: dimension
  - name: role_act_fst
    type: int
    comment: 当月首次有角色行为标记，1-是、0-否
    role: dimension
  - name: act_ds_fst
    type: string
    comment: 月首次活跃日期
    role: dimension
  - name: act_ds_lst
    type: string
    comment: 月最后活跃日期
    role: dimension
  - name: act_ds_cnt
    type: int
    comment: 月活跃天数
    role: measure
  - name: pay_ds_cnt
    type: int
    comment: 月付费天数
    role: measure
  - name: role_act_ds_cnt
    type: int
    comment: 当月有角色行为天数
    role: measure
  - name: act_last_period
    type: int
    comment: 上一时间周期活跃标记，1-活跃、0-非活跃
    role: dimension
  - name: pay_last_period
    type: int
    comment: 上一时间周期付费标记，1-是、0-否
    role: dimension
  - name: act_next_period
    type: int
    comment: 下一时间周期活跃标记，1-活跃、0-非活跃
    role: dimension
  - name: pay_next_period
    type: int
    comment: 下一时间周期付费标记，1-是、0-否
    role: dimension
  - name: ds
    type: string
    comment: 分区字段-月初
    role: partition
metrics:
  role_mau:
    expression: COUNT(DISTINCT user_id)
    description: 角色月活数（当月有活跃标记的角色 UV），主体=角色（user_type=3）
  role_new_uv:
    expression: SUM(CASE WHEN act_fst = 1 THEN 1 ELSE 0 END)
    description: 角色月新增 UV（act_fst=1，当月首次活跃的新增角色数）
  role_pay_uv:
    expression: SUM(CASE WHEN pay = 1 THEN 1 ELSE 0 END)
    description: 角色月付费 UV（pay=1，当月有付费行为的角色数）
  role_pay_amt_total:
    expression: SUM(pay_amt)
    description: 角色月累计付费金额（元），pay_amt 求和
  role_pay_rate:
    expression: SUM(CASE WHEN pay = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(DISTINCT user_id), 0)
    description: 角色月付费率 = 月付费 UV / 月活 UV
coverage:
  scenarios:
    - 角色月度活跃规模（MAU/新增 UV），用于用户生命周期月报与留存大盘
    - 角色月付费转化与金额（付费 UV、付费金额、付费率），用于付费经济月度复盘
    - 月活/付费的上下周期标记（act_last_period/act_next_period/pay_last_period/pay_next_period）可做月度留存与流失/回流分析
  limitations:
    - 仅对 ds=20260701 做了抽样验证（act_uv=28002、new_uv=18364、pay_uv=3732、pay_amt_total=858434、avg_act_days=4.64），未做全量 maxc 实测复核；其他分区值未逐一校验
    - _mi 为月增量，每行=单角色单月汇总，跨月分析需对多月分区分别聚合，不可直接累加 act_dur/act_pv 等量纲字段而不区分月份
    - act/pay 等为 0/1 标记位，作为 dimension 使用时用于分组筛选；聚合时需用 SUM(CASE WHEN ...=1) 转为计数
    - act_ds_fst/act_ds_lst 为日期字符串，粒度到日但非时间戳，时间序列趋势需配合 ds 分区使用
    - 未覆盖账号/设备主体（user_type 仅=3 角色一行一类），跨主体口径需联表 ods/dwd 层，本表不做 JOIN
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
dimension_refs: []
pref_label: 角色月活跃表
alt_labels:
  - 月增量
