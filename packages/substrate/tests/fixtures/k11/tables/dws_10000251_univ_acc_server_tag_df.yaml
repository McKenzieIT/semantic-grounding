table_name: dws_10000251_univ_acc_server_tag_df
engine: maxcompute
table_comment: ""
description: |
  业务含义:这张表是统一账号-区服粒度的用户标签日全量快照表(_df),按"账号 user_id × 区服 server_id × 统计日 ds"组织,每个账号在每个区服每天产出一行累计标签与度量。表名含 acc 且存在 user_id,因此判定为【账号表】,分析主体=账号,标识字段=user_id(存账号ID);区服 server_id 为次级维度。本表固定为 user_type=2 的【账号表】,user_id 列实际存储的是账号ID,不存在"按 user_type 切换设备/账号/角色层级"的多粒度分支;DISTINCT user_type 仅返回单一值 2(建议用 SELECT DISTINCT user_type 复核)。
  记录内容:账号在某区服下的累计活跃情况(首次/最近活跃时间、累计活跃天数、累计活跃时长、上次活跃日期与间隔)、累计付费情况(首次/最近付费时间、累计付费金额、新增当日付费、首付当日付费)、关联主体信息(首次/最近关联的设备/账号/角色 id 与时间、首次关联角色区服)、设备与环境信息(设备品牌型号、活跃 IP、地理位置、地区)、买量归因(买量标识、买量媒体)、内部用户标记(fellow_flag)、角色等级。
  能回答的业务问题:某账号在某区服的累计活跃天数/时长、累计付费金额、首次/最近活跃与付费时间;账号在多区服间的活跃与付费分布;新增当日 vs 首付当日的付费金额对比;账号关联的设备/角色变迁链路(首次 vs 最近);买量带来的账号活跃与付费质量;内部账号识别;账号活跃间隔与流失判断;按地区/平台/渠道/设备品牌/媒体拆解账号质量。
  注意事项:(1)本表为日全量快照,查询时务必带 ds 分区过滤到具体统计日;(2)本表固定 user_type=2 账号口径,user_id 即账号ID,无需也不能按 user_type 切换层级;若确需设备/角色口径应改用对应的 univ_dev/univ_role 表;(3)累计类指标(act_days_std/act_dur_std/pay_amt_std)为截至 ds 的累计值,不可跨 ds 直接相加;(4)act_ymd_diff 反映最近两次活跃间隔,可用于流失/回流判定但并非留存率;(5)role_level 为该账号在某区服下的角色等级快照,跨区服不可比;(6)fellow_flag=1 为内部测试账号,做真实玩家分析时建议排除;(7)原表中 pay_amt_std 列名重复出现(bigint 与 double 各一行),聚合该列时需以数仓确认为准,避免口径歧义。
domains:
  - 用户生命周期
  - 付费经济
  - 系统监控
granularity: 日全量快照(_df),每个账号 user_id 在每个区服 server_id 每个统计日 ds 一行;本表固定为 user_type=2 的【账号表】,分析主体=账号,标识字段=user_id(存账号ID),次级维度 server_id;DISTINCT user_type 仅返回单一值 2(建议用 SELECT DISTINCT user_type 复核),不存在按 user_type 切换设备/账号/角色层级的多粒度分支。
