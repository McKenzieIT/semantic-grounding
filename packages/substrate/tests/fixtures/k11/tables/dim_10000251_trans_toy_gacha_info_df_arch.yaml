table_name: dim_10000251_trans_toy_gacha_info_df_arch
engine: maxcompute
table_comment: '卡池配置维度表（按日归档）：每行对应某 ds 快照下的一个卡池配置，主键 (id, ds)'
kind: dim
primary_key:
- id
- ds
primary_key_unique: true
label_columns:
- name
description: '卡池（抽卡池）配置维度表，按日归档（df_arch）。每行对应某 ds 快照下的一个卡池配置记录，包含卡池ID、名称、所属组、解锁规则、消耗、掉落与保底规则、开放/关闭时间、概率说明等属性。主键 (id, ds) 经实测唯一（r=d=7390）。用于事实表（如抽卡流水）按卡池维度查找配置属性。'
domains:
- 探索收集
granularity: '每 (卡池ID, ds 快照) 一行的卡池配置维度表'
columns:
- name: id
  type: string
  comment: 卡池ID
  role: dimension
- name: directions
  type: string
  comment: 卡池备注
  role: dimension
- name: name
  type: string
  comment: 卡池名称
  role: dimension
- name: group_name
  type: string
  comment: 卡池组名称
  role: dimension
- name: group_bg
  type: string
  comment: 卡池组背景
  role: dimension
- name: group
  type: string
  comment: 卡池组
  role: dimension
- name: exchange_id
