coverage:
  scenarios:
  - '作为卡池维度表，供抽卡流水事实表（dws/dwd 层）按 (id, ds) JOIN 查找卡池名称、组别、类型、消耗、掉落/保底规则、开放关闭时间、概率说明等配置属性'
  - '支持按卡池类型(gacha_type)/卡池组(group)聚合统计'
  limitations:
  - '配置类维度表，无值度量（所有字段为 STRING 配置/编码串）'
  - '多个字段为复合编码串（如 cost=3_90002_1|3_90001_1、gacha_star_drop_id=600001_600002_...、gacha_star_weight=170_709_...、guarantee_maxmum=10_3_600001|...），需二次解码才能用于细粒度分析'
  - 'id 单列在跨 ds 快照下不唯一（30 个卡池 × 多日快照），主键为 (id, ds) 复合键；已实测唯一'
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数（跨 ds 快照）
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: '2026-07-31'
  note: '初版 dim 建模：主键 (id, ds) 经实测唯一（r=d=7390）；label=name；配置类维度表，无值度量；复合编码字段需二次解码。保持 draft 待业务确认。'
