  comment: 单抽消耗
  role: dimension
- name: gacha_multi_num
  type: string
  comment: 默认多抽次数
  role: dimension
- name: cost_resource
  type: string
  comment: 单抽消耗资源数
  role: dimension
- name: gacha_star_drop_id
  type: string
  comment: 不同品质掉落编号
  role: dimension
- name: gacha_star_weight
  type: string
  comment: 不同品质掉落权重
