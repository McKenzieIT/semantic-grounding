coverage:
  scenarios:
  - 以 knight_id 关联事实表，按武将维度展开觉醒点位(order/level/stage/awaken_stage)配置属性
  - 以 knight_id+order+level 复合键精确查找某武将某觉醒节点的消耗(cost)/属性加成(attribute_value)/技能(skill_id)等配置
  - 按 ds 日期分区回溯某武将觉醒配置的历史快照演变
  - 按 stage/awaken_stage 聚合统计各觉醒阶段下武将节点数与资源消耗
  limitations:
  - 配置类维度表，无值度量；talent_num/cost 等为编码串，需二次解码后方可用于度量
  - cost 与 attribute_value 为复合编码串（如 3_50101_12|1_3_1000），不能直接 SUM/AVG，须拆解后取明细
  - primary_key_unique=false：复合键 (knight_id, order, level) 在单 ds 分区内唯一，跨全表多分区不唯一（历史归档快照）
  - knight_name/name 为配置展示名，无业务唯一性校验
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: '2026-07-31'
  note: '自动建模：基于 meta describe 与单分区唯一性实测推断复合键 (knight_id, order, level) 为单分区自然唯一键；跨全表多 ds 快照不唯一，故 primary_key_unique=false 且保持 draft 未做分析师确认。'
