metrics:
  role_cnt:
    expression: COUNT(DISTINCT role_id)
    description: 角色总数(在库角色全量快照口径,含当日未登录的离线角色)
  avg_rolelevel:
    expression: AVG(CAST(rolelevel AS BIGINT))
    description: 角色平均等级
  max_rolelevel:
    expression: MAX(CAST(rolelevel AS BIGINT))
    description: 最高角色等级
  rolelevel_tier_low_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(rolelevel AS BIGINT) BETWEEN 1 AND 30 THEN role_id END)
    description: 低等级(1-30)角色数,用于等级分层分布
  rolelevel_tier_mid_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(rolelevel AS BIGINT) BETWEEN 31 AND 60 THEN role_id END)
    description: 中等等级(31-60)角色数
  rolelevel_tier_high_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(rolelevel AS BIGINT) BETWEEN 61 AND 90 THEN role_id END)
    description: 高等级(61-90)角色数
  rolelevel_tier_top_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(rolelevel AS BIGINT) >= 91 THEN role_id END)
    description: 顶级(91+)角色数
  avg_gold:
    expression: AVG(CAST(coinlist_gold AS BIGINT))
    description: 角色平均充值/主金币余额
  avg_freegold:
    expression: AVG(CAST(coinlist_freegold AS BIGINT))
    description: 角色平均免费金币余额(系统赠送部分)
  gold_positive_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(coinlist_gold AS BIGINT) > 0 THEN role_id END)
    description: 金币余额为正的角色数
  vip_high_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN CAST(viplevel AS BIGINT) >= 10 THEN role_id END)
    description: 高VIP(>=10)角色数,高净值付费用户规模
  avg_viplevel:
    expression: AVG(CAST(viplevel AS BIGINT))
    description: 角色平均VIP等级
  guild_member_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN guildid IS NOT NULL AND guildid <> '' THEN role_id END)
    description: 有公会归属的角色数
  no_guild_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN guildid IS NULL OR guildid = '' THEN role_id END)
    description: 无公会(散人)角色数
  guild_cnt:
    expression: COUNT(DISTINCT CASE WHEN guildid IS NOT NULL AND guildid <> '' THEN guildid END)
    description: 公会数(去重 guildid,排除空字符串/NULL的无公会标识,避免虚高)
  avg_guildpower:
    expression: AVG(CAST(guildpower AS BIGINT))
    description: 角色所在公会平均战力(角色视角均值)
  avg_guildlv:
    expression: AVG(CAST(guildlv AS BIGINT))
    description: 角色所在公会平均等级
disambiguation:
  term_defaults:
    paying_users: 有 moneyType=1 真实充值（排除沙盒）的角色
coverage:
  scenarios:
    - 角色规模统计:在库角色总数、当日活跃角色数(DAU)、DAU占在库比例
    - 角色等级分布与分层:平均/最高等级,1-30/31-60/61-90/91+各档角色数,成长阶段分布
    - 角色战力分布:平均战力、最高战力、战力天花板
    - 角色资产余额分布:金币/钻石/优惠券/免费金币/通用金币等余额均值与持有正余额角色数
    - 付费潜力分层:VIP等级分布、高VIP(>=10)角色数、持有钻石/金币角色占比(近似付费潜力,非真实付费率)
    - 公会构成分析:有/无公会角色数、公会数、公会平均成员数、公会平均战力/等级
    - 公会变动识别:当日跳槽/换会角色数(guildidold与guildid不同)
    - 公会会长识别:通过guildpresident识别会长身份
    - 阵营分布:各阵营角色数与占比(按faction维度GROUP BY)
    - 联赛/段位分布:各段位角色数(按league维度GROUP BY)
    - 服务器/区服分布:各server_id/serverzone角色数与活跃
    - 在线时长分布:平均/最长在线时长,活跃度水位
    - 新老角色构成:通过regtime识别注册时间分布与账龄
  limitations:
    - 全量快照而非增量,资产字段为余额快照,不可跨日直接累加求"产出/消耗",需配合资产流水类事件表
    - 所有数值字段以string存储,度量计算需CAST为数值,存在空值/非法值导致CAST异常的风险
    - 当日离线角色仍保留最近状态,统计"当日活跃"必须用 onlinetime>0 过滤,否则会高估活跃
    - 本表无付费金额(pay_amt)字段,不能直接计算付费额/ARPU/付费率,需关联付费事件表;钻石/金币持有不等于付费,仅反映余额
    - 本表无留存(ret_dX)字段,不能直接计算留存率,需关联留存类宽表或登录事件表
    - 本表无登录事件明细,不能回答登录频次/登录设备切换等行为序列问题
    - 本表为状态快照,不能回答角色具体做了什么(行为序列),仅记录当日状态
    - 单日快照口径,跨日趋势分析需扫描多个ds分区
    - coinlist_* 系列币种含义依赖游戏内设定,单位与游戏内一致,跨币种不可直接相加
    - guild_cnt/guild_member_avg等为角色视角聚合,非公会去重视角,需按公会ID聚合才能得到真实公会级统计
    - onlinetime 字段实测为 Unix 时间戳(最后登录时间戳,值约1.7e9,非在线时长秒数);移植自10000312的 active_role_cnt/dau_role_ratio/avg_onlinetime/max_onlinetime 4个度量因语义错误已移除(2026-07-30 真实数据验证：avg_onlinetime≈1.75e9,max_onlinetime≈1.78e9,均为时间戳非时长);如需真实在线时长/DAU,需关联登录事件表
  coverage_status: draft
