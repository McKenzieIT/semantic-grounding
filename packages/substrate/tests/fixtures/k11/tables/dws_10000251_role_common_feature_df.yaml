table_name: dws_10000251_role_common_feature_df
engine: maxcompute
table_comment: ""
description: |
  角色通用特征日全量快照表(_df)。每个角色每天一行,记录角色在当日的资产、公会归属、阵营、战力、等级、VIP、在线时长等通用特征状态。
  主体类型判定:表名含 role → 【角色表】,分析主体=角色,标识字段=role_id。
  粒度:每角色每天一行 / 日全量快照(daily full),当日即使角色未登录也会保留其在库中的最新状态快照。
  能回答的业务问题:角色等级/战力分布与分层;角色各类金币、钻石、优惠券等资产余额分布;VIP 等级分层与付费潜力;公会成员构成与公会规模/等级;阵营分布;各服务器/区服角色数与活跃;角色在线时长分布;新老角色(注册时间)构成;公会会长识别;公会变动(跳槽/退出)识别;联赛/天梯段位分布。
  注意事项:1) 本表为全量快照而非增量,资产字段为余额快照不可跨日直接累加求"产出/消耗";2) 字段以 string 存储,计算度量时需 CAST 为数值;3) 离线角色当日仍保留最近状态,分析"当日活跃"需配合 onlinetime>0 或登录类事件表;4) guildid/guildidold 可用于公会变动分析;5) coinlist_* 系列均为对应币种的当前余额,单位与游戏内一致;6) 本表无付费金额、留存、登录明细等行为字段,付费额/留存率/登录频次需关联对应事件表。
domains:
  - 角色成长
  - 付费经济
  - 社交公会
granularity: 每个角色每天一行 / 日全量快照(daily full, _df)。分析主体=角色,标识字段=role_id。主体类型判定:表名含 role → 【角色表】。每条记录代表某角色在某业务日(ds)的完整状态快照,包含资产余额、公会归属、战力等级等。
