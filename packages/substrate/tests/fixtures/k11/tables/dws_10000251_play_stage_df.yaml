dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS server_id (comment 区服id) exactly matches the PK server_id of dim_10000251_server_info, the canonical 区服 dimension for server name/opening date lookup.
    origin: deterministic
  - dim_table: dim_10000251_trans_sub_play_od
    join_keys:
      - dws_column: sub_play_id
        dim_column: sub_play_id
    derivation: DWS sub_play_id (comment 子玩法id) exactly matches the PK sub_play_id of dim_10000251_trans_sub_play_od, the 子玩法配置 dimension keyed by sub_play_id.
    origin: deterministic
  - dim_table: dim_10000251_trans_stage_df
    join_keys:
      - dws_column: stage_id
        dim_column: id
    derivation: DWS stage_id (comment 关卡id) semantically matches the PK id (关卡id) of dim_10000251_trans_stage_df, the 关卡配置 dimension for stage lookup by id.
