table_name: dws_10000251_play_stage_df
engine: maxcompute
table_comment: 玩法通关表
description: 玩法通关表：角色维度的玩法/子玩法/关卡通关进度日全量快照(_df)。粒度：角色x区服x玩法x子玩法x关卡x业务日期。记录每个角色在每个关卡的通关状态、参与次数、首通阵容/战力/等级、成就达成情况等。角色(role)为业务主体(user_type=3 推断，表无 user_type 列)。注意：MAX(ds) 为 NULL，表当前为空/无数据。
domains:
  - 战斗关卡
  - 角色成长
granularity: 角色(role) x 区服 x 玩法 x 子玩法 x 关卡 x 业务日期(日全量快照 _df)
