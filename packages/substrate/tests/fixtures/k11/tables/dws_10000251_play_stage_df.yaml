metrics:
  pass_role_cnt:
    expression: COUNT(DISTINCT role_id)
    description: 通关快照内角色数(去重 role_id，日全量快照 _df)
  pass_record_cnt:
    expression: SUM(CASE WHEN pass_status = 1 THEN 1 ELSE 0 END)
    description: 通关记录数(pass_status=1 的角色x关卡记录数)
  part_pv_total:
    expression: SUM(part_pv)
    description: 总参与次数(全部角色x关卡 part_pv 求和)
  pass_rate:
    expression: SUM(CASE WHEN pass_status = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 通关率(通关记录数/总记录数，行级)
  goals_role_cnt:
    expression: COUNT(DISTINCT CASE WHEN goals_status = 1 THEN role_id END)
    description: 满成就角色数(goals_status=1 去重 role_id)
coverage:
  scenarios:
    - 按玩法/子玩法/关卡维度统计角色通关数与通关率，定位卡点关卡
    - 评估关卡参与规模(参与次数)与满成就达成角色数
    - 角色 x 关卡 首通战力/等级/阵容画像(基于 pass_lineup_force/pass_role_level 等)
  limitations:
    - 表当前为空：MAX(ds) 为 NULL，无数据可验证；以上指标为结构性定义，未做 maxc 实测复核
    - 业务主体 角色(role)及 user_type=3 依据 role_id 主键推断，表无 user_type 列，未抽样验证
    - 仅 scout/meta describe 验证列结构与角色，未做全量数据复核；_df 为日全量快照，跨日累计需按 ds 去重
    - pass_rate 为行级通关率(角色x关卡记录级)，非角色级通关率；角色多关卡存在重复 role_id
