metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV（当日快照去重角色数，_df 全量）
  role_force_sum:
    expression: SUM(role_force)
    description: 全服角色总战力
  role_force_avg:
    expression: AVG(NULLIF(role_force, 0))
    description: 全服角色平均战力
  pve_goals_std_sum:
    expression: SUM(goals_std)
    description: PVE 累计星数总和（当日快照）
  apvp_top1_cnt:
    expression: COUNT_IF(apvp_rank = 1)
    description: 异步PVP 排名第一角色数
coverage:
