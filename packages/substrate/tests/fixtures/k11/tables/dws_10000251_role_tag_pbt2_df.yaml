metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV（去重角色数），_df日全量快照口径
  active_role_uv_1w:
    expression: COUNT(DISTINCT CASE WHEN act_days_1w > 0 THEN role_id END)
    description: 近7日活跃角色UV
  total_pay_amt_std:
    expression: SUM(pay_amt_std)
    description: 累计付费金额合计
  avg_role_level:
    expression: AVG(role_level)
    description: 平均角色等级
  avg_role_force:
    expression: AVG(role_force)
    description: 平均角色战力
coverage:
  scenarios:
    - 角色规模与活跃度（角色UV、近7日活跃角色UV）回答角色盘子与近期留存
    - 付费能力（累计付费金额）回答角色付费盘子
    - 角色成长水平（平均等级、平均战力）回答角色养成进度
  limitations:
    - 表为空/无数据(MAX(ds) NULL)，所有指标为结构化定义未实测
    - 仅 scout 抽样验证，未做全量 maxc 实测复核
    - user_type=3 为按表名推断，空表未做 SELECT DISTINCT 验证
    - _df 日全量快照，跨日累计不去重；跨区服/渠道聚合需先按 server_id/ch_type 分组
    - 195列宽表，本版本仅覆盖5个核心指标，未覆盖关卡/PVP/抽卡/资源等子域
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空(MAX(ds) NULL)，无法跑数实测；指标为结构化定义，待有数据后复核
