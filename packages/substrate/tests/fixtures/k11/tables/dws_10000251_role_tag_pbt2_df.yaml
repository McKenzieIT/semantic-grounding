table_name: dws_10000251_role_tag_pbt2_df
engine: maxcompute
table_comment: pbt2角色宽表
description: |-
  pbt2角色宽表。
  粒度：日全量快照(_df)。分析主体=角色（user_type=3）。
  主要字段：account_id, role_id, server_id, os_id, ch_type, act_tm_fst, act_tm_lst, act_days_std 等195列。
domains:
  - 角色成长
  - 付费经济
granularity: 日全量快照(_df)，分析主体=角色（user_type=3）
