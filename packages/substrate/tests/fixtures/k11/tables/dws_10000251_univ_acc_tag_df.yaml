table_name: dws_10000251_univ_acc_tag_df
engine: maxcompute
table_comment: 用户整体事件表
description: |
  用户生命周期全量标签宽表(日全量快照 _df,按 ds 分区),每账号每天一行,记录每个账号在游戏全生命周期内的核心标签。
  按【主体类型判定规则】本表固定为【账号表】:表名含 acc,故分析主体=账号,标识字段=user_id(存账号ID);本表 user_type 固定为 2(账号),DISTINCT user_type 仅返回单一值 2(建议用 SELECT DISTINCT user_type 复核),不存在按 user_type 切换/过滤不同层级的分支语义。
  涵盖:首末活跃与付费时间、累计活跃天数/时长、多时间窗口付费金额(新增首N日 pay_amt_fNd / 最近N日 pay_amt_lNd / 累计 pay_amt_std)、设备与渠道归因链路(attr_ad_id 买量标识、attr_media_name 买量媒体、ch_id/ch_type 渠道)、区服与角色养成进度(role_level 等级/role_force 战力/role_career 职业)、首次与最近关联的设备/账号/角色关系链路、IP 与地理位置、内部用户/预下载/测试期等标记。
  能回答的业务问题:用户画像分群(渠道/平台/地区/设备品牌)、留存与流失预警(最近活跃间隔 act_ymd_diff、首末活跃时间)、付费转化漏斗(首付 pay_amt_p1d、新增首N日付费)、渠道 ROI 归因(买量标识与媒体)、用户价值分层与 LTV 评估(累计付费、多窗口付费金额)、角色养成进度分析(账号关联角色的等级/战力/职业分布)。
  注意事项:1) _df 为日全量快照,跨天聚合时需注意去重(按 user_id 取最新分区或按 ds 过滤);2) 付费窗口口径区分"新增首N日"(从新增日起算)与"最近N日"(从当前分区日起回溯),二者不可混用;3) event_pay_info 为大事件累计付费的 JSON 文本串,不可直接 SUM 聚合,需解析;4) role_level/role_force/role_career/form_role_id 为账号关联角色的养成快照(取自 form_role_id 对应角色),在账号粒度上为该账号最近关联角色的养成值,跨账号聚合前需理解其为"账号关联角色"口径而非账号自身数值;5) 累计类字段(std 后缀)为历史全量累计,非当日增量;6) 本表为快照宽表,留存/付费率等指标基于快照字段近似计算(如 act_ymd_diff 反映最近两次活跃间隔而非严格同队列留存),实时或事件级明细分析需回事件明细表。
domains:
  - 用户生命周期
  - 付费经济
granularity: 每账号每天一行(日全量快照 _df,按 ds 分区);本表固定为【账号表】user_type=2,分析主体=账号,标识字段=user_id(存账号ID);DISTINCT user_type 仅返回单一值 2(建议用 SELECT DISTINCT user_type 复核),不存在按 user_type 切换层级的分支
