table_name: dws_10000251_role_summary_base_df
engine: maxcompute
table_comment: 角色汇总基础日全量快照表。记录角色基础属性与累计/近7/近30天活跃及付费汇总指标。
description: 角色汇总基础日全量快照表(_df)。分析主体=角色(表名含 role,按命名约定 user_type=3),唯一标识 role_id。每角色每日一行,记录角色基础属性(区服/平台/IP地理/渠道/包名/端版本)、首次与最近活跃及付费时间/金额、累计与7日/30日窗口的活跃(天数/次数/时长)和付费(天数/次数/金额)汇总指标。粒度:日全量快照(_df),当日即使角色未登录也保留其在库最新状态快照。能回答的业务问题:角色规模与构成(区服/平台/渠道/IP地理);活跃层级(累计/近7/近30天活跃天数与时长);付费层级(累计/近7/近30天付费金额与次数、首日/首7/首30天付费);滚服角色识别;付费角色ARPU等。
domains:
  - 用户生命周期
  - 付费经济
granularity: 每角色每日一行 / 日全量快照(daily full, _df)。分析主体=角色(表名含 role,按命名约定 user_type=3),标识字段=role_id。当日即使角色未登录也保留其在库最新状态快照。
