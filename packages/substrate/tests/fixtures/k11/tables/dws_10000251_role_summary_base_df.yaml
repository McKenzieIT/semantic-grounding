metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色数(在库角色全量快照口径,含当日未登录的离线角色)
  pay_role_uv:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END)
    description: 累计付费角色数(曾付费角色,快照口径)
  total_pay_amt_std:
    expression: SUM(pay_amt_std)
    description: 累计付费金额(单位:元,快照口径)
  total_act_days_std:
    expression: SUM(act_days_std)
    description: 累计活跃天数(角色视角求和,快照口径)
  pay_role_arpu:
    expression: SUM(pay_amt_std) / NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN role_id END), 0)
    description: 付费角色ARPU(累计付费金额/累计付费角色数)
coverage:
  scenarios:
    - 角色规模与构成:在库角色总数(role_uv),按 server_id/os_id/ch_type/ch_id/ip_country/ip_province/ip_city/pkg_name/app_ver 分布
    - 付费层级:累计付费角色数(pay_role_uv)、累计付费金额(total_pay_amt_std)、付费角色ARPU(pay_role_arpu)
    - 活跃层级:累计活跃天数(total_act_days_std),可结合近7/近30天窗口字段(act_days_1w/1m、act_dur_1w/1m)分析活跃水位
    - 滚服角色识别:按 roll_server_flag(1:滚服/0:非滚服)区分角色数
    - 新老与回流识别:通过 act_tm_fst/act_tm_lst/act_ymd_diff2 识别新角色、回流角色、最近活跃间隔
  limitations:
    - 表为空/无数据(2026-07-31 查询 SELECT MAX(ds) FROM ieu_cdm.dws_10000251_role_summary_base_df 返回 NULL),所有度量为结构性定义,未做真实数据验证
    - 本表 schema 无 user_type 列,分析主体=角色(user_type=3)系由表名命名约定推断,表空无法用 SELECT DISTINCT user_type 实测验证
    - 全量快照而非增量,累计/窗口字段为快照值,不可跨日直接累加求"产出/消耗"
    - 仅结构性定义,未做全量 maxc 实测复核,表空无法 spot-verify 度量值
    - pay_role_arpu 依赖 pay_amt_std>0 判定付费角色,若含 0 或退款负值记录可能存在偏差
    - 跨日趋势分析需扫描多个 ds 分区;当日离线角色仍保留最近状态,统计"当日活跃"需结合 act_ymd_diff2=0 等口径过滤
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空(MAX(ds) NULL,2026-07-31 maxc 查询),仅做结构性丰富;5个度量为结构性定义,未经真实数据 spot-verify;user_type=3 系表名命名约定推断(本表无 user_type 列,表空无法实测)。status=draft。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
      - dws_column: born_server_id_fst
        dim_column: server_id
      - dws_column: born_server_id_lst
        dim_column: server_id
    derivation: DWS server_id (最近区服id), born_server_id_fst (首次出生区服id) and born_server_id_lst (最近出生区服id) are all 区服 ids that join to dim_10000251_server_info (PK server_id), the 服务器/区服维度配置表 used for fact-table server attribute lookup.
