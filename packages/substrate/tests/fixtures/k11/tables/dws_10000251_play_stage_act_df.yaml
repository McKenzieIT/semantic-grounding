metrics:
  part_uv:
    expression: COUNT(DISTINCT CASE WHEN part_pv > 0 THEN role_id END)
    description: 参与玩法角色数(去重，过滤 part_pv>0)
  pass_uv:
    expression: COUNT(DISTINCT CASE WHEN pass_status = 1 THEN role_id END)
    description: 通关角色数(去重，pass_status=1)
  pass_rate:
    expression: COUNT(DISTINCT CASE WHEN pass_status = 1 THEN role_id END) * 1.0 / NULLIF(COUNT(DISTINCT CASE WHEN part_pv > 0 THEN role_id END), 0)
    description: 通关率(通关UV/参与UV)
  total_part_pv:
    expression: SUM(part_pv)
    description: 总参与次数(全角色累计)
  goal1_uv:
    expression: COUNT(DISTINCT CASE WHEN goal1_status = 1 THEN role_id END)
    description: 达成成就1角色数(去重)
coverage:
  scenarios:
    - 按玩法/子玩法/关卡统计参与角色数、通关角色数与通关率
    - 角色通关与成就达成画像(首通等级/战力/装备/科技、首通与首达成就时间)
    - 关卡难度与漏斗分析(参与→通关→满成就)
  limitations:
    - 表为空/无数据(MAX(ds) NULL)，未做实测复核；指标为结构性定义
    - _df 日全量快照：同一角色跨 ds 累计多次出现，跨期聚合需按 role_id 去重
    - play_id/sub_play_id/stage_id=0 表示 ds 活跃但未参与，统计参与UV需过滤该哨兵值
    - pass_tm=9999-12-31 23:59:59、pass_battle_id=''、pass_rounds=-1 等缺省值需在口径中排除
    - 仅 scout 抽样验证，未做全量 maxc 实测复核
  coverage_status: draft
confirmation:
