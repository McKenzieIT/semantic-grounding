table_name: dws_10000251_play_stage_act_df
engine: maxcompute
table_comment: 玩法通关表
description: |-
  玩法通关表（角色级，subject=role，user_type 推断=3，表空未实测）。
  粒度：角色级日全量快照(_df)，按 server_id/play_id/sub_play_id/stage_id 维度展开，每行记录某角色在某区服某玩法-子玩法-关卡的通关与首通/首达成就状态。
  主要字段：role_id, server_id, play_id, sub_play_id, stage_id, pass_status, part_pv, unpass_part_pv, goal1/2/3_status, goals_status, pass_tm, pass_role_level, pass_lineup_force, goal*_tm/role_level/lineup_force, goals_tm 等68列。
domains:
  - 战斗关卡
  - 角色成长
granularity: 角色级日全量快照(_df)，按玩法/子玩法/关卡维度展开
