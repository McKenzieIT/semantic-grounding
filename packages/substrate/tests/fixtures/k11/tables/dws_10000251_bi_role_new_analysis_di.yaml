table_comment: 经分用数-新增角色长线数据统计
description: |-
  经分用数-新增角色长线数据统计：按 reg_ds(新增日期) 分区的角色级 cohort 长线分析表，逐角色记录新增后 f1d~f360d 的累计付费金额与逐日是否活跃标记，用于新增角色留存与付费 LTV 曲线分析。
  粒度：日增量(_di)，按 reg_ds(新增日期) 分区；分析主体=角色(user_type=3)，主键 user_id。
