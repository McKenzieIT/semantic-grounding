metrics:
  new_role_uv:
    expression: COUNT(DISTINCT user_id)
    description: 新增角色数（cohort 规模，分析主体=角色 user_type=3）
  pay_amt_f1d_total:
    expression: SUM(pay_amt_f1d)
    description: 新增首日累计付费总额
  pay_amt_std_f7d_total:
    expression: SUM(pay_amt_std_f7d)
    description: 新增首7日累计付费总额（7日 LTV 分子）
  f7_retention_rate:
    expression: SUM(CASE WHEN is_act_f7d = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(DISTINCT user_id), 0)
    description: 新增首7日角色留存率
  avg_pay_amt_std_f30d:
    expression: SUM(pay_amt_std_f30d) / NULLIF(COUNT(DISTINCT user_id), 0)
    description: 人均30日累计付费金额（人均 LTV）
coverage:
  scenarios:
    - 按新增日期(reg_ds)分批统计每日新增角色规模(new_role_uv)与首日付费总额(pay_amt_f1d_total)，量化拉新质量。
    - 计算 f7 留存率(f7_retention_rate)与人均30日 LTV(avg_pay_amt_std_f30d)，刻画新增角色留存与付费长线曲线。
  limitations:
    - 日增量按 reg_ds(新增日期) 分区组织，非业务数据日期；最新分区 20260730 上 is_act_f7d 等长线标记因 cohort 过新多为 NULL，长线指标需在 cohort 成熟后复算。
    - 含 reg_ds='19700101' 哨兵分区（历史 NULL 充填），统计时需 WHERE reg_ds <> '19700101' 排除。
    - 仅对 20260730 分区抽样验证 new_role_uv/pay_amt_f1d_total/f7_retention_rate 三项，未做全量 maxc 实测复核；历史分区上留存/付费字段可能为 NULL。
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已在最新分区 reg_ds=20260730 抽样验证 new_role_uv=619、pay_amt_f1d_total=6638.0、f7_retention_rate=0.0(cohort 未到7日，符合预期)；user_type=3 角色主体已确认。
partitions:
