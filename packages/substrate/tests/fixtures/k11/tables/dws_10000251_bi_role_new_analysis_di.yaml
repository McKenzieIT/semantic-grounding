    join_keys:
      - dws_column: user_id
        dim_column: user_id
    derivation: "DWS column user_id (comment: 角色ID, user_type=3) is an exact match to PK user_id of dim_10000251_user_tag_before_ob_info (用户标签维度表, user_id tested unique), which is explicitly designed for fact tables to JOIN via user_id for pre-OB tag/batch dimension lookup."
    origin: deterministic
pref_label: 新增角色长线统计表
