table_name: dws_10000251_univ_role_tag_df
engine: maxcompute
table_comment: 用户整体事件表
description: |
  全域角色标签宽表(日全量快照),表名含 role,依主体判定规则本表固定为 user_type=3 的【角色表】,分析主体=角色,主体标识字段为 role_id(本表中 user_id 列实际存储角色ID role_id)。每"角色+统计日"一行,记录角色全生命周期的标签快照。DISTINCT user_type 仅返回单一值 3(建议用 SELECT DISTINCT user_type 复核)。
  记录内容:首末活跃与付费时间、累计及分时段付费金额(新增首N日 fNd / 最近N日 lNd)、设备品牌型号与渠道归因(买量标识 attr_ad_id/媒体 attr_media_name)、地理 IP 归属、角色养成数据(等级/战力/职业/角色名/区服)等。
  能回答的业务问题:付费 LTV 评估(首1/2/3/7/30/180日及分段 LTV)、渠道与买量归因分析(渠道 ROI、媒体对比)、首付转化漏斗、用户分层与流失预警(沉默/流失分级)、用户画像(机型/地域/平台)、角色养成进度分布(等级/战力/职业)、付费节奏(新增期 vs 滚动期)对比、Web 端占比分析。
  注意事项:
  1) 本表固定为角色主体(user_type=3),user_id 即 role_id,无需按 user_type 过滤切换主体;
  2) fNd 系列(如 pay_amt_f7d)为"以新增日 act_tm_fst 为基准的累计首N日付费",lNd 系列(如 pay_amt_l7d)为"以统计日 ds 为基准的最近滚动N日付费",口径不同不可直接相加对比;
  3) event_pay_info 为 JSON 串,不可直接聚合,需先用 get_json_object 解析;
  4) role_level/role_force 等为快照值,聚合(均值/求和)仅作分布参考,无业务累加意义;
  5) form_role_id(养成数据归属角色)可能与当前 user_id 不同,跨角色养成分析时需注意;
  6) 本表为日全量快照,T+1 更新,无法做当日实时/小时级分析;无单笔订单明细,无法做订单级下钻;无逐日活跃矩阵,不能直接计算 N 日留存率(仅有累计活跃天数 act_days_std 与活跃间隔 act_ymd_diff)。
domains:
  - 用户生命周期
  - 付费经济
  - 角色成长
granularity: |
  日全量快照(_df 后缀),每"角色(user_id 即 role_id)+统计日 ds"一行。表名含 role,依主体判定规则本表固定为 user_type=3 的【角色表】,分析主体=角色,主体标识字段为 role_id(本表中 user_id 列实际存储角色ID role_id)。DISTINCT user_type 仅返回单一值 3(建议用 SELECT DISTINCT user_type 复核)。
