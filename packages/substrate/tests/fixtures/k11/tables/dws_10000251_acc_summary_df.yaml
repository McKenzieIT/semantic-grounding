table_name: dws_10000251_acc_summary_df
engine: maxcompute
table_comment: 账号汇总日全量快照（_df）：每业务日每账号一行，汇总账号维度累计活跃/付费/留存等指标。
description: 粒度：日全量快照(_df)，每业务日(ds)每账号(account_id)一行累计汇总。分析主体=账号（user_type=2，由表名 acc 推断；该表无 user_type 列，主体按账号汇总定义）。涵盖累计活跃(pv/days/角色在线时长)、累计付费(amt/pv/days)、首末次活跃/付费、滚服标识、归因推广等账号级画像字段。
domains:
  - 用户生命周期
  - 付费经济
granularity: 日全量快照(_df)：每业务日每账号一行
