metrics:
  acc_uv:
    expression: COUNT(DISTINCT account_id)
    description: 账号数：当日快照下去重账号数（账号粒度主体指标）
  pay_acc_uv:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN account_id END)
    description: 累计付费账号数：累计付费金额>0的去重账号数
  pay_amt_std_total:
    expression: SUM(pay_amt_std)
    description: 累计付费总金额（元）：快照内账号累计付费金额之和
  act_pv_std_total:
    expression: SUM(act_pv_std)
    description: 累计活跃事件总量：快照内账号累计活跃次数之和
  pay_rate:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN account_id END) / NULLIF(COUNT(DISTINCT account_id), 0)
    description: 付费转化率：累计付费账号数 / 账号数
  arppu_std:
    expression: SUM(pay_amt_std) / NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN account_id END), 0)
    description: 累计付费账号ARPU（元/付费账号）：累计付费总金额 / 累计付费账号数
coverage:
  scenarios:
    - 账号规模与活跃：快照账号数、累计活跃事件总量
    - 付费经济：累计付费账号数、累计付费总金额、付费转化率、ARPPU
    - 留存与生命周期：首/末次活跃时间、活跃天数与日期间隔（act_days_std/act_ymd_diff1/2）
    - 渠道与平台画像：按 os_id/ch_type/ch_id/app_ver/ip_country 拆分账号规模与付费
  limitations:
    - 仅 scout 抽样验证，未做全量 maxc 实测复核
    - 全表零行：maxc 实测 SELECT COUNT(*)=0 且 MAX(ds)=NULL；该 dws 账号汇总表疑似未产出数据/历史遗留空表，ds=20260729 实测所有指标均为 0/NULL，无法验证合理性
    - 主体 user_type=2 为由表名 acc 推断；该表无 user_type 列，未做 SELECT DISTINCT 实测确认
    - 仅定义账号粒度聚合指标；按区服/角色维度的明细拆分未实测（act_role_list_*/pay_role_list_* 为列表型文本，不宜直接聚合）
    - _df 为日全量快照，每 ds 每账号一行累计值；跨 ds 不可直接累加，须以单 ds 快照为准
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-30
  confirmed_at: "2026-07-30"
  note: 已通过 maxc meta describe 校验全部69列真实名称/类型/注释并据实重排 role（标识/分组键->dimension，可聚合数值->measure，列表/扩展文本->attribute）。但 maxc 实测全表零行（COUNT(*)=0, MAX(ds)=NULL），ds=20260729 指标实测均为 0/NULL，无法验证合理性，故保持 draft；指标表达式仅使用已校验真实列且除法均带 NULLIF，待数据产出后复核可升 analyst_confirmed。
kind: dws
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: act_server_id_fst
        dim_column: server_id
      - dws_column: act_server_id_lst
        dim_column: server_id
      - dws_column: pay_server_id_fst
        dim_column: server_id
      - dws_column: pay_server_id_lst
        dim_column: server_id
    derivation: DWS columns act_server_id_fst (首次活跃区服id), act_server_id_lst (最近活跃区服id), pay_server_id_fst (首次付费区服id) and pay_server_id_lst (最近付费区服) hold server/区服 IDs that join dim_10000251_server_info on its primary key server_id to look up server name and open-time attributes.
