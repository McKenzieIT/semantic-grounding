table_name: dws_10000251_card_pve_act_di
engine: maxcompute
table_comment: PVE卡牌使用表（角色粒度，日增量）
description: |-
  PVE卡牌使用表。按角色(role)粒度记录PVE玩法中卡牌使用情况，日增量(_di)。
  粒度：角色(role) + 玩法(play_id/sub_play_id) + 卡牌(card_id) + 区服(server_id)，日增量(_di)。
  主要字段：role_id, server_id, play_id, sub_play_id, card_id, part_pv, win_pv, role_part_pv, role_win_pv, ext_info, ds 等11列。
  业务含义：part_pv/win_pv 为该卡牌在该玩法的参与/胜利次数；role_part_pv/role_win_pv 为该角色在该玩法的总参与/胜利次数（用于参与率/胜率计算）。
domains:
  - 战斗关卡
  - 装备道具
granularity: 角色(role) 粒度，日增量(_di)
columns:
  - name: role_id
    type: STRING
    comment: 角色id，key
    role: dimension
  - name: server_id
    type: STRING
    comment: 区服id，key
    role: dimension
  - name: play_id
    type: STRING
    comment: 玩法id，key，缺省值0
    role: dimension
  - name: sub_play_id
    type: STRING
    comment: 子玩法id，key，缺省值0
    role: dimension
  - name: card_id
    type: STRING
    comment: 卡牌id，key
    role: dimension
  - name: part_pv
    type: BIGINT
    comment: 参与次数，0表示未参与
    role: measure
  - name: win_pv
    type: BIGINT
    comment: 胜利次数
    role: measure
  - name: role_part_pv
    type: BIGINT
    comment: 角色参与次数，用于计算参与总次数
    role: measure
  - name: role_win_pv
    type: BIGINT
    comment: 角色胜利次数，用于计算胜利总次数
    role: measure
  - name: ext_info
    type: STRING
    comment: 扩展内容
    role: attribute
  - name: ds
    type: STRING
    comment: 业务日期
    role: partition
metrics:
  card_use_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 当日使用卡牌的角色UV（去重role_id）
  total_part_cnt:
    expression: SUM(part_pv)
    description: 卡牌参与总次数（part_pv汇总）
  total_win_cnt:
    expression: SUM(win_pv)
    description: 卡牌胜利总次数（win_pv汇总）
  card_win_rate:
    expression: SUM(win_pv) / NULLIF(SUM(part_pv), 0)
    description: 卡牌胜率 = 胜利次数/参与次数
  used_card_cnt:
    expression: COUNT(DISTINCT card_id)
    description: 当日被使用的卡牌种类数（去重card_id）
coverage:
  scenarios:
    - 按玩法/子玩法分析各卡牌的参与度与胜率
    - 评估角色在PVE战斗中卡牌使用广度（使用的卡牌种类数）
    - 区服维度对比卡牌使用UV与胜率表现
  limitations:
    - 表为空/无数据（MAX(ds) NULL，meta describe partitions 为空，sample_preview 为空）
    - 仅 scout 抽样验证，未做全量 maxc 实测复核
    - _di 为日增量，跨日汇总需按 ds 累加；角色粒度字段(role_part_pv/role_win_pv)用于参与率计算，避免按卡牌重复计数
    - 缺少 user_type 列，无法直接区分账号/角色/设备粒度（按命名推断为 role 粒度，user_type=3 未验证）
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  notes: 表为空(MAX(ds) NULL)，无法做指标实测验证；指标为结构性定义。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: server_id
        dim_column: server_id
    derivation: DWS server_id (区服id) exactly matches the DIM PK server_id; dim_10000251_server_info is the 区服 dimension providing server name and open-time attributes.
    origin: deterministic
  - dim_table: dim_10000251_trans_card_df
    join_keys:
      - dws_column: card_id
        dim_column: id
    derivation: DWS card_id (卡牌id) semantically maps to trans_card_df PK id (武将/卡牌配置主键); trans_card_df is the card/武将 config dimension for this game.
  - dim_table: dim_10000251_trans_play_df
    join_keys:
      - dws_column: play_id
        dim_column: id
    derivation: DWS play_id (玩法id) semantically maps to trans_play_df PK id (玩法 id); trans_play_df is the canonical 玩法 config dimension.
  - dim_table: dim_10000251_trans_sub_play_od
    join_keys:
      - dws_column: sub_play_id
        dim_column: sub_play_id
    derivation: DWS sub_play_id (子玩法id) exactly matches the DIM PK sub_play_id; dim_10000251_trans_sub_play_od is the canonical 子玩法 config dimension.
    origin: deterministic
pref_label: PVE卡牌使用活跃表
alt_labels:
  - 使用
