table_name: dws_10000251_univ_role_churn_di
engine: maxcompute
table_comment: 角色流失日增量汇总表（_di）：记录当日新增的流失角色(user_type=3)及其累计活跃、付费、设备/渠道、流失天数等画像。
description: |-
  粒度：日增量(_di)，每行=当日新增的1个流失角色。分析主体=角色（user_type=3，meta+SELECT DISTINCT 实测）。
  主要字段：user_type, user_id, os_id, ch_type, pkg_name, act_tm_fst, act_tm_lst, pay_tm_fst, pay_amt_std, act_days_std, churn_day 等49列。
  覆盖：流失规模(UV)、流失角色付费总额、流失付费角色ARPU、流失角色平均活跃天数。
domains:
  - 用户生命周期
  - 付费经济
granularity: 日增量(_di)；角色粒度（user_type=3，每行1角色）
