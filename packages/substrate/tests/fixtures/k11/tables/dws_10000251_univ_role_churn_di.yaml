metrics:
  churn_role_uv:
    expression: COUNT(DISTINCT user_id)
    description: 当日新增流失角色数（_di日增量，UV）。实测 ds=20260730 得 4114。
  churn_pay_amt_total:
    expression: SUM(pay_amt_std)
    description: 流失角色累计付费总额（元，全量求和）。实测 ds=20260730 得 525356.0。
  churn_pay_role_uv:
    expression: COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN user_id END)
    description: 流失角色中的付费角色数。实测 ds=20260730 得 972。
  churn_pay_arpu:
    expression: SUM(pay_amt_std) / NULLIF(COUNT(DISTINCT CASE WHEN pay_amt_std > 0 THEN user_id END), 0)
    description: 流失付费角色ARPU=流失付费总额/流失付费角色数（元/人，NULLIF防除零）。
  churn_avg_act_days:
    expression: SUM(act_days_std) / NULLIF(COUNT(DISTINCT user_id), 0)
    description: 流失角色平均累计活跃天数=累计活跃天数和/流失角色数（NULLIF防除零）。
coverage:
  scenarios:
    - 按 ds 监控每日新增流失角色规模（churn_role_uv），定位流失高峰日
    - 结合 churn_pay_amt_total / churn_pay_role_uv 评估流失造成的付费损失与付费流失占比
    - 通过 churn_pay_arpu 与 churn_avg_act_days 识别高价值/高黏性流失角色画像
    - 可按 os_id/ch_type/pkg_name/region_id/rel_role_srv_lst 等维度下钻流失结构
  limitations:
    - 仅抽样验证 ds=20260730（最新分区）的 5 个核心指标，未做全量 maxc 实测复核；其余指标为结构化定义
    - _di 为日增量，跨 ds 汇总需重新聚合；本表不提供历史回填快照（_df 语义见对应 _df 表）
    - churn_day（流失天数）在 _di 中随分区递增，跨日 SUM(churn_day) 会重复计数，不可直接跨日加总
    - 未覆盖设备/区服等长尾维度的基数核查；流失定义口径（阈值）由上游 DWS 确定，本层不重算
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 已对最新分区 ds=20260730 抽样验证 5 个核心指标（churn_role_uv=4114, churn_pay_amt_total=525356, churn_pay_role_uv=972, churn_pay_arpu≈540.3, churn_avg_act_days≈19.0），值合理；user_type=3 单值与角色主体推断一致。仅抽样验证，未全量复核。
dimension_refs:
  - dim_table: dim_10000251_server_info
    join_keys:
      - dws_column: rel_role_srv_fst
        dim_column: server_id
      - dws_column: rel_role_srv_lst
        dim_column: server_id
    derivation: DWS rel_role_srv_fst/rel_role_srv_lst (comment 首次/最近关联角色区服) store server (区服) ids; dim_10000251_server_info has PK server_id and is the 服务器(区服)维度配置表 explicitly meant for fact tables to JOIN via server_id to backfill server name/open date.
