table_name: dws_10000251_pve_battle_detail_cbt2_di
engine: maxcompute
table_comment: CBT2-PVE战斗详情日增量表（角色级战斗明细，主键 battle_id）
description: |-
  CBT2-PVE战斗详情日增量表（_di，角色级明细，主键 battle_id，主体 role_id）。
  粒度：日增量(_di)，每场 PVE 战斗一行（role_id+battle_id），按 ds 分区。
  主要字段：pve_type, battle_id, role_id, stage_id, chapter_id, suggest_level, lineup_level, lineup_force, npc_status, is_boost, team, star, force, result, tm 等18列。
domains:
  - 战斗关卡
  - 角色成长
granularity: 日增量(_di)，角色级战斗明细（role_id+battle_id），按 ds 分区
columns:
  - name: pve_type
    type: bigint
    comment: PVE玩法
    role: dimension
  - name: battle_id
    type: string
    comment: 战斗ID（主键）
    role: dimension
  - name: role_id
    type: string
    comment: 角色ID
    role: dimension
  - name: stage_id
    type: bigint
    comment: 关卡ID
    role: dimension
  - name: chapter_id
    type: bigint
    comment: 章节ID
    role: dimension
  - name: suggest_level
    type: bigint
    comment: 推荐等级
    role: dimension
  - name: lineup_level
    type: bigint
    comment: 阵容平均等级
    role: measure
  - name: lineup_force
    type: bigint
    comment: 阵容平均战力
    role: measure
  - name: npc_status
    type: bigint
    comment: NPC是否上阵 1:是 0:否
    role: dimension
  - name: is_boost
    type: bigint
    comment: 是否代打 1:是 0:否
    role: dimension
  - name: team
    type: string
    comment: 卡牌阵容
    role: attribute
  - name: star
    type: string
    comment: 星数
    role: attribute
  - name: team_detail
    type: string
    comment: 卡牌阵容详情
    role: attribute
  - name: force
    type: bigint
    comment: 战力
    role: measure
  - name: result
    type: bigint
    comment: 战果 1:胜/2:负/3:平/4:主动退出/5:其他原因退出
    role: dimension
  - name: tm
    type: datetime
    comment: 行为时间
    role: dimension
  - name: extra_info
    type: string
    comment: 额外信息
    role: attribute
  - name: ds
    type: string
    comment: 分区
    role: partition
metrics:
  daily_battle_cnt:
    expression: COUNT(battle_id)
    description: 日PVE战斗次数（行数），按 battle_id 计数
  daily_battle_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 日参与PVE战斗的角色数（role_id 去重）
  pve_win_rate:
    expression: SUM(CASE WHEN result = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: PVE胜率（result=1 占比），分母为日战斗总场次
  avg_battle_force:
    expression: AVG(force)
    description: 日均战斗战力（force 平均值）
  boost_battle_rate:
    expression: SUM(CASE WHEN is_boost = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 代打战斗占比（is_boost=1 占比）
coverage:
  scenarios:
    - 日PVE战斗总量与参与角色规模（daily_battle_cnt / daily_battle_role_uv）
    - PVE胜率与代打战斗占比（pve_win_rate / boost_battle_rate）
    - 战斗战力水平（avg_battle_force）
  limitations:
    - 表为空/无数据（MAX(ds) NULL，COUNT(*)=0），无法抽样验证指标取值，指标表达式为结构性定义，待有数据后复核。
    - _di 为日增量，role_id+battle_id 行级明细；跨日聚合 UV 需按 ds 切分去重，不可直接跨日 SUM(UV)。
    - 表无 user_type 列，分析主体由 role_id 列推断为角色级；star/team 为字符串属性，未规范化为维度。
    - 仅 scout 抽样验证（实测 COUNT=0），未做全量 maxc 实测复核；pve_type/stage_id/chapter_id 等分组维度未在指标中展开。
confirmation:
  status: draft
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  note: 表为空（MAX(ds) NULL, COUNT(*)=0），无法抽样验证指标取值；指标为结构性定义，status=draft，待有数据后复核。
dimension_refs:
  - dim_table: dim_10000251_trans_conquest_df
    join_keys:
      - dws_column: chapter_id
        dim_column: chapter_id
      - dws_column: stage_id
        dim_column: stage_id
    derivation: DWS columns chapter_id (comment 章节ID) and stage_id (comment 关卡ID) form an exact composite-name foreign key to dim_10000251_trans_conquest_df primary key [chapter_id, stage_id], the 征服/推图关卡维度配置表 with one row per chapter-stage; DWS suggest_level also aligns with the dim's reco_level.
    origin: deterministic
pref_label: CBT2 PVE战斗详情表
alt_labels:
  - CBT2
