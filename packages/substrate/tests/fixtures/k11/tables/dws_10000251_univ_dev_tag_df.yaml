table_name: dws_10000251_univ_dev_tag_df
engine: maxcompute
table_comment: 用户整体事件表
description: |
  记录每个设备实体截至分区日的累计标签与画像快照,粒度为"每设备每天一行"的日全量快照(_df)。
  【主体类型】本表固定为 user_type=1 的【设备表】,分析主体=设备,主体标识字段为 user_id(存储设备ID);DISTINCT user_type 仅返回单一值 1(建议用 SELECT DISTINCT user_type 复核)。
  能回答的业务问题:
  - 设备累计付费金额、累计付费订单数、累计活跃天数/在线时长,以及新增首 N 日(1/2/3/7/30/180/360)与滚动最近 N 日(1/7/30/90/180/360)付费金额;
  - 首次/最近活跃时间、首次/最近付费时间、最近两个活跃日间隔(回流/流失节奏);
  - 设备的平台、渠道、包名、地区、设备品牌型号、关联设备/账号/角色 ID 与时间、角色区服;
  - 买量归因(买量标识、媒体)、预下载/测试期/内部用户标记;
  - 关联角色养成画像(角色名、等级、战力、职业、养成角色 ID);
  - Web 端累计付费、大事件累计付费明细;
  - 可计算首日付费率、LTV、付费转化率、滚动窗口付费趋势、关联角色养成分层等指标。
  注意事项:
  - _df 为全量快照,跨分区求和/叠加会重复,做时序统计须用唯一分区或按 user_id 去重;
  - 本表固定 user_type=1,统计设备数直接 COUNT(DISTINCT user_id),无需再做 user_type 过滤;
  - 首次/最近类字段为历史快照值,不可聚合;付费金额类字段为累计或滚动窗口口径,使用前须确认窗口定义;
  - role_level/role_force/role_career 等角色字段来自设备关联的角色画像,部分设备行可能为空,聚合时须先剔除 NULL;
  - 留存率无法直接从本表单分区得出,需多分区对比或借助 act_ymd_diff 近似判断。
domains:
  - 用户生命周期
  - 付费经济
  - 角色成长
granularity: 日全量快照(_df),每设备每天一行;【设备表】,固定 user_type=1,分析主体=设备,主体标识字段=user_id(存储设备ID),DISTINCT user_type 仅返回单一值 1(建议用 SELECT DISTINCT user_type 复核)。
