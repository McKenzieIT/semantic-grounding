table_name: dws_10000251_role_tag_cbt1_df
engine: maxcompute
table_comment: K11-角色标签表-CBT1。角色级日全量快照(_df)，分析主体=角色(user_type=3)，152列覆盖活跃/付费/角色成长/公会/PVE/PVP/抽卡等标签。
description: |-
  K11-角色标签表-CBT1。角色级日全量快照(_df)，分析主体=角色（user_type=3，按表名推断，无 user_type 列实测）。
  覆盖：活跃(act_days_std/1w/1m, act_dur)、付费(pay_amt_std/1w/1m, real_pay_amt_std, vip_level, pay_level)、角色成长(role_level/role_force/lineup_*)、公会(guild_*)、PVE(p0101/p0201/p0301/p0401/p0501/abyss/equip_dungeon)、PVP(apvp/spvp)、抽卡(gacha_*) 等152列标签。
  主要字段：account_id, role_id, server_id, os_id, ch_type, act_tm_fst, act_tm_lst, act_days_std 等152列。
domains:
  - 用户生命周期
  - 角色成长
granularity: 日全量快照(_df)，分析主体=角色（user_type=3，按表名推断；无 user_type 列实测）
