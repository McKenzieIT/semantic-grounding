metrics:
  role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 角色UV（当日全量快照去重角色数，分析主体=角色）
  pay_amt_total:
    expression: SUM(pay_amt_std)
    description: 累计付费金额总额（角色级累计，全量快照求和）
  avg_role_level:
    expression: AVG(role_level)
    description: 平均角色等级（全量快照角色均值）
  avg_act_days_std:
    expression: AVG(act_days_std)
    description: 平均累计活跃天数（全量快照角色均值）
  guild_unlock_rate:
    expression: SUM(CASE WHEN guild_unlock_status = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 公会解锁率（解锁角色数/全量角色数）
coverage:
  scenarios:
    - 角色活跃规模与留存（role_uv、avg_act_days_std 回答角色UV与累计活跃深度）
    - 付费经济规模（pay_amt_total 回答累计付费总额；可按 pay_level/vip_level 分组）
    - 角色成长进度（avg_role_level 回答平均等级，可按 server_id/os_id 分组）
    - 公会渗透（guild_unlock_rate 回答公会解锁占比）
  limitations:
    - 仅对最新 ds(20250507) 抽样验证 role_uv/pay_amt_total/avg_role_level 三指标，未做全量 maxc 实测复核；其余指标为结构性定义。
    - 无 user_type 列，分析主体=角色(user_type=3) 按表名推断，未实测。
    - _df 为日全量快照，metrics 为快照求和/去重，非日增量；跨日叠加需去重处理。
    - 152 列标签中仅核心列进入 metrics，PVE/PVP/抽卡等列未逐一验证非空。
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  notes: 最新 ds=20250507 抽样验证 role_uv=36209/pay_amt_total=1090109/avg_role_level=48.94 均合理；其余指标结构性定义未全量复核。
