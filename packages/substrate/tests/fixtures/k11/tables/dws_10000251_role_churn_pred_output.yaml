table_name: dws_10000251_role_churn_pred_output
engine: maxcompute
table_comment: 角色流失预测输出表（模型推理序列化快照）
description: |-
  粒度：每快照角色级流失预测输出（每 role_id 一行，序列化为单行 log_str，按 ds 分区）。分析主体=角色（user_type=3，由表名 role 推断，表中无 user_type 列）。
  字段含义：log_str 为分号分隔的模型输出串，字段顺序：score=预测流失概率(0-1);role_id=角色ID;idx=样本/批次索引;tag=预测流失标签(0/1);y=实际流失标签(0/1，最新分区常为0因结果未实现)。ds 为快照分区(yyyymmdd_7_0)。
  业务用途：角色流失预测模型的序列化推理输出，与 dws_10000251_7_0_role_churn_pred_scoring 同源（最新分区数据完全一致），用于圈选高流失风险角色与模型表现回看。
domains:
  - 用户生命周期
granularity: 每快照角色级流失预测输出（role_id 主体，ds=yyyymmdd_7_0 快照分区）
columns:
  - name: log_str
    type: string
    comment: 模型输出序列化串，分号分隔：score(流失概率);role_id(角色ID);idx(样本索引);tag(预测标签0/1);y(实际标签0/1)
    role: attribute
  - name: ds
    type: string
    comment: 快照分区(yyyymmdd_7_0)
    role: partition
metrics:
  scored_role_uv:
    expression: COUNT(*)
    description: 单快照评分角色数（每行一 role_id，反映模型覆盖规模；与 scoring 表同源同值）
  avg_pred_score:
    expression: AVG(CAST(SPLIT_PART(log_str, ';', 1) AS DOUBLE))
    description: 平均预测流失得分（log_str 第1段 score 均值，整体流失风险水平）
  pred_churn_uv:
    expression: COUNT_IF(CAST(SPLIT_PART(log_str, ';', 4) AS DOUBLE) = 1.0)
    description: 预测流失角色数（log_str 第4段 tag=1，基于阈值圈选的高风险角色）
  actual_churn_uv:
    expression: COUNT_IF(CAST(SPLIT_PART(log_str, ';', 5) AS DOUBLE) = 1.0)
    description: 实际流失角色数（log_str 第5段 y=1，真实流失标签；最新分区常为0因结果未实现）
  actual_churn_rate:
    expression: SUM(CAST(SPLIT_PART(log_str, ';', 5) AS DOUBLE)) / NULLIF(COUNT(*), 0)
    description: 实际流失率（log_str 第5段 y=1 占比，用于回看模型精度/召回）
coverage:
  scenarios:
    - 圈选高流失风险角色：pred_churn_uv / scored_role_uv 给出预测流失占比，圈选 tag=1 角色
    - 模型表现回看：actual_churn_rate 与 avg_pred_score 对比评估模型校准；分桶对比 tag 与 y 计算精确率/召回
    - 评分规模监控：scored_role_uv 跨 ds 观察每快照评分覆盖是否稳定
  limitations:
    - 仅 scout 抽样验证（latest ds 20260715_7_0 单分区 COUNT/AVG/COUNT_IF 实测），未做全量 maxc 复核
    - log_str 字段顺序与字段含义靠样本+与 dws_10000251_7_0_role_churn_pred_scoring 同源比对推断（score;role_id;idx;tag;y），未经官方文档确认
    - 最新分区 y 全为 0（结果未实现），actual_churn_uv/actual_churn_rate 在最新分区无意义，需使用历史已回填分区评估精度
    - ds 为非标准快照分区（yyyymmdd_7_0），非每日全量/_di 增量；快照频率不规则（约每周）
    - 无 user_type 列，分析主体=角色 由表名 role 推断，未在数据层校验
confirmation:
  status: analyst_confirmed
  confirmed_by: enrichment-agent-2026-07-31
  confirmed_at: "2026-07-31"
  notes: 已在最新分区 ds=20260715_7_0 实测 scored_role_uv=1654784、avg_pred_score≈0.0039、pred_churn_uv=9185、actual_churn_uv=0，与同源表 dws_10000251_7_0_role_churn_pred_scoring 同分区同值，数值合理（最新分区无回填 y 符合预期）。metrics 仅使用真实列 log_str 经 SPLIT_PART 提取并 NULLIF 兜底除零。
dimension_refs: []
pref_label: 流失预测输出表
alt_labels:
  - 流失标签
  - 预测输出
  - 模型
