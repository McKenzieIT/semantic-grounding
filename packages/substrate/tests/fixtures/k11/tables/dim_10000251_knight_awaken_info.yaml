table_name: dim_10000251_knight_awaken_info
engine: maxcompute
table_comment: 武将觉醒信息配置维度表，每行描述一名武将某个觉醒点位/阶数的解锁条件、消耗与属性加成配置。
kind: dim
primary_key:
- knight_id
primary_key_unique: false
label_columns:
- knight_name
- name
description: '武将觉醒信息配置维度表（dim）。每行描述一名武将在某个觉醒点位（order/点位）下的觉醒阶数（awaken_stage）、解锁要求（unlock_require/unlock_describtion）、消耗资源（cost）、加成属性（attribute_value/develop）及激活技能（skill_id）等配置。以 knight_id 作为实体键关联武将主维度，label 取 knight_name（武将名称）与 name（点位名称，如"羁绊解锁"）。'
domains:
- 角色成长
granularity: 每 武将×觉醒点位×解锁条件 一行的觉醒配置维度表
columns:
- name: knight_id
  type: string
  comment: 武将ID
  role: dimension
- name: knight_name
  type: string
  comment: 武将名称
  role: dimension
- name: order
  type: string
  comment: 点位
  role: dimension
- name: level
  type: string
  comment: 等级
  role: dimension
- name: type
  type: string
  comment: 类型
  role: dimension
- name: stage
  type: string
  comment: 归属阶段
  role: dimension
- name: awaken_stage
  type: string
  comment: 阶数
  role: dimension
- name: show_type
  type: string
  comment: 显示类型
  role: dimension
- name: name
  type: string
  comment: 名称
  role: dimension
- name: former_id
  type: string
  comment: 前置id
  role: dimension
- name: unlock_require
  type: string
  comment: 额外解锁要求
  role: dimension
- name: unlock_describtion
  type: string
  comment: 特殊解锁条件描述
  role: dimension
- name: cost
  type: string
  comment: 消耗资源
  role: dimension
- name: develop
  type: string
  comment: 成长系数
  role: dimension
- name: attribute_value
  type: string
