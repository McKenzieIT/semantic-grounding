  role: dimension
coverage:
  scenarios:
  - 通过 knight_id 关联事实表，按 knight_name/name 维度透视各武将觉醒点位的解锁条件与加成配置
  - 按 awaken_stage/level/stage 维度聚合，分析各觉醒阶数下的属性加成(attribute_value/develop)与消耗(cost)配置
  - 按 skill_id/skill_type 查询觉醒激活的技能，辅助技能-觉醒关联分析
  - 按 former_id/unlock_require/unlock_describtion 查询觉醒点位的前置依赖与解锁路径
  limitations:
  - 配置类维度表，无值度量（数值字段如 talent_num/develop 均为编码字符串，不可直接 SUM/AVG）
  - 复合编码串需二次解码：cost（如"1_3_6000"）、attribute_value（如"102_50|302_25"）、unlock_require（如"3_1"）、former_id（如"8_1"）为下划线/竖线分隔的编码串，使用前需解析
  - primary_key knight_id 非行唯一（1971 行仅 73 个 distinct knight_id，每武将约 27 个觉醒点位行），primary_key_unique=false；真实行粒度为 武将×觉醒点位×解锁条件 复合，未实测出唯一列组合，故仅以实体键 knight_id 作为主键并保持 draft
  - unlock_describtion 字段为原表拼写（describtion 而非 description），沿用原名
confirmation:
  status: draft
  confirmed_by: dim-enrichment-2026-07-31
  confirmed_at: "2026-07-31"
  note: 自动 dim 建模：meta describe 校验 20 列与类型/注释一致；knight_id 作实体主键（非行唯一，已实测 r=1971>d=73 故 primary_key_unique=false）；label 取 knight_name/name；domain 归"角色成长"；配置类维度无度量，故保持 draft 待业务确认。
metrics:
  row_count:
    expression: COUNT(*)
    description: 维度表总行数
