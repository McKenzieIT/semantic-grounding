domains:
- name: 用户生命周期
  description: 注册、登录、活跃、留存、流失、回流相关
  directory: account
- name: 付费经济
  description: 充值、消费、货币兑换、商城购买、VIP相关
  directory: payment
- name: 资源产销
  description: 道具获得/消耗、货币变动、经济系统健康度相关
  directory: resource
- name: 战斗关卡
  description: 副本进入/结算、PVP对战、挑战、战斗力变化相关
  directory: battle
- name: 探索收集
  description: 抽卡/抽奖、收集系统相关
  directory: resource
- name: 角色成长
  description: 等级提升、装备强化、技能解锁、功能开放相关
  directory: system
- name: 社交公会
  description: 公会操作、好友互动、排行榜相关
  directory: social
- name: 装备道具
  description: 装备、道具的获得/消耗与数量变动相关
  directory: resource
- name: 系统监控
  description: 维度表、配置表、监控相关
  directory: system
- name: 自定义
  description: 无法归入上述类别的事件
  directory: activity
