name: game.rogue.skipBattle
event_filter: event = 'game.rogue.skipBattle'
description: 古战场（rogue）玩法中角色使用跳过战斗功能的埋点事件。玩家在古战场扫荡/挑战时选择直接跳过战斗过程快速结算，分析主体为 role_id（角色）。参数含游戏服、账号、角色、性别、创角/上线时间、角色等级、vip等级、角色战力、经验、看板娘及关键货币余额（gold/sendgold/freegold/diamond/expCoin/energy）等 22 个字段，用于刻画跳过战斗玩家的等级/战力/付费能力画像。ds=20260729 scout 实测：当日 13 次跳过、10 角色、10 账号、6 服务器。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=13, role_uv=10, acc_uv=10, server_uv=6，数值量级合理（古战场跳过战斗属中低频事件），事件在线
metrics:
  game_rogue_skipBattle_cnt:
    expression: COUNT(*)
    description: 古战场跳过战斗总次数
  game_rogue_skipBattle_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 跳过战斗的角色数（分析主体 role_id）
  game_rogue_skipBattle_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 跳过战斗的账号数
  game_rogue_skipBattle_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生跳过战斗的服务器数
  game_rogue_skipBattle_avg_role_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 跳过战斗角色的平均等级
  game_rogue_skipBattle_avg_vip_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.vipLevel') AS BIGINT))
    description: 跳过战斗角色的平均 vip 等级
  game_rogue_skipBattle_avg_role_force:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT))
    description: 跳过战斗角色的平均战力
  game_rogue_skipBattle_per_role_avg_cnt:
    expression: COUNT(*)::FLOAT / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均跳过战斗次数（总次数/角色UV）
coverage:
  scenarios:
    - 古战场跳过战斗的次数与角色 UV，衡量该玩法的使用热度
    - 跳过战斗角色的等级、vip、战力画像，识别是高战力快速扫荡还是低战力跳过卡点
    - 各服务器跳过战斗热度对比
    - 人均跳过次数反映玩家对古战场战斗的回避/速通倾向
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），未逐字段核对 params 类型
    - roleLevel/vipLevel/roleForce 来自 params JSON，未抽样比对原始值
    - 单日样本量较小（cnt=13），指标波动较大，需多日累计复核
coverage_status: analyst_confirmed
external_refs: []
