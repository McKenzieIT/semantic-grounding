metrics:
  game_pvp_end_cnt:
    expression: COUNT(*)
    description: PVP战斗结束事件总次数(每场战斗上报1条)
  game_pvp_end_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与PVP的角色去重数(分析主体粒度)
  game_pvp_end_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与PVP的账号去重数
  game_pvp_end_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 产生PVP事件的游戏服去重数
  game_pvp_end_avg_duration:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.duration') AS BIGINT))
    description: PVP单场战斗平均时长(秒),衡量战斗节奏
  game_pvp_end_avg_score:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT))
    description: PVP单场己方积分均值
  game_pvp_end_win_rate:
    expression: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.score') AS BIGINT) > CAST(GET_JSON_OBJECT(params, '$.relScore') AS BIGINT) THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: PVP胜率(己方积分>对手积分判定胜),用NULLIF防0除
  game_pvp_end_boost_rate:
    expression: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.isBoost') AS BIGINT) = 1 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 代打占比(isBoost=1),用于异常账户/代练检测
  game_pvp_end_mode_cnt:
    expression: COUNT(DISTINCT CAST(GET_JSON_OBJECT(params, '$.mode') AS BIGINT))
    description: PVP模式种类数(1竞技场无bp/2竞技场有bp/3休闲/4演武场)
coverage:
  scenarios:
    - "PVP参与度: 通过事件量级/角色/账号/区服去重衡量玩法活跃度与覆盖广度"
    - "PVP战斗节奏: avg_duration 反映单场战斗节奏,辅助匹配机制与平衡性分析"
    - "PVP胜率分析: win_rate 反映玩家竞技表现与匹配公平性(失败方提前退出可能未上报 end)"
    - "代打占比: boost_rate 用于异常账户与代练行为检测"
    - "PVP模式分布: mode_cnt=4 说明 4 种 mode 齐全,可细分模式维度统计"
  limitations:
    - 仅 ds=20260729 单日 scout 实测,未做全量复核
    - 分析主体粒度默认 role_id;同账号多角色参与PVP未做合并
    - blood 字段实测数值量级较大(亿级),与 params_fields 描述"血量百分比"不符,需业务方确认语义(可能为绝对血量)
    - win_cnt=23308/35614 ≈ 65.4% 胜率偏高,可能与失败方提前退出未上报 end 有关,需结合业务规则复核
    - 事件本身无支付/货币产出字段,Revenue 类指标不适用;如需结算收益请用 coinList 衍生
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729：cnt=35614, role_uv=2784, acc_uv=2648, server_uv=401；avg_duration=32.58s, avg_score=536, win_cnt=23308, mode_cnt=4。字段参数完整、4种mode齐全、数值合理,事件在线。
