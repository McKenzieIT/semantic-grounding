name: game.rogue.exit
event_filter: event = 'game.rogue.exit'
description: 古战场（rogue）玩法退出事件。角色完成或中断古战场探索后上报，记录退出时刻的角色快照（等级、VIP、战力、经验、货币等22个参数）。分析主体为 role_id（角色级事件），account_id 为账号维度补充。scout 实测 ds=20260729：cnt=13/role_uv=10/acc_uv=10/server_uv=8，参与规模较小。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
metrics:
  rogue_exit_cnt:
    expression: COUNT(*)
    description: 古战场退出事件总次数
  rogue_exit_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 古战场退出的去重角色数（分析主体 role_id）
  rogue_exit_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 古战场退出的去重账号数
  rogue_exit_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 古战场退出覆盖的去重游戏服数
  rogue_exit_avg_role_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.roleLevel') AS BIGINT))
    description: 退出角色的平均等级
coverage:
  scenarios:
    - 古战场退出参与规模（次数/角色UV/账号UV/游戏服UV）
    - 退出角色的等级水平分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级事件），account_id 为账号维度补充
    - 单日样本量较小（cnt=13），跨日趋势需扩窗口复核
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=13, role_uv=10, acc_uv=10, server_uv=8"
coverage_status: analyst_confirmed
external_refs: []
