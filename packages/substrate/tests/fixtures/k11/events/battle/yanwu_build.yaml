name: game.yanwu.build
event_filter: event = 'game.yanwu.build'
description: 演武场设置队伍事件：角色在演武场（PVP 竞技玩法）设置出战队伍布阵，含武将站位（cardList.pos）、布置消耗（layoutList.point）与赛季（season）。分析主体为 role_id（角色），account_id 为账户粒度。scout 实测 ds=20260729 与 ds=20260728 均零命中（cnt=0），事件疑似下线或当日未触发。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  season:
    type: int
    description: 赛季
  cardList:
    type: array
    description: 武将列表
  cardList.id:
    type: int
    description: 武将id
  cardList.name:
    type: string
    description: 武将名
  cardList.pos:
    type: int
    description: 站位
  layoutList:
    type: array
    description: 布置列表
  layoutList.id:
    type: int
    description: id
  layoutList.point:
    type: int
    description: 消耗
metrics:
  game_yanwu_build_cnt:
    expression: COUNT(*)
    description: 演武场设置队伍事件总次数（行为量）
  game_yanwu_build_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置队伍的去重角色数（分析主体 role_id）
  game_yanwu_build_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置队伍的去重账户数
  game_yanwu_build_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 设置队伍涉及的去重游戏服数
  game_yanwu_build_per_role_actions:
    expression: COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均设置队伍次数（总次数/去重角色数，NULLIF 防除零）
  game_yanwu_build_role_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 设置队伍角色平均等级（来自 params.roleLevel）
  game_yanwu_build_vip_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.vipLevel') AS BIGINT))
    description: 设置队伍角色平均 VIP 等级（来自 params.vipLevel）
  game_yanwu_build_force_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT))
    description: 设置队伍角色平均战力（来自 params.roleForce）
coverage:
  scenarios:
    - 演武场（PVP 竞技）队伍设置参与度：通过 _role_uv/_account_uv 衡量活跃布阵角色规模
    - 人均布阵频次：_per_role_actions 反映角色调整队伍的次数
    - 参与角色画像：_role_level_avg/_vip_level_avg/_force_avg 刻画设置队伍角色的等级/VIP/战力分布
    - 跨服参与广度：_server_uv 反映玩法覆盖的游戏服数量
  limitations:
    - 日志中零命中(ds=20260729 与 ds=20260728 均为 cnt=0)，事件疑似下线/未触发，metrics 表达式为预设待数据回流后生效
    - 仅 ds=20260729/20260728 双日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），尚未在真实数据下复核
    - cardList/layoutList 为数组类型，未在 metrics 中展开（避免 LATERAL VIEW/JOIN），如需武将级分析需单独建表
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；retry ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。双日零命中，事件疑似下线/未触发，维持 draft。"
coverage_status: draft
external_refs: []
