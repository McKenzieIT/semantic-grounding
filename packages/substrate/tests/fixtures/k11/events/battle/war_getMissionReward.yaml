name: game.war.getMissionReward
event_filter: event = 'game.war.getMissionReward'
description: |-
  战役活动任务奖励领取事件。当玩家在战役活动系统中领取任务奖励时触发，记录领取角色、所属游戏服、任务id及领取时的角色属性（等级、vip、战力、经验）与各货币余额快照。
  分析主体粒度：role_id（每个角色一次奖励领取为一条记录）。
  真实测量体量（ds=20260729 scout）：cnt=27801、role_uv=3552、acc_uv=3387、server_uv=456，覆盖456个游戏服，单日活跃领取行为密度合理。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 任务id
metrics:
  game_war_get_mission_reward_cnt:
    expression: COUNT(*)
    description: 战役任务奖励领取总次数
  game_war_get_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取奖励的去重角色数
  game_war_get_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取奖励的去重账号数
  game_war_get_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取奖励覆盖的去重游戏服数
  game_war_get_mission_reward_task_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 被领取奖励的去重任务id数（任务覆盖广度）
  game_war_get_mission_reward_avg_role_force:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 领取奖励角色的平均战力（角色战力字段求和后除以事件行数）
  game_war_get_mission_reward_avg_role_level:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 领取奖励角色的平均等级
coverage:
  scenarios:
    - 战役活动任务奖励领取行为活跃度（次数、去重角色/账号/服务器覆盖）
    - 不同任务id被领取广度，识别热门/冷门任务
    - 领取角色群体战力/等级分布特征
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - coinList 各字段（gold/freegold/diamond/expCoin/energy）为领取时刻余额快照，求和无业务意义，故未纳入聚合
    - 分析主体默认 role_id，账号级聚合需配合 account_id 二次聚合
    - 任务id 类型为 int，依赖 params.$.id 解析；如该字段缺失会落入 NULL
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729：cnt=27801、role_uv=3552、acc_uv=3387、server_uv=456，数据体量合理，事件稳定在线。
coverage_status: analyst_confirmed
