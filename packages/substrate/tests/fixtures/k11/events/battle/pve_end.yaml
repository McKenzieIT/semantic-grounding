metrics:
  game_pve_end_cnt:
    expression: COUNT(*)
    description: 副本战斗结束事件总次数
  game_pve_end_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与副本战斗的去重角色数（分析主体粒度）
  game_pve_end_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与副本战斗的去重账号数
  game_pve_end_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的游戏服去重数
  game_pve_end_win_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.battleRes') = '1' THEN 1 ELSE 0 END)
    description: 战斗胜利次数（battleRes=1 胜）
  game_pve_end_win_rate:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.battleRes') = '1' THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 副本胜率（胜利次数/总场次）
  game_pve_end_first_pass_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.firstPass') = '1' THEN 1 ELSE 0 END)
    description: 首次通关次数（firstPass=1）
  game_pve_end_duration_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.duration') AS BIGINT))
    description: 战斗时长（秒）总和
  game_pve_end_round_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.round') AS BIGINT))
    description: 战斗回合数总和
coverage:
  scenarios:
    - 衡量副本/PVE战斗规模与活跃（场次、角色/账号/服 UV）
    - 通关效率（胜率、首次通关数）
    - 战斗消耗（时长、回合数）
    - 支持按 server_id/role_id 下钻分析副本参与度与难度分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度）
    - coinList/starTaskList/cardList 等数组型快照未纳入聚合指标
    - battleRes 各枚举(2负/3平/4主动退出/5其他)未单独拆分，仅统计胜与胜率
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=127237、role_uv=4291、acc_uv=4049、server_uv=466，数据合理且高频，确认为真实在线事件。
