name: game.war.getWarChapterStarReward
event_filter: event = 'game.war.getWarChapterStarReward'
description: 玩家在战役玩法中领取章节星星奖励时触发的行为埋点事件。记录领取奖励的角色（分析主体：role_id）、所在游戏服(serverId/serverName)、章节ID(chapterId)及领取位置(newPos)，并附带角色等级/vip/战力/经验及货币快照(coinList)。Scout 实测 ds=20260729 与 ds=20260728 双日均零命中，事件疑似已下线或当前未触发。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  chapterId:
    type: int
    description: 章节ID
  newPos:
    type: int
    description: 领取到的位置
metrics:
  game_war_getWarChapterStarReward_cnt:
    expression: COUNT(*)
    description: 战役章节星星奖励领取事件总次数
  game_war_getWarChapterStarReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取战役章节星星奖励的去重角色数（分析主体：role_id）
  game_war_getWarChapterStarReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取战役章节星星奖励的去重账号数
  game_war_getWarChapterStarReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取战役章节星星奖励的去重游戏服数
  game_war_getWarChapterStarReward_chapter_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.chapterId'))
    description: 领取奖励涉及的去重章节ID数
coverage:
  scenarios:
    - 统计战役章节星星奖励的领取次数与领取角色数，评估关卡奖励投放与玩家推进进度
    - 按章节(chapterId)/位置(newPos)维度分析奖励领取分布，识别热门章节与卡点
  limitations:
    - 仅 ds=20260729 与 ds=20260728 双日 scout 实测均零命中(cnt/role_uv/acc_uv/server_uv=0)，事件疑似已下线/未触发，未做全量复核
    - 事件分析主体默认 role_id（角色级埋点），因零命中未做主体粒度复核
    - coinList 各货币字段(gold/sendgold/freegold/diamond/expCoin/energy)为事件时刻货币快照，非本次奖励增量，暂不作为奖励金额 SUM 度量
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样零命中。事件疑似下线/未触发，保持 draft。"
external_refs: []
