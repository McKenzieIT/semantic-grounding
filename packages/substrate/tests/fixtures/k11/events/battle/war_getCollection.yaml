name: game.war.getCollection
event_filter: event = 'game.war.getCollection'
description: 战役活动收集品收集事件：角色在战役活动中获取/收集某个收集品(id)时上报，用于分析收集品获取分布与活跃度。分析主体为 role_id（角色粒度），可下钻至 account_id、server_id。scout 实测 ds=20260729/20260728 零命中，疑似事件下线或未触发。参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、收集品id 等23个
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 收集品id
metrics:
  war_getcollection_cnt:
    expression: COUNT(*)
    description: 收集品收集事件总次数
  war_getcollection_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与收集的角色数（去重）
  war_getcollection_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与收集的账号数（去重）
  war_getcollection_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的游戏服数（去重）
  war_getcollection_item_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 被收集的收集品种类数（按收集品id去重）
coverage:
  scenarios:
    - 战役活动收集品获取频次与活跃度（_cnt、_role_uv）
    - 收集品覆盖广度：被收集的物品种类数（_item_uv）
    - 多服/多账号分布（_server_uv、_account_uv）
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 scout 单日实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），未与业务方确认
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样零命中；事件疑似下线或未触发，保持 draft"
