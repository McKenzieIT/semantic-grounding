name: game.war.getGuanduBossDailyReward
event_filter: event = 'game.war.getGuanduBossDailyReward'
description: 官渡之战BOSS日常奖励领取事件。玩家角色在官渡副本中击败BOSS后领取每日奖励时触发，记录角色、服务器、奖励(rewards)及货币(coinList)等27个参数。分析主体为 role_id（角色）。scout 实测 ds=20260729 与 ds=20260728 零命中，疑似下线/未触发。
domains:
  - 战斗关卡
domain: battle
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  rewards:
    type: array
    description: 奖励
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  game_war_getGuanduBossDailyReward_cnt:
    expression: COUNT(*)
    description: 领取官渡BOSS日常奖励的总事件次数
  game_war_getGuanduBossDailyReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取奖励的去重角色数
  game_war_getGuanduBossDailyReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取奖励的去重账号数
  game_war_getGuanduBossDailyReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取奖励的去重服务器数
coverage:
  scenarios:
    - 分析官渡BOSS日常奖励的领取频次与参与角色规模
    - 监控官渡副本每日BOSS奖励发放的活跃度
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 与 ds=20260728 单日 scout 实测，未做全量复核
    - 分析主体粒度默认 role_id（角色），未做实测复核
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 与 ds=20260728 均零命中(cnt=0/role_uv=0/acc_uv=0/server_uv=0)，事件疑似下线/未触发，保留 draft
coverage_status: draft
external_refs: []
