name: game.social.guild.member
event_filter: event = 'game.social.guild.member'
description: 公会成员花名册快照事件：每条记录代表一个公会的完整成员名册（params.members 数组，含 uid/job/joinTs/wactive/wactiveTs/lastWactive/name 字段），按日上报。事件粒度为公会（guildId 为分析主体），基表 role_id/account_id 为空串，server_id 与 guildId 已填充。scout 实测 ds=20260729：cnt=13106 公会快照、guild_uv=13106、server_uv=235、成员记录合计 260600、平均每公会 19.88 人、零空公会。
domains:
  - 社交公会
domain: social
metrics:
  game_social_guild_member_cnt:
    expression: COUNT(*)
    description: 公会成员花名册快照事件总条数（每条=一个公会的一次成员名册上报）
  game_social_guild_member_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 上报公会花名册的去重游戏服数
  game_social_guild_member_guild_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.guildId'))
    description: 去重公会数（事件分析主体；实测每公会每日1条快照，与 cnt 接近相等）
  game_social_guild_member_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 去重角色数（公会粒度事件基表 role_id 为空串，该指标退化为常数1，仅作结构占位，非分析主体）
  game_social_guild_member_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 去重账号数（公会粒度事件基表 account_id 为空串，该指标退化为常数1，仅作结构占位，非分析主体）
  game_social_guild_member_total_member_records:
    expression: SUM(REGEXP_COUNT(params,'"uid":'))
    description: 全部公会快照中成员记录总数（按 members 数组内 uid 键出现次数近似数组长度后求和）
  game_social_guild_member_avg_per_guild:
    expression: ROUND(CAST(SUM(REGEXP_COUNT(params,'"uid":')) AS DOUBLE) / NULLIF(COUNT(*), 0), 2)
    description: 平均每公会上报成员数（NULLIF 防 0 除）
coverage:
  scenarios:
    - 量化每日上报公会花名册的规模与覆盖区服/公会范围（社交公会域）
    - 评估公会平均成员数与总成员记录规模，刻画公会活跃度分布
    - 按 server_id 下钻识别公会覆盖密集服，辅助公会运营与跨服生态分析
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 本事件为公会粒度：基表 role_id/account_id 为空串，COUNT(DISTINCT role_id) 与 COUNT(DISTINCT account_id) 退化为常数1，不作为分析主体；分析主体为 GET_JSON_OBJECT(params,'$.guildId')
    - 成员记录数通过 REGEXP_COUNT(params,'"uid":') 近似统计 members 数组长度，仅限事件级聚合，未 EXPLODE 展开到成员行级
    - params_fields 中声明的 roleId/roleName/sex/createTime/roleLevel/vipLevel/roleForce/exp/image/coinList/sessionId/logUUID 在 ds=20260729 抽样 params 顶层未观察到（仅 members/serverId/guildId/_muid 顶层字段存在），疑似成员级字段误归顶层或不同触发路径差异，未深究
coverage_status: analyst_confirmed
