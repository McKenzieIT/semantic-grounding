name: game.guild.kickout
event_filter: event = 'game.guild.kickout'
description: |-
  公会踢出事件：公会管理者将成员踢出公会(game.guild.kickout)。主体粒度为角色(role_id 视为操作者/执行踢出者，targetUid 为被踢目标)；记录每次踢出动作及当时角色快照(角色等级/vip/战力/货币)。ds=20260729 单日 scout 实测 cnt=228/role_uv=45/acc_uv=45/server_uv=21。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  targetUid:
    type: int
    description: 目标uid
metrics:
  guild_kickout_cnt:
    expression: COUNT(*)
    description: 公会踢出事件触发次数(每次踢出动作记1条)
  guild_kickout_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 执行踢出的独立角色数(去重 role_id；主体粒度角色，视为操作者/踢出执行者)
  guild_kickout_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 执行踢出的独立账号数(去重 account_id)
  guild_kickout_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的区服数(去重 server_id，反映踢出动作覆盖面)
  guild_kickout_target_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.targetUid'))
    description: 被踢出的独立目标数(去重 targetUid；与 role_uv 互补衡量受影响面)
  guild_kickout_target_per_actor:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.targetUid')) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每个操作者踢出的去重目标数(被踢目标/操作者；NULLIF 防零除)
coverage:
  scenarios:
    - 公会踢出规模与频率(guild_kickout_cnt / guild_kickout_role_uv / guild_kickout_account_uv)
    - 踢出动作覆盖面(guild_kickout_server_uv 区服数、guild_kickout_target_uv 被踢目标数)
    - 操作者强度(guild_kickout_target_per_actor 人均踢出目标数)
  limitations:
    - 仅 ds=20260729 单日 scout 实测(cnt=228/role_uv=45/acc_uv=45/server_uv=21)，未做全量多日复核
    - 主体粒度默认 role_id 视为操作者(执行踢出)、targetUid 视为被踢目标；未逐事件实测 actor/target 归属正确性
    - targetUid 仅做 COUNT(DISTINCT) 实测，未枚举目标业务含义(需配置表/产品确认)
    - 本游戏无 MaxCompute 事件分布查询，无 daily_count/total_count/active_days
  coverage_status: analyst_reviewed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
external_refs: []
