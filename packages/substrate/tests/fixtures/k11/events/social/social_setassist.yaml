name: game.social.setassist
event_filter: event = 'game.social.setassist'
description: 玩家设置好友助战（社交公会域）。记录角色发起设置助战时上报的状态快照，含游戏服、账号、角色名/等级/vip/战力/经验及货币与卡片信息。分析主体为 role_id（角色级事件），可按 server_id/account_id 下钻分组。ds=20260729 scout 实测：cnt=407, role_uv=242, acc_uv=237, server_uv=28。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  card1:
    type: int
    description: 卡片1id
  card2:
    type: int
    description: 卡片2id
  card3:
    type: int
    description: 卡片3id
metrics:
  social_setassist_cnt:
    expression: COUNT(*)
    description: 助战设置事件总次数（角色每次设置助战上报一条）
  social_setassist_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置助战的去重角色数（分析主体）
  social_setassist_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置助战的去重账号数
  social_setassist_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 覆盖的去重游戏服数
  social_setassist_avg_role_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.roleLevel') AS BIGINT))
    description: 设置助战角色的平均角色等级（状态快照）
  social_setassist_avg_vip_level:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.vipLevel') AS BIGINT))
    description: 设置助战角色的平均vip等级
  social_setassist_avg_role_force:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.roleForce') AS BIGINT))
    description: 设置助战角色的平均角色战力
coverage:
  scenarios:
    - 社交助战功能活跃度：按日/服统计 social_setassist_cnt 与 role_uv，评估助战设置功能的使用规模与渗透
    - 助战用户画像：通过 avg_role_level/avg_vip_level/avg_role_force 刻画设置助战角色的等级/vip/战力分布，识别高战力助战供给者
    - 跨服覆盖广度：social_setassist_server_uv 衡量功能在各游戏服的落地范围
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；多日趋势需后续按日聚合
    - 分析主体默认为 role_id（角色级事件），account_id 仅作账号去重辅助
    - roleLevel/vipLevel/roleForce 为事件上报瞬时状态快照，非助战生效后的变化值
    - 未关联全服活跃角色分母，故未计算助战渗透率（需 JOIN，已超出单表范围）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=407, role_uv=242, acc_uv=237, server_uv=28；数量合理（社交助战上报），event+ds 双过滤命中，确认上线有效。
coverage_status: analyst_confirmed
external_refs: []
