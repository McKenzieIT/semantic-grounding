name: game.guildLuckyBag.send
event_filter: event = 'game.guildLuckyBag.send'
description: 公会福袋发送事件：公会成员在公会内发送福袋，记录发送方的角色、服务器、福袋uid及关键货币快照。分析主体为 role_id（角色），事件粒度=单次福袋发送行为。scout 实测 ds=20260729/20260728 均零命中（事件疑似下线或近期未触发）。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  bagUid:
    type: int
    description: 福袋uid
metrics:
  guild_lucky_bag_send_cnt:
    expression: COUNT(*)
    description: 公会福袋发送事件总次数
  guild_lucky_bag_send_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发送福袋的去重角色数
  guild_lucky_bag_send_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发送福袋的去重账号数
  guild_lucky_bag_send_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发送福袋的去重服务器数
  guild_lucky_bag_send_bag_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.bagUid'))
    description: 发送的去重福袋uid数
coverage:
  scenarios:
    - 公会福袋发送参与度（发送人数/次数/服务器分布）
    - 公会福袋发送者的角色等级/VIP/战力分布（结合 params）
    - 福袋发送去重数量（按 bagUid 去重）
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发，指标暂无实测值
    - 仅 scout 单日 ds=20260729 探测（并补测 ds=20260728），未做全量复核
    - 分析主体默认 role_id（角色），未与账号级聚合交叉验证
    - coinList 为数组字段，货币金额类指标未纳入（需数组展开，避免误算）
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0; 补测 ds=20260728: cnt=0; 零命中，疑似下线/未触发，保持 draft"
external_refs: []
