name: game.guild.doBargain
event_filter: event = 'game.guild.doBargain'
description: 公会砍价-砍价：玩家在公会砍价玩法中触发砍价动作（向商品出价/议价）的事件，每次事件对应当日 1 次砍价(dailyBargainCnt=1)。记录砍价时货币快照(充值钻石 gold、免费钻石 freegold、紫金 diamond 等)与角色经济画像。分析主体粒度为 role_id。参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个。scout 实测 ds=20260729 单日 cnt=2752、role_uv=2752、acc_uv=2622、server_uv=340。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  dailyBargainCnt:
    type: int
    description: 每日砍价次数
metrics:
  game_guild_dobargain_cnt:
    expression: COUNT(*)
    description: 公会砍价动作事件总次数
  game_guild_dobargain_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与公会砍价的去重角色数（分析主体粒度 role_id）
  game_guild_dobargain_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与公会砍价的去重账号数
  game_guild_dobargain_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 参与公会砍价的去重游戏服数
  game_guild_dobargain_daily_cnt_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.dailyBargainCnt') AS BIGINT))
    description: 当日累计砍价次数之和（基于 dailyBargainCnt，ds=20260729 每人 1 次）
  game_guild_dobargain_gold_snapshot_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 砍价发生时持有充值钻石(gold)合计，参与者经济画像快照（货币余额，非收入）
  game_guild_dobargain_freegold_snapshot_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.freegold') AS BIGINT))
    description: 砍价发生时持有免费钻石(freegold)合计，参与者经济画像快照（货币余额，非收入）
  game_guild_dobargain_gold_per_bargainer:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 砍价参与者人均持有充值钻石(gold)，砍价时经济画像（货币快照非收入）
coverage:
  scenarios:
    - 公会砍价玩法的日参与规模与渗透：砍价次数(cnt/daily_cnt_sum)、参与角色/账号/服数
    - 砍价参与者经济画像：砍价时持有充值钻石/免费钻石水平（gold/freegold 快照）
    - 跨服参与分布与活跃游戏服识别（server_uv）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id；ds=20260729 当日每角色恰好触发 1 次（dailyBargainCnt_max=1），多日累计行为未复核
    - coinList.* 为砍价时货币快照（余额），非花费或收入，仅作经济画像用途；diamond(紫金) 该日上报为 null
    - dailyBargainCnt 为玩家上报的当日累计值，跨天重置与跨日累加行为未复核
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=2752, role_uv=2752, acc_uv=2622, server_uv=340; dailyBargainCnt_sum=2752(每人1次,max=1); gold快照sum=37186, sendgold快照sum=7731, freegold快照sum=47338152, diamond快照sum=null"
external_refs: []
