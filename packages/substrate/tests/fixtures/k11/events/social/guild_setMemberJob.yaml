name: game.guild.setMemberJob
event_filter: event = 'game.guild.setMemberJob'
description: 公会任命事件：公会会长/官员为成员（targetUid）分配或调整公会职位（job），oldJob 为调整前职位。分析主体为 role_id（操作者/任命方），targetUid 字段记录被任命方 uid。实测 ds=20260729：cnt=148，role_uv=55，acc_uv=55，server_uv=32。参数含游戏服id/名字、账号id、角色id/名字、性别、创角/上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表（充值钻石/赠送钻石/免费钻石/紫金/经验卷轴/体力）、sessionId、logUUID、targetUid、job、oldJob 等25个。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  targetUid:
    type: int
    description: 目标uid
  job:
    type: int
    description: 职位
  oldJob:
    type: int
    description: 原来的职位
metrics:
  guild_set_member_job_cnt:
    expression: COUNT(*)
    description: 公会任命事件总次数
  guild_set_member_job_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 操作者（任命方）去重角色数
  guild_set_member_job_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 操作者（任命方）去重账号数
  guild_set_member_job_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 覆盖去重服务器数
  guild_set_member_job_target_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.targetUid'))
    description: 被任命方去重 targetUid 数
  guild_set_member_job_job_type_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.job'))
    description: 涉及去重职位类型数
  guild_set_member_job_per_role_avg_cnt:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 操作者角色平均任命次数
coverage:
  scenarios:
    - 公会职位任命/调整的日常体量与覆盖（人次、角色数、服务器分布）
    - 被任命方 targetUid 去重数与职位类型分布
    - 操作者（任命方）role_id 的活跃度与多服务器分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（操作方/任命方）；被任命方需通过 GET_JSON_OBJECT(params,'$.targetUid') 单独统计
    - role_id 与 account_id 在本事件 ds=20260729 实测一一对应（role_uv=acc_uv=55）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=148, role_uv=55, acc_uv=55, server_uv=32 (role_uv=acc_uv 一一对应)"
coverage_status: analyst_confirmed
external_refs: []
