name: game.guild.transferPresident
event_filter: event = 'game.guild.transferPresident'
description: 公会会长转让事件：当现任会长(role_id 为分析主体，即转让方/出让会长者)将会长职位转交给目标角色(targetUid，受让方/新会长)时触发。记录转让发生时双方的角色等级/vip/战力及货币快照。ds=20260729 单日 scout 实测 cnt=20、role_uv=20(转让方)、server_uv=14。
domains:
  - 社交公会
domain: social
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  targetUid:
    type: int
    description: 目标uid
metrics:
  guild_transfer_president_cnt:
    expression: COUNT(*)
    description: 公会会长转让事件总次数（转让发生的总记录数）
  guild_transfer_president_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发起会长转让的转让方角色数（出让会长的 role_id 去重数，分析主体粒度）
  guild_transfer_president_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发起会长转让的转让方账号数
  guild_transfer_president_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生会长转让的游戏服数
  guild_transfer_president_target_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.targetUid'))
    description: 接收会长职位的受让方角色数（targetUid 去重数，新会长数）
  guild_transfer_president_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 单个转让方平均发起的会长转让次数（总次数/转让方角色数，使用 NULLIF 防止除零）
coverage:
  scenarios:
    - 公会会长更迭监测：统计每日会长转让次数、涉及的转让方/受让方角色数与游戏服数，衡量公会权力交接活跃度
    - 受让方去向分析：通过 target_uv 观察会长职位流向哪些角色，识别新任会长群体
    - 公会稳定性评估：结合 server_uv 与转让频次，判断哪些服务器公会权力交接频繁
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认为 role_id（转让方/出让会长者）；受让方需经 GET_JSON_OBJECT(params,'$.targetUid') 提取
    - 事件名称含 targetUid，疑似同事件内既记录转让方快照也记录受让方 uid；未做源/目标同源校验
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测 cnt=20、role_uv=20、acc_uv=20、server_uv=14、target_uv=20，数值合理
external_refs: []
