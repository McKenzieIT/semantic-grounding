name: game.card.gacha
event_filter: event = 'game.card.gacha'
description: 抽卡事件：角色在卡池（武将/藏品/战法）进行抽卡时上报，记录每次抽卡的卡池类型、抽卡数量、消耗资源、抽卡结果卡列表、SSR数量、大保底触发与心愿达成。分析主体粒度为 role_id（角色），单次抽卡行为计为一条日志。ds=20260729 实测：cnt=64754，role_uv=4293，acc_uv=4030，server_uv=467；当日累计抽卡次数(gachaTimes合计) 359951，抽出SSR卡合计 10246。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  type:
    type: int
    description: 卡池类型 1武将 2藏品 3战法
  cardPoolId:
    type: int
    description: 卡池ID
  gachaTimes:
    type: int
    description: 抽卡数量
  cost:
    type: array
    description: 消耗资源
  cost.type:
    type: int
    description: 类型
  cost.value:
    type: int
    description: 值
  cost.size:
    type: int
    description: 数量
  cost.uid:
    type: int
    description: 唯一id
  free:
    type: int
    description: 是否免费
  ssrCnt:
    type: int
    description: 抽出ssr卡的数量
  ssrCoes:
    type: array
    description: 抽到ssr之前的抽卡次数
  totalCnt:
    type: int
    description: 当前卡池抽卡总次数
  wishList:
    type: array
    description: 心愿单
  wishList.type:
    type: int
    description: 类型
  wishList.id:
    type: int
    description: id
  cardList:
    type: array
    description: 抽卡结果
  cardList.type:
    type: int
    description: 类型
  cardList.id:
    type: int
    description: id
  cardList.amount:
    type: int
    description: 数量
  guarantee:
    type: int
    description: 有大保底触发
  cometrue:
    type: int
    description: 心愿达成次数
metrics:
  game_card_gacha_cnt:
    expression: COUNT(*)
    description: 抽卡日志条数（每次抽卡行为一条）
  game_card_gacha_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发起抽卡的角色去重数（分析主体粒度 role_id）
  game_card_gacha_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发起抽卡的账号去重数
  game_card_gacha_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及抽卡的游戏服去重数
  game_card_gacha_pulls_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.gachaTimes') AS BIGINT))
    description: 当期累计抽卡次数（gachaTimes 求和）
  game_card_gacha_ssr_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.ssrCnt') AS BIGINT))
    description: 当期累计抽出 SSR 卡数量（ssrCnt 求和）
  game_card_gacha_pool_total_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.totalCnt') AS BIGINT))
    description: 当期累计卡池抽卡总次数（totalCnt 求和，状态快照累加）
  game_card_gacha_free_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.free')='1' THEN 1 ELSE 0 END)
    description: 免费抽卡次数（free=1）
  game_card_gacha_guarantee_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.guarantee')='1' THEN 1 ELSE 0 END)
    description: 触发大保底的抽卡次数（guarantee=1）
  game_card_gacha_cometrue_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.cometrue') AS BIGINT))
    description: 心愿达成次数合计（cometrue 求和）
  game_card_gacha_ssr_rate:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.ssrCnt') AS BIGINT)) / NULLIF(SUM(CAST(GET_JSON_OBJECT(params,'$.gachaTimes') AS BIGINT)),0)
    description: SSR 出货率 = SSR 累计数 / 累计抽卡次数（NULLIF 防零除）
coverage:
  scenarios:
    - 通过 role_uv/account_uv 评估抽卡玩法的角色/账号渗透规模
    - 通过 pulls_sum、ssr_sum、ssr_rate 衡量抽卡产出与 SSR 出货率，辅助卡池概率调优
    - 通过 guarantee_cnt、cometrue_sum 监控大保底触发与心愿达成次数，评估保底/心愿机制投入产出
    - 通过 server_uv 与按服维度聚合，定位高活跃抽卡服
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核；多日趋势需另行批量校验
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角色复抽做去重校验
    - cost（消耗资源）与 cardList（抽卡结果卡列表）、wishList 为数组参数，未在本事件 metrics 内展开逐元素求和，如需按消耗资源类型聚合需单独建模
    - ssr_rate 分母为 gachaTimes 求和（抽卡次数），与 cardList 抽出卡总数口径可能不同，仅作 SSR/抽次比参考
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=64754, role_uv=4293, acc_uv=4030, server_uv=467; gachaTimes合计=359951, ssrCnt合计=10246, totalCnt合计=14507499, free=1次数=64754, guarantee=1次数=759, cometrue合计=6693。数值合理，event+ds 双过滤命中，确认在线可查。
coverage_status: analyst_confirmed
