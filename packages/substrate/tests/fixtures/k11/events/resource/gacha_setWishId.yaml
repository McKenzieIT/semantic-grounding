name: game.gacha.setWishId
event_filter: event = 'game.gacha.setWishId'
description: 玩家在卡池设置心愿目标时触发的事件，记录设置的卡池id(gachaId)与心愿目标id列表(ids)。分析主体粒度为 role_id（角色）。scout 实测 ds=20260729：cnt=2492, role_uv=1466, acc_uv=1396, server_uv=190。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  gachaId:
    type: int
    description: 卡池id
  ids:
    type: array
    description: 心愿目标ids
  specialId:
    type: int
    description: 新手集市id，id=0表示普通卡池
metrics:
  game_gacha_setWishId_cnt:
    expression: COUNT(*)
    description: 心愿目标设置事件总次数
  game_gacha_setWishId_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置过心愿目标的去重角色数
  game_gacha_setWishId_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置过心愿目标的去重账号数
  game_gacha_setWishId_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数
  game_gacha_setWishId_gacha_pool_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.gachaId'))
    description: 涉及的去重卡池数
  game_gacha_setWishId_ids_filled_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.ids') IS NOT NULL THEN 1 ELSE 0 END)
    description: 携带心愿目标 ids 列表的事件数
  game_gacha_setWishId_per_role_rate:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均设置心愿目标事件次数（cnt/role_uv）
coverage:
  scenarios:
    - 卡池心愿目标玩法的渗透度（设置心愿的角色/账号/服务器覆盖）
    - 不同卡池(gachaId)的心愿设置分布
    - 人均设置次数反映心愿玩法的使用强度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核
    - 分析主体粒度默认 role_id；ids 为数组参数未逐元素展开统计
    - params_fields 声明的 specialId 在实测样本中未出现于 params（疑似下线/未上报），相关指标未写入
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "measured ds=20260729: cnt=2492, role_uv=1466, acc_uv=1396, server_uv=190, gacha_pool_uv=3"
coverage_status: analyst_confirmed
external_refs: []
