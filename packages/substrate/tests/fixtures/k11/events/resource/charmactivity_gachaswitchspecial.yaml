name: game.charmactivity.gachaswitchspecial
event_filter: event = 'game.charmactivity.gachaswitchspecial'
description: 灵器活动-切换新手集市卡池：角色在灵器活动内切换至新手集市卡池时上报，记录卡池切换行为及当前关键货币持有。分析主体粒度为 role_id（角色），每次切换新手集市卡池计为一条日志。ds=20260729 实测：cnt=177，role_uv=177，acc_uv=177，server_uv=7；切换覆盖 7 个游戏服、177 个角色，当日人均仅切换 1 次（cnt=role_uv）。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动id
  gachaIds:
    type: array
    description: 卡池id列表
metrics:
  game_charmactivity_gachaswitchspecial_cnt:
    expression: COUNT(*)
    description: 切换新手集市卡池日志条数（每次切换一条）
  game_charmactivity_gachaswitchspecial_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 切换新手集市卡池的角色去重数（分析主体粒度 role_id）
  game_charmactivity_gachaswitchspecial_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 切换新手集市卡池的账号去重数
  game_charmactivity_gachaswitchspecial_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及切换新手集市卡池的游戏服去重数
  game_charmactivity_gachaswitchspecial_activity_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.activityId'))
    description: 涉及的灵器活动 id 去重数
coverage:
  scenarios:
    - 通过 role_uv/account_uv 评估新手集市卡池切换玩法的角色/账号渗透规模
    - 通过 server_uv 与按服维度聚合，定位新手集市卡池切换的活跃服
    - 通过 activity_uv 识别哪些灵器活动开放了新手集市卡池切换入口
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量多日复核；多日趋势需另行批量校验
    - 分析主体粒度默认 role_id（角色），未对 account_id 跨角色复切做去重校验
    - gachaIds（卡池id列表）为数组参数，未在本事件 metrics 内展开逐元素求和，如需按卡池维度聚合需单独建模
    - 当日 cnt=role_uv（177=177），说明样本角色当日均仅切换 1 次，人均切换频次指标在该样本下退化为 1，跨日复核后才有统计意义
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=177, role_uv=177, acc_uv=177, server_uv=7；event+ds 双过滤命中，数值合理（177 角色覆盖 7 服，人均切换 1 次），确认在线可查。
coverage_status: analyst_confirmed
external_refs: []
