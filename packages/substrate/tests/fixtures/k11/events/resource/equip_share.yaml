name: game.equip.share
event_filter: event = 'game.equip.share'
description: 装备分享事件：玩家在游戏内分享某件装备时触发（equipUid/equipId 标识被分享装备）。分析主体为 role_id（角色维度），account_id 为账号维度。日志实测 ds=20260729：共 3 次分享，来自 2 个角色 / 2 个账号 / 2 个游戏服，分享装备 equipId 含 612002、813008、211014 等。
domains:
  - 装备道具
domain: resource
tech_domain: resource
metrics:
  game_equip_share_cnt:
    expression: COUNT(*)
    description: 装备分享事件总次数
  game_equip_share_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 分享装备的去重角色数
  game_equip_share_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 分享装备的去重账号数
  game_equip_share_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 分享装备涉及的去重游戏服数
  game_equip_share_equip_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.equipUid'))
    description: 分享出去重装备唯一id数
coverage:
  scenarios:
    - 装备分享功能使用规模（次数、角色数、账号数、游戏服数）
    - 不同服务器间装备分享热度分布
    - 被分享装备的唯一性与覆盖广度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色维度），未单独验证 account 级去重差异
    - 单日样本量较小（cnt=3），趋势/异常结论需多日数据支撑
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  equipUid:
    type: int
    description: 装备唯一id
  equipId:
    type: int
    description: 装备配置id
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=3, role_uv=2, acc_uv=2, server_uv=2；equipUid/equipId/roleLevel 等 params 字段均有真实值（如 equipId=612002/813008/211014）
coverage_status: analyst_confirmed
external_refs: []
