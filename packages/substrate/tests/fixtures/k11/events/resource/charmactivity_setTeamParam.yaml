name: game.charmactivity.setTeamParam
event_filter: event = 'game.charmactivity.setTeamParam'
description: 灵器活动-设置队伍信息事件。记录玩家在灵器活动（charmactivity）玩法中配置队伍信息（entries.unitId 队伍成员位、entries.spCaptain 队长标记）的操作，每次设置队伍触发一条日志，附带角色基础属性与关键货币快照。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。scout 实测 ds=20260729 cnt=0、ds=20260728 cnt=0——日志中零命中，事件疑似下线/未触发或未上报到该视图。
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  entries:
    type: array
    description: entries
  entries.unitId:
    type: int
    description: entries.unitId
  entries.spCaptain:
    type: int
    description: entries.spCaptain
metrics:
  game_charmactivity_setTeamParam_cnt:
    expression: COUNT(*)
    description: 灵器活动设置队伍信息事件总记录数
  game_charmactivity_setTeamParam_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置过灵器活动队伍的角色数（去重）
  game_charmactivity_setTeamParam_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置过灵器活动队伍的账号数（去重）
  game_charmactivity_setTeamParam_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及灵器活动设置队伍的游戏服数量（去重）
  game_charmactivity_setTeamParam_session_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.sessionId'))
    description: 灵器活动设置队伍事件覆盖的会话数（sessionId 去重）
coverage:
  scenarios:
    - 灵器活动队伍设置参与度与活跃角色/账号/服数（role_uv / account_uv / server_uv / session_uv）
    - 灵器活动队伍配置操作频次（cnt）
  limitations:
    - 日志中零命中(ds=20260729 与 ds=20260728 双日 scout cnt=0)，疑似下线/未触发/未上报到 ods_10000251_all_view
    - 仅 ds=20260729 与 ds=20260728 双日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度）；account_id 可作账号粒度补充
    - entries 数组（unitId/spCaptain 队伍位与队长标记）粒度明细未做拆解，仅提供事件级聚合指标
  granularity: role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729 cnt=0、ds=20260728 cnt=0，双日零命中。事件疑似下线/未触发，维持 draft，仅写入指标定义待真实数据复核后再 confirm。
coverage_status: draft
external_refs: []
