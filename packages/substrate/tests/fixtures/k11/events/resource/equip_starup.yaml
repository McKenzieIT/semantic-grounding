name: game.equip.starup
event_filter: event = 'game.equip.starup'
description: 装备升星事件：角色(role_id)对某件装备(uid)执行升星操作，单次提升 upstar 颗星，伴随角色基础属性(roleLevel/vipLevel/roleForce/exp)与关键货币快照(coinList)上报。分析粒度为 role_id（角色级事件）。ds=20260729 单日 scout 实测 cnt=0 / role_uv=0 / acc_uv=0 / server_uv=0，ds=20260728 同样零命中，事件疑似下线或未触发。
domains:
  - 装备道具
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  uid:
    type: int
    description: 装备uid
  upstar:
    type: int
    description: 提升的星数
metrics:
  equip_starup_cnt:
    expression: COUNT(*)
    description: 装备升星总次数
  equip_starup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与装备升星的活跃角色数
  equip_starup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与装备升星的活跃账号数
  equip_starup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生装备升星的游戏服数
  equip_starup_upstar_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.upstar') AS BIGINT))
    description: 升星总星数（单次提升星数累加）
  equip_starup_equip_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.uid'))
    description: 被升星的装备uid去重数
  equip_starup_per_role:
    expression: ROUND(CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0), 2)
    description: 人均升星次数（总次数/参与角色数）
coverage:
  scenarios:
    - 装备升星参与度（角色/账号/服务器覆盖）
    - 升星总星数与人均升星频次
    - 被升星装备uid覆盖广度
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析粒度默认 role_id（角色级事件）
    - coinList 为货币快照数组，未在指标层展开逐条统计
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: ds=20260729 scout 实测 cnt=0, role_uv=0, acc_uv=0, server_uv=0；ds=20260728 同样零命中，事件疑似下线/未触发
external_refs: []
