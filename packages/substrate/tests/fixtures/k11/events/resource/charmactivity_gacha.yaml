name: game.charmactivity.gacha
event_filter: event = 'game.charmactivity.gacha'
description: 灵器活动抽卡事件：角色在灵器活动卡池（type=1 活动 / type=2 新手集市）进行抽卡时上报，记录每次抽卡的卡池id、抽卡数量(count)、累计总次数(totalCount)、抽卡消耗(costs)、获得资源(gainRes/realRes)、命中灵器次数(hitCounts)、是否触发保底(guarantee)。分析主体粒度为 role_id（角色），单次抽卡行为计为一条日志。ds=20260729 实测：cnt=1285，role_uv=245，acc_uv=245，server_uv=7；当日累计抽卡次数(count合计) 3283，累计总次数(totalCount合计) 34461，触发保底次数 36，涉及卡池去重 5、活动去重 1。
domains:
  - 探索收集
domain: resource
