name: game.pitchpot
event_filter: event = 'game.pitchpot'
description: 探索收集-投壶玩法事件：角色在投壶活动中进行投壶（含一键投壶）时上报，含活动id(pitchpotId)、当前层数(floor)、本层投壶次数(count)、累计总次数(totalCount)、命中索引(hitIndices)、本次获得道具(itemIds)、是否通层(isFloorClear)等投壶进度字段，并带角色快照(等级/vip/战力/经验)与货币列表。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。scout 实测 ds=20260729/20260728 均零命中（cnt=0），事件疑似下线或当前版本未触发。原参数说明：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等29个
domains:
  - 探索收集
domain: resource
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  pitchpotId:
    type: int
    description: 投壶活动id
  floor:
    type: int
    description: 投壶开始时的层数
  count:
    type: int
    description: 投壶结束后的本层投壶次数
  totalCount:
    type: int
    description: 投壶结束后的总次数
  itemIds:
    type: array
    description: 本次（含 onekey）获得的道具id列表
  hitIndices:
    type: array
    description: 命中的索引列表
  isFloorClear:
    type: bool
    description: 是否完成通层
metrics:
  pitchpot_cnt:
    description: 投壶事件总次数（含一键投壶）
    expression: COUNT(*)
  pitchpot_role_uv:
    description: 参与投壶的去重角色数（分析主体粒度）
    expression: COUNT(DISTINCT role_id)
  pitchpot_account_uv:
    description: 参与投壶的去重账号数
    expression: COUNT(DISTINCT account_id)
  pitchpot_server_uv:
    description: 产生投壶行为的去重游戏服数
    expression: COUNT(DISTINCT server_id)
  pitchpot_activity_uv:
    description: 触发的去重投壶活动数（按 pitchpotId）
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.pitchpotId'))
  pitchpot_total_count_sum:
    description: 投壶累计总次数之和（按 totalCount，反映投壶产出总量）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.totalCount') AS BIGINT))
  pitchpot_floor_count_sum:
    description: 本层投壶次数之和（按 count，反映单层投壶密度）
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
  pitchpot_floor_clear_role_uv:
    description: 完成通层的去重角色数（isFloorClear=true）
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params, '$.isFloorClear') = 'true' THEN role_id END)
  pitchpot_per_role:
    description: 人均投壶次数（总次数/去重角色数，分母为0时返回NULL）
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
coverage:
  scenarios:
    - 投壶玩法参与度与产出（每日投壶总次数/角色覆盖度/人均次数）
    - 投壶活动与层数进度（活动维度参与分布、通层率漏斗、单层投壶密度）
    - 服务器维度投壶分布（识别活动/玩法投放效果差异）
  limitations:
    - scout 实测 ds=20260729 与 ds=20260728 均零命中（cnt=0/role_uv=0/acc_uv=0），事件疑似下线或当前版本未触发，上述指标实测值均为0
    - 仅 ds=20260729/ds=20260728 双日 scout 实测，未做全量复核；待事件恢复上报后需复测
    - 分析主体默认 role_id（角色粒度），账号粒度 account_id 为补充
    - isFloorClear 为 bool，通过字符串等值判断（GET_JSON_OBJECT 返回 "true"/"false"），bool 解析口径以日志上报格式为准
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；retry ds=20260728 仍为0；零命中，事件疑似下线/未触发，保持 draft"
external_refs: []
