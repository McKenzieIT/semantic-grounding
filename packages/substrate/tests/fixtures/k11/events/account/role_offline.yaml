name: game.role.offline
event_filter: event = 'game.role.offline'
description: 角色下线事件：玩家登出游戏时触发的日志，记录本次会话在线时长 duration、下线时间 logoutTime、角色等级、VIP 等级、战力及武将/装备/货币等完整快照。主体粒度为 role_id（角色级），覆盖 account_id 账号。实测 ds=20260729 单日 14059 条、4730 角色、4392 账号、484 服。
metrics:
  game_role_offline_cnt:
    expression: COUNT(*)
    description: 角色下线事件总次数
  game_role_offline_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 下线去重角色数
  game_role_offline_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 下线去重账号数
  game_role_offline_duration_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.duration') AS BIGINT))
    description: 下线事件累计在线时长（秒），来自 params.duration
coverage:
  scenarios:
    - 用于分析玩家活跃度、下线频次、在线时长分布及账号/角色/服务器维度的登出规模，支撑用户生命周期留存与流失研究
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认为 role_id；duration 为会话级单次在线时长，非累计总在线时长
domains:
  - 用户生命周期
domain: account
