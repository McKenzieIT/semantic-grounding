metrics:
  game_role_snapshot_cnt:
    expression: COUNT(*)
    description: 在线角色快照总记录数
  game_role_snapshot_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 快照去重角色数（在线角色规模）
  game_role_snapshot_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 快照去重账号数
  game_role_snapshot_force_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.roleForce') AS BIGINT))
    description: 在线角色战力总和（全服在线战力快照）
coverage:
  scenarios:
    - 在线角色规模与活跃度快照（总记录数、去重角色数、去重账号数）
    - 全服在线战力总览（在线角色战力总和，支撑战力分布与大盘监控）
    - 快照在服务器/平台维度的覆盖广度（去重服务器数）
  limitations:
    - 仅 ds=20260729 单日 scout 实测(cnt=302, role_uv=302, acc_uv=301, server_uv=94)，未做全量复核
    - subject 粒度默认 role_id（account 域 role_* 事件），单角色多次快照以 role_id 去重
    - roleForce 为角色战力状态值，SUM 仅为在线战力大盘参考，未做分服/分等级分布
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout 单日实测 ds=20260729 命中 302 条/302 角色/301 账号/94 服务器，roleForce/roleLevel/vipLevel 等字段经 GET_JSON_OBJECT 可读
external_refs: []
