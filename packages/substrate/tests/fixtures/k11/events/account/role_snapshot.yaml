name: game.role.snapshot
event_filter: event = 'game.role.snapshot'
description: |-
  在线玩家角色快照事件：周期性记录在线玩家的完整角色状态（角色等级、vip等级、角色战力、货币余额、武将阵容、日常/周常任务进度、天命方案等72个参数），用于重建玩家画像、战力分布与活跃度快照。主体粒度 role_id（account 域 role_* 事件，每条记录=1在线角色的全量快照）。实测 ds=20260729 单日命中 302 条/302 角色/301 账号/94 服务器。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等72个
domains:
  - 用户生命周期
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
