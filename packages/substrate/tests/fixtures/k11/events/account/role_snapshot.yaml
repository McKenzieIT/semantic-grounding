  dailyTask.point:
    type: int
    description: 经验点数
  dailyTask.result:
    type: int
    description: 是否已领奖（1已领奖、0未领奖）
  weeklyTask:
    type: array
    description: 周常任务列表
  weeklyTask.id:
    type: int
    description: 任务id
  weeklyTask.point:
    type: int
    description: 经验点数
  weeklyTask.result:
    type: int
    description: 是否已领奖（1已领奖、0未领奖）
  cardList:
    type: array
    description: 武将列表
  cardList.id:
