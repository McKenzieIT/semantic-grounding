name: game.role.changeCard
event_filter: event = 'game.role.changeCard'
description: 玩家修改个人名帖(card)事件，记录玩家更换展示名帖的行为。每次更换记一条日志，参数含游戏服id、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、新名帖id(card) 等23个字段，可用于分析名帖换装活跃度与玩家偏好。
domains:
  - 用户生命周期
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  card:
    type: int
    description: 玩家名帖
metrics:
  changeCard_cnt:
    expression: COUNT(*)
    description: 玩家名帖修改总次数
  changeCard_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 修改名帖的去重角色数
  changeCard_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 修改名帖的去重账号数
  changeCard_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发名帖修改的去重服务器数
  changeCard_card_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.card'))
    description: 被选用的去重名帖id数
  changeCard_avg_per_role:
    expression: ROUND(COUNT(*) * 1.0 / NULLIF(COUNT(DISTINCT role_id),0), 3)
    description: 人均名帖修改次数（总次数/去重角色数）
coverage:
  scenarios:
    - 玩家名帖换装活跃度（总次数、去重角色数、去重账号数）
    - 名帖偏好分布（被选用的去重名帖id数）
    - 名帖换装在服务器/平台维度的覆盖广度
  limitations:
    - 仅 ds=20260729 单日 scout 实测(cnt=27, role_uv=24, acc_uv=24)，未做全量复核
    - subject 粒度默认 role_id（account 域 role_* 事件），未逐事件实测角色级聚合准确性
    - card 字段为名帖id，仅统计去重数，未做名帖id分布直方图
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 单日实测 ds=20260729 命中 27 条/24 角色/24 账号，card/roleId/roleLevel 字段均经 GET_JSON_OBJECT 验证可读
external_refs: []
