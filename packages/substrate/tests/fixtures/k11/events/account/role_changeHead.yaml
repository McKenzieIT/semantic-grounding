name: game.role.changeHead
event_filter: event = 'game.role.changeHead'
description: 玩家修改头像或头像框时上报的事件（game.role.changeHead），记录角色更换头像/头像框的行为，含 headId 指明切换到的目标头像id。主体粒度为 role_id（角色），可聚合到 account_id 与 server_id。ds=20260729 单日实测：事件 368 条、角色 303、账号 301、服务器 68。
domains:
  - 用户生命周期
domain: account
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  headId:
    type: int
    description: 头像id/头像框id
metrics:
  game_role_changehead_cnt:
    expression: COUNT(*)
    description: 修改头像/头像框事件总次数
  game_role_changehead_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 修改头像的去重角色数
  game_role_changehead_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 修改头像的去重账号数
  game_role_changehead_head_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.headId'))
    description: 命中的去重头像/头像框id数量
coverage:
  scenarios:
    - 角色头像/头像框更换行为频次与覆盖角色/账号规模
    - 不同头像id的热度分布（哪些头像更受青睐）
    - 跨服务器头像更换活跃度对比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id；账号级聚合可能因多角色同账号而低于角色级
    - head_uv 依赖 params.headId 字段上报完整性，空值不计入去重
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 单日 scout 实测：cnt=368, role_uv=303, acc_uv=301, server_uv=68，数据量合理
  coverage_status: analyst_confirmed
external_refs: []
