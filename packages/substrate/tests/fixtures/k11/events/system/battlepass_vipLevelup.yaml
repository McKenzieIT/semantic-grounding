name: game.battlepass.vipLevelup
event_filter: event = 'game.battlepass.vipLevelup'
description: 战令-VIP等级提升事件：角色在战令系统中提升VIP等级时上报，携带新旧VIP等级(newVipLevel/oldVipLevel)、新旧等级与经验、本次获得的战令经验(battlePassExp)、战令id、商品id等。分析主体粒度为 role_id（角色）。ds=20260729 实测：cnt=21 条日志，role_uv=20，account_uv=20，server_uv=11，全部21条均发生 newVipLevel>oldVipLevel 的实际升级，battlePassExp 合计 1500。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  goodsId:
    type: int
    description: 商品id
  battlepassId:
    type: int
    description: 战令id
  oldVipLevel:
    type: int
    description: 旧vip等级
  newVipLevel:
    type: int
    description: 新vip等级
  battlePassExp:
    type: int
    description: 获得的战令经验
  oldLevel:
    type: int
    description: 旧等级
  oldExp:
    type: int
    description: 旧经验
  newLevel:
    type: int
    description: 新等级
  newExp:
    type: int
    description: 新经验
metrics:
  game_battlepass_vip_levelup_cnt:
    expression: COUNT(*)
    description: 战令VIP升级事件总次数
  game_battlepass_vip_levelup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发生战令VIP升级的独立角色数
  game_battlepass_vip_levelup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发生战令VIP升级的独立账号数
  game_battlepass_vip_levelup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生战令VIP升级的独立游戏服数
  game_battlepass_vip_levelup_exp_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.battlePassExp') AS BIGINT))
    description: 战令VIP升级获得的总战令经验
  game_battlepass_vip_levelup_real_levelup_cnt:
    expression: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.newVipLevel') AS INT) > CAST(GET_JSON_OBJECT(params, '$.oldVipLevel') AS INT) THEN 1 ELSE 0 END)
    description: 实际发生VIP等级提升(newVipLevel>oldVipLevel)的事件次数
coverage:
  scenarios:
    - 战令VIP等级升级的活跃度与覆盖角色/账号/服务器规模
    - 战令经验产出总量(battlePassExp)分析
    - 实际VIP等级提升次数与上报次数一致性核对
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），如需账号粒度使用 account_uv 指标
    - 战令经验字段 battlePassExp 单日合计 1500，样本量较小(21条)，长尾/异常值未排查
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=21, role_uv=20, acc_uv=20, server_uv=11；battlePassExp 合计 1500；21条均满足 newVipLevel>oldVipLevel。数据合理，标记 analyst_confirmed。
coverage_status: analyst_confirmed
external_refs: []
