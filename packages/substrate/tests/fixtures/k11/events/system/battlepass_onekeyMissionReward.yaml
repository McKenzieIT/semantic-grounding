name: game.battlepass.onekeyMissionReward
event_filter: event = 'game.battlepass.onekeyMissionReward'
description: 战令系统一键领取任务奖励事件：玩家批量领取战令每日任务(dailyMissions)与期间任务(periodMissions)的奖励，记录获得的战令经验(battlePassExp)及领奖前后等级/经验(old/newLevel、old/newExp)。分析主体为 role_id（角色级事件，参数含 roleId/roleName/accountId）。实测 ds=20260729：26484 条事件、3919 角色、3699 账号、465 服务器。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  dailyMissions:
    type: array
    description: 领取奖励的每日任务id列表
  periodMissions:
    type: array
    description: 领取奖励的期间任务id列表
  battlePassExp:
    type: int
    description: 获得的战令经验
  oldLevel:
    type: int
    description: 旧等级
  oldExp:
    type: int
    description: 旧经验
  newLevel:
    type: int
    description: 新等级
  newExp:
    type: int
    description: 新经验
metrics:
  onekey_mission_reward_cnt:
    expression: COUNT(*)
    description: 一键领奖事件总次数
  onekey_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发一键领奖的去重角色数
  onekey_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发一键领奖的去重账号数
  onekey_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发一键领奖的去重服务器数
  onekey_mission_reward_bp_exp_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.battlePassExp') AS BIGINT))
    description: 一次领奖获得的战令经验总量
  onekey_mission_reward_leveled_up_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.newLevel') IS NOT NULL AND GET_JSON_OBJECT(params,'$.oldLevel') IS NOT NULL AND CAST(GET_JSON_OBJECT(params,'$.newLevel') AS BIGINT) > CAST(GET_JSON_OBJECT(params,'$.oldLevel') AS BIGINT) THEN 1 ELSE 0 END)
    description: 领奖后战令等级提升的事件次数
  onekey_mission_reward_leveled_up_rate:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.newLevel') IS NOT NULL AND GET_JSON_OBJECT(params,'$.oldLevel') IS NOT NULL AND CAST(GET_JSON_OBJECT(params,'$.newLevel') AS BIGINT) > CAST(GET_JSON_OBJECT(params,'$.oldLevel') AS BIGINT) THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0)
    description: 领奖触发等级提升的事件占比
coverage:
  scenarios:
    - 战令一键领奖功能使用规模与覆盖角色/账号/服务器数
    - 单日战令经验产出总量与人均产出
    - 一键领奖触发战令等级提升的频次与占比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认为 role_id（角色级事件，参数含 roleId/roleName）
    - periodMissions 字段单日非空仅 1 条，期间任务领奖覆盖度低
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
coverage_status: analyst_confirmed
external_refs: []
