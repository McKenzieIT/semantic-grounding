name: game.train.collection
event_filter: event = 'game.train.collection'
description: 藏品收集养成事件：玩家在游戏中收集/养成藏品（collectionId/collectionName），归属于某套装（suitId/suitName），事件携带触发时刻的角色快照（roleLevel/roleForce/vipLevel/exp 等26个参数，含 coinList 关键货币列表）。分析主体为 role_id（角色粒度，亦可按 account_id 汇总账号维度）。ds=20260729 单日实测：cnt=8213, role_uv=1830, acc_uv=1760, server_uv=145, collection_uv=109, suit_uv=16。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  collectionId:
    type: int
    description: 藏品id
  collectionName:
    type: string
    description: 藏品名字
  suitId:
    type: int
    description: 套装id
  suitName:
    type: int
    description: 套装名字
metrics:
  train_collection_cnt:
    expression: COUNT(*)
    description: 藏品养成事件触发总次数
  train_collection_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发藏品养成的去重角色数（分析主体粒度）
  train_collection_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发藏品养成的去重账号数
  train_collection_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发藏品养成的去重游戏服数
  train_collection_collection_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.collectionId'))
    description: 单日触达的不同藏品id数量（藏品丰富度）
  train_collection_suit_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.suitId'))
    description: 单日触达的不同套装id数量
  train_collection_per_role_cnt:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均藏品养成触发次数（总次数/角色uv）
coverage:
  scenarios:
    - 藏品养成活跃度：每日藏品养成触发次数与覆盖角色/账号/服务器数
    - 藏品丰富度：单日触达的不同藏品id与套装id数量
    - 人均养成强度：人均触发次数（总次数/角色uv）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - coinList 为数组字段，未做货币维度 SUM 聚合验证（GET_JSON_OBJECT 数组语义未实测）
    - 分析主体默认 role_id（角色粒度），账号维度 account_id 可作辅助汇总
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=8213, role_uv=1830, acc_uv=1760, server_uv=145, collection_uv=109, suit_uv=16; 数值合理(role_uv>acc_uv>0, server_uv=145 合理)。事件加速键 event+ds 命中。"
coverage_status: analyst_confirmed
external_refs: []
