name: game.artifact.reinforce
event_filter: event = 'game.artifact.reinforce'
description: 兵符强化事件 (artifact.reinforce)：角色对兵符(artifact)执行强化操作时上报，记录强化次数、强化职业、强化前后兵符星级与附加/随机属性。分析主体粒度为 role_id（角色），即每次强化由具体角色触发，可统计角色强化参与度、人均强化次数、兵符星级分布。参数：游戏服id/名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表、会话id、logUUID、强化职业(job)、强化次数(count)、强化兵符(artifact.uid/cfgId/star、artifact.addAttrs、artifact.randAttrs) 等37个。ds=20260729 实测单日 cnt=10427、role_uv=1460、acc_uv=1396、server_uv=186、强化次数总和 35149。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  job:
    type: int
    description: 强化职业
  count:
    type: int
    description: 强化次数
  artifact:
    type: json
    description: 强化兵符
  artifact.uid:
    type: int
    description: artifact.uid
  artifact.cfgId:
    type: int
    description: artifact.cfgId
  artifact.star:
    type: int
    description: artifact.star
  artifact.addAttrs:
    type: array
    description: artifact.addAttrs
  artifact.addAttrs.attrId:
    type: int
    description: artifact.addAttrs.attrId
  artifact.addAttrs.attrValue:
    type: int
    description: artifact.addAttrs.attrValue
  artifact.randAttrs:
    type: array
    description: artifact.randAttrs
  artifact.randAttrs.cellId:
    type: int
    description: artifact.randAttrs.cellId
  artifact.randAttrs.attrId:
    type: int
    description: artifact.randAttrs.attrId
  artifact.randAttrs.attrValue:
    type: int
    description: artifact.randAttrs.attrValue
  artifact.randAttrs.cfgId:
    type: int
    description: artifact.randAttrs.cfgId
  artifact.randAttrs.type:
    type: int
    description: artifact.randAttrs.type
metrics:
  game_artifact_reinforce_cnt:
    expression: COUNT(*)
    description: 兵符强化事件总数（记录条数）
  game_artifact_reinforce_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与兵符强化的去重角色数
  game_artifact_reinforce_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与兵符强化的去重账号数
  game_artifact_reinforce_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发兵符强化的去重服务器数
  game_artifact_reinforce_total_cnt:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
    description: 兵符强化操作次数总和（来自 params.count 强化次数字段）
  game_artifact_reinforce_avg_cnt_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 参与角色的平均强化次数（强化次数总和 / 去重角色数，分母为0返回NULL）
coverage:
  scenarios:
    - 角色成长-兵符强化参与度：统计参与强化的角色/账号/服务器规模与渗透率
    - 兵符强化活跃度：通过强化次数总和与人均强化次数评估该玩法热度与角色投入度
    - 兵符强化服务器分布：识别强化最活跃的服务器，辅助运营关注与跨服对比
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；多日趋势与节假日表现未覆盖
    - 分析主体默认为 role_id（角色粒度），未对 account_id 账号粒度做交叉复核
    - params.count 字段在单日实测下全部可解析求和（35149），但未抽样核对该字段对 NULL/异常值的容错
    - 兵符星级/属性分布未在本次 scout 中实测，相关指标未写入
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: 实测 ds=20260729 单日：cnt=10427、role_uv=1460、acc_uv=1396、server_uv=186；强化次数总和(params.count SUM)=35149；数字合理，事件在线且高频
coverage_status: analyst_confirmed
external_refs: []
