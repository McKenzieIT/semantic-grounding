name: game.battlepass.buyExp
event_filter: event = 'game.battlepass.buyExp'
description: 战令购买经验事件：玩家在战令系统中购买经验以推进战令进度。记录购买前后角色等级与经验变化（oldLevel/oldExp→newLevel/newExp）、购买经验量（exp）及购买时各货币余额（coinList.gold/diamond/expCoin/energy 等）。分析主体为 role_id（角色粒度），可按 server_id/account_id 维度聚合。scout 实测 ds=20260729 与 ds=20260728 均零命中，事件疑似下线或未触发。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  oldLevel:
    type: int
    description: 旧等级
  oldExp:
    type: int
    description: 旧经验
  newLevel:
    type: int
    description: 新等级
  newExp:
    type: int
    description: 新经验
metrics:
  game_battlepass_buyexp_cnt:
    expression: COUNT(*)
    description: 战令购买经验事件总次数
  game_battlepass_buyexp_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 购买战令经验的去重角色数
  game_battlepass_buyexp_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 购买战令经验的去重账号数
  game_battlepass_buyexp_gain_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.exp') AS BIGINT))
    description: 战令购买经验总增量（exp 字段求和）
  game_battlepass_buyexp_level_up_cnt:
    expression: SUM(CASE WHEN CAST(GET_JSON_OBJECT(params, '$.newLevel') AS BIGINT) > CAST(GET_JSON_OBJECT(params, '$.oldLevel') AS BIGINT) THEN 1 ELSE 0 END)
    description: 因购买经验导致角色等级提升的事件次数
coverage:
  scenarios:
    - 战令购买经验的日活/参与角色数与账号数趋势
    - 战令经验增量（exp）总量与人均，识别经验获取节奏
    - 购买经验触发等级提升的频次，评估战令等级推进效率
  limitations:
    - 日志中零命中（ds=20260729 与 ds=20260728 cnt=0/role_uv=0/acc_uv=0/server_uv=0），事件疑似下线或未触发，所有指标实测值均为 0
    - 仅 scout 单日双日实测（ds=20260729/20260728），未做全量复核
    - 分析主体默认 role_id（角色粒度），未在事件级校验 account_id 主键唯一性
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0, role_uv=0, acc_uv=0, server_uv=0; ds=20260728: cnt=0, role_uv=0, acc_uv=0, server_uv=0 —— 零命中，事件疑似下线/未触发"
coverage_status: draft
external_refs: []
