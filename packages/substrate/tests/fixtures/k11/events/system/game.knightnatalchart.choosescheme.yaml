name: game.knightnatalchart.choosescheme
event_filter: event = 'game.knightnatalchart.choosescheme'
description: 武将命盘-选择方案：玩家在武将命盘系统中为指定武将（knightId）选择一套命盘方案（scheme）时触发的行为事件，记录选方案操作本身及其携带的角色与货币快照（coinList 等24个参数）。分析主体为 role_id（角色），可用于度量命盘系统的活跃使用度、方案选择渗透率与各武将的命盘热度。scout 实测 ds=20260729 单日 cnt=1678、role_uv=256、acc_uv=253、server_uv=114。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  scheme:
    type: int
    description: 方案
metrics:
  choosescheme_cnt:
    expression: COUNT(*)
    description: 命盘方案选择事件总次数（每条日志=一次选方案操作）
  choosescheme_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发过命盘方案选择的角色数（去重 role_id）
  choosescheme_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发过命盘方案选择的账号数（去重 account_id）
  choosescheme_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发过命盘方案选择的游戏服数（去重 server_id）
  choosescheme_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.knightId'))
    description: 被选择过命盘方案的武将种类数（去重 params.knightId）
  choosescheme_role_per_role_avg:
    expression: CAST(choosescheme_cnt AS DOUBLE) / NULLIF(choosescheme_role_uv, 0)
    description: 平均每个角色选择命盘方案的次数（事件次数/角色数）
coverage:
  scenarios:
    - 度量武将命盘系统的日/区间活跃使用度与选方案渗透率（事件次数、角色数、账号数、游戏服数）
    - 评估命盘方案选择的人均频次（choosescheme_role_per_role_avg）以判断系统黏性
    - 统计被选方案的武将种类覆盖（choosescheme_knight_uv）辅助识别热门武将
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；指标真实量级以单日为准，区间值需另行复算
    - 分析主体默认 role_id（角色粒度），role_id 同时存在于 base 视图列与 params.roleId，此处以 base 视图 role_id 去重计数
    - choosescheme_knight_uv 依赖 GET_JSON_OBJECT(params,'$.knightId')，若个别日志缺该字段会被忽略
    - params 携带的 coinList 等快照字段未在 metrics 中聚合，仅作维度/快照参考
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=1678 / role_uv=256 / acc_uv=253 / server_uv=114，数值合理且 role_uv≈acc_uv 符合角色粒度，命盘系统在线且高频触发，故确认。
coverage_status: analyst_confirmed
external_refs: []
