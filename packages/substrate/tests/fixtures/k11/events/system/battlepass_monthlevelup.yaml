name: game.battlepass.monthlevelup
event_filter: event = 'game.battlepass.monthlevelup'
description: |-
  战令（玉简）月卡等级提升事件。角色完成战令等级提升时触发，区分普通升级(action=1)与购买升级(action=2)，并记录战令激活状态(普通/高级/珍藏版)。
  分析主体为 role_id（角色维度），账号维度作辅助。ds=20260729 实测 cnt=7507，role_uv=3773，acc_uv=3579，server_uv=452。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  action:
    type: int
    description: 行为类型，1-普通升级 2-购买升级
  cfgId:
    type: int
    description: 战令配置id
  enabledStatus:
    type: int
    description: 战令激活状态，0-普通战令（未付费版）1-高级战令 2-珍藏版
  level:
    type: int
    description: 战令等级
metrics:
  battlepass_monthlevelup_cnt:
    expression: COUNT(*)
    description: 战令月卡等级提升总次数
  battlepass_monthlevelup_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发等级提升的去重角色数
  battlepass_monthlevelup_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发等级提升的去重账号数
  battlepass_monthlevelup_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发等级提升的去重游戏服数
  battlepass_monthlevelup_premium_role_uv:
    expression: COUNT(DISTINCT CASE WHEN CAST(GET_JSON_OBJECT(params,'$.enabledStatus') AS INT) IN (1,2) THEN role_id END)
    description: 高级/珍藏版战令（付费版）等级提升的去重角色数
  battlepass_monthlevelup_buyupgrade_cnt:
    expression: COUNT(CASE WHEN CAST(GET_JSON_OBJECT(params,'$.action') AS INT) = 2 THEN 1 END)
    description: 通过购买升级行为(action=2)的等级提升次数
  battlepass_monthlevelup_avg_cnt_per_role:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每角色等级提升次数（参与深度）
coverage:
  scenarios:
    - 战令月卡等级提升整体规模与参与角色/账号/游戏服数
    - 付费版战令(高级/珍藏) 与 普通版参与度对比
    - 普通升级(action=1) 与 购买升级(action=2) 行为占比
    - 平均每角色等级提升次数（参与深度）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色维度），账号维度作辅助
    - coinList 货币明细字段未纳入指标，如需货币产销需结合资源产销事件
    - level(战令等级)字段未做分布统计，仅做整体规模与参与度
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=7507, role_uv=3773, acc_uv=3579, server_uv=452"
coverage_status: analyst_confirmed
