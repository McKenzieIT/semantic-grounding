name: game.tactic.unwear
event_filter: event = 'game.tactic.unwear'
description: 战法脱下事件：角色从武将(knightId)身上卸下战法(tacticId)，记录卸下动作及卸下瞬间的角色/武将/战法上下文与货币快照。 分析主体为 role_id（角色级事件），ds=20260729 单日 scout 实测 cnt=220、role_uv=122、acc_uv=120、server_uv=47、tactic_uv=49、knight_uv=48。 参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等24个
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  tacticId:
    type: int
    description: 战法id
metrics:
  game_tactic_unwear_cnt:
    expression: COUNT(*)
    description: 战法脱下事件总次数（按行计）
  game_tactic_unwear_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发战法脱下的去重角色数（分析主体为 role_id）
  game_tactic_unwear_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发战法脱下的去重账号数
  game_tactic_unwear_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发战法脱下的去重游戏服数
  game_tactic_unwear_tactic_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.tacticId'))
    description: 被脱下战法的去重战法类型数（tacticId）
  game_tactic_unwear_knight_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.knightId'))
    description: 被卸下战法的目标武将去重数（knightId）
  game_tactic_unwear_per_role_cnt:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均战法脱下次数（总次数/去重角色数）
coverage:
  scenarios:
    - 量化每日/每周战法脱下频次，定位频繁换装的角色与武将，辅助装备策略与养成路径分析
    - 通过 tactic_uv/knight_uv 评估被替换战法与武将的覆盖广度，识别热门与冷门战法组合
    - 配合战法装备(game.tactic.wear)事件计算净战法换装量与流通趋势
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级事件），账号级/account_id 与角色级可能多对一
    - 仅记录卸下动作快照，不含卸下前后战法属性差值（需与战法属性表关联，本事件视图禁止 JOIN）
    - coinList 货币快照为脱下瞬间的余额值，非本次脱下的资源消耗
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=220、role_uv=122、acc_uv=120、server_uv=47、tactic_uv=49、knight_uv=48；数量合理，参数字段(tacticId/knightId/roleId)均可经 GET_JSON_OBJECT 取到，事件真实触发。"
coverage_status: analyst_confirmed
external_refs: []
