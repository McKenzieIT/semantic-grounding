name: game.mission.beginnerFinalReward
event_filter: event = 'game.mission.beginnerFinalReward'
description: |-
  养成任务（beginner）组最终奖励领取事件。当角色完成新手养成任务组并领取最终组奖励时上报，携带角色基础属性（等级/vip/战力/经验）及关键货币余额（充值钻石、赠送钻石、免费钻石、紫金、经验卷轴、体力）。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个
  分析主体为 role_id（角色粒度）。scout 实测 ds=20260729/20260728 日志零命中，事件疑似下线或未触发。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 任务组id
metrics:
  beginner_final_reward_cnt:
    expression: COUNT(*)
    description: 养成任务组最终奖励领取事件总条数
  beginner_final_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取养成任务组最终奖励的去重角色数（分析主体 role_id）
  beginner_final_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取养成任务组最终奖励的去重账号数
  beginner_final_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取养成任务组最终奖励的去重游戏服数
  beginner_final_reward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 养成任务组最终奖励涉及充值钻石总量
  beginner_final_reward_diamond_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.diamond') AS BIGINT))
    description: 养成任务组最终奖励涉及紫金总量
coverage:
  scenarios:
    - 新手养成任务组最终奖励领取参与度（角色/账号/服务器 UV）
    - 养成任务组最终奖励发放的货币规模（充值钻石/紫金总量）
  limitations:
    - 日志中零命中(ds=20260729 cnt=0, ds=20260728 cnt=0)，疑似下线/未触发
    - 仅 ds=20260729/20260728 两日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），未交叉验证 account 粒度
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0; ds=20260728: cnt=0/role_uv=0/acc_uv=0; 零命中，事件疑似下线/未触发，保留 draft"
coverage_status: draft
