name: game.battlepass.reward
event_filter: event = 'game.battlepass.reward'
description: 玩家在战令系统中领取奖励时上报的行为事件，记录领取的战令id、战令等级、指定领取标记(rewaredLevel，0=一键领取)、普通奖励等级数组与VIP奖励等级数组。分析主体为角色(role_id)，账号级聚合另用 account_id。实测 ds=20260729 单日事件量 7276 次，覆盖 3718 角色 / 3528 账号 / 454 服。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  battlepassId:
    type: int
    description: 战令id
  battlePassVipLevel:
    type: int
    description: vip等级
  battlepassLevel:
    type: int
    description: 战令等级
  rewaredLevel:
    type: int
    description: 指定领取，0 表示一键领取
  rewardedNormalLevel:
    type: array
    description: 普通奖励等级
  rewardedVipLevel:
    type: array
    description: vip奖励等级
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=7276, role_uv=3718, acc_uv=3528, server_uv=454；事件在线且数据量合理"
metrics:
  game_battlepass_reward_cnt:
    expression: COUNT(*)
    description: 战令领取奖励事件总次数（含一键领取与多等级领取）
  game_battlepass_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取战令奖励的去重角色数（分析主体）
  game_battlepass_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取战令奖励的去重账号数
  game_battlepass_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取战令奖励的去重游戏服数
  game_battlepass_reward_oneclick_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params, '$.rewaredLevel') = '0' THEN role_id END)
    description: 一键领取(rewaredLevel=0)的去重角色数
coverage:
  scenarios:
    - 战令系统领取活跃度：通过事件总量与去重角色/账号数衡量每日领取渗透
    - 领取角色覆盖：账号UV与角色UV对比，识别多角色账号领取行为
    - 一键领取渗透：rewaredLevel=0 角色占比反映一键领取功能使用情况
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id；账号级聚合需 account_id
    - 奖励等级数组字段(rewardedNormalLevel/rewardedVipLevel)未做展开统计
coverage_status: analyst_confirmed
external_refs: []
