name: game.mission.reward
event_filter: event = 'game.mission.reward'
description: "任务领奖事件：玩家完成游戏内任务（主线/支线/日常等，由 missionType 区分）后领取奖励时上报。分析主体为 role_id（角色级），可按 server_id 分服、按 missionType/missionId 下钻统计领奖行为与货币产出。scout 实测 ds=20260729/20260728 均零命中（事件疑似下线或当日未触发）。参数共25个，含游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表(coinList: gold/sendgold/freegold/diamond/expCoin/energy)、会话id、logUUID、任务类型、任务id、领取的最新阶段。"
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  missionType:
    type: int
    description: 任务类型
  missionId:
    type: int
    description: 任务id
  newSections:
    type: array
    description: 领取的最新阶段
metrics:
  game_mission_reward_cnt:
    expression: COUNT(*)
    description: 任务领奖事件总上报次数
  game_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领奖去重角色数（分析主体 role_id）
  game_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领奖去重账号数
  game_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领奖覆盖游戏服数
  game_mission_reward_mission_type_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.missionType'))
    description: 领奖涉及的任务类型数
  game_mission_reward_mission_cnt:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.missionId'))
    description: 领奖涉及的任务id数
  game_mission_reward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 领奖产出充值钻石总量
  game_mission_reward_diamond_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.diamond') AS BIGINT))
    description: 领奖产出紫金总量
coverage:
  scenarios:
    - 各任务类型(missionType)领奖次数与去重角色数，衡量任务完成活跃度
    - 分服(server_id)领奖覆盖与角色渗透
    - 领奖产出的关键货币(gold/diamond)总量，反映任务奖励经济产出
  limitations:
    - 日志中零命中(ds=20260729/20260728 均为 cnt=0)，事件疑似下线或当日未触发，指标实测值为0
    - 仅 ds=20260729/20260728 两日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级），未验证 account 级口径
    - coinList 为 array 结构，单值 SUM 仅为近似口径
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。零命中，维持 draft。"
coverage_status: draft
external_refs: []
