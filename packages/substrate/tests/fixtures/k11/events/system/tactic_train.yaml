name: game.tactic.train
event_filter: event = 'game.tactic.train'
description: 战法系统特训事件：玩家对某个战法（id）执行特训并产出碎片（count）时上报，记录特训行为本身、被特训战法、产出碎片数量及特训角色画像（等级/VIP/战力）。用于度量战法特训参与规模、各战法的特训热度分布与碎片产出量。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 战法id
  count:
    type: int
    description: 碎片数量
metrics:
  tactic_train_cnt:
    expression: COUNT(*)
    description: 战法特训事件总次数（每次特训计一次）
  tactic_train_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与战法特训的去重角色数
  tactic_train_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与战法特训的去重账号数
  tactic_train_fragment_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
    description: 战法特训产出的碎片总数（count 字段累加）
  tactic_train_distinct_tactics:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 当日被特训的去重战法数量（id 字段去重）
  tactic_train_per_role_avg:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 每个特训角色的平均特训次数（>1 表示同角色当日多次特训）
  tactic_train_fragment_per_role_avg:
    expression: CAST(SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT)) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 每个特训角色的平均碎片产出量
  tactic_train_vip_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.vipLevel') AS BIGINT))
    description: 特训角色的平均VIP等级
  tactic_train_role_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 特训角色的平均角色等级
  tactic_train_role_force_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT))
    description: 特训角色的平均战力
coverage:
  granularity: 单次特训事件（role_id 为默认主体粒度）
  scenarios:
    - 战法特训的参与规模（次数/角色UV/账号UV/碎片产出总量）
    - 各战法（id）的特训热度分布（distinct_tactics 与按 id 分组的次数/碎片）
    - 单日重复特训行为识别（per_role_avg > 1 提示同角色当日多次特训）
    - 不同VIP/战力/等级玩家的战法特训活跃度分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id，未逐事件实测 role_id 是否为最细主体（同账号多角色场景未复核）
    - count（碎片数量）字段在 ds=20260729 全 831 行均非空且为正整数，按产出量累加；未排除潜在的反向扣减场景
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=831 / role_uv=406 / acc_uv=404；id/count/vipLevel/roleLevel/roleForce/roleId 全 831 行非空；count_sum=27780（碎片总数），distinct tactic id=35
