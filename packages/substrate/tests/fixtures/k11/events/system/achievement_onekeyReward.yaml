name: game.achievement.onekeyReward
event_filter: event = 'game.achievement.onekeyReward'
description: |-
  成就一键领奖：玩家一键领取已达成成就的奖励，newAchieves 列表记录本次领取的成就 id/order。
  分析主体为 role_id（角色级事件）。scout 实测 ds=20260729：事件命中 10762 条、role_uv=1884、acc_uv=1813、server_uv=172。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等25个
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  newAchieves:
    type: array
    description: 领取奖励的成就信息列表
  newAchieves.id:
    type: int
    description: 成就id
  newAchieves.order:
    type: int
    description: 成就order
metrics:
  achievement_onekey_reward_cnt:
    expression: COUNT(*)
    description: 成就一键领奖事件总命中数
  achievement_onekey_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取成就奖励的去重角色数（分析主体 role_id）
  achievement_onekey_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取成就奖励的去重账号数
  achievement_onekey_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及区服数
  achievement_onekey_reward_per_role:
    expression: CAST(COUNT(*) AS DECIMAL) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均领取次数（事件命中/去重角色，分母为0返回NULL）
coverage:
  scenarios:
    - 成就系统参与度：领取成就奖励的角色/账号规模与区服覆盖
    - 人均领奖强度：人均领取次数反映成就密集度与活跃度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级事件），未验证 account 粒度
    - newAchieves 为列表参数，未拆解逐条成就计数
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=10762, role_uv=1884, acc_uv=1813, server_uv=172（数字合理，确认在线）
external_refs: []
