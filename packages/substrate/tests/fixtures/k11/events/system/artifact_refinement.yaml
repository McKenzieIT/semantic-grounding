metrics:
  refinement_cnt:
    expression: COUNT(*)
    description: 兵符精炼事件总次数
  refinement_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与精炼的去重角色数（分析主体）
  refinement_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与精炼的去重账号数
  refinement_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 覆盖的去重游戏服数
  refined_artifact_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.uid'))
    description: 被精炼的去重兵符 uid 数（要使用的兵符 uid）
  avg_wear_artifact_star:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.wearArtifact.star') AS BIGINT))
    description: 穿戴兵符的平均星级（精炼目标）
  refinement_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均精炼次数（总次数 / 去重角色数）
coverage:
  subject: role_id
  subject_note: 兵符精炼以 role_id 为分析主体（穿戴兵符属角色装备）
  scenarios:
    - 各游戏服兵符精炼活跃度与渗透角色数（refinement_cnt / refinement_role_uv / refinement_server_uv）
    - 人均精炼强度（refinement_per_role）定位重度精炼用户
    - 被精炼兵符规模与穿戴兵符星级分布（refined_artifact_uv / avg_wear_artifact_star）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - usedArtifact.uid / wearArtifact.uid 在 ds=20260729 解析为 0 distinct（疑似字段缺失或嵌套结构差异），改用顶层 uid 作为被精炼兵符标识
    - GET_JSON_OBJECT 依赖运行时 params JSON 结构，跨日结构可能漂移
    - 实测 GET_JSON_OBJECT(params,'$.roleId')=722 与 base role_uv=722 一致，role_id 主体校验通过
coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=1925, role_uv=722, acc_uv=706, server_uv=144; refined_artifact_uv(uid)=568, avg_wear_star=2.81, avg_used_star=1.0（消耗1星材料精炼穿戴兵符）"
external_refs: []
