name: game.artifact.refinement
event_filter: event = 'game.artifact.refinement'
description: |-
  兵符精炼事件：玩家消耗低阶兵符（params.uid）对已穿戴兵符（wearArtifact）进行精炼升级，
  记录穿戴/被消耗兵符的星级、属性（addAttrs/randAttrs）及槽位变化。
  分析主体为 role_id。ds=20260729 单日实测 1925 条/722 角色/706 账号/144 服务器。
domains:
  - 角色成长
domain: system
