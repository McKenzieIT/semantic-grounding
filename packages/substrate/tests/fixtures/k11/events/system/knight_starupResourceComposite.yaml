name: game.knight.starupResourceComposite
event_filter: event = 'game.knight.starupResourceComposite'
description: 魂石合成武将升星事件：玩家使用魂石对武将进行升星合成，记录合成前后武将资源/货币变化（coinList、rewards）。分析主体为 role_id（角色）。实测 ds=20260729 单日命中 484 条事件、448 去重角色、438 去重账号、88 服务器，覆盖 7 种 starupId 升星类型、count 字段合计 34380、最高角色等级 100。
domains:
  - 角色成长
domain: system
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  starupId:
    type: int
    description: starupId
  count:
    type: int
    description: count
  rewards:
    type: array
    description: rewards
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  knight_starup_resource_composite_cnt:
    expression: COUNT(*)
    description: 升星合成事件总次数
  knight_starup_resource_composite_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发升星合成的去重角色数
  knight_starup_resource_composite_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发升星合成的去重账号数
  knight_starup_resource_composite_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及升星合成的去重服务器数
  knight_starup_resource_composite_starup_type_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.starupId'))
    description: 命中的去重升星类型数（starupId）
  knight_starup_resource_composite_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.count') AS BIGINT))
    description: 合成次数（count 字段）合计
  knight_starup_resource_composite_cnt_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每角色升星合成次数
coverage:
  scenarios:
    - 角色升星养成活跃度与渗透（角色/账号/服务器 UV）
    - 升星类型分布与合成次数规模（starupId 类型数、count 合计）
    - 平均每角色升星合成强度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色）；实测 params.roleId 去重 448 与 base role_id 一致
    - count 为自报合成次数，未与 rewards 数组条目交叉校验
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "实测 ds=20260729: cnt=484, role_uv=448, acc_uv=438, server_uv=88, starup类型uv=7, count_sum=34380, max_roleLevel=100"
coverage_status: analyst_confirmed
external_refs: []
