name: game.charge.refund
event_filter: event = 'game.charge.refund'
description: 游戏充值退款事件：记录玩家对游戏内充值订单发起退款的行为，参数含 orderId/orderUid/goodsId/amount 等退款单据与数量信息（共28个字段）。分析主体粒度为 role_id（角色），辅以 account_id（账号）与 server_id（游戏服）。scout 实测 ds=20260729：cnt=2, role_uv=1, acc_uv=1, server_uv=1（退款事件稀疏，单日低量符合预期）。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  orderId:
    type: string
    description: order id
  orderUid:
    type: string
    description: order uid
  goodsId:
    type: int
    description: goods id
  type:
    type: string
    description: 直冲id
  amount:
    type: int
    description: 数量
  gmActivityId:
    type: int
    description: gm活动id
metrics:
  game_charge_refund_cnt:
    expression: COUNT(*)
    description: 退款事件总次数（所有退款记录条数）
  game_charge_refund_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 发起退款的去重角色数
  game_charge_refund_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 发起退款的去重账号数
  game_charge_refund_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及退款的去重游戏服数
  game_charge_refund_amount_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.amount') AS BIGINT))
    description: 退款数量(amount 字段，参数描述为"数量")总和
  game_charge_refund_amt_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.amount') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 平均每个退款角色的退款数量
coverage:
  scenarios:
    - 退款规模与频次监控（次数/角色UV/账号UV/服务器UV）
    - 退款数量(amount)合计与人均退款量
    - 退款订单/商品维度下钻（orderId/orderUid/goodsId 经 params 可下钻）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），退款单据粒度(orderId/orderUid)需结合 params 下钻
    - amount 字段参数描述为"数量"，非货币金额；如需货币维度需另行核实
    - 单日样本量小（cnt=2, role_uv=1），聚合指标代表性有限
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=2, role_uv=1, acc_uv=1, server_uv=1；amount_sum=2 (uv=1)。数据量小但事件结构与字段可读，确认事件在线且可聚合。
coverage_status: analyst_confirmed
