name: game.saleshop.confirmdiscounts
event_filter: event = 'game.saleshop.confirmdiscounts'
description: 折扣商店-确认折扣。玩家在折扣商店确认领取某组折扣商品时上报，分析主体为 role_id。params 含 shopId(商店id)、confirmIdx(确认的折扣组序号)、discounts(折扣列表) 及角色货币快照(coinList.gold 等)。ds=20260729 scout 实测：563 次确认、562 角色、557 账号、5 服务器；全部命中 shopId=1（confirmIdx=1 共 513 次 / confirmIdx=2 共 50 次）。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  shopId:
    type: int
    description: 商店id
  confirmIdx:
    type: int
    description: 确认的组
  discounts:
    type: array
    description: 折扣列表
metrics:
  saleshop_confirmdiscounts_cnt:
    expression: COUNT(*)
    description: 折扣商店确认折扣事件总次数
  saleshop_confirmdiscounts_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发确认折扣的去重角色数（分析主体）
  saleshop_confirmdiscounts_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发确认折扣的去重账号数
  saleshop_confirmdiscounts_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发确认折扣的去重游戏服数
  saleshop_confirmdiscounts_shop_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.shopId'))
    description: 被确认折扣的去重商店数
  saleshop_confirmdiscounts_confirmidx_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.confirmIdx'))
    description: 被确认折扣的去重折扣组序号数
  saleshop_confirmdiscounts_role_per_server:
    expression: COUNT(DISTINCT role_id) / NULLIF(COUNT(DISTINCT server_id), 0)
    description: 每服平均触发确认折扣的角色数
coverage:
  scenarios:
    - 折扣商店确认折扣的总体规模与角色/账号/服务器触达
    - 不同商店(shopId)与折扣组(confirmIdx)的确认分布
    - 每服平均确认折扣角色数（参与度）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（事件由角色触发；accountId 亦可用，角色粒度更细）
    - 无直接金额字段；coinList.* 为角色货币快照(余额)，非本次交易金额，未计入指标
    - discounts 为数组结构，未展开聚合（仅按 shopId/confirmIdx 维度统计）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=563 / role_uv=562 / acc_uv=557 / server_uv=5；shopId=1(confirmIdx=1:513 / confirmIdx=2:50)；数据合理，标记 analyst_confirmed
coverage_status: analyst_confirmed
external_refs: []
