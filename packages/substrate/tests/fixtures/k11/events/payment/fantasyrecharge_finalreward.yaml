name: game.fantasyrecharge.finalreward
event_filter: event = 'game.fantasyrecharge.finalreward'
description: 幻想服充值活动-领取最终奖励事件：玩家在幻想服完成充值活动并领取最终大奖时触发（fantasyrecharge_finalreward）。奖励以免费钻石(freegold)形式发放，实测 ds=20260729 共 21 条记录、21 个去重角色、21 个去重账号、6 个游戏服。分析主体为 role_id（角色粒度），亦可按 account_id 汇总到账号粒度。
domains:
  - 付费经济
domain: payment
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
metrics:
  fantasyrecharge_finalreward_cnt:
    expression: COUNT(*)
    description: 领取最终奖励事件总次数
  fantasyrecharge_finalreward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取最终奖励的去重角色数（分析主体粒度）
  fantasyrecharge_finalreward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取最终奖励的去重账号数
  fantasyrecharge_finalreward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取最终奖励覆盖的去重游戏服数
  fantasyrecharge_finalreward_freegold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.freegold') AS BIGINT))
    description: 领取最终奖励发放的免费钻石(freegold)总量（实测 ds=20260729 为 188323）
  fantasyrecharge_finalreward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 领取最终奖励涉及充值钻石(gold)总量（实测 ds=20260729 为 0，奖励不以充值钻石形式发放）
  fantasyrecharge_finalreward_sendgold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.sendgold') AS BIGINT))
    description: 领取最终奖励涉及充值赠送钻石(sendgold)总量（实测 ds=20260729 为 0）
  fantasyrecharge_finalreward_diamond_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.diamond') AS BIGINT))
    description: 领取最终奖励涉及紫金(diamond)总量
  fantasyrecharge_finalreward_avg_freegold_per_role:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.freegold') AS BIGINT)) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均领取免费钻石量（按角色粒度，分母用 NULLIF 防除零）
coverage:
  scenarios:
    - 幻想服充值活动最终奖励的领取规模与覆盖角色/账号/游戏服数
    - 最终奖励发放的免费钻石总量与人均领取量
    - 各游戏服最终奖励领取渗透情况（按 server_id 分组聚合）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色粒度），account_id 仅作账号粒度补充
    - 实测 ds=20260729 充值钻石(gold)/赠送钻石(sendgold) 均为 0，最终奖励主要以免费钻石(freegold, 总量 188323) 形式发放，付费货币维度无数据
    - 单日样本量较小（21 条/21 角色/6 服），多日趋势需扩展 ds 范围后复核
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=21, role_uv=21, acc_uv=21, server_uv=6；coinList.freegold_sum=188323, gold_sum=0, sendgold_sum=0。事件真实触发、数据合理，确认 analyst_confirmed。
coverage_status: analyst_confirmed
external_refs: []
