name: game.home.practice
event_filter: event = 'game.home.practice'
description: 武将特训事件：玩家在主城对武将（cardId/cardName）进行特训时触发，单次事件记录一次特训行为及涉及的碎片数量（pieceAmount），同时上报角色/账号/服务器上下文与角色画像（等级/VIP/战力/经验/性别/创角时间/上线时间）和货币快照（coinList：gold/sendgold/freegold/diamond/expCoin/energy）。分析主体粒度为 role_id（角色级）。scout 实测 ds=20260729 单日 cnt=1755 / role_uv=659 / acc_uv=643 / server_uv=107，碎片总量 piece_sum=40540。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  cardId:
    type: int
    description: 武将id
  cardName:
    type: string
    description: 武将名
  pieceAmount:
    type: int
    description: 碎片数量
metrics:
  game_home_practice_cnt:
    expression: COUNT(*)
    description: 武将特训触发总次数（每次特训计一次）
  game_home_practice_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 武将特训去重角色数（默认主体粒度）
  game_home_practice_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 武将特训去重账号数（账号口径参考）
  game_home_practice_piece_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.pieceAmount') AS BIGINT))
    description: 武将特训涉及碎片（pieceAmount）累计总量（产出/消耗语义需结合业务确认）
coverage:
  scenarios:
    - 武将特训触发规模与角色/账号覆盖（cnt / role_uv / account_uv / server_uv）
    - 武将碎片产出或消耗总量（piece_sum）评估武将养成资源消耗
    - 通过 server_uv 观察特训行为的服务器分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id，未逐事件实测 role_id 是否为最细主体
    - pieceAmount 字段语义需结合业务确认（产出或消耗），piece_sum 仅反映单日累计
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout 实测 ds=20260729：cnt=1755 / role_uv=659 / acc_uv=643 / server_uv=107 / piece_sum=40540
external_refs: []
