name: game.scriptActivity.taskBattlepassMissionReward
event_filter: event = 'game.scriptActivity.taskBattlepassMissionReward'
description: 玩家完成战令(battlepass)任务后领取奖励时触发的行为埋点。记录活动ID(themeId)、任务ID(missionId)、领取前后战令等级与经验(newLevel/oldLevel、newExp/oldExp)以及各类货币变动(coinList.gold/sendgold/freegold/diamond/expCoin/energy)。分析主体为 role_id(角色，事件携带 roleId/roleName/roleLevel/vipLevel/roleForce)。scout 实测 ds=20260729 与 ds=20260728 均零命中，事件疑似下线/未触发。参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等28个
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  themeId:
    type: int
    description: 活动ID
  missionId:
    type: int
    description: 任务ID
  newLevel:
    type: int
    description: 新的等级
  newExp:
    type: int
    description: 新的经验
  oldLevel:
    type: int
    description: 旧的等级
  oldExp:
    type: int
    description: 旧的经验
metrics:
  bp_mission_reward_cnt:
    expression: COUNT(*)
    description: 战令任务奖励领取总次数
  bp_mission_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取战令任务奖励的去重角色数
  bp_mission_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取战令任务奖励的去重账号数
  bp_mission_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数
  bp_mission_reward_theme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.themeId'))
    description: 涉及的去重战令活动ID(themeId)数
  bp_mission_reward_mission_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.missionId'))
    description: 涉及的去重任务ID(missionId)数
  bp_mission_reward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.gold') AS BIGINT))
    description: 领取奖励的充值钻石(coinList.gold)总变动量
  bp_mission_reward_freegold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.freegold') AS BIGINT))
    description: 领取奖励的免费钻石(coinList.freegold)总变动量
coverage:
  scenarios:
    - 战令任务奖励领取热度(次数/角色UV/账号UV)与活动/任务分布
    - 战令奖励对各类货币(gold/freegold/diamond 等)的产出贡献
    - 角色维度领取行为画像(结合 roleLevel/vipLevel/roleForce)
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发，指标实测值为 0/NULL
    - 仅 ds=20260729/20260728 两日 scout 实测，未做全量复核
    - 分析主体默认 role_id(角色)，因零命中未做粒度复核
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "measured ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0; ds=20260728 同样零命中，事件疑似下线/未触发"
external_refs: []
