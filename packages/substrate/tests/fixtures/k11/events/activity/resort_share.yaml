name: game.resort.share
event_filter: event = 'game.resort.share'
description: 代打-分享卡片事件：玩家在求助(resort)玩法中触发分享卡片行为，记录分享渠道(公会/世界/好友)及求助类型resortType。分析主体为 role_id(角色)，单日实测 ds=20260729 cnt=118 / role_uv=82 / acc_uv=81 / server_uv=14。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  resortType:
    type: int
    description: 求助类型
  resortValue1:
    type: int
    description: 值1
  resortValue2:
    type: int
    description: 值2
  shareGuild:
    type: bool
    description: 是否分享公会
  shareWorld:
    type: bool
    description: 是否分享世界
  shareFriends:
    type: array
    description: 分享的好友
metrics:
  game_resort_share_cnt:
    expression: COUNT(*)
    description: 分享卡片事件总次数
  game_resort_share_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 分享卡片触发的角色去重数
  game_resort_share_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 分享卡片触发的账号去重数
  game_resort_share_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 分享卡片涉及的游戏服去重数
  game_resort_share_guild_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params,'$.shareGuild') = 'true' THEN role_id END)
    description: 分享至公会的角色去重数
  game_resort_share_world_uv:
    expression: COUNT(DISTINCT CASE WHEN GET_JSON_OBJECT(params,'$.shareWorld') = 'true' THEN role_id END)
    description: 分享至世界的角色去重数
coverage:
  scenarios:
    - 代打求助分享卡片的触发规模与角色/账号/服务器覆盖
    - 分享渠道分布(公会/世界)及各渠道UV占比
    - 求助类型resortType分布与跨服分享情况
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id(角色)，分享行为以角色为单位计量
    - shareFriends为数组类型，未在指标中展开逐好友统计
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout实测 ds=20260729: cnt=118 / role_uv=82 / acc_uv=81 / server_uv=14，数据合理"
coverage_status: analyst_confirmed
external_refs: []
