name: game.springfestival.preheatdaytalkreward
event_filter: event = 'game.springfestival.preheatdaytalkreward'
description: |-
  春节活动-预热剧情奖励触发事件。当角色在春节预热活动期间完成剧情对话并领取奖励时上报，携带角色/账号/服务器基础属性、活动id、天数(day)及角色货币快照等24个参数。
  分析主体：role_id（角色粒度）。scout 实测 ds=20260729 与 ds=20260728 均零命中（cnt=0/role_uv=0/acc_uv=0），事件疑似下线/未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动id
  day:
    type: int
    description: 天数
metrics:
  springfestival_preheatdaytalkreward_cnt:
    expression: COUNT(*)
    description: 春节预热剧情奖励触发次数（事件总条数）
  springfestival_preheatdaytalkreward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发剧情奖励的角色去重数（分析主体：role_id）
  springfestival_preheatdaytalkreward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发剧情奖励的账号去重数
coverage:
  scenarios:
    - 按天/服务器统计春节预热剧情奖励触发次数与触达角色数，评估预热剧情参与度
    - 按角色等级/vip等级拆分触达，分析不同层级玩家的剧情参与情况
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729/20260728 单日 scout 实测，未做全量复核
    - 分析主体默认 role_id，因零命中未做粒度复核
coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0；零命中，疑似下线/未触发"
external_refs: []
