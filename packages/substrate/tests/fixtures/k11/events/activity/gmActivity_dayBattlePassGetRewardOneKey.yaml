name: game.gmActivity.dayBattlePassGetRewardOneKey
event_filter: event = 'game.gmActivity.dayBattlePassGetRewardOneKey'
description: 日战令一键领取奖励事件：玩家在日战令（dayBattlePass）玩法中通过一键领取功能批量领取奖励时上报，记录活动 activity、奖励列表 rewardList（含 id/free/paid 标记）及货币快照 coinList 等27个参数。主体粒度为 role_id（角色）。实测 ds=20260729 单日 cnt=4298、role_uv=4190、acc_uv=3935、server_uv=475。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activity:
    type: int
    description: activity
  rewardList:
    type: array
    description: rewardList
  rewardList.id:
    type: int
    description: rewardList.id
  rewardList.free:
    type: bool
    description: rewardList.free
  rewardList.paid:
    type: bool
    description: rewardList.paid
metrics:
  game_gmActivity_dayBattlePassGetRewardOneKey_cnt:
    expression: COUNT(*)
    description: 日战令一键领取奖励事件总触发次数
  game_gmActivity_dayBattlePassGetRewardOneKey_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发日战令一键领取的去重角色数
  game_gmActivity_dayBattlePassGetRewardOneKey_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发日战令一键领取的去重账号数
  game_gmActivity_dayBattlePassGetRewardOneKey_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发日战令一键领取的去重游戏服数
coverage:
  scenarios:
    - 日战令一键领取功能使用频次与参与角色/账号/游戏服规模
    - 日战令奖励批量领取玩法的日活与渗透（结合主活跃口径）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色），账号级口径需用 account_uv 单独核算
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 实测 cnt=4298, role_uv=4190, acc_uv=3935, server_uv=475
  coverage_status: analyst_confirmed
external_refs: []
