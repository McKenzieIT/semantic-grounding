name: game.autoSkill.create
event_filter: event = 'game.autoSkill.create'
description: 玩家在自动战斗功能中创建武将出战方案，记录武将id(knightId)与方案id(schemeId)。主体粒度为 role_id（角色级事件），account_id 为账号归并维度。实测 ds=20260729 单日 cnt=78 / role_uv=40 / acc_uv=37 / server_uv=25。参数含游戏服、角色、货币、武将方案等 24 个字段。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  schemeId:
    type: int
    description: 方案id
metrics:
  game_autoSkill_create_cnt:
    expression: COUNT(*)
    description: 自动战斗创建武将方案事件总次数
  game_autoSkill_create_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 创建武将方案的去重角色数（主体粒度 role_id）
  game_autoSkill_create_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 创建武将方案的去重账号数
  game_autoSkill_create_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 创建武将方案涉及的去重游戏服数
coverage:
  scenarios:
    - 通过方案创建次数与角色/账号 UV 评估自动战斗功能使用活跃度
    - 通过 server_uv 观察功能在不同游戏服的渗透范围
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id；account_id 用于账号级去重归并
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 scout 实测 cnt=78 / role_uv=40 / acc_uv=37 / server_uv=25，量级合理
  coverage_status: analyst_confirmed
external_refs: []
