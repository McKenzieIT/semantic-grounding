name: game.welfare.dailyGoldReward
event_filter: event = 'game.welfare.dailyGoldReward'
description: 福利系统每日金/三山璧奖励领取事件：玩家通过福利玩法领取每日金奖励时上报，记录领取行为本身、领取角色画像（等级/VIP/战力）及领取后货币快照（coinList）。奖励明细字段 rewards/rewarded 在实测中未上报，奖励金额为固定每日值，由事件次数反映参与规模。
domains:
  - 资源产销
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  rewards:
    type: array
    description: 奖励
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
  rewarded:
    type: array
    description: 已领取的奖励
metrics:
  dailyGoldReward_cnt:
    expression: COUNT(*)
    description: 每日金奖励领取事件总次数（每次领取计一次）
  dailyGoldReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取每日金奖励的去重角色数
  dailyGoldReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取每日金奖励的去重账号数
  dailyGoldReward_claims_per_role:
    expression: CAST(COUNT(*) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 每个领取角色的平均领取次数（>1 表示同一角色当日多次领取）
  dailyGoldReward_vip_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.vipLevel') AS BIGINT))
    description: 领取角色的平均VIP等级
  dailyGoldReward_role_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 领取角色的平均角色等级
  dailyGoldReward_role_force_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT))
    description: 领取角色的平均战力
coverage:
  granularity: 单次领取事件（role_id 为默认主体粒度）
  scenarios:
    - 每日福利金奖励领取的参与规模（次数/角色UV/账号UV）
    - 不同VIP/战力/等级玩家领取每日金奖励的活跃度分布
    - 单日重复领取行为识别（claims_per_role > 1 提示同角色当日多次领取）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - rewards/rewarded 数组在 ds=20260729 实测中全 2158 行均为 NULL，奖励明细未上报，无法统计单次奖励金额
    - 默认主体粒度为 role_id，未逐事件实测 role_id 是否为最细主体
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=2158 / role_uv=2089 / acc_uv=2046；roleId/vipLevel/roleLevel/roleForce/coinList 全非空，rewards/rewarded 数组全 NULL
external_refs: []
