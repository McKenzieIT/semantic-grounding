name: game.match3game.complete
event_filter: event = 'game.match3game.complete'
description: 猜字谜（match3game）迷你游戏关卡完成事件：记录角色在猜字谜玩法中完成一关/进度的时刻，主体粒度为角色级（role_id），默认主体 role_id。事件参数含游戏服、角色、VIP等级、角色战力、关卡 floor、theme、coinList 货币快照等24个字段，可用于度量迷你游戏参与规模与关卡推进深度。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  theme:
    type: int
    description: theme
  floor:
    type: int
    description: floor
metrics:
  game_match3game_complete_cnt:
    expression: COUNT(*)
    description: 猜字谜关卡完成事件总次数
  game_match3game_complete_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 完成猜字谜关卡的角色数（去重）
  game_match3game_complete_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 完成猜字谜关卡的账号数（去重）
  game_match3game_complete_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的游戏服数量（去重）
coverage:
  scenarios:
    - 迷你游戏参与规模（完成次数 / 角色 UV / 账号 UV / 游戏服数）
    - 猜字谜玩法活跃度与游戏服覆盖分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729 cnt=0, ds=20260728 cnt=0)，疑似下线/未触发
    - 主体默认 role_id（角色级粒度）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: "scout ds=20260729: cnt=0, role_uv=0, acc_uv=0, server_uv=0; retry ds=20260728: cnt=0; 零命中，疑似下线/未触发"
external_refs: []
