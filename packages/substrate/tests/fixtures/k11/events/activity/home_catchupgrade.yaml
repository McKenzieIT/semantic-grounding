name: game.home.catchupgrade
event_filter: event = 'game.home.catchupgrade'
description: 家园系统捕捞等级突破事件，记录玩家在家园玩法中完成捕捞等级突破升级的行为。主体粒度 role_id（角色），单日实测(ds=20260729)共 2591 次突破，涉及 1182 角色、1146 账号、88 游戏服。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  upgradeLevel:
    type: int
    description: 突破新等级
metrics:
  game_home_catchupgrade_cnt:
    expression: COUNT(*)
    description: 家园捕捞等级突破总次数
  game_home_catchupgrade_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发捕捞等级突破的独立角色数
  game_home_catchupgrade_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发捕捞等级突破的独立账号数
  game_home_catchupgrade_upgradelevel_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.upgradeLevel') AS BIGINT))
    description: 突破新等级累计值
coverage:
  scenarios:
    - 家园捕捞系统参与度与突破等级进度分析
    - 活跃角色在家园玩法中的成长速率
    - 区服维度突破分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id，账号粒度仅供交叉参考
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: analyst_confirmed
  note: "scout (ds=20260729): cnt=2591, role_uv=1182, acc_uv=1146, server_uv=88"
external_refs: []
