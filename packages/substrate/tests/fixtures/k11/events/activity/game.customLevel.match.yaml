name: game.customLevel.match
event_filter: event = 'game.customLevel.match'
description: 演武场(Arena)匹配行为事件：记录角色进入/触发演武场匹配的瞬时行为，携带游戏服id、角色等级、vip等级、角色战力、货币列表及错误码code等23个参数。subject 粒度为 role_id，单次匹配=1行，用于衡量演武场匹配玩法的触发量与覆盖面。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  code:
    type: int
    description: 错误码
metrics:
  game_customLevel_match_cnt:
    expression: COUNT(*)
    description: 演武场匹配事件总触发次数
  game_customLevel_match_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发匹配事件的去重角色数(role_id)
  game_customLevel_match_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发匹配事件的去重账号数(account_id)
  game_customLevel_match_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发匹配事件的去重游戏服数(server_id)
coverage:
  scenarios:
    - 匹配触发次数/角色UV/账号UV/游戏服UV 衡量演武场匹配玩法的活跃度与覆盖面
    - subject 默认 role_id，单次匹配=1行
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 scout cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 retry cnt=0；日志零命中，疑似下线/未触发
  coverage_status: draft
external_refs: []
