name: game.qice.missionOnekeyReward
event_filter: event = 'game.qice.missionOnekeyReward'
description: 奇策系统任务奖励一键领取事件：玩家在奇策玩法中点击一键领取多个任务奖励时上报。主体粒度为 role_id（角色级）。参数含 serverId/roleId/roleName/roleLevel/vipLevel/roleForce/exp/stageId（任务主题id）/missionIds（任务id列表）/coinList 等。2026-07-29 与 2026-07-28 单日 scout 实测均零命中（cnt=0），疑似事件已下线或当前未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  stageId:
    type: int
    description: 任务领取主题id
  missionIds:
    type: array
    description: 任务id列表
metrics:
  game_qice_missiononekeyreward_cnt:
    expression: COUNT(*)
    description: 奇策任务一键领取事件总上报次数
  game_qice_missiononekeyreward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发奇策任务一键领取的去重角色数
  game_qice_missiononekeyreward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发奇策任务一键领取的去重账号数
  game_qice_missiononekeyreward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发奇策任务一键领取的去重游戏服数
coverage:
  scenarios:
    - 监控奇策任务一键领取功能的使用频次与覆盖角色/账号/服务器范围
    - 评估奇策任务奖励发放的活动参与度与活跃度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 默认主体为 role_id（角色级）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0 role_uv=0 acc_uv=0 server_uv=0；ds=20260728 同样零命中。疑似事件下线或当前未触发，保持 draft。
  coverage_status: draft
external_refs: []
