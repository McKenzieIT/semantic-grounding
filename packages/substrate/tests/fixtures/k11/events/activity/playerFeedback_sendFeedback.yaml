name: game.playerFeedback.sendFeedback
event_filter: event = 'game.playerFeedback.sendFeedback'
description: 玩家反馈上报事件（玩家通过客服/反馈入口提交游戏问题或建议）。携带角色基础快照（serverId/roleId/roleName/roleLevel/vipLevel/roleForce/exp）与反馈内容（type=1游戏问题/2建议，feedback文本）。主体粒度为 role_id（单角色单次反馈行为），可按 account_id 聚合账号维度。日志实测 ds=20260729/20260728 均零命中（0/0/0），疑似事件已下线或近两日未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  playerId:
    type: int
    description: playerId
  type:
    type: int
    description: 反馈类型 1 游戏问题 2 建议
  feedback:
    type: string
    description: 反馈内容
metrics:
  game_playerFeedback_sendFeedback_cnt:
    expression: COUNT(*)
    description: 玩家反馈事件总上报次数
  game_playerFeedback_sendFeedback_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 提交反馈的去重角色数
  game_playerFeedback_sendFeedback_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 提交反馈的去重账号数
  game_playerFeedback_sendFeedback_feedback_type_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.type'))
    description: 反馈类型去重数（1游戏问题/2建议）
coverage:
  scenarios:
    - 监测玩家反馈量级与活跃反馈者规模（cnt/role_uv/account_uv）
    - 按反馈类型分布评估游戏问题与建议占比（feedback_type_uv 辅助 type 维度）
    - 配合 account_id/role_id 维度定位高频反馈用户，支撑客服与运营跟进
  limitations:
    - 日志中零命中(ds=20260729/20260728，cnt=0/role_uv=0/acc_uv=0)，疑似事件已下线或近两日未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核；ds=20260728 复测仍为 0
    - 默认主体粒度为 role_id，跨账号聚合时使用 account_id
    - 反馈类型分布仅统计 type 字段去重数，非各类型上报次数
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout 实测 ds=20260729 cnt=0 role_uv=0 acc_uv=0；ds=20260728 复测仍为 0；零命中保留 draft
  coverage_status: draft
