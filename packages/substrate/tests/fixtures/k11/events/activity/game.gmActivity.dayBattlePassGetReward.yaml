name: game.gmActivity.dayBattlePassGetReward
event_filter: event = 'game.gmActivity.dayBattlePassGetReward'
description: gmActivity.dayBattlePassGetReward：玩家领取每日战令(BattlePass)活动奖励事件，记录角色在每日战令活动中领取免费/付费轨道奖励的行为。事件携带奖励id、free/paid轨道标记、活动id及角色属性(等级/vip/战力/经验)与货币快照(钻石/紫金/经验卷轴/体力)。主体粒度为 role_id（角色），单条记录代表一次角色领奖行为，用于度量日战令领奖参与度与轨道分布。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
  activity:
    type: int
    description: activity
  free:
    type: bool
    description: free
  paid:
    type: bool
    description: paid
metrics:
  game_gmActivity_dayBattlePassGetReward_cnt:
    expression: COUNT(*)
    description: 每日战令领奖事件总次数
  game_gmActivity_dayBattlePassGetReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取每日战令奖励的去重角色数
  game_gmActivity_dayBattlePassGetReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取每日战令奖励的去重账号数
  game_gmActivity_dayBattlePassGetReward_paid_reward_cnt:
    expression: SUM(CASE WHEN GET_JSON_OBJECT(params,'$.paid') = 'true' THEN 1 ELSE 0 END)
    description: 领取付费轨道(paid=true)奖励的次数
coverage:
  scenarios:
    - 每日战令活动领奖参与度统计（角色/账号去重 UV 与总次数）
    - 免费 vs 付费轨道领奖分布对比
    - 战令奖励领取趋势与活跃角色画像分析
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似下线/未触发或当日无战令领奖日志
    - 主体粒度默认 role_id；账号粒度 account_uv 作交叉校验
  subject_granularity: role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 scout: cnt=0 role_uv=0 acc_uv=0 server_uv=0；ds=20260728 重试 cnt=0。零命中，维持 draft。"
  coverage_status: draft
