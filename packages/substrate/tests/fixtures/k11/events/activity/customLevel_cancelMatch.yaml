name: game.customLevel.cancelMatch
event_filter: event = 'game.customLevel.cancelMatch'
description: |-
  演武场-取消匹配事件：玩家在演武场（自定义关卡 PvP）匹配流程中主动取消匹配时上报的角色级埋点。记录角色身份、所在服、角色等级/VIP/战力与多币种余额，用于刻画玩家匹配放弃行为。主体粒度为 role_id（角色）；实测 20260729/20260728 双日零命中，事件可能下线或当日未触发。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等23个
domains:
  - 自定义
domain: activity
metrics:
  game_customLevel_cancelMatch_cnt:
    expression: COUNT(*)
    description: 演武场取消匹配事件总次数（去重前），衡量玩家放弃匹配的整体触发量
  game_customLevel_cancelMatch_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 演武场取消匹配的去重角色数，主体粒度为 role_id
  game_customLevel_cancelMatch_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 演武场取消匹配的去重账号数，跨角色归并
  game_customLevel_cancelMatch_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 演武场取消匹配涉及的去重游戏服数，观察事件分布广度
coverage:
  scenarios:
    - 分析演武场 PvP 匹配放弃规模与趋势（事件次数、角色/账号 UV）
    - 观察取消匹配行为在游戏服间的分布（server_uv）
    - 结合 roleLevel/vipLevel/roleForce 描绘放弃匹配的玩家画像
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id，跨角色聚合需显式指定 account_id
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  code:
    type: int
    description: 错误码
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: draft
  note: "ds=20260729 scout: cnt=0/role_uv=0/acc_uv=0/server_uv=0; ds=20260728 retry: cnt=0，双日零命中，事件疑似下线/未触发，维持 draft"
external_refs: []
