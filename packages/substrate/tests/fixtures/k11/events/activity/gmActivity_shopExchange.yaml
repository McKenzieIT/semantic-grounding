name: game.gmActivity.shopExchange
event_filter: event = 'game.gmActivity.shopExchange'
description: GM活动兑换商店兑换事件：记录角色在GM活动商店中兑换商品的行为，参数含活动ID(actId)、商品ID(goodsId)及消耗货币列表(coinList.gold/sendgold/freegold/diamond/expCoin/energy)与角色基础属性(roleLevel/vipLevel/roleForce)，主体粒度为role_id。scout实测ds=20260729与ds=20260728均零命中。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  actId:
    type: int
    description: 活动ID
  goodsId:
    type: int
    description: 商品ID
metrics:
  game_gmActivity_shopExchange_cnt:
    expression: COUNT(*)
    description: 兑换事件总次数（含同一角色多次兑换），主体粒度role_id
  game_gmActivity_shopExchange_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与GM活动商店兑换的去重角色数
  game_gmActivity_shopExchange_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与GM活动商店兑换的去重账号数
  game_gmActivity_shopExchange_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 发生GM活动商店兑换的去重游戏服数
coverage:
  scenarios:
    - GM活动商店兑换参与度与转化分析（次数/角色UV/账号UV/服UV）
    - 配合actId、goodsId参数可下钻分析单活动/单商品的兑换热度
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729 cnt=0 / ds=20260728 cnt=0)，疑似活动下线或当期未触发，需运营确认活动开启状态后再复核
    - 默认主体粒度为 role_id；货币消耗金额相关指标需coinList字段细化，未在本批指标中覆盖
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: scout实测 ds=20260729 cnt=0 role_uv=0 acc_uv=0 server_uv=0；重试 ds=20260728 仍 cnt=0，判定零命中，保留draft
external_refs: []
