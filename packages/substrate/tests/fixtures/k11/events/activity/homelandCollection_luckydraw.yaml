name: game.homelandCollection.luckydraw
event_filter: event = 'game.homelandCollection.luckydraw'
description: 家园藏品福袋抽奖事件：玩家在家园藏品玩法中开启福袋(luckyId)获取藏品奖励，记录每次抽奖行为。主体粒度为 role_id（角色）。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  luckyId:
    type: int
    description: 福袋id
metrics:
  game_homelandCollection_luckydraw_cnt:
    expression: COUNT(*)
    description: 家园藏品福袋抽奖总次数
  game_homelandCollection_luckydraw_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与福袋抽奖的角色去重数
  game_homelandCollection_luckydraw_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与福袋抽奖的账号去重数
  game_homelandCollection_luckydraw_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 参与福袋抽奖的游戏服去重数
coverage:
  scenarios:
    - 福袋抽奖次数
    - 参与角色/账号/游戏服分布
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729 cnt=0, ds=20260728 cnt=0)，疑似下线/未触发
    - 默认主体 role_id
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 cnt=0 -> 零命中
  coverage_status: draft
external_refs: []
