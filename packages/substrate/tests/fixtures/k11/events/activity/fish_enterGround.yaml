name: game.fish.enterGround
event_filter: event = 'game.fish.enterGround'
description: 钓鱼玩法：角色切换渔场（groundId）事件，记录玩家从旧渔场（oldGroundId）进入新渔场的切换行为及当前角色状态（等级、VIP、战力、货币列表、看板娘等24个参数）。主体粒度为 role_id（角色级事件），单日 scout 实测日志零命中（ds=20260729/20260728 均为 0），疑似事件已下线或当日未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  oldGroundId:
    type: int
    description: 旧渔场id
  groundId:
    type: int
    description: 渔场id
metrics:
  game_fish_enterGround_cnt:
    expression: COUNT(*)
    description: 渔场切换事件总次数
  game_fish_enterGround_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发渔场切换的去重角色数
  game_fish_enterGround_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发渔场切换的去重账号数
  game_fish_enterGround_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发渔场切换的去重游戏服数
coverage:
  scenarios:
    - 渔场切换次数与覆盖角色/账号/服务器分布，支撑渔场热度排名与玩家迁移路径分析。
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728 cnt=0)，疑似下线/未触发
    - 默认主体粒度 role_id；零命中场景下指标实测值均为 0
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 重试仍 cnt=0；判定为零命中
  coverage_status: draft
external_refs: []
