name: game.homeland.useGift
event_filter: event = 'game.homeland.useGift'
description: 家园玩法-使用礼品(giftId/giftNum)：角色在家园玩法中消耗/使用礼品道具，上报礼品id与数量。主体粒度 role_id；ds=20260729 scout 实测 cnt=69405, role_uv=1578, acc_uv=1519, server_uv=324。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  giftId:
    type: int
    description: 礼品id
  giftNum:
    type: int
    description: 礼品数量
metrics:
  game_homeland_usegift_cnt:
    expression: COUNT(*)
    description: 礼品使用事件总次数
  game_homeland_usegift_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 使用礼品的去重角色数
  game_homeland_usegift_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 使用礼品的去重账号数
  game_homeland_usegift_gift_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.giftNum') AS BIGINT))
    description: 礼品消耗总数量(giftNum 求和)
coverage:
  scenarios:
    - 礼品消耗总次数/总数量及消耗角色、账号 UV、服务器覆盖
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 默认主体 role_id；giftNum 为客户端上报，可能存在异常值
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 scout: cnt=69405, role_uv=1578, acc_uv=1519, server_uv=324"
  coverage_status: analyst_confirmed
external_refs: []
