name: game.scriptActivity.getRunningSignReward
event_filter: event = 'game.scriptActivity.getRunningSignReward'
description: "玩家领取活动进行期签到奖励事件。分析主体为角色(role_id)，每次领取记录活动ID(themeId)、领取位置(signRewardMaxDay)、奖励列表(rewards)及货币变动。实测 ds=20260729: cnt=587, role_uv=580, acc_uv=570, server_uv=52"
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  themeId:
    type: int
    description: 活动ID
  signRewardMaxDay:
    type: int
    description: 领取到的位置
  rewards:
    type: array
    description: 奖励
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  scriptActivity_getRunningSignReward_cnt:
    expression: COUNT(*)
    description: 领取进行期签到奖励事件总次数
  scriptActivity_getRunningSignReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取签到奖励的去重角色数（分析主体）
  scriptActivity_getRunningSignReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取签到奖励的去重账号数
  scriptActivity_getRunningSignReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取签到奖励的去重游戏服数
  scriptActivity_getRunningSignReward_theme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.themeId'))
    description: 领取签到奖励的去重活动主题(themeId)数
  scriptActivity_getRunningSignReward_sign_max_day_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.signRewardMaxDay') AS BIGINT))
    description: 领取到的签到位置(signRewardMaxDay)累计值
  scriptActivity_getRunningSignReward_avg_sign_max_day:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.signRewardMaxDay') AS BIGINT)) / NULLIF(COUNT(*),0)
    description: 平均签到领取位置（事件级加权平均）
coverage:
  scenarios:
    - 评估进行期签到奖励的总体领取规模与角色覆盖度
    - 跨活动(themeId)、跨服(server_id)的签到参与热度对比
    - 通过领取位置(signRewardMaxDay)分布了解签到进度与留存
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 分析主体为角色(role_id)粒度，账号(account_id)仅作去重辅助
    - rewards 为数组奖励明细，本事件未逐项展开统计（受限于参数数组结构）
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "实测 ds=20260729: cnt=587, role_uv=580, acc_uv=570, server_uv=52；themeId/signRewardMaxDay 字段可经 GET_JSON_OBJECT 正常提取"
coverage_status: analyst_confirmed
external_refs: []
