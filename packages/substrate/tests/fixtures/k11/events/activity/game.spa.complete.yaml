name: game.spa.complete
event_filter: event = 'game.spa.complete'
description: 角色快照完成事件 game.spa.complete：在某个会话/逻辑节点完成时上报的角色状态快照，包含游戏服、账号、角色基础信息（角色名、性别、创角/上线时间）、角色成长指标（角色等级、vip等级、角色战力、经验）以及关键货币余额（充值钻石、赠送钻石、免费钻石、紫金、经验卷轴、体力 等24个字段）。分析主体为 role_id（角色粒度），account_id 为账号粒度补充。实测 ds=20260729 单日 cnt=1032、role_uv=460、acc_uv=457、server_uv=94。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightId:
    type: int
    description: 武将id
  id:
    type: int
    description: 话题id
metrics:
  spa_complete_cnt:
    expression: COUNT(*)
    description: game.spa.complete 事件上报条数（角色快照完成事件总量）
  spa_complete_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发快照完成事件的去重角色数（角色粒度主体）
  spa_complete_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发快照完成事件的去重账号数（账号粒度补充）
  spa_complete_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发快照完成事件覆盖的去重游戏服数
  spa_complete_role_level_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT))
    description: 触发事件角色的等级累计（GET_JSON_OBJECT 取 params.roleLevel 求和）
  spa_complete_role_force_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT))
    description: 触发事件角色的战力累计（GET_JSON_OBJECT 取 params.roleForce 求和）
  spa_complete_avg_role_level:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 触发事件角色的平均等级（等级累计 / 事件数，NULLIF 防 0 除）
  spa_complete_recharge_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 触发事件角色上报的充值钻石余额累计（GET_JSON_OBJECT 取 params.coinList.gold 求和）
coverage:
  scenarios:
    - 角色快照完成事件的日活跃角色/账号规模与游戏服覆盖广度（spa_complete_cnt / _role_uv / _account_uv / _server_uv）
    - 快照完成时角色成长水位分布与平均等级（_role_level_sum / _role_force_sum / _avg_role_level）
    - 快照完成时刻的充值钻石余额规模（_recharge_gold_sum）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核（多日趋势/波动尚未验证）
    - vip_sum 实测为 0（ds=20260729 当日上报 vipLevel 均为 0），如需 vip 维度分析需换日复核
    - 充值钻石余额（coinList.gold）实测仅 1446，参与角色极少，非支付事件仅为货币余额快照
    - 分析主体默认 role_id（角色粒度），account_id 为账号粒度补充，未做账号-角色多对多关系拆解
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=1032、role_uv=460、acc_uv=457、server_uv=94；role_level_sum=60529、role_force_sum=8037990635、recharge_gold_sum=1446、vip_sum=0。JSON 字段访问 GET_JSON_OBJECT(params,$.roleLevel/$.roleForce/$.coinList.gold) 均可命中。
coverage_status: analyst_confirmed
