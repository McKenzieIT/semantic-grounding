name: game.equipmentPresets.setName
event_filter: event = 'game.equipmentPresets.setName'
description: 装备预设-设置名字：玩家修改已保存的装备预设方案的名称，记录预设id、旧名(oldName)与新名(newName)。主体粒度为 role_id（角色），account_id 关联账号。单日 ds=20260729 scout 实测 cnt=21、role_uv=3、acc_uv=3、server_uv=3。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 预设id
  oldName:
    type: string
    description: 旧的名字
  newName:
    type: string
    description: 新的名字
metrics:
  game_equipment_presets_set_name_cnt:
    expression: COUNT(*)
    description: 装备预设设置名字事件总次数（角色维度行为计数）
  game_equipment_presets_set_name_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发装备预设改名的去重角色数
  game_equipment_presets_set_name_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发装备预设改名的去重账号数
  game_equipment_presets_set_name_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发装备预设改名的去重游戏服数
coverage:
  scenarios:
    - 装备预设改名行为量级监控（cnt/role_uv/account_uv）
    - 跨服覆盖度评估（server_uv）
    - 装备自定义玩法参与度分析
  limitations:
    - 主体粒度默认 role_id（角色）；account_id 为账号关联视角。
    - 仅 ds=20260729 单日 scout 实测，未做全量复核。
    - server_uv 等服务端去重在跨服/渠道合并视图上可能受去重口径影响。
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 scout 实测 cnt=21、role_uv=3、acc_uv=3、server_uv=3；数据量级偏小但非零，符合改名类低频行为特征，确认事件通路有效。
  coverage_status: analyst_confirmed
