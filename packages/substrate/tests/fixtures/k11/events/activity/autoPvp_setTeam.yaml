name: game.autoPvp.setTeam
event_filter: event = 'game.autoPvp.setTeam'
description: 自动PVP玩法中玩家设置防守/进攻阵容的事件，记录玩家在自动PVP系统中调整出战武将编队（knightList）、武将自动技能方案（knightAutoSkill）、灵器（mainCharm/assistCharm）、sp队长、阵营光环等阵容配置。主体粒度为 role_id（角色），附带 accountId 账号维。ds=20260729 单日实测 4381 条记录、1391 角色、1341 账号、192 服务器。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  knightList:
    type: array
    description: 武将列表
  knightAutoSkill:
    type: array
    description: 武将自动技能方案
  knightAutoSkill.knightId:
    type: int
    description: 武将id
  knightAutoSkill.schemeId:
    type: int
    description: 方案id
  effectGroup:
    type: int
    description: 阵营光环
  mainCharm:
    type: array
    description: 主灵器
  assistCharm:
    type: array
    description: 助灵器
  spCaptain:
    type: int
    description: sp队长
metrics:
  game_autoPvp_setTeam_cnt:
    expression: COUNT(*)
    description: 自动PVP设置阵容事件总记录数（每次设置阵容为一条日志）
  game_autoPvp_setTeam_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 参与自动PVP设置阵容的去重角色数
  game_autoPvp_setTeam_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 参与自动PVP设置阵容的去重账号数
  game_autoPvp_setTeam_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发自动PVP设置阵容事件的去重服务器数
coverage:
  scenarios:
    - 评估自动PVP玩法的阵容配置活跃度（设置次数、参与角色/账号/服务器覆盖），用于衡量该玩法渗透率与玩家参与意愿。
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体默认 role_id（角色）
    - server_uv 因跨服PVP可能含合并/镜像服，去重口径以原始 server_id 为准
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 单日 scout 实测 cnt=4381 / role_uv=1391 / acc_uv=1341 / server_uv=192，数据合理。
  coverage_status: analyst_confirmed
external_refs: []
