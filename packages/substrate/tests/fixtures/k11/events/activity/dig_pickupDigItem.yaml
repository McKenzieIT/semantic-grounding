name: game.dig.pickupDigItem
event_filter: event = 'game.dig.pickupDigItem'
description: 挖宝拾取道具：玩家在挖宝玩法中拾取到掉落道具时上报的单次拾取事件，参数含角色/账号/游戏服上下文、货币列表(coinList)、位置pos、层级digLevel等。主题粒度为 role_id（单角色单次拾取）。实测 ds=20260729 单日零命中（cnt=0），ds=20260728 亦为零命中，日志中未见该事件触发，疑似下线或未上线。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  pos:
    type: int
    description: 位置
  digLevel:
    type: int
    description: 层级
metrics:
  game_dig_pickupDigItem_cnt:
    expression: COUNT(*)
    description: 挖宝拾取道具事件总次数
  game_dig_pickupDigItem_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发挖宝拾取的去重角色数
  game_dig_pickupDigItem_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发挖宝拾取的去重账号数
  game_dig_pickupDigItem_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发挖宝拾取的去重游戏服数
coverage:
  scenarios:
    - 监控挖宝玩法道具产出体量与参与角色/账号/游戏服覆盖
    - 评估挖宝拾取活跃度趋势（按角色或游戏服维度下钻）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 主题粒度默认 role_id，账号级统计另见 account_uv 指标
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0 role_uv=0 acc_uv=0；ds=20260728 cnt=0 role_uv=0 acc_uv=0。日志中零命中，疑似下线/未触发，保持 draft。
  coverage_status: draft
external_refs: []
