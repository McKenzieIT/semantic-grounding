name: game.scriptActivity.taskBattlepassReward
event_filter: event = 'game.scriptActivity.taskBattlepassReward'
description: "玩家在战令(battlepass)活动中按等级(level)一键领取战令奖励时触发的行为埋点。记录活动ID(themeId)、当前战令等级(level)、奖励类型(rewardType)、奖励列表(rewards，含 type/value/size/uid)以及各类货币变动(coinList.gold/sendgold/freegold/diamond/expCoin/energy)。分析主体为 role_id(角色，事件携带 roleId/roleName/roleLevel/vipLevel/roleForce)。scout 实测 ds=20260729: cnt=1605, role_uv=889, acc_uv=876, server_uv=108，事件活跃。参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等30个"
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  themeId:
    type: int
    description: 活动ID
  level:
    type: int
    description: 等级
  rewardType:
    type: int
    description: 类型
  rewards:
    type: array
    description: 奖励
  rewards.type:
    type: int
    description: 类型
  rewards.value:
    type: int
    description: 值
  rewards.size:
    type: int
    description: 数量
  rewards.uid:
    type: int
    description: 唯一id
metrics:
  bp_reward_cnt:
    expression: COUNT(*)
    description: 战令奖励一键领取总次数
  bp_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取战令奖励的去重角色数
  bp_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取战令奖励的去重账号数
  bp_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数
  bp_reward_theme_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.themeId'))
    description: 涉及的去重战令活动ID(themeId)数
  bp_reward_level_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.level') AS BIGINT))
    description: 领取时战令等级(level)的平均值
  bp_reward_rewardtype_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params,'$.rewardType'))
    description: 涉及的去重奖励类型(rewardType)数
  bp_reward_rolelevel_avg:
    expression: AVG(CAST(GET_JSON_OBJECT(params,'$.roleLevel') AS BIGINT))
    description: 领取角色的平均角色等级(roleLevel)
  bp_reward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.gold') AS BIGINT))
    description: 领取奖励的充值钻石(coinList.gold)总变动量
  bp_reward_freegold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.freegold') AS BIGINT))
    description: 领取奖励的免费钻石(coinList.freegold)总变动量
  bp_reward_diamond_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params,'$.coinList.diamond') AS BIGINT))
    description: 领取奖励的紫金(coinList.diamond)总变动量
coverage:
  scenarios:
    - 战令奖励一键领取热度(次数/角色UV/账号UV)与活动(themeId)/奖励类型(rewardType)分布
    - 战令奖励对各类货币(gold/freegold/diamond 等)的产出贡献
    - 角色维度领取行为画像(结合 roleLevel/vipLevel/roleForce、战令 level)
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - rewards 为数组字段，未在指标中聚合(避免 JOIN/explode)；如需按 rewards.type/value/size 拆分需另起明细模型
    - 分析主体默认 role_id(角色)，单日 scout 未做粒度复核
  coverage_status: analyst_confirmed
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "measured ds=20260729: cnt=1605, role_uv=889, acc_uv=876, server_uv=108"
external_refs:
  - dim_table: dim_10000251_knight_awaken_info_arch
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_awaken_info_arch 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info 主键精确同名
    origin: deterministic
  - dim_table: dim_10000251_knight_level_info_arch
    join_keys:
      - dws_column: level
        dim_column: level
    derivation: 确定性：事件字段 level 与 dim_10000251_knight_level_info_arch 主键精确同名
    origin: deterministic
