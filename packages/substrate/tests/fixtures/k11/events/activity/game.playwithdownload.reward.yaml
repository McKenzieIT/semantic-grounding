name: game.playwithdownload.reward
event_filter: event = 'game.playwithdownload.reward'
description: 边玩边下奖励领取事件：玩家通过边玩边下载功能领取奖励时上报，记录游戏服、账号、角色及奖励领取明细（货币列表、看板娘、经验等23个参数）。主体粒度 role_id（角色级），单日实测 721 次领取，覆盖 413 个角色、408 个账号、13 个游戏服。
metrics:
  game_playwithdownload_reward_cnt:
    expression: COUNT(*)
    description: 边玩边下奖励领取总次数
  game_playwithdownload_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取奖励的去重角色数
  game_playwithdownload_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取奖励的去重账号数
  game_playwithdownload_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取奖励的去重游戏服数
coverage:
  scenarios:
    - 评估边玩边下功能的奖励领取渗透与活跃度（次数/角色/账号/游戏服维度）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色级），未拆分奖励类型 id
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 实测 cnt=721 role_uv=413 acc_uv=408 server_uv=13，数据合理
  coverage_status: analyst_confirmed
