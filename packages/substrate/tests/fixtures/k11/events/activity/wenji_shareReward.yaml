name: game.wenji.shareReward
event_filter: event = 'game.wenji.shareReward'
description: 文姬分享奖励事件：玩家通过分享文姬系统领取奖励触发的行为埋点。参数包含游戏服/账号/角色基础信息（roleId、roleName、roleLevel、vipLevel、roleForce、exp 等）以及奖励id（id），coinList 记录领取时的关键货币快照（充值钻石、赠送钻石、免费钻石、紫金、经验卷轴、体力等）。分析主体为 role_id（角色粒度，account_id 作为账号粒度辅助）。真实数据验证（ds=20260729）：cnt=547，role_uv=145，acc_uv=144，server_uv=10。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: 奖励id
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=547，role_uv=145，acc_uv=144，server_uv=10，数据合理（多服多角色多账号，单角色平均 3.77 次）。
metrics:
  game_wenji_shareReward_cnt:
    expression: COUNT(*)
    description: 文姬分享奖励触发总次数
  game_wenji_shareReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发文姬分享奖励的角色去重数（分析主体粒度）
  game_wenji_shareReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发文姬分享奖励的账号去重数（账号粒度辅助）
  game_wenji_shareReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发文姬分享奖励的游戏服去重数
  game_wenji_shareReward_reward_id_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.id'))
    description: 文姬分享奖励领取的不同奖励id去重数
  game_wenji_shareReward_role_avg_cnt:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 文姬分享奖励人均触发次数（总次数/角色去重）
coverage:
  scenarios:
    - 文姬分享奖励触发量与角色/账号去重（活动参与度评估）
    - 文姬分享奖励在多个游戏服的分布（服级渗透）
    - 不同奖励id的领取分布（奖励档位覆盖率）
    - 人均分享触发次数（活跃度与频次）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核（多日趋势待补）
    - 分析主体默认 role_id（角色粒度），account_id 仅作账号粒度辅助，未独立核验
    - coinList 为领取时的货币快照，非本次分享奖励的产出增量，未作为指标输出
    - reward_id_uv 基于参数 id 去重，未排除 NULL（无 id 的异常行）
coverage_status: analyst_confirmed
