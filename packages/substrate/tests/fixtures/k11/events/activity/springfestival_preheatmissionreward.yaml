name: game.springfestival.preheatmissionreward
event_filter: event = 'game.springfestival.preheatmissionreward'
description: 春节活动预热阶段，玩家领取任务奖励时触发的埋点事件。记录领奖行为本身、所属活动(activityId)、命中的任务列表(missionIds)以及领奖后角色关键货币变化(coinList.gold 充值钻石/coinList.diamond 紫金/coinList.expCoin 经验卷轴/coinList.energy 体力等)。分析主体粒度为 role_id(单角色领奖)，account_id 可作为账号级聚合维度。scout 实测(ds=20260729 与 ds=20260728)均为零命中，事件疑似已下线或当期未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动id
  missionIds:
    type: array
    description: 任务id列表
metrics:
  springfestival_preheatmissionreward_cnt:
    expression: COUNT(*)
    description: 春节预热任务奖励领取事件总次数
  springfestival_preheatmissionreward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取春节预热任务奖励的去重角色数(分析主体 role_id)
  springfestival_preheatmissionreward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取春节预热任务奖励的去重账号数
  springfestival_preheatmissionreward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的游戏服数量
  springfestival_preheatmissionreward_activity_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.activityId'))
    description: 涉及的去重活动数量
  springfestival_preheatmissionreward_mission_claim_role_uv:
    expression: COUNT(DISTINCT CASE WHEN SIZE(CAST(GET_JSON_OBJECT(params, '$.missionIds') AS ARRAY<BIGINT>)) > 0 THEN role_id END)
    description: 至少领取一个任务奖励(missionIds 非空)的去重角色数
  springfestival_preheatmissionreward_gold_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.gold') AS BIGINT))
    description: 领奖发放的充值钻石总量
  springfestival_preheatmissionreward_diamond_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.diamond') AS BIGINT))
    description: 领奖发放的紫金总量
  springfestival_preheatmissionreward_expcoin_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.expCoin') AS BIGINT))
    description: 领奖发放的经验卷轴总量
  springfestival_preheatmissionreward_energy_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.coinList.energy') AS BIGINT))
    description: 领奖发放的体力总量
coverage:
  scenarios:
    - 春节预热活动任务参与度与领奖规模(次数、角色UV、账号UV、服务器覆盖)
    - 各活动(activityId)的领奖渗透与货币发放(充值钻石/紫金/经验卷轴/体力)分析
    - 任务奖励领取漏斗及活跃角色贡献评估
  limitations:
    - 日志中零命中(ds=20260729 cnt=0；重试 ds=20260728 cnt=0)，事件疑似下线/当期未触发
    - 仅 ds=20260729 与 ds=20260728 两个分区 scout 实测，未做全量分区复核
    - 分析主体粒度默认 role_id(角色级领奖)，未验证账号级聚合语义
    - coinList.* 各货币字段在零命中分区下均为空，实际发放量需待事件恢复后复核
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；重试 ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。两日均零命中，事件疑似下线/未触发，保留 draft 状态待事件恢复后复核。"
external_refs: []
