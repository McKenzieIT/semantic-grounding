name: game.happyLottery.fetchPointReward
event_filter: event = 'game.happyLottery.fetchPointReward'
description: |-
  刮刮乐：领取积分奖励（活动参与事件）。记录玩家在刮刮乐活动中领取积分奖励的行为，含奖励id列表(ids)、领取类型(type:1普通/2层奖励)、活动id(lotteryId)等。主体粒度 role_id。ds=20260729 实测 日志量 5580 条，覆盖 2886 角色 / 2784 账号 / 424 服务器。
  参数：游戏服id、游戏服名字、账号id、角色id、角色名、性别、创角时间、上线时间、角色等级、vip等级、角色战力、经验 等27个
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  lotteryId:
    type: int
    description: 活动id
  ids:
    type: array
    description: 领取的奖励id列表
  type:
    type: int
    description: 1 普通 奖励 2 层奖励
  choose1:
    type: int
    description: type 2 层奖励 时候选择的奖励
  choose2:
    type: int
    description: type 2 层奖励 时候选择的奖励
metrics:
  game_happyLottery_fetchPointReward_cnt:
    expression: COUNT(*)
    description: 刮刮乐领取积分奖励事件总触发次数
  game_happyLottery_fetchPointReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 触发领取积分奖励的去重角色数
  game_happyLottery_fetchPointReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 触发领取积分奖励的去重账号数
  game_happyLottery_fetchPointReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 触发领取积分奖励的去重游戏服数
coverage:
  scenarios:
    - 用于回答"刮刮乐活动的日参与规模、活跃角色/账号数、覆盖服务器广度"等业务问题
    - 支撑活动参与度与渗透率分析（事件计数 / 角色 UV / 账号 UV / 服务器 UV）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id；账号/服务器粒度为辅助观察
    - 未对奖励id列表(ids)、领取类型(type)做分维度交叉验证
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  coverage_status: analyst_confirmed
  note: "ds=20260729 scout: cnt=5580, role_uv=2886, acc_uv=2784, server_uv=424"
