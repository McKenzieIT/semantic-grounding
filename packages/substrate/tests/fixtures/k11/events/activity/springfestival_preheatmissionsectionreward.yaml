name: game.springfestival.preheatmissionsectionreward
event_filter: event = 'game.springfestival.preheatmissionsectionreward'
description: 春节活动-预热任务阶段奖励领取：玩家在春节预热活动中达成阶段任务并领取阶段奖励时上报的事件，参数含活动id(activityId)、当前阶段(maxSection)及角色属性与货币快照(coinList)。分析主体为 role_id（角色级事件）。scout 实测 ds=20260729/20260728 双日零命中，事件疑似已下线或处于非活动期未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  activityId:
    type: int
    description: 活动id
  maxSection:
    type: int
    description: 阶段
metrics:
  springfestival_preheatmissionsectionreward_cnt:
    expression: COUNT(*)
    description: 春节预热任务阶段奖励领取事件总次数
  springfestival_preheatmissionsectionreward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取阶段奖励的去重角色数
  springfestival_preheatmissionsectionreward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取阶段奖励的去重账号数
  springfestival_preheatmissionsectionreward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 涉及的去重游戏服数
  springfestival_preheatmissionsectionreward_section_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.maxSection') AS BIGINT))
    description: 累计领取的阶段进度（maxSection 求和）
  springfestival_preheatmissionsectionreward_claim_per_role:
    expression: COUNT(*) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 人均领取次数（总次数 / 去重角色数）
coverage:
  scenarios:
    - 春节预热活动阶段奖励的领取次数与参与角色/账号/游戏服规模
    - 各阶段(maxSection)奖励领取的累计进度与角色覆盖
    - 活动期间奖励领取热度趋势（按 ds 分日）
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 仅 ds=20260729/20260728 双日 scout 实测，未做全量复核
    - 分析主体默认 role_id（角色级事件），未单独核验 account_id 粒度
    - 货币快照(coinList)字段未做金额汇总核验（无 money/price/amount 字段，且事件零命中无法验证）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728 同样零命中。事件为春节预热活动阶段奖励，属季节性活动，当前非活动期未触发，保持 draft。"
coverage_status: draft
external_refs: []
