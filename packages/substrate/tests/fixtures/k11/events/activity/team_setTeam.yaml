name: game.team.setTeam
event_filter: event = 'game.team.setTeam'
description: 设置当前阵容：玩家切换/确认当前出战阵容（teamId）的事件。携带游戏服、账号、角色基础属性（等级/vip/战力/经验）、关键货币余额、会话等23个参数。分析主体为 role_id（角色粒度），单条事件表示一次阵容切换操作。scout 实测 ds=20260729 与 ds=20260728 均为零命中，事件疑似下线或未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  teamId:
    type: int
    description: 阵容id
metrics:
  game_team_setteam_cnt:
    expression: COUNT(*)
    description: 设置阵容事件总次数（含同一角色多次切换）
  game_team_setteam_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 设置阵容的去重角色数
  game_team_setteam_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 设置阵容的去重账号数
  game_team_setteam_team_uv:
    expression: COUNT(DISTINCT GET_JSON_OBJECT(params, '$.teamId'))
    description: 设置阵容涉及的去重阵容ID数
  game_team_setteam_role_force_avg:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleForce') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 设置阵容时角色平均战力（按事件次数加权）
  game_team_setteam_role_level_avg:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.roleLevel') AS BIGINT)) / NULLIF(COUNT(*), 0)
    description: 设置阵容时角色平均等级（按事件次数加权）
coverage:
  scenarios:
    - 玩家阵容切换活跃度（次数/UV）
    - 阵容使用分布（哪些 teamId 被设置为当前阵容）
    - 阵容切换与角色战力/等级的关联
    - 各游戏服阵容切换热度对比
  subject_granularity: role_id
  limitations:
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发，metrics 仅有定义无实测校验
    - 仅 ds=20260729 + ds=20260728 两天 scout 实测，未做全量复核
  coverage_status: draft
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: "scout 实测 ds=20260729: cnt=0/role_uv=0/acc_uv=0/server_uv=0；ds=20260728: cnt=0/role_uv=0/acc_uv=0/server_uv=0。两日零命中，事件疑似下线或从未触发。"
external_refs: []
