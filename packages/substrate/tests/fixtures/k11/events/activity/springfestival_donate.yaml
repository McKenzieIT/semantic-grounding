name: game.springfestival.donate
event_filter: event = 'game.springfestival.donate'
description: "预热活动期间玩家捐赠道具的埋点事件，记录每次捐赠行为及捐赠数量(count)。分析主体为角色(role_id)，可按服(server_id)/账号(account_id)/VIP等级(vipLevel)/角色等级(roleLevel)下钻聚合。scout 实测 ds=20260729 日志零命中(cnt=0)，回退 ds=20260728 仍为零，事件疑似下线或当期预热活动未触发。参数含24个字段：游戏服id/名字、账号id、角色id/名、性别、创角/上线时间、角色等级、vip等级、角色战力、经验、看板娘、关键货币列表(coinList: gold/sendgold/freegold/diamond/expCoin/energy)、会话id、logUUID、id、count。"
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  id:
    type: int
    description: id
  count:
    type: int
    description: count
metrics:
  springfestival_donate_cnt:
    expression: COUNT(*)
    description: 捐赠事件总次数（每次捐赠计一次）
  springfestival_donate_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 捐赠的去重角色数
  springfestival_donate_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 捐赠的去重账号数
  springfestival_donate_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 捐赠涉及的去重游戏服数
  springfestival_donate_count_sum:
    expression: SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT))
    description: 捐赠道具总数量（累加 params.count）
  springfestival_donate_count_per_role:
    expression: CAST(SUM(CAST(GET_JSON_OBJECT(params, '$.count') AS BIGINT)) AS DOUBLE) / NULLIF(COUNT(DISTINCT role_id), 0)
    description: 每个捐赠角色的平均捐赠数量
coverage:
  granularity: 单次捐赠事件（role_id 为默认主体粒度）
  scenarios:
    - 预热活动期间捐赠道具的参与规模（次数/角色UV/账号UV/覆盖服数）
    - 单角色捐赠量排行与活跃度分析（count_per_role 识别重度捐赠玩家）
    - 按角色等级/VIP等级下钻捐赠行为分布
  limitations:
    - 日志中零命中（ds=20260729 cnt=0，回退 ds=20260728 仍为 0），疑似事件下线或当期预热活动未触发，指标实测日均返回 0/NULL
    - 仅 ds=20260729/20260728 单日 scout 实测，未做全量复核
    - 默认主体粒度为 role_id，未在数据中验证唯一性
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-30
  confirmed_at: "2026-07-30"
  note: scout 实测 ds=20260729：cnt=0 / role_uv=0 / acc_uv=0 / server_uv=0；回退 ds=20260728 同样零命中。事件疑似下线或当期未触发，保持 draft，待预热活动复跑后复核
