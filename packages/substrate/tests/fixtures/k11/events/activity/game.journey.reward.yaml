name: game.journey.reward
event_filter: event = 'game.journey.reward'
description: 限时逐鹿玩法领取奖励事件：玩家在限时逐鹿活动中领取奖励时上报，含游戏服/账号/角色/货币列表/最大奖励order等23个参数。主体粒度为 role_id（角色），可按 account_id 汇总账号维度。ds=20260729/20260728 scout 实测零命中，事件疑似下线或未触发。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  maxRewardOrder:
    type: int
    description: 最大奖励order
metrics:
  game_journey_reward_cnt:
    expression: COUNT(*)
    description: 限时逐鹿领取奖励事件总触发次数
  game_journey_reward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取逐鹿奖励的去重角色数（主体粒度 role_id）
  game_journey_reward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取逐鹿奖励的去重账号数
  game_journey_reward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取逐鹿奖励的去重游戏服数
coverage:
  scenarios:
    - 限时逐鹿玩法奖励领取活跃度与参与角色规模
    - 各游戏服逐鹿奖励领取覆盖情况
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 日志中零命中(ds=20260729/20260728)，疑似下线/未触发
    - 默认主体为 role_id（角色粒度）
confirmation:
  status: draft
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: ds=20260729 cnt=0/role_uv=0/acc_uv=0；ds=20260728 同样零命中，事件疑似下线或未触发
  coverage_status: draft
external_refs: []
