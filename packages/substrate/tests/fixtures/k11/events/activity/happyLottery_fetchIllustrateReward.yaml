name: game.happyLottery.fetchIllustrateReward
event_filter: event = 'game.happyLottery.fetchIllustrateReward'
description: 刮刮乐活动：玩家领取图鉴（illustrate）奖励时触发的埋点事件。参数覆盖角色基础信息（roleLevel/vipLevel/roleForce/exp）、活动id（lotteryId）、本次领取的等级列表（levels）及货币快照（coinList）等24个字段。主体粒度为 role_id（角色级事件）。ds=20260729 单日实测 793 条，覆盖 752 个角色 / 744 个账号 / 222 个游戏服。
domains:
  - 自定义
domain: activity
params_fields:
  serverId:
    type: int
    description: 游戏服id
  serverName:
    type: string
    description: 游戏服名字
  accountId:
    type: string
    description: 账号id
  roleId:
    type: int
    description: 角色id
  roleName:
    type: string
    description: 角色名
  sex:
    type: int
    description: 性别
  createTime:
    type: int
    description: 创角时间
  onlineTime:
    type: int
    description: 上线时间
  roleLevel:
    type: int
    description: 角色等级
  vipLevel:
    type: int
    description: vip等级
  roleForce:
    type: int
    description: 角色战力
  exp:
    type: int
    description: 经验
  image:
    type: int
    description: 看板娘
  coinList:
    type: array
    description: 关键货币列表
  coinList.gold:
    type: int
    description: 充值钻石
  coinList.sendgold:
    type: int
    description: 充值赠送钻石
  coinList.freegold:
    type: int
    description: 免费钻石
  coinList.diamond:
    type: int
    description: 紫金
  coinList.expCoin:
    type: int
    description: 经验卷轴
  coinList.energy:
    type: int
    description: 体力
  sessionId:
    type: string
    description: 会话id
  logUUID:
    type: string
    description: logUUID（日志唯一id）
  lotteryId:
    type: int
    description: 活动id
  levels:
    type: array
    description: 领取的等级列表
metrics:
  game_happyLottery_fetchIllustrateReward_cnt:
    expression: COUNT(*)
    description: 刮刮乐图鉴奖励领取总次数
  game_happyLottery_fetchIllustrateReward_role_uv:
    expression: COUNT(DISTINCT role_id)
    description: 领取图鉴奖励的去重角色数
  game_happyLottery_fetchIllustrateReward_account_uv:
    expression: COUNT(DISTINCT account_id)
    description: 领取图鉴奖励的去重账号数
  game_happyLottery_fetchIllustrateReward_server_uv:
    expression: COUNT(DISTINCT server_id)
    description: 领取图鉴奖励的去重游戏服数
coverage:
  scenarios:
    - 刮刮乐图鉴奖励领取的活跃度（总次数、角色/账号/服务器触达面）
    - 活动参与广度与渗透（按 lotteryId 拆分可分析单活动覆盖）
  limitations:
    - 仅 ds=20260729 单日 scout 实测，未做全量复核
    - 主体粒度默认 role_id（角色级事件）
    - levels 为领取的等级列表（数组），未在指标中展开为领取档次数
confirmation:
  status: analyst_confirmed
  confirmed_by: scout-verification-2026-07-31
  confirmed_at: "2026-07-31"
  note: "ds=20260729 scout: cnt=793, role_uv=752, acc_uv=744, server_uv=222"
  coverage_status: analyst_confirmed
external_refs: []
